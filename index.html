<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>扫码测试 - 兼容浏览器</title>
    <!-- 引入 html5-qrcode 库 (CDN) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 16px;
            background: #f5f7fa;
        }
        h1 { text-align: center; color: #333; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #reader-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        #reader-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: #4a6cf7;
            color: white;
            flex: 1 0 auto;
            min-width: 100px;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #file-input {
            display: none;
        }
        .result-box {
            background: #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            word-break: break-all;
        }
        .result-label {
            font-weight: bold;
            color: #495057;
        }
        .result-content {
            font-size: 18px;
            color: #212529;
            margin-top: 4px;
            background: white;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .hint {
            font-size: 14px;
            color: #868e96;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>📷 扫码测试</h1>

    <!-- 摄像头扫码区域 -->
    <div class="card">
        <div id="reader-container"></div>
        <div class="btn-group">
            <button id="start-btn" class="btn">▶ 开始扫码</button>
            <button id="stop-btn" class="btn btn-danger" disabled>⏹ 停止</button>
        </div>
        <div class="hint">摄像头调用需 HTTPS 环境，首次需授权</div>
    </div>

    <!-- 本地图片解码 -->
    <div class="card">
        <div class="btn-group">
            <button id="upload-btn" class="btn btn-secondary">🖼 从图片解码</button>
            <input type="file" id="file-input" accept="image/*" />
        </div>
        <div class="hint">支持二维码 / 条形码（如无法识别请换清晰图片）</div>
    </div>

    <!-- 结果显示 -->
    <div class="card">
        <div class="result-box">
            <div class="result-label">📌 扫描结果</div>
            <div id="result-content" class="result-content">等待扫描...</div>
        </div>
    </div>

    <script>
        (function() {
            // DOM 元素
            const container = document.getElementById('reader-container');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const uploadBtn = document.getElementById('upload-btn');
            const fileInput = document.getElementById('file-input');
            const resultDiv = document.getElementById('result-content');

            let html5QrCode = null;      // 扫描器实例
            let isScanning = false;

            // ------------------- 显示结果 -------------------
            function showResult(text) {
                resultDiv.textContent = text || '（空）';
                // 若结果较长可自动换行
            }

            // ------------------- 摄像头扫码 -------------------
            function startCameraScan() {
                if (isScanning) {
                    console.warn('正在扫描中，请勿重复启动');
                    return;
                }

                // 如果已有实例则先销毁（避免重复）
                if (html5QrCode) {
                    html5QrCode.clear();
                    html5QrCode = null;
                }

                // 创建新的扫描器实例
                html5QrCode = new Html5Qrcode("reader-container");

                const config = {
                    fps: 15,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0,
                };

                // 开始扫码
                html5QrCode.start(
                    { facingMode: "environment" },  // 使用后置摄像头
                    config,
                    onScanSuccess,
                    onScanError
                )
                .then(() => {
                    isScanning = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    showResult('扫码已启动，请将二维码/条形码对准摄像头...');
                    console.log('摄像头扫码已启动');
                })
                .catch(err => {
                    console.error('启动扫码失败:', err);
                    alert('启动扫码失败：' + (err.message || '未知错误') + '\n请确保：\n1. 使用 HTTPS 访问\n2. 已授予摄像头权限');
                    // 重置按钮状态
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    // 清理实例
                    if (html5QrCode) {
                        html5QrCode.clear();
                        html5QrCode = null;
                    }
                    isScanning = false;
                });
            }

            // 扫码成功回调
            function onScanSuccess(decodedText, decodedResult) {
                console.log('扫码成功:', decodedText);
                showResult(decodedText);
                // 如果希望扫码成功后自动停止，可取消下面注释
                // stopCameraScan();
            }

            // 扫码错误回调（例如未找到码时持续报错，忽略即可）
            function onScanError(err) {
                // 大部分是 "No MultiFormat Readers were able to detect the code." 等，忽略
                // console.warn(err);
            }

            // 停止扫码
            function stopCameraScan() {
                if (html5QrCode && isScanning) {
                    html5QrCode.stop()
                        .then(() => {
                            // 停止后清除视频流，但保留容器背景
                            console.log('扫码已停止');
                            isScanning = false;
                            startBtn.disabled = false;
                            stopBtn.disabled = true;
                            showResult('扫码已停止');
                            // 清除实例，释放资源
                            html5QrCode.clear();
                            html5QrCode = null;
                        })
                        .catch(err => {
                            console.error('停止扫码出错:', err);
                            // 强制重置状态
                            isScanning = false;
                            startBtn.disabled = false;
                            stopBtn.disabled = true;
                            if (html5QrCode) {
                                html5QrCode.clear();
                                html5QrCode = null;
                            }
                        });
                } else {
                    // 若没有实例，直接重置按钮
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    isScanning = false;
                }
            }

            // ------------------- 从图片解码 -------------------
            function decodeImage(file) {
                if (!file) return;
                // 检查是否为图片
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件');
                    return;
                }

                // 使用 Html5Qrcode 的 scanFile 方法
                if (!html5QrCode) {
                    // 如果没有实例，创建一个临时的（无DOM渲染）
                    html5QrCode = new Html5Qrcode("reader-container");
                }

                // 显示加载中
                showResult('正在解码图片，请稍候...');

                html5QrCode.scanFile(file, true /* showImage */)
                    .then(decodedText => {
                        showResult(decodedText);
                        console.log('图片解码成功:', decodedText);
                    })
                    .catch(err => {
                        console.error('图片解码失败:', err);
                        showResult('解码失败：' + (err.message || '无法识别该图片中的码'));
                    })
                    .finally(() => {
                        // 重置文件输入，允许重复选择同一文件
                        fileInput.value = '';
                    });
            }

            // ------------------- 事件绑定 -------------------
            startBtn.addEventListener('click', startCameraScan);

            stopBtn.addEventListener('click', stopCameraScan);

            uploadBtn.addEventListener('click', function() {
                fileInput.click();
            });

            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    decodeImage(this.files[0]);
                }
            });

            // 页面卸载时停止扫码释放资源
            window.addEventListener('beforeunload', function() {
                if (html5QrCode && isScanning) {
                    html5QrCode.stop().catch(() => {});
                    html5QrCode.clear();
                }
            });

            // 额外：检测浏览器是否支持摄像头
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                startBtn.disabled = true;
                showResult('⚠️ 当前浏览器不支持摄像头 API，请使用“从图片解码”功能');
                alert('您的浏览器不支持摄像头调用，但您仍可通过“从图片解码”测试扫码');
            }

            console.log('扫码测试页面已加载，请确保使用 HTTPS 访问');
        })();
    </script>
</body>
</html>
