<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="zcfi 商品管理与智能扫码：无服务器、数据保存在你自己的 GitHub Gist。" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>zcfi 商品管理与智能扫码</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        :root {
            --ink: #0f172a;
            --muted: #475569;
            --line: #e2e8f0;
            --brand: #2563eb;
            --brand-soft: #eff6ff;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px 44px;
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: #eef2f7;
            background-image: radial-gradient(1200px 600px at 50% -10%, #dbeafe 0%, #eef2f7 55%, #eef2f7 100%);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        .page { width: 100%; max-width: 760px; }
        .hero { text-align: center; margin-bottom: 26px; }
        .brand {
            display: inline-block;
            margin: 0 0 10px;
            padding: 4px 12px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid var(--line);
            color: var(--brand);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 10px;
            font-size: clamp(24px, 5.2vw, 34px);
            line-height: 1.25;
            letter-spacing: 0.01em;
        }
        .intro {
            margin: 0 auto;
            max-width: 34em;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }
        .entries {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 640px) {
            .entries { grid-template-columns: 1fr 1fr; }
        }
        .entry {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 22px 22px 20px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #ffffff;
            color: inherit;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
        }
        .entry:hover {
            transform: translateY(-2px);
            border-color: #bfdbfe;
            box-shadow: 0 14px 32px rgba(37, 99, 235, 0.14);
        }
        .entry:focus-visible {
            outline: 3px solid var(--brand);
            outline-offset: 3px;
        }
        .entry-icon { font-size: 34px; line-height: 1; }
        .entry-title { font-size: 20px; font-weight: 700; }
        .entry-path {
            align-self: flex-start;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand);
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 13px;
        }
        .entry-desc { color: var(--muted); font-size: 14px; line-height: 1.65; }
        .notice {
            margin: 22px 0 0;
            padding: 13px 16px;
            border: 1px solid #fde68a;
            border-radius: 12px;
            background: #fffbeb;
            color: #92400e;
            font-size: 13px;
            line-height: 1.65;
        }
        footer {
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.8;
        }
        footer a { color: #475569; }
        footer a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
        /* v2.3.11 品牌组合（zcfi.cn | 出品：可点击跳转，外观锁定，防系统字体缩放） */
        .brand-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif !important;
            -webkit-text-size-adjust: 100% !important;
            text-size-adjust: 100% !important;
            font-size: 16px !important;
            line-height: 20px !important;
            white-space: nowrap;
        }
        .brand-logo {
            font-size: 16px !important;
            line-height: 20px !important;
            font-weight: 700 !important;
            letter-spacing: 0.2px !important;
            color: #4a6fa5 !important;
            text-decoration: none !important;
            cursor: pointer;
        }
        .brand-logo:hover {
            color: #4a6fa5 !important;
            text-decoration: none !important;
        }
        .brand-logo span { color: #4fc3a1 !important; }
        .brand-logo:focus-visible {
            outline: 2px solid #4fc3a1;
            outline-offset: 2px;
            border-radius: 2px;
        }
        .brand-bar {
            width: 1px;
            height: 1.6em;
            flex: 0 0 1px;
            background: currentColor;
            opacity: 0.25;
        }
        .brand-txt {
            font-size: 13px !important;
            line-height: 20px !important;
            font-weight: 500 !important;
            letter-spacing: 6px !important;
            margin-right: -6px;
            color: #94a3b8 !important;
        }
        footer .brand-line { margin-bottom: 8px; }
        @media (prefers-reduced-motion: reduce) {
            .entry { transition: none; }
            .entry:hover { transform: none; }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="hero">
        <p class="brand">zcfi</p>
        <h1>商品管理与智能扫码</h1>
        <p class="intro">无服务器、无数据库的轻量商品管理：页面托管在 GitHub Pages，数据保存在你自己的 GitHub Gist。</p>
    </header>

    <nav class="entries" aria-label="系统入口">
        <a class="entry" href="admin.html">
            <span class="entry-icon" aria-hidden="true">🖥️</span>
            <span class="entry-title">进入管理后台</span>
            <span class="entry-path">admin.html</span>
            <span class="entry-desc">商品树、库存、回收站、数据工具与标签打印，建议在电脑上使用。</span>
        </a>
        <a class="entry" href="scan.html">
            <span class="entry-icon" aria-hidden="true">📱</span>
            <span class="entry-title">手机扫码</span>
            <span class="entry-path">scan.html</span>
            <span class="entry-desc">连续扫码查询商品、关联快递/订单、标记售出，适合在手机上使用。</span>
        </a>
    </nav>

    <p class="notice">数据保存在你自己的 GitHub Gist；请勿在公共设备记住登录；Secret Gist 不是私有仓库。</p>

    <footer>
        <div class="brand-line" aria-label="zcfi.cn 出品">
            <a class="brand-logo" href="https://zcfi.cn/" target="_blank" rel="noopener noreferrer">zcfi<span>.</span>cn</a>
            <span class="brand-bar" aria-hidden="true"></span>
            <span class="brand-txt">出品</span>
        </div>
        <p>当前版本 v2.4.1 · <a href="tools/scanner-test.html">扫码测试页（调试用）</a></p>
    </footer>
</main>
</body>
</html>
