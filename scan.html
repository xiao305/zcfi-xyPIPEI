<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能扫码</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; margin-top: 0; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        #reader-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; min-width: 80px; }
        .search-box { display: flex; gap: 8px; margin-top: 12px; }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        .result-area {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            min-height: 60px;
            border-left: 4px solid #94a3b8;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-area .label {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .result-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 0;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .timestamp {
            font-size: 12px;
            color: #94a3b8;
        }
        .result-item .type-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .result-item .content {
            font-size: 15px;
            word-break: break-all;
            margin-top: 4px;
            white-space: pre-wrap;
        }
        .found { border-left-color: #22c55e; background: #f0fdf4; }
        .not-found { border-left-color: #ef4444; background: #fef2f2; }
        .debug-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            border-top: 1px dashed #d1d5db;
            padding-top: 4px;
        }
        /* 成本隐藏相关 */
        .cost-display { font-weight: 600; }
        .cost-toggle {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 4px;
            color: #475569;
        }
        .cost-toggle:hover { background: #e2e8f0; }
        /* 快递公司标签 */
        .courier-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 6px;
            color: #1e293b;
        }
        .courier-jt { background: #fee2e2; }
        .courier-jd { background: #fee2e2; }
        .courier-yd { background: #ffedd5; }
        .courier-yz { background: #dcfce7; }
        .courier-ems { background: #dbeafe; }
        .courier-zto { background: #dbeafe; }
        .courier-yt { background: #bfdbfe; }
        .courier-sto { background: #f3d9c6; }
        .courier-sf { background: #e5e7eb; color: #1e293b; }
        /* 关联模式提示条 */
        #associate-mode-bar {
            display: none;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 14px;
            align-items: center;
            justify-content: space-between;
        }
        #associate-mode-bar .exit-associate-btn {
            background: none;
            border: 1px solid #b45309;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            color: #b45309;
            background: #fff7ed;
        }
        /* 备注编辑 */
        .remark-edit-btn {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 6px;
            color: #475569;
        }
        .remark-edit-btn:hover { background: #e2e8f0; }
        .remark-edit-area {
            display: none;
            margin-top: 6px;
        }
        .remark-edit-area.active { display: block; }
        .remark-edit-area input {
            width: calc(100% - 100px);
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .remark-edit-area .btn-group {
            margin-top: 6px;
        }
        /* 登录遮罩 */
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-overlay.active { display: flex; }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }
        .login-box h2 { margin-top: 0; }
        .login-box label { display: block; margin-top: 12px; font-weight: 600; }
        .login-box input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 4px; }
        #login-error { color: #ef4444; margin-top: 10px; }
        .status-tip { font-size: 14px; color: #64748b; margin-top: 8px; text-align: center; }
        .clear-btn { margin-top: 8px; }
        /* 商品详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .modal h3 { margin-top: 0; }
        .modal .detail-item { margin-bottom: 8px; font-size: 15px; }
        .modal .btn-group { margin-top: 16px; }
        /* 保存动画 */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn.loading { pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body>
<!-- 登录遮罩 -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>登录</h2>
        <p style="color:#64748b; font-size:14px;">请输入 GitHub 凭证</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <div class="btn-group" style="margin-top:20px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- 主界面 -->
<div id="app-container" style="display:none;">
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h1>智能扫码</h1>
            <div>
                <button class="btn btn-danger" id="clear-history-btn" style="padding:6px 12px; font-size:14px;">清空历史</button>
                <button class="btn btn-danger" id="logout-btn" style="padding:6px 12px; font-size:14px;">退出</button>
            </div>
        </div>
        <div class="card">
            <div id="reader-container">
                <div class="placeholder-text">点击「开始扫码」<br>支持二维码 / PDF417</div>
            </div>
            <div class="btn-group">
                <button id="start-btn" class="btn btn-primary">开始扫码</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>停止</button>
            </div>
            <div class="status-tip">请允许摄像头权限</div>
        </div>
        <div class="card">
            <div class="search-box">
                <input type="text" id="manual-input" placeholder="手动输入编码 / 订单号 / 快递单号" />
                <button class="btn btn-primary" id="manual-btn">查询</button>
            </div>
            <!-- 关联模式提示条 -->
            <div id="associate-mode-bar">
                <span id="associate-mode-text">正在关联商品-编码</span>
                <button class="exit-associate-btn" id="exit-associate-btn">退出关联</button>
            </div>
        </div>
        <div class="card">
            <div id="result-area" class="result-area">
                <div class="label">扫码历史</div>
                <div id="result-content" style="margin-top:4px; color:#64748b;">等待扫码或输入...</div>
            </div>
        </div>
    </div>
</div>

<!-- 商品详情弹窗 -->
<div id="product-detail-overlay" class="modal-overlay">
    <div class="modal">
        <h3>商品详情</h3>
        <div id="detail-content"></div>
        <div class="btn-group">
            <button class="btn btn-primary" id="scan-associate-btn">扫描关联信息</button>
            <button class="btn btn-secondary" id="close-detail-btn">关闭</button>
        </div>
    </div>
</div>

<!-- 关联确认弹窗 -->
<div id="associate-overlay" class="modal-overlay">
    <div class="modal">
        <h3>关联确认</h3>
        <div id="associate-content"></div>
        <div class="btn-group">
            <button class="btn btn-success" id="confirm-associate-btn">确认关联</button>
            <button class="btn btn-secondary" id="cancel-associate-btn">取消</button>
        </div>
    </div>
</div>

<!-- 未匹配/警告弹窗 -->
<div id="warning-overlay" class="modal-overlay">
    <div class="modal">
        <h3 id="warning-title">提示</h3>
        <div id="warning-content"></div>
        <div class="btn-group" id="warning-buttons">
            <button class="btn btn-secondary" id="warning-close-btn">关闭</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 快递单号识别库
    // ============================================================
    const COURIER_RULES = [
        { company: '京东', regex: /^JDX\d{12}$/i },
        { company: '京东', regex: /^JD[A-Z]{2}\d{11}$/i },
        { company: '京东', regex: /^JD[A-Z]{3}\d{10}$/i },
        { company: '京东', regex: /^JD\d{13}$/i },
        { company: '极兔', regex: /^JT\d{13}$/i },
        { company: '申通(7734)', regex: /^7734\d{11}$/ },
        { company: '申通(7720)', regex: /^7720\d{11}$/ },
        { company: '申通', regex: /^77\d{13}$/ },
        { company: '韵达(434)', regex: /^434\d{12}$/ },
        { company: '韵达(435)', regex: /^435\d{12}$/ },
        { company: '韵达', regex: /^43\d{13}$/ },
        { company: '中通', regex: /^790\d{11}$/ },
        { company: '圆通', regex: /^YT\d{13}$/i },
        { company: '顺丰', regex: /^SF\d{13}$/i },
        { company: '邮政', regex: /^9\d{12}$/ },
        { company: 'EMS', regex: /^1\d{12}$/ }
    ];

    const COMPANY_COLOR_MAP = {
        '极兔': 'courier-jt',
        '京东': 'courier-jd',
        '韵达': 'courier-yd',
        '韵达(434)': 'courier-yd',
        '韵达(435)': 'courier-yd',
        '邮政': 'courier-yz',
        'EMS': 'courier-ems',
        '中通': 'courier-zto',
        '圆通': 'courier-yt',
        '申通': 'courier-sto',
        '申通(7734)': 'courier-sto',
        '申通(7720)': 'courier-sto',
        '顺丰': 'courier-sf'
    };

    const STORAGE_KEYS = { TOKEN: 'github_token', GIST_ID: 'gist_id', FILENAME: 'gist_filename' };
    let gistData = { products: {} };
    let currentToken = '', currentGistId = '', currentFilename = 'data.json';

    // DOM 元素
    const loginOverlay = document.getElementById('login-overlay');
    const loginToken = document.getElementById('login-token');
    const loginGistId = document.getElementById('login-gistid');
    const loginFilename = document.getElementById('login-filename');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const appContainer = document.getElementById('app-container');
    const logoutBtn = document.getElementById('logout-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const manualInput = document.getElementById('manual-input');
    const manualBtn = document.getElementById('manual-btn');
    const resultContent = document.getElementById('result-content');
    const resultArea = document.getElementById('result-area');
    const readerContainer = document.getElementById('reader-container');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const associateModeBar = document.getElementById('associate-mode-bar');
    const associateModeText = document.getElementById('associate-mode-text');
    const exitAssociateBtn = document.getElementById('exit-associate-btn');

    const productDetailOverlay = document.getElementById('product-detail-overlay');
    const detailContent = document.getElementById('detail-content');
    const scanAssociateBtn = document.getElementById('scan-associate-btn');
    const closeDetailBtn = document.getElementById('close-detail-btn');
    const associateOverlay = document.getElementById('associate-overlay');
    const associateContent = document.getElementById('associate-content');
    const confirmAssociateBtn = document.getElementById('confirm-associate-btn');
    const cancelAssociateBtn = document.getElementById('cancel-associate-btn');

    const warningOverlay = document.getElementById('warning-overlay');
    const warningTitle = document.getElementById('warning-title');
    const warningContent = document.getElementById('warning-content');
    const warningButtons = document.getElementById('warning-buttons');
    const warningCloseBtn = document.getElementById('warning-close-btn');

    let html5QrCode = null;
    let isScanning = false;
    let history = [];
    let scanMode = 'normal';
    let currentProductInfo = null;

    // ---------- GitHub API ----------
    async function getGistContent(token, gistId, filename) {
        const url = `https://api.github.com/gists/${gistId}`;
        const resp = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`GitHub API 错误: ${err.message || resp.statusText}`);
        }
        const data = await resp.json();
        const files = data.files;
        if (!files || !files[filename]) return {};
        try { return JSON.parse(files[filename].content); } catch { return {}; }
    }

    async function updateGistContent(token, gistId, filename, content) {
        const contentStr = JSON.stringify(content, null, 2);
        const url = `https://api.github.com/gists/${gistId}`;
        const payload = { files: { [filename]: { content: contentStr } } };
        const resp = await fetch(url, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`更新失败: ${err.message || resp.statusText}`);
        }
        return await resp.json();
    }

    // ---------- 工具函数 ----------
    function cleanText(text) {
        if (typeof text !== 'string') return '';
        return text.replace(/^[\s\r\n\t]+|[\s\r\n\t]+$/g, '');
    }

    function detectCourier(text) {
        const cleaned = cleanText(text);
        for (let rule of COURIER_RULES) {
            if (rule.regex.test(cleaned)) {
                return { matched: true, company: rule.company };
            }
        }
        return { matched: false };
    }

    function getCourierTagHtml(trackingNumber) {
        const courier = detectCourier(trackingNumber);
        if (!courier.matched) return '';
        const colorClass = COMPANY_COLOR_MAP[courier.company] || '';
        return `<span class="courier-tag ${colorClass}">${courier.company}</span>`;
    }

    function findProductByAny(query) {
        const products = gistData.products || {};
        let results = [];
        function traverse(obj, path) {
            for (let key in obj) {
                const node = obj[key];
                if (key === query) results.push({ type: 'node', code: key, node: node, matchField: 'code' });
                if (node.orderNumber === query) results.push({ type: 'node', code: key, node: node, matchField: 'orderNumber' });
                if (node.trackingNumber === query) results.push({ type: 'node', code: key, node: node, matchField: 'trackingNumber' });
                if (node.qrLinks && node.qrLinks.includes(query)) results.push({ type: 'node', code: key, node: node, matchField: 'qrLink' });
                if (node.items) {
                    node.items.forEach(item => {
                        if (item.code === query) results.push({ type: 'item', parentCode: key, item: item, matchField: 'code' });
                        if (item.orderNumber === query) results.push({ type: 'item', parentCode: key, item: item, matchField: 'orderNumber' });
                        if (item.trackingNumber === query) results.push({ type: 'item', parentCode: key, item: item, matchField: 'trackingNumber' });
                        if (item.qrLinks && item.qrLinks.includes(query)) results.push({ type: 'item', parentCode: key, item: item, matchField: 'qrLink' });
                    });
                }
                if (node.children) traverse(node.children, path + '/' + key);
            }
        }
        traverse(products, '');
        return results;
    }

    function findNodeByCode(code, obj) {
        if (!obj) obj = gistData.products;
        if (obj[code]) return obj[code];
        for (let key in obj) {
            if (obj[key].children) {
                const found = findNodeByCode(code, obj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    // ---------- 历史日志 ----------
    function renderHistory() {
        if (history.length === 0) {
            resultContent.innerHTML = '<div style="color:#64748b;">暂无记录</div>';
            resultArea.className = 'result-area';
            return;
        }
        let html = '';
        history.forEach((item) => {
            const time = item.time.toLocaleTimeString();
            html += `<div class="result-item">
                <div><span class="timestamp">${time}</span> <span class="type-badge">${item.typeLabel}</span></div>
                <div class="content">${item.detail}</div>
                ${item.debug ? `<div class="debug-info">${item.debug}</div>` : ''}
            </div>`;
        });
        resultContent.innerHTML = html;
        resultArea.className = 'result-area found';
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    // ---------- 成本切换（事件委托） ----------
    document.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('cost-toggle')) {
            const button = e.target;
            const costSpan = button.previousElementSibling;
            if (costSpan && costSpan.classList.contains('cost-display')) {
                if (costSpan.textContent === '***') {
                    costSpan.textContent = costSpan.dataset.cost;
                    button.textContent = '隐藏';
                } else {
                    costSpan.textContent = '***';
                    button.textContent = '显示';
                }
            }
        }
    });

    // ---------- 商品详情弹窗 ----------
    function showProductDetail(match) {
        renderProductDetail(match);
        productDetailOverlay.classList.add('active');
        // 记录历史（包含实际信息）
        let detailText = '';
        if (match.type === 'node') {
            const node = match.node;
            detailText = `商品: ${node.name || match.code} (${match.code}) 状态: ${node.status || '在售'}`;
            if (node.trackingNumber) detailText += `\n快递: ${node.trackingNumber}`;
            if (node.orderNumber) detailText += `\n订单: ${node.orderNumber}`;
            if (node.remark) detailText += `\n备注: ${node.remark}`;
        } else {
            const item = match.item;
            const parent = findNodeByCode(match.parentCode);
            const parentName = parent?.name || match.parentCode;
            detailText = `库存: ${item.name || parentName} (${item.code}) 父级: ${parentName} 状态: ${item.status || '在售'}`;
            if (item.trackingNumber) detailText += `\n快递: ${item.trackingNumber}`;
            if (item.orderNumber) detailText += `\n订单: ${item.orderNumber}`;
            if (item.remark) detailText += `\n备注: ${item.remark}`;
        }
        let debug = '';
        if (match.matchField === 'code') debug = '扫描到编码-精准匹配';
        else if (match.matchField === 'orderNumber') debug = '扫描到关联订单号';
        else if (match.matchField === 'trackingNumber') debug = '扫描到关联快递单号';
        else if (match.matchField === 'qrLink') debug = '扫描到关联链接';
        else debug = '扫描到商品';
        history.push({ time: new Date(), typeLabel: (match.type === 'node' ? '商品' : '库存'), detail: detailText, debug });
        renderHistory();
    }

    function renderProductDetail(match) {
        let detailHtml = '';
        if (match.type === 'node') {
            const node = match.node;
            const name = node.name || match.code;
            const status = node.status || '在售';
            detailHtml += `<div class="detail-item"><strong>商品:</strong> ${name} (${match.code})</div>`;
            detailHtml += `<div class="detail-item"><strong>状态:</strong> ${status}</div>`;
            if (node.cost !== undefined) {
                const cost = Number(node.cost).toFixed(2);
                detailHtml += `<div class="detail-item"><strong>成本:</strong> <span class="cost-display" data-cost="${cost}">***</span><button class="cost-toggle">显示</button></div>`;
            }
            if (node.trackingNumber) {
                detailHtml += `<div class="detail-item"><strong>快递:</strong> ${node.trackingNumber} ${getCourierTagHtml(node.trackingNumber)}</div>`;
            }
            if (node.orderNumber) detailHtml += `<div class="detail-item"><strong>订单:</strong> ${node.orderNumber}</div>`;
            if (node.qrLinks && node.qrLinks.length) detailHtml += `<div class="detail-item"><strong>链接数:</strong> ${node.qrLinks.length}</div>`;
            const remark = node.remark || '无';
            detailHtml += `<div class="detail-item"><strong>备注:</strong> <span id="remark-text">${remark}</span><button class="remark-edit-btn" id="edit-remark-btn">编辑</button></div>`;
            if (match.matchField) detailHtml += `<div class="detail-item"><strong>匹配字段:</strong> ${match.matchField}</div>`;
            currentProductInfo = { type: 'node', code: match.code, node: node };
        } else {
            const item = match.item;
            const parentNode = findNodeByCode(match.parentCode);
            const parentName = parentNode?.name || match.parentCode;
            const name = item.name || parentName;
            const status = item.status || '在售';
            detailHtml += `<div class="detail-item"><strong>库存:</strong> ${name} (${item.code})</div>`;
            detailHtml += `<div class="detail-item"><strong>父级:</strong> ${parentName}</div>`;
            detailHtml += `<div class="detail-item"><strong>状态:</strong> ${status}</div>`;
            if (item.cost !== undefined) {
                const cost = Number(item.cost).toFixed(2);
                detailHtml += `<div class="detail-item"><strong>成本:</strong> <span class="cost-display" data-cost="${cost}">***</span><button class="cost-toggle">显示</button></div>`;
            }
            if (item.trackingNumber) {
                detailHtml += `<div class="detail-item"><strong>快递:</strong> ${item.trackingNumber} ${getCourierTagHtml(item.trackingNumber)}</div>`;
            }
            if (item.orderNumber) detailHtml += `<div class="detail-item"><strong>订单:</strong> ${item.orderNumber}</div>`;
            if (item.qrLinks && item.qrLinks.length) detailHtml += `<div class="detail-item"><strong>链接数:</strong> ${item.qrLinks.length}</div>`;
            const remark = item.remark || '无';
            detailHtml += `<div class="detail-item"><strong>备注:</strong> <span id="remark-text">${remark}</span><button class="remark-edit-btn" id="edit-remark-btn">编辑</button></div>`;
            if (match.matchField) detailHtml += `<div class="detail-item"><strong>匹配字段:</strong> ${match.matchField}</div>`;
            currentProductInfo = { type: 'item', parentCode: match.parentCode, itemCode: item.code, item: item };
        }
        detailContent.innerHTML = detailHtml;

        const editBtn = document.getElementById('edit-remark-btn');
        if (editBtn) {
            editBtn.addEventListener('click', function() {
                const remarkSpan = document.getElementById('remark-text');
                const currentRemark = (remarkSpan && remarkSpan.textContent !== '无') ? remarkSpan.textContent : '';
                const editArea = document.createElement('div');
                editArea.className = 'remark-edit-area active';
                editArea.innerHTML = `
                    <input type="text" id="remark-edit-input" value="${currentRemark}" placeholder="输入备注" />
                    <div class="btn-group" style="margin-top:6px;">
                        <button class="btn btn-success btn-sm" id="save-remark-btn">保存</button>
                        <button class="btn btn-secondary btn-sm" id="cancel-remark-btn">取消</button>
                    </div>
                `;
                const remarkItem = remarkSpan.closest('.detail-item');
                remarkItem.after(editArea);
                editBtn.style.display = 'none';

                document.getElementById('save-remark-btn').addEventListener('click', async function() {
                    const newRemark = document.getElementById('remark-edit-input').value.trim();
                    if (currentProductInfo.type === 'node') {
                        currentProductInfo.node.remark = newRemark || undefined;
                    } else {
                        currentProductInfo.item.remark = newRemark || undefined;
                    }
                    // 保存动画
                    const saveBtn = document.getElementById('save-remark-btn');
                    saveBtn.classList.add('loading');
                    saveBtn.innerHTML = '<span class="spinner"></span>保存中...';
                    try {
                        await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
                        // 重新渲染详情
                        renderProductDetail(currentProductInfo);
                    } catch (e) {
                        alert('保存失败: ' + e.message);
                        saveBtn.classList.remove('loading');
                        saveBtn.textContent = '保存';
                    }
                });

                document.getElementById('cancel-remark-btn').addEventListener('click', function() {
                    editArea.remove();
                    editBtn.style.display = 'inline-block';
                });
            });
        }
    }

    // ---------- 关联模式 ----------
    function enterAssociateMode() {
        scanMode = 'associate';
        let productCode = '';
        if (currentProductInfo.type === 'node') {
            productCode = currentProductInfo.code;
        } else {
            productCode = currentProductInfo.itemCode || currentProductInfo.item.code;
        }
        associateModeText.textContent = `正在关联商品-${productCode}`;
        associateModeBar.style.display = 'flex';
        productDetailOverlay.classList.remove('active');
        startScan();
    }

    function exitAssociateMode() {
        scanMode = 'normal';
        associateModeBar.style.display = 'none';
        stopScan();
    }

    scanAssociateBtn.addEventListener('click', enterAssociateMode);
    exitAssociateBtn.addEventListener('click', exitAssociateMode);

    // ---------- 警告弹窗通用 ----------
    function showWarning(title, content, buttonsHtml) {
        warningTitle.textContent = title;
        warningContent.innerHTML = content;
        warningButtons.innerHTML = buttonsHtml || '<button class="btn btn-secondary" id="warning-close-btn">关闭</button>';
        // 绑定关闭按钮
        const closeBtn = document.getElementById('warning-close-btn');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => warningOverlay.classList.remove('active'));
        }
        warningOverlay.classList.add('active');
    }

    // ---------- 关联确认弹窗（带警告逻辑） ----------
    function showAssociatePrompt(content, type, rawText) {
        let typeName = '';
        if (type === 'tracking') typeName = '快递单号';
        else if (type === 'order') typeName = '订单号';
        else if (type === 'link') typeName = '链接';
        else typeName = '未知类型';
        let targetInfo = '';
        if (currentProductInfo.type === 'node') {
            targetInfo = `商品-${currentProductInfo.code}`;
        } else {
            targetInfo = `库存-${currentProductInfo.itemCode || currentProductInfo.item.code}`;
        }
        let extraHtml = '';
        if (type === 'tracking') {
            const courier = detectCourier(rawText);
            if (courier.matched) {
                const colorClass = COMPANY_COLOR_MAP[courier.company] || '';
                extraHtml = `<p>快递公司: <span class="courier-tag ${colorClass}">${courier.company}</span></p>`;
            }
        }
        associateContent.innerHTML = `
            <p>正在为<strong>${targetInfo}</strong>关联</p>
            <p>识别到 ${typeName}:</p>
            <p><strong>${rawText}</strong></p>
            ${extraHtml}
            <p>是否确认关联？</p>
        `;
        associateOverlay.classList.add('active');
        window.associateData = { content, type, rawText };
    }

    // ---------- 处理扫描结果 ----------
    async function handleScanResult(rawText) {
        const cleaned = cleanText(rawText);
        if (!cleaned) return;

        // 实时刷新数据库
        try {
            const freshData = await getGistContent(currentToken, currentGistId, currentFilename);
            if (freshData && freshData.products) gistData = freshData;
        } catch (e) {
            console.error('刷新数据失败:', e);
        }

        if (scanMode === 'associate') {
            stopScan();
            let type = '';
            if (cleaned.startsWith('http://') || cleaned.startsWith('https://')) {
                type = 'link';
            } else {
                const courier = detectCourier(cleaned);
                if (courier.matched) {
                    type = 'tracking';
                } else if (/^\d{10,}$/.test(cleaned)) {
                    type = 'order';
                } else {
                    showWarning('无法识别', '该内容无法识别为关联信息（订单号/快递单号/链接），请重新扫描。', '<button class="btn btn-primary" id="warning-continue-scan">继续扫描</button><button class="btn btn-secondary" id="warning-exit-associate">退出关联</button>');
                    document.getElementById('warning-continue-scan').addEventListener('click', () => {
                        warningOverlay.classList.remove('active');
                        startScan();
                    });
                    document.getElementById('warning-exit-associate').addEventListener('click', () => {
                        warningOverlay.classList.remove('active');
                        exitAssociateMode();
                    });
                    return;
                }
            }

            // 检查是否已有关联信息
            let hasExisting = false;
            let existingField = '';
            if (currentProductInfo.type === 'node') {
                const node = currentProductInfo.node;
                if (type === 'tracking' && node.trackingNumber) { hasExisting = true; existingField = 'trackingNumber'; }
                else if (type === 'order' && node.orderNumber) { hasExisting = true; existingField = 'orderNumber'; }
                else if (type === 'link' && node.qrLinks && node.qrLinks.includes(cleaned)) { hasExisting = true; existingField = 'qrLink'; }
            } else {
                const item = currentProductInfo.item;
                if (type === 'tracking' && item.trackingNumber) { hasExisting = true; existingField = 'trackingNumber'; }
                else if (type === 'order' && item.orderNumber) { hasExisting = true; existingField = 'orderNumber'; }
                else if (type === 'link' && item.qrLinks && item.qrLinks.includes(cleaned)) { hasExisting = true; existingField = 'qrLink'; }
            }

            if (hasExisting) {
                showWarning('已存在关联', `当前商品已存在${type === 'link' ? '该链接' : (type === 'tracking' ? '快递单号' : '订单号')}，是否替换为新值？`, `
                    <button class="btn btn-primary" id="warning-replace">替换</button>
                    <button class="btn btn-secondary" id="warning-cancel">取消</button>
                    <button class="btn btn-secondary" id="warning-manual">手动纠错</button>
                `);
                document.getElementById('warning-replace').addEventListener('click', () => {
                    warningOverlay.classList.remove('active');
                    // 替换逻辑：继续确认关联
                    showAssociatePrompt(cleaned, type, cleaned);
                });
                document.getElementById('warning-cancel').addEventListener('click', () => {
                    warningOverlay.classList.remove('active');
                    startScan(); // 重新扫描
                });
                document.getElementById('warning-manual').addEventListener('click', () => {
                    warningOverlay.classList.remove('active');
                    // 手动纠错：弹出输入框让用户修改
                    const newValue = prompt('请输入正确的内容：', cleaned);
                    if (newValue && newValue.trim()) {
                        showAssociatePrompt(newValue.trim(), type, newValue.trim());
                    } else {
                        startScan();
                    }
                });
                return;
            }

            showAssociatePrompt(cleaned, type, cleaned);
        } else {
            // 普通模式
            const matches = findProductByAny(cleaned);
            if (matches.length > 0) {
                showProductDetail(matches[0]);
                stopScan();
            } else {
                let typeLabel = '未匹配';
                let detailHtml = '';
                if (cleaned.startsWith('http')) {
                    typeLabel = '链接';
                    detailHtml = `<div><strong>链接:</strong> ${cleaned}</div>`;
                } else {
                    const courier = detectCourier(cleaned);
                    if (courier.matched) {
                        typeLabel = '快递单号';
                        detailHtml = `<div><strong>快递单号:</strong> ${cleaned} ${getCourierTagHtml(cleaned)}</div>`;
                    } else if (/^\d{10,}$/.test(cleaned)) {
                        typeLabel = '订单号';
                        detailHtml = `<div><strong>订单号:</strong> ${cleaned}</div>`;
                    } else {
                        typeLabel = '编码';
                        detailHtml = `<div><strong>编码:</strong> ${cleaned}</div>`;
                    }
                }
                history.push({ time: new Date(), typeLabel, detail: detailHtml, debug: '未关联到商品' });
                renderHistory();
                // 弹窗提示未找到
                showWarning('未找到商品', `扫描内容：${cleaned}\n未在数据库中找到关联商品。`, '<button class="btn btn-secondary" id="warning-close-btn">关闭</button>');
                stopScan();
            }
        }
    }

    // ---------- 确认关联 ----------
    confirmAssociateBtn.addEventListener('click', async function() {
        const data = window.associateData;
        if (!data || !currentProductInfo) return;

        // 保存动画
        confirmAssociateBtn.classList.add('loading');
        confirmAssociateBtn.innerHTML = '<span class="spinner"></span>保存中...';

        if (currentProductInfo.type === 'node') {
            const node = currentProductInfo.node;
            if (data.type === 'tracking') node.trackingNumber = data.content;
            else if (data.type === 'order') node.orderNumber = data.content;
            else if (data.type === 'link') {
                if (!node.qrLinks) node.qrLinks = [];
                if (!node.qrLinks.includes(data.content)) node.qrLinks.push(data.content);
            }
            // 状态自动变更：在售→已售，仅针对关联快递或订单
            if ((data.type === 'tracking' || data.type === 'order') && node.status === '在售') {
                node.status = '已售';
            }
        } else {
            const item = currentProductInfo.item;
            if (data.type === 'tracking') item.trackingNumber = data.content;
            else if (data.type === 'order') item.orderNumber = data.content;
            else if (data.type === 'link') {
                if (!item.qrLinks) item.qrLinks = [];
                if (!item.qrLinks.includes(data.content)) item.qrLinks.push(data.content);
            }
            if ((data.type === 'tracking' || data.type === 'order') && item.status === '在售') {
                item.status = '已售';
            }
        }

        try {
            await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
            confirmAssociateBtn.classList.remove('loading');
            confirmAssociateBtn.textContent = '确认关联';
            alert('关联成功');
            // 重新显示商品详情
            let match;
            if (currentProductInfo.type === 'node') {
                match = { type: 'node', code: currentProductInfo.code, node: currentProductInfo.node };
            } else {
                match = { type: 'item', parentCode: currentProductInfo.parentCode, itemCode: currentProductInfo.itemCode, item: currentProductInfo.item };
            }
            renderProductDetail(match);
            associateOverlay.classList.remove('active');
            scanMode = 'normal';
            associateModeBar.style.display = 'none';
            productDetailOverlay.classList.add('active');
            // 历史记录添加关联成功信息
            history.push({ time: new Date(), typeLabel: '关联成功', detail: `成功关联${data.type === 'link' ? '链接' : data.type === 'tracking' ? '快递单号' : '订单号'}：${data.content}`, debug: '关联成功' });
            renderHistory();
        } catch (e) {
            confirmAssociateBtn.classList.remove('loading');
            confirmAssociateBtn.textContent = '确认关联';
            alert('保存失败: ' + e.message);
        }
    });

    cancelAssociateBtn.addEventListener('click', function() {
        associateOverlay.classList.remove('active');
        exitAssociateMode();
        productDetailOverlay.classList.add('active');
    });

    closeDetailBtn.addEventListener('click', function() {
        productDetailOverlay.classList.remove('active');
        scanMode = 'normal';
        associateModeBar.style.display = 'none';
        currentProductInfo = null;
    });

    // ---------- 扫码功能 ----------
    function onScanSuccess(decodedText) {
        handleScanResult(decodedText);
    }
    function onScanError(err) {}

    function startScan() {
        if (isScanning) return;
        if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
        html5QrCode = new Html5Qrcode("reader-container");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        ).then(() => {
            isScanning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
        }).catch(err => {
            alert('启动摄像头失败: ' + (err.message || '未知错误'));
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isScanning = false;
            if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
        });
    }

    function stopScan() {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().then(() => {
                isScanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                html5QrCode.clear();
                html5QrCode = null;
            }).catch(() => {});
        } else {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isScanning = false;
        }
    }

    startBtn.addEventListener('click', startScan);
    stopBtn.addEventListener('click', stopScan);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        startBtn.disabled = true;
        startBtn.title = '当前浏览器不支持摄像头';
    }

    // ---------- 手动查询 ----------
    function manualQuery() {
        const raw = manualInput.value;
        if (!raw || raw.trim() === '') return;
        handleScanResult(raw);
        manualInput.value = '';
    }
    manualBtn.addEventListener('click', manualQuery);
    manualInput.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') manualQuery();
    });

    // ---------- 清空历史 ----------
    clearHistoryBtn.addEventListener('click', function() {
        history = [];
        renderHistory();
    });

    console.log('智能扫码页面已加载（完整优化版）');
</script>
</body>
</html>
