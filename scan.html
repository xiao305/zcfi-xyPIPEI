<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能扫码</title>
    <link rel="icon" href="data:," />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- 共享核心：严格读取 / 并发安全三方合并保存 / 转义 / 状态规范化 / toast -->
    <script src="js/core.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; margin-top: 0; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: background 0.2s;
            position: relative;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
        .btn-success { background: #22c55e; }
        .btn-success:hover:not(:disabled) { background: #16a34a; }
        .btn-sm { padding: 4px 12px; font-size: 14px; }
        #reader-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; min-width: 80px; }
        .search-box { display: flex; gap: 8px; margin-top: 12px; }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        .result-area {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            min-height: 60px;
            border-left: 4px solid #94a3b8;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-area .label {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .result-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 0;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .timestamp {
            font-size: 12px;
            color: #94a3b8;
        }
        .result-item .type-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .result-item .content {
            font-size: 15px;
            word-break: break-all;
            margin-top: 4px;
            white-space: pre-wrap;
        }
        .found { border-left-color: #22c55e; background: #f0fdf4; }
        .not-found { border-left-color: #ef4444; background: #fef2f2; }
        .debug-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            border-top: 1px dashed #d1d5db;
            padding-top: 4px;
        }
        .cost-display { font-weight: 600; }
        .cost-toggle {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 4px;
            color: #475569;
        }
        .cost-toggle:hover { background: #e2e8f0; }
        .courier-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 6px;
            color: #1e293b;
        }
        .courier-jt { background: #fee2e2; }
        .courier-jd { background: #fee2e2; }
        .courier-yd { background: #ffedd5; }
        .courier-yz { background: #dcfce7; }
        .courier-ems { background: #dbeafe; }
        .courier-zto { background: #dbeafe; }
        .courier-yt { background: #bfdbfe; }
        .courier-sto { background: #f3d9c6; }
        .courier-sf { background: #e5e7eb; color: #1e293b; }
        #associate-mode-bar {
            display: none;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 14px;
            align-items: center;
            justify-content: space-between;
        }
        #associate-mode-bar .exit-associate-btn {
            background: none;
            border: 1px solid #b45309;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            color: #b45309;
            background: #fff7ed;
        }
        .remark-edit-btn {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 6px;
            color: #475569;
        }
        .remark-edit-btn:hover { background: #e2e8f0; }
        .remark-edit-area {
            display: none;
            margin-top: 6px;
        }
        .remark-edit-area.active { display: block; }
        .remark-edit-area input {
            width: calc(100% - 100px);
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .remark-edit-area .btn-group {
            margin-top: 6px;
        }
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-overlay.active { display: flex; }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }
        .login-box h2 { margin-top: 0; }
        .login-box label { display: block; margin-top: 12px; font-weight: 600; }
        .login-box input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 4px; }
        #login-error { color: #ef4444; margin-top: 10px; }
        .status-tip { font-size: 14px; color: #64748b; margin-top: 8px; text-align: center; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .modal h3 { margin-top: 0; }
        .modal .detail-item { margin-bottom: 8px; font-size: 15px; }
        .modal .btn-group { margin-top: 16px; }
        .modal .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            color: white;
        }
        .status-pending { background: #f59e0b; }
        .status-onsale { background: #22c55e; }
        .status-sold { background: #94a3b8; }
        .status-unknown { background: #e2e8f0; color: #475569; }
        #not-found-content { white-space: pre-line; }
        .save-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
        }
        .save-status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .save-status.success { color: #16a34a; }
        .save-status.error { color: #dc2626; }
        .not-found-modal .modal {
            border-left: 6px solid #ef4444;
        }
        .not-found-modal .modal h3 { color: #dc2626; }
        .associate-type-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 4px;
        }
        .associate-warning {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            color: #b91c1c;
            word-break: break-all;
        }
        #associate-content {
            word-break: break-all;
        }
        #associate-content p {
            word-break: break-all;
        }
        .associate-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
        .associate-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<!-- 登录遮罩 -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>登录</h2>
        <p style="color:#64748b; font-size:14px;">请输入 GitHub 凭证</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <div class="btn-group" style="margin-top:20px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- 主界面 -->
<div id="app-container" style="display:none;">
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h1>智能扫码</h1>
            <div>
                <button class="btn btn-danger" id="clear-history-btn" style="padding:6px 12px; font-size:14px;">清空历史</button>
                <button class="btn btn-danger" id="logout-btn" style="padding:6px 12px; font-size:14px;">退出</button>
            </div>
        </div>
        <div class="card">
            <div id="reader-container">
                <div class="placeholder-text">点击「开始扫码」<br>支持二维码 / PDF417</div>
            </div>
            <div class="btn-group">
                <button id="start-btn" class="btn btn-primary">开始扫码</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>停止</button>
            </div>
            <div class="status-tip" id="camera-status">请允许摄像头权限</div>
        </div>
        <div class="card">
            <div class="search-box">
                <input type="text" id="manual-input" placeholder="手动输入编码 / 订单号 / 快递单号" />
                <button class="btn btn-primary" id="manual-btn">查询</button>
            </div>
            <div id="associate-mode-bar">
                <span id="associate-mode-text">正在关联商品-编码</span>
                <button class="exit-associate-btn" id="exit-associate-btn">退出关联</button>
            </div>
        </div>
        <div class="card">
            <div id="result-area" class="result-area">
                <div class="label">扫码历史</div>
                <div id="result-content" style="margin-top:4px; color:#64748b;">等待扫码或输入...</div>
            </div>
        </div>
    </div>
</div>

<!-- 商品详情弹窗 -->
<div id="product-detail-overlay" class="modal-overlay">
    <div class="modal">
        <h3 id="detail-title">商品详情</h3>
        <div id="detail-content"></div>
        <div class="btn-group">
            <button class="btn btn-primary" id="scan-associate-btn">扫描关联信息</button>
            <button class="btn btn-secondary" id="close-detail-btn">关闭</button>
        </div>
    </div>
</div>

<!-- 关联确认弹窗 -->
<div id="associate-overlay" class="modal-overlay">
    <div class="modal">
        <h3>关联确认</h3>
        <div id="associate-content"></div>
        <div id="associate-warning-area" class="associate-warning" style="display:none;"></div>
        <label>关联类型</label>
        <select id="associate-type-select" class="associate-type-select">
            <option value="tracking">快递单号</option>
            <option value="order">订单号</option>
            <option value="link">链接</option>
        </select>
        <div class="associate-checkbox">
            <input type="checkbox" id="mark-as-sold-checkbox">
            <label for="mark-as-sold-checkbox">关联后标记为“售出”（无论当前状态）</label>
        </div>
        <div class="btn-group">
            <button class="btn btn-success" id="confirm-associate-btn">确认关联</button>
            <button class="btn btn-secondary" id="cancel-associate-btn">取消</button>
        </div>
        <div class="save-status" id="associate-save-status" style="margin-top:8px;"></div>
    </div>
</div>

<!-- 未找到弹窗 -->
<div id="not-found-overlay" class="modal-overlay not-found-modal">
    <div class="modal">
        <h3>⚠️ 未找到匹配商品</h3>
        <p id="not-found-content">扫描内容无法关联到任何商品或库存项。</p>
        <p style="font-size:14px; color:#64748b;">已停止扫描，您可重新开始或查看历史记录。</p>
        <div class="btn-group">
            <button class="btn btn-primary" id="not-found-ok">确定</button>
        </div>
    </div>
</div>

<script>
    'use strict';
    /* ============================================================
     * 智能扫码页（scan.html）R1
     * - 数据读写统一走 js/core.js：ZCFI.get 严格读取 / ZCFI.save 并发安全三方合并
     * - 所有动态 HTML 一律 escapeHtml；备注/链接只按纯文本处理
     * - 摄像头 idle/starting/scanning/stopping 串行状态机 + 扫码锁 + 2 秒去重
     * - 历史记录 localStorage 持久化（最近 200 条，含时间/类型/内容/是否命中）
     * ============================================================ */
    const Z = window.ZCFI;
    if (!Z) {
        console.error('[scan] js/core.js 未加载，数据读写功能不可用');
    }

    // ============================================================
    // 快递识别库
    // ============================================================
    const COURIER_RULES = [
        { company: '京东', regex: /^JDX\d{12}$/i },
        { company: '京东', regex: /^JD[A-Z]{2}\d{11}$/i },
        { company: '京东', regex: /^JD[A-Z]{3}\d{10}$/i },
        { company: '京东', regex: /^JD\d{13}$/i },
        { company: '极兔', regex: /^JT\d{13}$/i },
        { company: '申通(7734)', regex: /^7734\d{11}$/ },
        { company: '申通(7720)', regex: /^7720\d{11}$/ },
        { company: '申通', regex: /^77\d{13}$/ },
        { company: '韵达(434)', regex: /^434\d{12}$/ },
        { company: '韵达(435)', regex: /^435\d{12}$/ },
        { company: '韵达', regex: /^43\d{13}$/ },
        { company: '中通', regex: /^790\d{11}$/ },
        { company: '圆通', regex: /^YT\d{13}$/i },
        { company: '顺丰', regex: /^SF\d{13}$/i },
        { company: '邮政', regex: /^9\d{12}$/ },
        { company: 'EMS', regex: /^1\d{12}$/ }
    ];

    const COMPANY_COLOR_MAP = {
        '极兔': 'courier-jt',
        '京东': 'courier-jd',
        '韵达': 'courier-yd',
        '韵达(434)': 'courier-yd',
        '韵达(435)': 'courier-yd',
        '邮政': 'courier-yz',
        'EMS': 'courier-ems',
        '中通': 'courier-zto',
        '圆通': 'courier-yt',
        '申通': 'courier-sto',
        '申通(7734)': 'courier-sto',
        '申通(7720)': 'courier-sto',
        '顺丰': 'courier-sf'
    };

    // 关联类型 / 匹配字段的中文映射
    const TYPE_LABELS = { tracking: '快递单号', order: '订单号', link: '链接' };
    const MATCH_FIELD_LABELS = {
        code: '内部编码',
        orderNumber: '订单号',
        trackingNumber: '快递单号',
        qrLink: '关联链接'
    };

    // ============================================================
    // 本地存储键与状态
    // ============================================================
    const STORAGE_KEYS = { TOKEN: 'github_token', GIST_ID: 'gist_id', FILENAME: 'gist_filename' };
    const HISTORY_KEY = 'zcfi_scan_history_v1';
    const HISTORY_LIMIT = 200;
    const DEDUPE_MS = 2000;

    var gistData = { products: {} };
    let baseDoc = null;                 // 最近一次成功加载/保存的完整文档快照（三方合并基准）
    let currentToken = '';
    let currentGistId = '';
    let currentFilename = 'data.json';
    let dataUpdatedAt = null;

    let loginBusy = false;
    let scanMode = 'normal';            // normal | associate
    let currentProductInfo = null;      // { type:'node', code } | { type:'item', parentCode, itemCode }
    let currentAssociateData = null;    // { rawText, detectedType, selectedType }
    let processing = false;             // 扫码锁：进入 handleScanResult 同步置位
    let lastHandled = { text: '', time: 0 };
    let history = [];

    // ============================================================
    // DOM 引用
    // ============================================================
    const loginOverlay = document.getElementById('login-overlay');
    const loginToken = document.getElementById('login-token');
    const loginGistId = document.getElementById('login-gistid');
    const loginFilename = document.getElementById('login-filename');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const appContainer = document.getElementById('app-container');
    const logoutBtn = document.getElementById('logout-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const manualInput = document.getElementById('manual-input');
    const manualBtn = document.getElementById('manual-btn');
    const resultContent = document.getElementById('result-content');
    const resultArea = document.getElementById('result-area');
    const readerContainer = document.getElementById('reader-container');
    const cameraStatus = document.getElementById('camera-status');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const associateModeBar = document.getElementById('associate-mode-bar');
    const associateModeText = document.getElementById('associate-mode-text');
    const exitAssociateBtn = document.getElementById('exit-associate-btn');

    const productDetailOverlay = document.getElementById('product-detail-overlay');
    const detailContent = document.getElementById('detail-content');
    const scanAssociateBtn = document.getElementById('scan-associate-btn');
    const closeDetailBtn = document.getElementById('close-detail-btn');

    const associateOverlay = document.getElementById('associate-overlay');
    const associateContent = document.getElementById('associate-content');
    const associateWarningArea = document.getElementById('associate-warning-area');
    const associateTypeSelect = document.getElementById('associate-type-select');
    const confirmAssociateBtn = document.getElementById('confirm-associate-btn');
    const cancelAssociateBtn = document.getElementById('cancel-associate-btn');
    const associateSaveStatus = document.getElementById('associate-save-status');
    const markAsSoldCheckbox = document.getElementById('mark-as-sold-checkbox');

    const notFoundOverlay = document.getElementById('not-found-overlay');
    const notFoundContent = document.getElementById('not-found-content');
    const notFoundOk = document.getElementById('not-found-ok');

    // ============================================================
    // 通用小工具
    // ============================================================
    function esc(value) {
        return Z ? Z.escapeHtml(value) : String(value === undefined || value === null ? '' : value);
    }

    function toast(message, type) {
        if (Z) Z.toast(message, { type: type || 'info' });
        else console.log('[toast]', message);
    }

    function errorText(err) {
        return Z ? Z.friendlyError(err) : ((err && err.message) || String(err));
    }

    function runAsync(fn) {
        return function () {
            let result;
            try {
                result = fn.apply(this, arguments);
            } catch (e) {
                console.error('[scan] 同步异常', e);
                toast('操作失败：' + errorText(e), 'error');
                return;
            }
            if (result && typeof result.catch === 'function') {
                result.catch(function (e) {
                    console.error('[scan] 异步异常', e);
                    toast('操作失败：' + errorText(e), 'error');
                });
            }
            return result;
        };
    }

    function detectCourier(text) {
        const normalized = Z ? Z.normalizeCode(text) : String(text || '').trim();
        for (let i = 0; i < COURIER_RULES.length; i += 1) {
            if (COURIER_RULES[i].regex.test(normalized)) {
                return { matched: true, company: COURIER_RULES[i].company };
            }
        }
        return { matched: false };
    }

    function getCourierTagHtml(trackingNumber) {
        const courier = detectCourier(trackingNumber);
        if (!courier.matched) return '';
        const colorClass = COMPANY_COLOR_MAP[courier.company] || '';
        return '<span class="courier-tag ' + esc(colorClass) + '">' + esc(courier.company) + '</span>';
    }

    function formatMatchField(field) {
        return MATCH_FIELD_LABELS[field] || field || '';
    }

    function statusBadgeHtml(status) {
        const normalized = Z ? Z.normalizeStatus(status) : (status || '在售');
        const cls = Z ? Z.statusClass(normalized) : 'status-unknown';
        return '<span class="status-badge ' + esc(cls) + '">' + esc(normalized) + '</span>';
    }

    // ============================================================
    // 历史记录（localStorage 持久化，最近 200 条）
    // ============================================================
    function loadHistory() {
        const raw = Z ? Z.storage.getJson(HISTORY_KEY, []) : [];
        if (!Array.isArray(raw)) return [];
        return raw.slice(-HISTORY_LIMIT).map(function (entry, index) {
            const row = (entry && typeof entry === 'object') ? entry : {};
            const date = row.time ? new Date(row.time) : new Date();
            return {
                time: isNaN(date.getTime()) ? new Date() : date,
                typeLabel: row.typeLabel ? String(row.typeLabel) : '记录',
                detail: row.detail ? String(row.detail) : '',
                debug: row.debug ? String(row.debug) : '',
                matched: !!row.matched
            };
        });
    }

    function persistHistory() {
        if (!Z) return;
        const payload = history.slice(-HISTORY_LIMIT).map(function (item) {
            const time = item.time instanceof Date ? item.time.getTime() : Number(item.time);
            return {
                time: isFinite(time) ? time : Date.now(),
                typeLabel: item.typeLabel,
                detail: item.detail,
                debug: item.debug,
                matched: !!item.matched
            };
        });
        Z.storage.setJson(HISTORY_KEY, payload);
    }

    function pushHistory(entry) {
        history.push(entry);
        if (history.length > HISTORY_LIMIT) history = history.slice(-HISTORY_LIMIT);
        persistHistory();
        renderHistory();
    }

    function renderHistory() {
        if (!history.length) {
            // 静态字符串，不含用户数据
            resultContent.innerHTML = '<div style="color:#64748b;">暂无记录</div>';
            resultArea.className = 'result-area';
            return;
        }
        let html = '';
        history.forEach(function (item) {
            const when = Z ? Z.formatDateTime(item.time) : String(item.time);
            html += '<div class="result-item">' +
                '<div><span class="timestamp">' + esc(when) + '</span> ' +
                '<span class="type-badge">' + esc(item.typeLabel) + '</span></div>' +
                '<div class="content">' + esc(item.detail) + '</div>' +
                (item.debug ? '<div class="debug-info">' + esc(item.debug) + '</div>' : '') +
                '</div>';
        });
        resultContent.innerHTML = html;
        const hasMatched = history.some(function (item) { return item.matched; });
        resultArea.className = 'result-area ' + (hasMatched ? 'found' : 'not-found');
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    // ============================================================
    // 文案化的摄像头错误提示
    // ============================================================
    function cameraErrorMessage(err) {
        const name = err && (err.name || err.code) ? String(err.name || err.code) : '';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
            return '摄像头权限被拒绝，请在浏览器设置中允许摄像头后重试';
        }
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') {
            return '未找到可用摄像头，请改用“手动输入”';
        }
        if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') {
            return '摄像头被其他应用占用或无法启动，请关闭其他相机应用后重试';
        }
        const raw = err && err.message ? String(err.message) : '未知错误';
        return '摄像头启动失败：' + raw + '。可重试，或使用手动输入';
    }

    // ============================================================
    // 数据加载（严格读取，失败抛出带 code 的错误）
    // ============================================================
    async function loadDocument(token, gistId, filename) {
        if (!Z) throw new Error('js/core.js 未加载，无法读取数据');
        const result = await Z.get(token, gistId, filename);
        return result;
    }

    async function performLogin() {
        if (loginBusy) return;
        const token = loginToken.value.trim();
        const gistId = loginGistId.value.trim();
        const filename = loginFilename.value.trim() || 'data.json';
        if (!token || !gistId) {
            loginError.textContent = '请填写 Token 和 Gist ID';
            return;
        }
        loginBusy = true;
        loginBtn.disabled = true;
        const oldBtnText = loginBtn.textContent;
        loginBtn.textContent = '登录中…';
        loginError.textContent = '';
        try {
            const result = await loadDocument(token, gistId, filename);
            // 仅在读取彻底成功后，才切换页面状态并落 localStorage
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            gistData = result.data;
            baseDoc = Z.clone(result.data);
            dataUpdatedAt = result.updatedAt || null;
            Z.storage.set(STORAGE_KEYS.TOKEN, token);
            Z.storage.set(STORAGE_KEYS.GIST_ID, gistId);
            Z.storage.set(STORAGE_KEYS.FILENAME, filename);

            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            if (cameraStatus) cameraStatus.textContent = '请允许摄像头权限';
            setScanState(SCAN_IDLE);
            resetReaderArea();

            processing = false;
            currentProductInfo = null;
            currentAssociateData = null;
            scanMode = 'normal';
            lastHandled = { text: '', time: 0 };

            if (history.length) {
                renderHistory();
            } else {
                resultContent.innerHTML = '<div style="color:#64748b;">已登录，请扫码或输入</div>';
                resultArea.className = 'result-area';
            }
            toast('登录成功', 'success');
        } catch (e) {
            loginError.textContent = '登录失败：' + errorText(e);
        } finally {
            loginBusy = false;
            loginBtn.disabled = false;
            loginBtn.textContent = oldBtnText || '登录';
        }
    }

        processing = false;
        await stopScan().catch(function () {});
        Z.storage.remove(STORAGE_KEYS.TOKEN);
        Z.storage.remove(STORAGE_KEYS.GIST_ID);
        Z.storage.remove(STORAGE_KEYS.FILENAME);

        dataUpdatedAt = null;
        appContainer.style.display = 'none';

        loginToken.value = '';
        loginGistId.value = 'f13d97c430522e4851afbf3cd2331e14';

    // ============================================================
    // 摄像头状态机（idle / starting / scanning / stopping，串行队列）
    // ============================================================
    const SCAN_IDLE = 'idle';
    const SCAN_STARTING = 'starting';
    const SCAN_SCANNING = 'scanning';
    const SCAN_STOPPING = 'stopping';
    let scanState = SCAN_IDLE;
    let scanQueue = Promise.resolve();
    let html5QrCode = null;

    function enqueueScan(task) {
        const run = scanQueue.then(task, task);
        scanQueue = run.then(function () {}, function () {});
        return run;
    }

    function setScanState(nextState) {
        scanState = nextState;
        startBtn.disabled = nextState !== SCAN_IDLE;
        stopBtn.disabled = nextState !== SCAN_SCANNING;
        startBtn.textContent = nextState === SCAN_STARTING ? '启动中…' : '开始扫码';
        stopBtn.textContent = nextState === SCAN_STOPPING ? '停止中…' : '停止';
        startBtn.title = '';
    }

    function resetReaderArea() {
        if (!readerContainer) return;
        readerContainer.textContent = '';
        const div = document.createElement('div');
        div.className = 'placeholder-text';
        div.appendChild(document.createTextNode('点击「开始扫码」'));
        div.appendChild(document.createElement('br'));
        div.appendChild(document.createTextNode('支持二维码 / PDF417'));
        readerContainer.appendChild(div);
    }

    function showStoppedPlaceholder() {
        if (!readerContainer) return;
        readerContainer.textContent = '';
        const div = document.createElement('div');
        div.className = 'placeholder-text';
        div.appendChild(document.createTextNode('已停止扫码'));
        div.appendChild(document.createElement('br'));
        div.appendChild(document.createTextNode('点击「开始扫码」继续'));
        readerContainer.appendChild(div);
    }

    function onScanSuccess(decodedText) {
        // 相机回调可能按帧连续触发，由 handleScanResult 内的锁与去重收敛
        handleScanResult(decodedText);
    }

    function onScanError() {
        // 通常为“本帧未识别到码”，无需提示，避免刷屏
    }

    function startScan() {
        return enqueueScan(async function () {
            if (scanState === SCAN_SCANNING) return true;
            if (typeof window.Html5Qrcode !== 'function') {
                toast('扫码组件未加载，请刷新页面后重试，或使用手动输入', 'error');
                if (cameraStatus) cameraStatus.textContent = '扫码组件未加载，请刷新页面或使用手动输入';
                setScanState(SCAN_IDLE);
                return false;
            }
            setScanState(SCAN_STARTING);
            if (cameraStatus) cameraStatus.textContent = '正在启动摄像头…';
            try {
                if (html5QrCode) {
                    try { await html5QrCode.clear(); } catch (e) { /* 清理失败忽略 */ }
                    html5QrCode = null;
                }
                const instance = new window.Html5Qrcode('reader-container');
                html5QrCode = instance;
                await instance.start(
                    { facingMode: 'environment' },
                    { fps: 15, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    onScanError
                );
                setScanState(SCAN_SCANNING);
                if (cameraStatus) cameraStatus.textContent = '摄像头已就绪，请对准二维码 / PDF417';
                processing = false;
                return true;
            } catch (err) {
                try { if (html5QrCode) await html5QrCode.clear(); } catch (e) { /* ignore */ }
                html5QrCode = null;
                setScanState(SCAN_IDLE);
                resetReaderArea();
                const message = cameraErrorMessage(err);
                if (cameraStatus) cameraStatus.textContent = message + '（可重试，或使用手动输入）';
                toast(message, 'error');
                return false;
            }
        });
    }

    function stopScan() {
        return enqueueScan(async function () {
            const instance = html5QrCode;
            if (!instance) {
                if (scanState !== SCAN_IDLE) setScanState(SCAN_IDLE);
                return;
            }
            setScanState(SCAN_STOPPING);
            try {
                await instance.stop();
            } catch (e) {
                // 停止失败（可能尚未真正启动）也继续清理
            }
            try {
                await instance.clear();
            } catch (e) { /* ignore */ }
            html5QrCode = null;
            setScanState(SCAN_IDLE);
            showStoppedPlaceholder();
        });
    }

    // ============================================================
    // 文档解析：按最新 gistData 解析当前商品/库存
    // ============================================================
    function resolveCurrentEntity() {
        if (!currentProductInfo) return null;
        if (currentProductInfo.type === 'node') {
            const node = Z.findNodeByCode(gistData, currentProductInfo.code);
            if (!node) return null;
            return { kind: 'node', code: currentProductInfo.code, entity: node };
        }
        if (currentProductInfo.type === 'item') {
            const parent = Z.findNodeByCode(gistData, currentProductInfo.parentCode);
            if (!parent) return null;
            const item = Z.findItem(parent, currentProductInfo.itemCode);
            if (!item) return null;
            return {
                kind: 'item',
                code: currentProductInfo.itemCode,
                parentCode: currentProductInfo.parentCode,
                entity: item,
                parent: parent
            };
        }
        return null;
    }

    // 兼容旧内部函数名：本地自动化用例/调试脚本可能调用
    function getLatestMatchFromCurrent() {
        const resolved = resolveCurrentEntity();
        if (!resolved) return null;
        if (resolved.kind === 'node') {
            return { type: 'node', code: resolved.code, node: resolved.entity };
        }
        return {
            type: 'item',
            parentCode: resolved.parentCode,
            itemCode: resolved.code,
            item: resolved.entity
        };
    }

    function findProductByAny(query) {
        const keyword = Z.normalizeQuery(query);
        if (!keyword) return [];
        const results = [];
        const seen = Object.create(null);
        function push(match) {
            const key = match.type === 'node'
                ? 'node:' + match.code
                : 'item:' + match.parentCode + '/' + match.item.code;
            if (seen[key]) return;
            seen[key] = true;
            results.push(match);
        }
        Z.walk(gistData, function (node, code) {
            if (Z.sameCode(code, query)) {
                push({ type: 'node', code: code, node: node, matchField: 'code' });
            }
            if (Z.sameCode(node.orderNumber, query)) {
                push({ type: 'node', code: code, node: node, matchField: 'orderNumber' });
            }
            if (Z.sameCode(node.trackingNumber, query)) {
                push({ type: 'node', code: code, node: node, matchField: 'trackingNumber' });
            }
            if (Array.isArray(node.qrLinks) && node.qrLinks.some(function (link) { return Z.sameUrl(link, query); })) {
                push({ type: 'node', code: code, node: node, matchField: 'qrLink' });
            }
            if (Array.isArray(node.items)) {
                node.items.forEach(function (item) {
                    if (!item) return;
                    if (Z.sameCode(item.code, query)) {
                        push({ type: 'item', parentCode: code, item: item, matchField: 'code' });
                    }
                    if (Z.sameCode(item.orderNumber, query)) {
                        push({ type: 'item', parentCode: code, item: item, matchField: 'orderNumber' });
                    }
                    if (Z.sameCode(item.trackingNumber, query)) {
                        push({ type: 'item', parentCode: code, item: item, matchField: 'trackingNumber' });
                    }
                    if (Array.isArray(item.qrLinks) && item.qrLinks.some(function (link) { return Z.sameUrl(link, query); })) {
                        push({ type: 'item', parentCode: code, item: item, matchField: 'qrLink' });
                    }
                });
            }
        });
        return results;
    }

    // ============================================================
    // 商品详情
    // ============================================================
    function showProductDetail(match) {
        notFoundOverlay.classList.remove('active');
        if (match.type === 'node') {
            currentProductInfo = { type: 'node', code: match.code, matchField: match.matchField };
        } else {
            currentProductInfo = {
                type: 'item',
                parentCode: match.parentCode,
                itemCode: match.item.code,
                matchField: match.matchField
            };
        }
        renderProductDetail();
        productDetailOverlay.classList.add('active');
        const scopeLabel = match.type === 'node' ? '商品' : '库存';
        const codeDisplay = match.type === 'node' ? match.code : match.item.code;
        pushHistory({
            time: new Date(),
            typeLabel: scopeLabel,
            detail: '匹配到 ' + scopeLabel + '：' + codeDisplay,
            debug: match.matchField ? ('扫描命中：' + formatMatchField(match.matchField)) : '扫描命中商品',
            matched: true
        });
    }

    function renderProductDetail() {
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            closeProductDetailSurface();
            return;
        }
        const info = resolved.entity;
        const isNode = resolved.kind === 'node';
        const parentName = isNode ? '' : (resolved.parent.name || resolved.parentCode);
        const name = info.name || (isNode ? resolved.code : parentName);
        const status = Z.normalizeStatus(info.status);
        const remark = (info.remark === undefined || info.remark === null || info.remark === '')
            ? '无'
            : String(info.remark);

        let html = '';
        if (isNode) {
            html += '<div class="detail-item"><strong>商品:</strong> ' + esc(name) + ' (' + esc(resolved.code) + ')</div>';
        } else {
            html += '<div class="detail-item"><strong>库存:</strong> ' + esc(name) + ' (' + esc(resolved.code) + ')</div>';
            html += '<div class="detail-item"><strong>父级:</strong> ' + esc(parentName) + '</div>';
        }
        html += '<div class="detail-item"><strong>状态:</strong> ' + statusBadgeHtml(status) + '</div>';

        if (info.cost !== undefined && info.cost !== null && info.cost !== '') {
            const costNumber = Number(info.cost);
            const costText = isFinite(costNumber) ? costNumber.toFixed(2) : String(info.cost);
            html += '<div class="detail-item"><strong>成本:</strong> ' +
                '<span class="cost-display" data-cost="' + esc(costText) + '">***</span>' +
                '<button class="cost-toggle" type="button">显示</button></div>';
        }
        if (info.trackingNumber) {
            html += '<div class="detail-item"><strong>快递:</strong> ' +
                esc(info.trackingNumber) + ' ' + getCourierTagHtml(info.trackingNumber) + '</div>';
        }
        if (info.orderNumber) {
            html += '<div class="detail-item"><strong>订单:</strong> ' + esc(info.orderNumber) + '</div>';
        }
        const linkCount = Array.isArray(info.qrLinks) ? info.qrLinks.length : 0;
        if (linkCount) {
            html += '<div class="detail-item"><strong>链接数:</strong> ' + linkCount + '</div>';
        }
        html += '<div class="detail-item"><strong>备注:</strong> ' +
            '<span id="remark-text">' + esc(remark) + '</span>' +
            '<button class="remark-edit-btn" id="edit-remark-btn" type="button">编辑</button></div>';
        if (currentProductInfo.matchField) {
            html += '<div class="detail-item"><strong>匹配字段:</strong> ' +
                esc(formatMatchField(currentProductInfo.matchField)) + '</div>';
        }
        detailContent.innerHTML = html;

        const editBtn = document.getElementById('edit-remark-btn');
        if (editBtn) editBtn.addEventListener('click', openRemarkEditor);
    }

    function openRemarkEditor() {
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            return;
        }
        const remarkSpan = document.getElementById('remark-text');
        if (!remarkSpan) return;
        const row = remarkSpan.closest('.detail-item');
        if (!row) return;
        if (row.nextElementSibling && row.nextElementSibling.classList.contains('remark-edit-area')) return;

        const editBtn = document.getElementById('edit-remark-btn');
        const currentRemark = (resolved.entity.remark === undefined || resolved.entity.remark === null)
            ? ''
            : String(resolved.entity.remark);

        // 用 DOM API 构建，避免把备注拼进 HTML/属性（XSS）
        const area = document.createElement('div');
        area.className = 'remark-edit-area active';

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'remark-edit-input';
        input.placeholder = '输入备注';
        input.value = currentRemark;

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';
        btnGroup.style.marginTop = '6px';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.id = 'save-remark-btn';
        saveBtn.className = 'btn btn-success btn-sm';
        saveBtn.textContent = '保存';

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.id = 'cancel-remark-btn';
        cancelBtn.className = 'btn btn-secondary btn-sm';
        cancelBtn.textContent = '取消';

        const statusDiv = document.createElement('div');
        statusDiv.className = 'save-status';
        statusDiv.id = 'remark-save-status';

        btnGroup.appendChild(saveBtn);
        btnGroup.appendChild(cancelBtn);
        area.appendChild(input);
        area.appendChild(btnGroup);
        area.appendChild(statusDiv);
        row.after(area);
        if (editBtn) editBtn.style.display = 'none';

        function closeEditor() {
            if (area.parentNode) area.parentNode.removeChild(area);
            const btn = document.getElementById('edit-remark-btn');
            if (btn) btn.style.display = 'inline-block';
        }

        saveBtn.addEventListener('click', function () {
            saveRemark(saveBtn, statusDiv, closeEditor).catch(function (e) {
                console.error('[scan] 保存备注异常', e);
            });
        });
        cancelBtn.addEventListener('click', closeEditor);
        try { input.focus(); } catch (e) { /* ignore */ }
    }

    async function saveRemark(saveBtn, statusDiv, closeEditor) {
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            return;
        }
        const input = document.getElementById('remark-edit-input');
        const newRemark = input ? input.value.trim() : '';
        const currentRemark = (resolved.entity.remark === undefined || resolved.entity.remark === null)
            ? ''
            : String(resolved.entity.remark).trim();
        if (newRemark === currentRemark) {
            toast('备注未修改', 'info');
            closeEditor();
            return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中…';
        statusDiv.className = 'save-status';
        statusDiv.innerHTML = '<span class="spinner"></span> 保存中…';
        try {
            await saveEntityFields({ remark: newRemark || undefined });
            toast('备注已保存', 'success');
            // 成功后才用 result.data 重建详情；失败时页面与内存均保持原值
            renderProductDetail();
        } catch (e) {
            statusDiv.className = 'save-status error';
            statusDiv.textContent = '保存失败：' + errorText(e) + '。可重试。';
            saveBtn.disabled = false;
            saveBtn.textContent = '重试保存';
            toast('备注保存失败：' + errorText(e), 'error');
        }
    }

    // ============================================================
    // 并发安全保存：只提交实际变化的字段（ZCFI.save 内部重新 GET + 三方合并）
    // ============================================================
    function askConflict(conflicts) {
        try {
            const lines = conflicts.map(function (conflict) {
                const label = conflict.label || conflict.field || '字段';
                const target = conflict.target ? '（' + conflict.target + '）' : '';
                return '· ' + label + target;
            }).join('\n');
            const ok = window.confirm(
                '检测到其它设备同时修改了数据：\n' + lines +
                '\n\n点击“确定”用本次修改覆盖远端；点击“取消”放弃本次保存。'
            );
            if (!ok) return null;
            return conflicts.map(function () { return 'mine'; });
        } catch (e) {
            return null;
        }
    }

    function buildEntityOp(fields) {
        const resolved = resolveCurrentEntity();
        if (!resolved) throw new Error('商品信息已过期，请重新扫码');
        if (resolved.kind === 'node') {
            return { type: 'node.upsert', code: resolved.code, fields: fields };
        }
        return { type: 'item.upsert', parentCode: resolved.parentCode, code: resolved.code, fields: fields };
    }

    async function saveEntityFields(fields) {
        if (!Z) throw new Error('js/core.js 未加载，无法保存');
        if (!currentToken || !currentGistId) throw new Error('登录已失效，请重新登录');
        if (!baseDoc) throw new Error('本地数据尚未加载完成，请稍后重试');
        const op = buildEntityOp(fields);
        // 先 remote GET + 三方合并；成功才替换 gistData，失败时内存与界面保持原样
        const result = await Z.save({
            token: currentToken,
            gistId: currentGistId,
            filename: currentFilename,
            baseDoc: baseDoc,
            ops: [op],
            // 页面提供显式“重试保存”入口：不做隐藏的 5xx 自动重试，避免用户重复点击时语义不清
            maxAttempts: 1,
            onConflict: function (conflicts) {
                return askConflict(conflicts);
            }
        });
        gistData = result.data;
        baseDoc = Z.clone(result.data);
        dataUpdatedAt = result.updatedAt || dataUpdatedAt;
        return result;
    }

    // ============================================================
    // 关联模式
    // ============================================================
    function enterAssociateMode() {
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            closeProductDetailSurface();
            return Promise.resolve(false);
        }
        scanMode = 'associate';
        associateModeText.textContent = '正在关联商品-' + resolved.code;
        associateModeBar.style.display = 'flex';
        productDetailOverlay.classList.remove('active');
        currentAssociateData = null;
        associateSaveStatus.className = 'save-status';
        associateSaveStatus.innerHTML = '';
        markAsSoldCheckbox.checked = false;
        processing = false;
        // startScan 会等待上一次 stop 完成后再启动（串行队列）
        return startScan();
    }

    async function exitAssociateMode() {
        scanMode = 'normal';
        associateModeBar.style.display = 'none';
        associateOverlay.classList.remove('active');
        associateSaveStatus.className = 'save-status';
        associateSaveStatus.innerHTML = '';
        currentAssociateData = null;
        markAsSoldCheckbox.checked = false;
        processing = false;
        await stopScan();
    }

    function detectAssociateType(text) {
        if (Z && Z.isHttpUrl(text)) return 'link';
        const courier = detectCourier(text);
        if (courier.matched) return 'tracking';
        if (/^\d{10,}$/.test(text)) return 'order';
        return '';
    }

    function getExistingState(target, type, rawText) {
        if (type === 'tracking' || type === 'order') {
            const value = type === 'tracking' ? target.trackingNumber : target.orderNumber;
            const hasValue = value !== undefined && value !== null && String(value).trim() !== '';
            return {
                hasValue: hasValue,
                same: hasValue && Z.sameCode(value, rawText),
                value: value
            };
        }
        if (type === 'link') {
            const links = Array.isArray(target.qrLinks) ? target.qrLinks : [];
            const same = links.some(function (link) { return Z.sameUrl(link, rawText); });
            return { hasValue: same, same: same, value: rawText };
        }
        return { hasValue: false, same: false, value: '' };
    }

    function renderAssociatePreview(rawText, detectedType, selectedType) {
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            exitAssociateMode().catch(function () {});
            return;
        }
        const target = resolved.entity;
        const typeLabel = TYPE_LABELS[selectedType] || '未知类型';
        const existing = getExistingState(target, selectedType, rawText);

        let warningHtml = '';
        let showWarning = false;
        let confirmText = '确认关联';
        if (selectedType === 'link') {
            if (existing.same) {
                warningHtml = '<div class="associate-warning">✅ 已绑定相同 链接：<strong>' +
                    esc(rawText) + '</strong><br>无需重复关联。</div>';
                showWarning = true;
                confirmText = '确定';
            }
        } else if (existing.hasValue) {
            if (existing.same) {
                warningHtml = '<div class="associate-warning">✅ 已绑定相同 ' + esc(typeLabel) + '：<strong>' +
                    esc(rawText) + '</strong><br>无需重复关联。</div>';
                confirmText = '确定';
            } else {
                warningHtml = '<div class="associate-warning">⚠️ 该商品已关联 ' + esc(typeLabel) + '：<strong>' +
                    esc(existing.value) + '</strong><br>是否替换为新的 ' + esc(typeLabel) +
                    '：<strong>' + esc(rawText) + '</strong>？</div>';
                confirmText = '替换';
            }
            showWarning = true;
        }

        associateWarningArea.innerHTML = warningHtml;
        associateWarningArea.style.display = showWarning ? 'block' : 'none';
        associateTypeSelect.value = selectedType;

        let extraHtml = '';
        if (selectedType === 'tracking') {
            const courier = detectCourier(rawText);
            if (courier.matched) {
                extraHtml = '<p>快递公司: ' + getCourierTagHtml(rawText) + '</p>';
            }
        }
        const entityLabel = resolved.kind === 'node'
            ? '商品-' + resolved.code
            : '库存-' + resolved.code;
        associateContent.innerHTML =
            '<p>正在为<strong>' + esc(entityLabel) + '</strong>关联</p>' +
            '<p>识别到 ' + esc(typeLabel) + ':</p>' +
            '<p><strong>' + esc(rawText) + '</strong></p>' +
            extraHtml +
            '<p style="font-size:13px; color:#64748b;">如需强制指定类型，请在下拉框中选择。</p>';

        confirmAssociateBtn.textContent = confirmText;
        confirmAssociateBtn.disabled = false;
        currentAssociateData = {
            rawText: rawText,
            detectedType: detectedType,
            selectedType: selectedType
        };
    }

    function showAssociatePrompt(rawText, detectedType) {
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            exitAssociateMode().catch(function () {});
            return;
        }
        renderAssociatePreview(rawText, detectedType, detectedType);
        if (!currentAssociateData) return;
        associateSaveStatus.className = 'save-status';
        associateSaveStatus.innerHTML = '';
        markAsSoldCheckbox.checked = false;
        associateOverlay.classList.add('active');
    }

    function buildAssociateFields(target, type, rawText, markAsSold) {
        const fields = {};
        if (type === 'tracking') {
            if (!Z.sameCode(target.trackingNumber, rawText)) fields.trackingNumber = rawText;
        } else if (type === 'order') {
            if (!Z.sameCode(target.orderNumber, rawText)) fields.orderNumber = rawText;
        } else if (type === 'link') {
            const links = Array.isArray(target.qrLinks) ? target.qrLinks.slice() : [];
            const exists = links.some(function (link) { return Z.sameUrl(link, rawText); });
            if (!exists) fields.qrLinks = links.concat([rawText]);
        }
        if (markAsSold) {
            const currentStatus = Z.normalizeStatus(target.status);
            if (currentStatus !== Z.STATUS.SOLD) fields.status = Z.STATUS.SOLD;
        }
        return fields;
    }

    async function finishAssociateToDetail() {
        associateOverlay.classList.remove('active');
        currentAssociateData = null;
        processing = false;
        await exitAssociateMode();
        renderProductDetail();
        productDetailOverlay.classList.add('active');
    }

    async function confirmAssociate() {
        if (!currentAssociateData) {
            toast('关联数据已失效，请重新扫描', 'warn');
            return;
        }
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            await exitAssociateMode();
            return;
        }
        const selectedType = associateTypeSelect.value;
        if (!TYPE_LABELS[selectedType]) {
            toast('关联类型无效，请重新选择', 'error');
            return;
        }
        const rawText = currentAssociateData.rawText;
        const markAsSold = markAsSoldCheckbox.checked;
        const fields = buildAssociateFields(resolved.entity, selectedType, rawText, markAsSold);
        if (!Object.keys(fields).length) {
            toast('该信息已关联，无需重复操作', 'info');
            await finishAssociateToDetail();
            return;
        }

        confirmAssociateBtn.disabled = true;
        confirmAssociateBtn.textContent = '保存中…';
        associateSaveStatus.className = 'save-status';
        associateSaveStatus.innerHTML = '<span class="spinner"></span> 保存中…';
        try {
            await saveEntityFields(fields);
            const statusChanged = Object.prototype.hasOwnProperty.call(fields, 'status');
            toast('关联成功' + (statusChanged ? '（状态已更新为售出）' : ''), 'success');
            await finishAssociateToDetail();
            pushHistory({
                time: new Date(),
                typeLabel: '关联',
                detail: '关联' + (TYPE_LABELS[selectedType] || '信息') + '：' + rawText,
                debug: statusChanged ? '关联成功，已标记售出' : '关联成功',
                matched: true
            });
        } catch (e) {
            associateSaveStatus.className = 'save-status error';
            associateSaveStatus.textContent = '保存失败：' + errorText(e) + '。请检查网络后点击“重试保存”。';
            confirmAssociateBtn.disabled = false;
            confirmAssociateBtn.textContent = '重试保存';
            toast('关联保存失败：' + errorText(e), 'error');
        }
    }

    async function cancelAssociate() {
        associateOverlay.classList.remove('active');
        currentAssociateData = null;
        associateSaveStatus.className = 'save-status';
        associateSaveStatus.innerHTML = '';
        markAsSoldCheckbox.checked = false;
        processing = false;
        if (scanMode === 'associate') {
            // 取消后继续在关联模式下扫描
            await stopScan();
            await startScan();
        }
    }

    // ============================================================
    // 扫码结果处理（锁 + 去重 + 立即停扫）
    // ============================================================
    function handleNormalResult(cleaned) {
        const matches = findProductByAny(cleaned);
        if (matches.length) {
            if (matches.length > 1) {
                toast('该码命中 ' + matches.length + ' 条记录，已打开第一条', 'warn');
            }
            showProductDetail(matches[0]);
            return;
        }
        notFoundContent.textContent = '扫描内容: "' + cleaned + '"\n无法关联到任何商品或库存项。';
        notFoundOverlay.classList.add('active');
        currentProductInfo = null;
        pushHistory({
            time: new Date(),
            typeLabel: '未匹配',
            detail: '内容: ' + cleaned,
            debug: '未匹配到任何商品',
            matched: false
        });
        // 未匹配弹窗属于“处理完成”状态：放开扫码锁，允许用户关闭弹窗后继续查询
        processing = false;
    }

    async function handleAssociateResult(cleaned) {
        const type = detectAssociateType(cleaned);
        if (!type) {
            toast('无法识别为关联信息，请重新扫描或退出关联模式。', 'warn');
            processing = false;
            await stopScan();
            if (scanMode === 'associate') await startScan();
            return;
        }
        const resolved = resolveCurrentEntity();
        if (!resolved) {
            toast('商品信息已过期，请重新扫码', 'error');
            await exitAssociateMode();
            return;
        }
        showAssociatePrompt(cleaned, type);
    }

    async function handleScanResult(rawText) {
        if (!currentToken) {
            toast('请先登录', 'warn');
            return;
        }
        if (processing) return;
        const cleaned = Z.normalizeCode(rawText);
        if (!cleaned) return;
        const now = Date.now();
        if (lastHandled.text === cleaned && now - lastHandled.time < DEDUPE_MS) return;
        lastHandled = { text: cleaned, time: now };
        processing = true;

        // 立即停扫（入队），但不阻塞后续处理；相机回调由 processing 锁忽略
        stopScan().catch(function () {});
        try {
            if (scanMode === 'associate') {
                await handleAssociateResult(cleaned);
            } else {
                handleNormalResult(cleaned);
            }
        } catch (e) {
            console.error('[scan] 处理扫码内容失败', e);
            toast('处理扫码内容失败：' + errorText(e), 'error');
            processing = false;
        }
    }

    // ============================================================
    // 弹窗关闭 / 手动查询 / 历史清空
    // ============================================================
    function closeProductDetailSurface() {
        productDetailOverlay.classList.remove('active');
        currentProductInfo = null;
        currentAssociateData = null;
        associateOverlay.classList.remove('active');
        processing = false;
    }

    async function closeDetailAndStop() {
        closeProductDetailSurface();
        scanMode = 'normal';
        associateModeBar.style.display = 'none';
        await stopScan();
    }

    function manualQuery() {
        if (processing) return;
        const raw = manualInput.value;
        if (!raw || !raw.trim()) return;
        manualInput.value = '';
        handleScanResult(raw).catch(function (e) {
            console.error('[scan] 手动查询失败', e);
        });
    }

    clearHistoryBtn.addEventListener('click', function () {
        if (!history.length) return;
        if (!window.confirm('确定清空扫码历史？此操作不可恢复。')) return;
        history = [];
        persistHistory();
        renderHistory();
        toast('已清空扫码历史', 'success');
    });

    // ============================================================
    // 事件绑定
    // ============================================================
    loginBtn.addEventListener('click', runAsync(performLogin));
    [loginToken, loginGistId, loginFilename].forEach(function (el) {
        el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performLogin();
            }
        });
        el.addEventListener('input', function () {
            if (loginError.textContent) loginError.textContent = '';
        });
    });

    logoutBtn.addEventListener('click', runAsync(logout));

    startBtn.addEventListener('click', function () {
        startScan().catch(function (e) { console.error('[scan] 启动扫描失败', e); });
    });
    stopBtn.addEventListener('click', function () {
        stopScan().catch(function (e) { console.error('[scan] 停止扫描失败', e); });
    });

    manualBtn.addEventListener('click', manualQuery);
    let manualComposing = false;
    manualInput.addEventListener('compositionstart', function () { manualComposing = true; });
    manualInput.addEventListener('compositionend', function () { manualComposing = false; });
    manualInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing && !manualComposing) {
            e.preventDefault();
            manualQuery();
        }
    });

    scanAssociateBtn.addEventListener('click', runAsync(enterAssociateMode));
    exitAssociateBtn.addEventListener('click', runAsync(exitAssociateMode));
    closeDetailBtn.addEventListener('click', runAsync(closeDetailAndStop));
    confirmAssociateBtn.addEventListener('click', runAsync(confirmAssociate));
    cancelAssociateBtn.addEventListener('click', runAsync(cancelAssociate));
    associateTypeSelect.addEventListener('change', function () {
        if (!currentAssociateData) return;
        renderAssociatePreview(
            currentAssociateData.rawText,
            currentAssociateData.detectedType,
            associateTypeSelect.value
        );
    });
    notFoundOk.addEventListener('click', function () {
        notFoundOverlay.classList.remove('active');
        processing = false;
    });

    // 成本显示/隐藏（事件委托，详情重绘后仍有效）
    document.addEventListener('click', function (e) {
        const button = e.target;
        if (!button || !button.classList || !button.classList.contains('cost-toggle')) return;
        const costSpan = button.previousElementSibling;
        if (!costSpan || !costSpan.classList.contains('cost-display')) return;
        if (costSpan.textContent === '***') {
            costSpan.textContent = costSpan.dataset.cost || '';
            button.textContent = '隐藏';
        } else {
            costSpan.textContent = '***';
            button.textContent = '显示';
        }
    });

    // ============================================================
    // 初始化
    // ============================================================
    history = loadHistory();
    setScanState(SCAN_IDLE);
    resetReaderArea();

    // 便于本地自动化验证（非业务功能）
    window.__scanDebug = {
        getData: function () { return gistData; },
        getBaseDoc: function () { return baseDoc; },
        isProcessing: function () { return processing; },
        getScanState: function () { return scanState; },
        getHistory: function () { return history; }
    };

    (function autoLogin() {
        const token = Z ? Z.storage.get(STORAGE_KEYS.TOKEN, '') : '';
        const gistId = Z ? Z.storage.get(STORAGE_KEYS.GIST_ID, '') : '';
        const filename = (Z ? Z.storage.get(STORAGE_KEYS.FILENAME, '') : '') || 'data.json';
        if (token && gistId) {
            loginToken.value = token;
            loginGistId.value = gistId;
            loginFilename.value = filename;
            performLogin();
        } else {
            loginOverlay.classList.add('active');
            appContainer.style.display = 'none';
        }
    })();

    console.log('智能扫码页面已加载（R1：core 保存引擎 / 扫码状态机 / 历史持久化）');
</script>
</body>
</html>
