<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能扫码</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; margin-top: 0; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: background 0.2s;
            position: relative;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
        .btn-success { background: #22c55e; }
        .btn-success:hover:not(:disabled) { background: #16a34a; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover:not(:disabled) { background: #d97706; }
        .btn-sm { padding: 4px 12px; font-size: 14px; }
        #reader-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; min-width: 80px; }
        .search-box { display: flex; gap: 8px; margin-top: 12px; }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        .result-area {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            min-height: 60px;
            border-left: 4px solid #94a3b8;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-area .label {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .result-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 0;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .timestamp {
            font-size: 12px;
            color: #94a3b8;
        }
        .result-item .type-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .result-item .content {
            font-size: 15px;
            word-break: break-all;
            margin-top: 4px;
            white-space: pre-wrap;
        }
        .found { border-left-color: #22c55e; background: #f0fdf4; }
        .not-found { border-left-color: #ef4444; background: #fef2f2; }
        .debug-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            border-top: 1px dashed #d1d5db;
            padding-top: 4px;
        }
        /* 成本隐藏相关 */
        .cost-display { font-weight: 600; }
        .cost-toggle {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 4px;
            color: #475569;
        }
        .cost-toggle:hover { background: #e2e8f0; }
        /* 快递公司标签 */
        .courier-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 6px;
            color: #1e293b;
        }
        .courier-jt { background: #fee2e2; }
        .courier-jd { background: #fee2e2; }
        .courier-yd { background: #ffedd5; }
        .courier-yz { background: #dcfce7; }
        .courier-ems { background: #dbeafe; }
        .courier-zto { background: #dbeafe; }
        .courier-yt { background: #bfdbfe; }
        .courier-sto { background: #f3d9c6; }
        .courier-sf { background: #e5e7eb; color: #1e293b; }
        /* 关联模式提示条 */
        #associate-mode-bar {
            display: none;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 14px;
            align-items: center;
            justify-content: space-between;
        }
        #associate-mode-bar .exit-associate-btn {
            background: none;
            border: 1px solid #b45309;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            color: #b45309;
            background: #fff7ed;
        }
        /* 备注编辑 */
        .remark-edit-btn {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 6px;
            color: #475569;
        }
        .remark-edit-btn:hover { background: #e2e8f0; }
        .remark-edit-area {
            display: none;
            margin-top: 6px;
        }
        .remark-edit-area.active { display: block; }
        .remark-edit-area input {
            width: calc(100% - 100px);
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .remark-edit-area .btn-group {
            margin-top: 6px;
        }
        /* 登录遮罩 */
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-overlay.active { display: flex; }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }
        .login-box h2 { margin-top: 0; }
        .login-box label { display: block; margin-top: 12px; font-weight: 600; }
        .login-box input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 4px; }
        #login-error { color: #ef4444; margin-top: 10px; }
        .status-tip { font-size: 14px; color: #64748b; margin-top: 8px; text-align: center; }
        .clear-btn { margin-top: 8px; }
        /* 商品详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .modal h3 { margin-top: 0; }
        .modal .detail-item { margin-bottom: 8px; font-size: 15px; }
        .modal .btn-group { margin-top: 16px; }
        .modal .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            color: white;
        }
        .status-待售 { background: #f59e0b; }
        .status-在售 { background: #22c55e; }
        .status-售出 { background: #94a3b8; }
        /* 保存状态提示 */
        .save-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
        }
        .save-status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .save-status.success { color: #16a34a; }
        .save-status.error { color: #dc2626; }

        /* 未匹配弹窗专用 */
        .not-found-modal .modal {
            border-left: 6px solid #ef4444;
        }
        .not-found-modal .modal h3 { color: #dc2626; }
        /* 关联类型选择下拉 */
        .associate-type-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 4px;
        }
        .associate-warning {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            color: #b91c1c;
        }
    </style>
</head>
<body>
<!-- 登录遮罩 -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>登录</h2>
        <p style="color:#64748b; font-size:14px;">请输入 GitHub 凭证</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <div class="btn-group" style="margin-top:20px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- 主界面 -->
<div id="app-container" style="display:none;">
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h1>智能扫码</h1>
            <div>
                <button class="btn btn-danger" id="clear-history-btn" style="padding:6px 12px; font-size:14px;">清空历史</button>
                <button class="btn btn-danger" id="logout-btn" style="padding:6px 12px; font-size:14px;">退出</button>
            </div>
        </div>
        <div class="card">
            <div id="reader-container">
                <div class="placeholder-text">点击「开始扫码」<br>支持二维码 / PDF417</div>
            </div>
            <div class="btn-group">
                <button id="start-btn" class="btn btn-primary">开始扫码</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>停止</button>
            </div>
            <div class="status-tip">请允许摄像头权限</div>
        </div>
        <div class="card">
            <div class="search-box">
                <input type="text" id="manual-input" placeholder="手动输入编码 / 订单号 / 快递单号" />
                <button class="btn btn-primary" id="manual-btn">查询</button>
            </div>
            <!-- 关联模式提示条 -->
            <div id="associate-mode-bar">
                <span id="associate-mode-text">正在关联商品-编码</span>
                <button class="exit-associate-btn" id="exit-associate-btn">退出关联</button>
            </div>
        </div>
        <div class="card">
            <div id="result-area" class="result-area">
                <div class="label">扫码历史</div>
                <div id="result-content" style="margin-top:4px; color:#64748b;">等待扫码或输入...</div>
            </div>
        </div>
    </div>
</div>

<!-- 商品详情弹窗 -->
<div id="product-detail-overlay" class="modal-overlay">
    <div class="modal">
        <h3 id="detail-title">商品详情</h3>
        <div id="detail-content"></div>
        <div class="btn-group">
            <button class="btn btn-primary" id="scan-associate-btn">扫描关联信息</button>
            <button class="btn btn-secondary" id="close-detail-btn">关闭</button>
        </div>
    </div>
</div>

<!-- 关联确认弹窗（含警告和类型选择） -->
<div id="associate-overlay" class="modal-overlay">
    <div class="modal">
        <h3>关联确认</h3>
        <div id="associate-content"></div>
        <div id="associate-warning-area" class="associate-warning" style="display:none;"></div>
        <label>关联类型</label>
        <select id="associate-type-select" class="associate-type-select">
            <option value="tracking">快递单号</option>
            <option value="order">订单号</option>
            <option value="link">链接</option>
        </select>
        <div class="btn-group">
            <button class="btn btn-success" id="confirm-associate-btn">确认关联</button>
            <button class="btn btn-secondary" id="cancel-associate-btn">取消</button>
        </div>
        <div class="save-status" id="associate-save-status" style="margin-top:8px;"></div>
    </div>
</div>

<!-- 未找到弹窗 -->
<div id="not-found-overlay" class="modal-overlay not-found-modal">
    <div class="modal">
        <h3>⚠️ 未找到匹配商品</h3>
        <p id="not-found-content">扫描内容无法关联到任何商品或库存项。</p>
        <p style="font-size:14px; color:#64748b;">已停止扫描，您可重新开始或查看历史记录。</p>
        <div class="btn-group">
            <button class="btn btn-primary" id="not-found-ok">确定</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 快递单号识别库（正则 + 公司名称 + 颜色类）
    // ============================================================
    const COURIER_RULES = [
        { company: '京东', regex: /^JDX\d{12}$/i },
        { company: '京东', regex: /^JD[A-Z]{2}\d{11}$/i },
        { company: '京东', regex: /^JD[A-Z]{3}\d{10}$/i },
        { company: '京东', regex: /^JD\d{13}$/i },
        { company: '极兔', regex: /^JT\d{13}$/i },
        { company: '申通(7734)', regex: /^7734\d{11}$/ },
        { company: '申通(7720)', regex: /^7720\d{11}$/ },
        { company: '申通', regex: /^77\d{13}$/ },
        { company: '韵达(434)', regex: /^434\d{12}$/ },
        { company: '韵达(435)', regex: /^435\d{12}$/ },
        { company: '韵达', regex: /^43\d{13}$/ },
        { company: '中通', regex: /^790\d{11}$/ },
        { company: '圆通', regex: /^YT\d{13}$/i },
        { company: '顺丰', regex: /^SF\d{13}$/i },
        { company: '邮政', regex: /^9\d{12}$/ },
        { company: 'EMS', regex: /^1\d{12}$/ }
    ];

    const COMPANY_COLOR_MAP = {
        '极兔': 'courier-jt',
        '京东': 'courier-jd',
        '韵达': 'courier-yd',
        '韵达(434)': 'courier-yd',
        '韵达(435)': 'courier-yd',
        '邮政': 'courier-yz',
        'EMS': 'courier-ems',
        '中通': 'courier-zto',
        '圆通': 'courier-yt',
        '申通': 'courier-sto',
        '申通(7734)': 'courier-sto',
        '申通(7720)': 'courier-sto',
        '顺丰': 'courier-sf'
    };

    // ============================================================
    // 存储与全局状态
    // ============================================================
    const STORAGE_KEYS = { TOKEN: 'github_token', GIST_ID: 'gist_id', FILENAME: 'gist_filename' };
    let gistData = { products: {} };
    let currentToken = '', currentGistId = '', currentFilename = 'data.json';

    // DOM 引用
    const loginOverlay = document.getElementById('login-overlay');
    const loginToken = document.getElementById('login-token');
    const loginGistId = document.getElementById('login-gistid');
    const loginFilename = document.getElementById('login-filename');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const appContainer = document.getElementById('app-container');
    const logoutBtn = document.getElementById('logout-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const manualInput = document.getElementById('manual-input');
    const manualBtn = document.getElementById('manual-btn');
    const resultContent = document.getElementById('result-content');
    const resultArea = document.getElementById('result-area');
    const readerContainer = document.getElementById('reader-container');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const associateModeBar = document.getElementById('associate-mode-bar');
    const associateModeText = document.getElementById('associate-mode-text');
    const exitAssociateBtn = document.getElementById('exit-associate-btn');

    const productDetailOverlay = document.getElementById('product-detail-overlay');
    const detailContent = document.getElementById('detail-content');
    const scanAssociateBtn = document.getElementById('scan-associate-btn');
    const closeDetailBtn = document.getElementById('close-detail-btn');

    const associateOverlay = document.getElementById('associate-overlay');
    const associateContent = document.getElementById('associate-content');
    const associateWarningArea = document.getElementById('associate-warning-area');
    const associateTypeSelect = document.getElementById('associate-type-select');
    const confirmAssociateBtn = document.getElementById('confirm-associate-btn');
    const cancelAssociateBtn = document.getElementById('cancel-associate-btn');
    const associateSaveStatus = document.getElementById('associate-save-status');

    const notFoundOverlay = document.getElementById('not-found-overlay');
    const notFoundContent = document.getElementById('not-found-content');
    const notFoundOk = document.getElementById('not-found-ok');

    let html5QrCode = null;
    let isScanning = false;
    let history = [];
    let scanMode = 'normal'; // 'normal' 或 'associate'
    let currentProductInfo = null; // 当前弹窗显示的商品信息
    let currentAssociateData = null; // 暂存关联数据

    // ---------- GitHub API ----------
    async function getGistContent(token, gistId, filename) {
        const url = `https://api.github.com/gists/${gistId}`;
        const resp = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`GitHub API 错误: ${err.message || resp.statusText}`);
        }
        const data = await resp.json();
        const files = data.files;
        if (!files || !files[filename]) return {};
        try { return JSON.parse(files[filename].content); } catch { return {}; }
    }

    async function updateGistContent(token, gistId, filename, content) {
        const contentStr = JSON.stringify(content, null, 2);
        const url = `https://api.github.com/gists/${gistId}`;
        const payload = { files: { [filename]: { content: contentStr } } };
        const resp = await fetch(url, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`更新失败: ${err.message || resp.statusText}`);
        }
        return await resp.json();
    }

    // ---------- 登录/登出 ----------
    async function performLogin() {
        const token = loginToken.value.trim();
        const gistId = loginGistId.value.trim();
        const filename = loginFilename.value.trim() || 'data.json';
        if (!token || !gistId) {
            loginError.textContent = '请填写 Token 和 Gist ID';
            return;
        }
        loginError.textContent = '';
        try {
            const data = await getGistContent(token, gistId, filename);
            if (!data.products) data.products = {};
            localStorage.setItem(STORAGE_KEYS.TOKEN, token);
            localStorage.setItem(STORAGE_KEYS.GIST_ID, gistId);
            localStorage.setItem(STORAGE_KEYS.FILENAME, filename);
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            gistData = data;
            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            resultContent.innerHTML = '<div style="color:#64748b;">已登录，请扫码或输入</div>';
            resultArea.className = 'result-area';
        } catch (e) {
            loginError.textContent = `登录失败: ${e.message}`;
        }
    }

    function logout() {
        localStorage.removeItem(STORAGE_KEYS.TOKEN);
        localStorage.removeItem(STORAGE_KEYS.GIST_ID);
        localStorage.removeItem(STORAGE_KEYS.FILENAME);
        currentToken = '';
        currentGistId = '';
        currentFilename = 'data.json';
        gistData = { products: {} };
        appContainer.style.display = 'none';
        loginOverlay.classList.add('active');
        loginError.textContent = '';
        loginToken.value = '';
        loginGistId.value = 'f13d97c430522e4851afbf3cd2331e14';
        loginFilename.value = 'data.json';
        stopScan();
        history = [];
        renderHistory();
        productDetailOverlay.classList.remove('active');
        associateOverlay.classList.remove('active');
        notFoundOverlay.classList.remove('active');
        scanMode = 'normal';
        currentProductInfo = null;
        associateModeBar.style.display = 'none';
    }

    loginBtn.addEventListener('click', performLogin);
    document.querySelectorAll('#login-token, #login-gistid, #login-filename').forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') performLogin(); });
    });
    logoutBtn.addEventListener('click', logout);

    (function autoLogin() {
        const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
        const gistId = localStorage.getItem(STORAGE_KEYS.GIST_ID);
        const filename = localStorage.getItem(STORAGE_KEYS.FILENAME) || 'data.json';
        if (token && gistId) {
            loginToken.value = token;
            loginGistId.value = gistId;
            loginFilename.value = filename;
            performLogin();
        } else {
            loginOverlay.classList.add('active');
            appContainer.style.display = 'none';
        }
    })();

    // ---------- 工具函数 ----------
    function cleanText(text) {
        if (typeof text !== 'string') return '';
        return text.replace(/^[\s\r\n\t]+|[\s\r\n\t]+$/g, '');
    }

    function detectCourier(text) {
        const cleaned = cleanText(text);
        for (let rule of COURIER_RULES) {
            if (rule.regex.test(cleaned)) {
                return { matched: true, company: rule.company };
            }
        }
        return { matched: false };
    }

    function getCourierTagHtml(trackingNumber) {
        const courier = detectCourier(trackingNumber);
        if (!courier.matched) return '';
        const colorClass = COMPANY_COLOR_MAP[courier.company] || '';
        return `<span class="courier-tag ${colorClass}">${courier.company}</span>`;
    }

    function findProductByAny(query) {
        const products = gistData.products || {};
        let results = [];
        function traverse(obj, path) {
            for (let key in obj) {
                const node = obj[key];
                if (key === query) results.push({ type: 'node', code: key, node: node, matchField: 'code' });
                if (node.orderNumber === query) results.push({ type: 'node', code: key, node: node, matchField: 'orderNumber' });
                if (node.trackingNumber === query) results.push({ type: 'node', code: key, node: node, matchField: 'trackingNumber' });
                if (node.qrLinks && node.qrLinks.includes(query)) results.push({ type: 'node', code: key, node: node, matchField: 'qrLink' });
                if (node.items) {
                    node.items.forEach(item => {
                        if (item.code === query) results.push({ type: 'item', parentCode: key, item: item, matchField: 'code' });
                        if (item.orderNumber === query) results.push({ type: 'item', parentCode: key, item: item, matchField: 'orderNumber' });
                        if (item.trackingNumber === query) results.push({ type: 'item', parentCode: key, item: item, matchField: 'trackingNumber' });
                        if (item.qrLinks && item.qrLinks.includes(query)) results.push({ type: 'item', parentCode: key, item: item, matchField: 'qrLink' });
                    });
                }
                if (node.children) traverse(node.children, path + '/' + key);
            }
        }
        traverse(products, '');
        return results;
    }

    function findNodeByCode(code, obj) {
        if (!obj) obj = gistData.products;
        if (obj[code]) return obj[code];
        for (let key in obj) {
            if (obj[key].children) {
                const found = findNodeByCode(code, obj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findParentNode(code, parentObj) {
        if (!parentObj) parentObj = gistData.products;
        for (let key in parentObj) {
            if (parentObj[key].children && parentObj[key].children[code]) {
                return parentObj[key];
            }
            if (parentObj[key].children) {
                const found = findParentNode(code, parentObj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    // 获取商品状态样式
    function statusBadge(status) {
        if (!status) status = '在售';
        return `<span class="status-badge status-${status}">${status}</span>`;
    }

    // ---------- 渲染历史 ----------
    function renderHistory() {
        if (history.length === 0) {
            resultContent.innerHTML = '<div style="color:#64748b;">暂无记录</div>';
            resultArea.className = 'result-area';
            return;
        }
        let html = '';
        history.forEach((item) => {
            const time = item.time.toLocaleTimeString();
            html += `<div class="result-item">
                <div><span class="timestamp">${time}</span> <span class="type-badge">${item.typeLabel}</span></div>
                <div class="content">${item.detail}</div>
                ${item.debug ? `<div class="debug-info">${item.debug}</div>` : ''}
            </div>`;
        });
        resultContent.innerHTML = html;
        resultArea.className = 'result-area found';
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    // ---------- 成本切换（事件委托） ----------
    document.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('cost-toggle')) {
            const button = e.target;
            const costSpan = button.previousElementSibling;
            if (costSpan && costSpan.classList.contains('cost-display')) {
                if (costSpan.textContent === '***') {
                    costSpan.textContent = costSpan.dataset.cost;
                    button.textContent = '隐藏';
                } else {
                    costSpan.textContent = '***';
                    button.textContent = '显示';
                }
            }
        }
    });

    // ---------- 商品详情弹窗 ----------
    function showProductDetail(match) {
        renderProductDetail(match);
        productDetailOverlay.classList.add('active');
        // 记录历史
        let debug = '';
        if (match.matchField === 'code') debug = '扫描到编码-精准匹配';
        else if (match.matchField === 'orderNumber') debug = '扫描到关联订单号';
        else if (match.matchField === 'trackingNumber') debug = '扫描到关联快递单号';
        else if (match.matchField === 'qrLink') debug = '扫描到关联链接';
        else debug = '扫描到商品';
        // 增加内容详情
        let detail = `匹配到 ${match.type === 'node' ? '商品' : '库存'}：${match.code}`;
        history.push({ time: new Date(), typeLabel: (match.type === 'node' ? '商品' : '库存'), detail: detail, debug: debug });
        renderHistory();
    }

    function renderProductDetail(match) {
        let detailHtml = '';
        let typeLabel = '商品';
        if (match.type === 'node') {
            const node = match.node;
            const name = node.name || match.code;
            const status = node.status || '在售';
            detailHtml += `<div class="detail-item"><strong>商品:</strong> ${name} (${match.code})</div>`;
            detailHtml += `<div class="detail-item"><strong>状态:</strong> ${statusBadge(status)}</div>`;
            if (node.cost !== undefined) {
                const cost = Number(node.cost).toFixed(2);
                detailHtml += `<div class="detail-item"><strong>成本:</strong> <span class="cost-display" data-cost="${cost}">***</span><button class="cost-toggle">显示</button></div>`;
            }
            if (node.trackingNumber) {
                detailHtml += `<div class="detail-item"><strong>快递:</strong> ${node.trackingNumber} ${getCourierTagHtml(node.trackingNumber)}</div>`;
            }
            if (node.orderNumber) detailHtml += `<div class="detail-item"><strong>订单:</strong> ${node.orderNumber}</div>`;
            if (node.qrLinks && node.qrLinks.length) detailHtml += `<div class="detail-item"><strong>链接数:</strong> ${node.qrLinks.length}</div>`;
            const remark = node.remark || '无';
            detailHtml += `<div class="detail-item"><strong>备注:</strong> <span id="remark-text">${remark}</span><button class="remark-edit-btn" id="edit-remark-btn">编辑</button></div>`;
            if (match.matchField) detailHtml += `<div class="detail-item"><strong>匹配字段:</strong> ${match.matchField}</div>`;
            currentProductInfo = { type: 'node', code: match.code, node: node };
        } else if (match.type === 'item') {
            const item = match.item;
            const parentNode = findNodeByCode(match.parentCode);
            const parentName = parentNode?.name || match.parentCode;
            const name = item.name || parentName;
            const status = item.status || '在售';
            typeLabel = '库存';
            detailHtml += `<div class="detail-item"><strong>库存:</strong> ${name} (${item.code})</div>`;
            detailHtml += `<div class="detail-item"><strong>父级:</strong> ${parentName}</div>`;
            detailHtml += `<div class="detail-item"><strong>状态:</strong> ${statusBadge(status)}</div>`;
            if (item.cost !== undefined) {
                const cost = Number(item.cost).toFixed(2);
                detailHtml += `<div class="detail-item"><strong>成本:</strong> <span class="cost-display" data-cost="${cost}">***</span><button class="cost-toggle">显示</button></div>`;
            }
            if (item.trackingNumber) {
                detailHtml += `<div class="detail-item"><strong>快递:</strong> ${item.trackingNumber} ${getCourierTagHtml(item.trackingNumber)}</div>`;
            }
            if (item.orderNumber) detailHtml += `<div class="detail-item"><strong>订单:</strong> ${item.orderNumber}</div>`;
            if (item.qrLinks && item.qrLinks.length) detailHtml += `<div class="detail-item"><strong>链接数:</strong> ${item.qrLinks.length}</div>`;
            const remark = item.remark || '无';
            detailHtml += `<div class="detail-item"><strong>备注:</strong> <span id="remark-text">${remark}</span><button class="remark-edit-btn" id="edit-remark-btn">编辑</button></div>`;
            if (match.matchField) detailHtml += `<div class="detail-item"><strong>匹配字段:</strong> ${match.matchField}</div>`;
            currentProductInfo = { type: 'item', parentCode: match.parentCode, itemCode: item.code, item: item };
        }
        detailContent.innerHTML = detailHtml;

        // 绑定编辑备注按钮
        const editBtn = document.getElementById('edit-remark-btn');
        if (editBtn) {
            editBtn.addEventListener('click', function() {
                const remarkSpan = document.getElementById('remark-text');
                const currentRemark = (remarkSpan && remarkSpan.textContent !== '无') ? remarkSpan.textContent : '';
                // 创建编辑UI
                const editArea = document.createElement('div');
                editArea.className = 'remark-edit-area active';
                editArea.innerHTML = `
                    <input type="text" id="remark-edit-input" value="${currentRemark}" placeholder="输入备注" />
                    <div class="btn-group" style="margin-top:6px;">
                        <button class="btn btn-success btn-sm" id="save-remark-btn">保存</button>
                        <button class="btn btn-secondary btn-sm" id="cancel-remark-btn">取消</button>
                    </div>
                    <div class="save-status" id="remark-save-status"></div>
                `;
                const remarkItem = remarkSpan.closest('.detail-item');
                remarkItem.after(editArea);
                editBtn.style.display = 'none';

                const saveRemarkBtn = document.getElementById('save-remark-btn');
                const cancelRemarkBtn = document.getElementById('cancel-remark-btn');
                const remarkSaveStatus = document.getElementById('remark-save-status');

                saveRemarkBtn.addEventListener('click', async function() {
                    const newRemark = document.getElementById('remark-edit-input').value.trim();
                    saveRemarkBtn.disabled = true;
                    saveRemarkBtn.textContent = '保存中...';
                    remarkSaveStatus.innerHTML = '<span class="spinner"></span> 保存中...';
                    try {
                        if (currentProductInfo.type === 'node') {
                            currentProductInfo.node.remark = newRemark || undefined;
                        } else if (currentProductInfo.type === 'item') {
                            currentProductInfo.item.remark = newRemark || undefined;
                        }
                        await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
                        remarkSaveStatus.className = 'save-status success';
                        remarkSaveStatus.innerHTML = '✓ 保存成功';
                        // 重新渲染详情
                        renderProductDetail(currentProductInfo);
                    } catch (e) {
                        remarkSaveStatus.className = 'save-status error';
                        remarkSaveStatus.textContent = '✗ 保存失败: ' + e.message;
                        saveRemarkBtn.disabled = false;
                        saveRemarkBtn.textContent = '保存';
                    }
                });

                cancelRemarkBtn.addEventListener('click', function() {
                    editArea.remove();
                    editBtn.style.display = 'inline-block';
                });
            });
        }
    }

    // ---------- 关联扫描模式 ----------
    function enterAssociateMode() {
        scanMode = 'associate';
        let productCode = '';
        if (currentProductInfo.type === 'node') {
            productCode = currentProductInfo.code;
        } else if (currentProductInfo.type === 'item') {
            productCode = currentProductInfo.itemCode || currentProductInfo.item.code;
        }
        associateModeText.textContent = `正在关联商品-${productCode}`;
        associateModeBar.style.display = 'flex';
        productDetailOverlay.classList.remove('active');
        startScan();
    }

    function exitAssociateMode() {
        scanMode = 'normal';
        associateModeBar.style.display = 'none';
        stopScan();
        associateOverlay.classList.remove('active');
        associateSaveStatus.innerHTML = '';
    }

    scanAssociateBtn.addEventListener('click', enterAssociateMode);
    exitAssociateBtn.addEventListener('click', exitAssociateMode);

    // ---------- 关联确认弹窗（增强） ----------
    function showAssociatePrompt(content, detectedType, rawText) {
        // 检测当前商品是否已有关联值
        let hasExisting = false;
        let existingField = '';
        let existingValue = '';
        if (currentProductInfo.type === 'node') {
            const node = currentProductInfo.node;
            if (detectedType === 'tracking' && node.trackingNumber) {
                hasExisting = true;
                existingField = '快递单号';
                existingValue = node.trackingNumber;
            } else if (detectedType === 'order' && node.orderNumber) {
                hasExisting = true;
                existingField = '订单号';
                existingValue = node.orderNumber;
            } else if (detectedType === 'link' && node.qrLinks && node.qrLinks.includes(rawText)) {
                hasExisting = true;
                existingField = '链接';
                existingValue = rawText;
            }
        } else if (currentProductInfo.type === 'item') {
            const item = currentProductInfo.item;
            if (detectedType === 'tracking' && item.trackingNumber) {
                hasExisting = true;
                existingField = '快递单号';
                existingValue = item.trackingNumber;
            } else if (detectedType === 'order' && item.orderNumber) {
                hasExisting = true;
                existingField = '订单号';
                existingValue = item.orderNumber;
            } else if (detectedType === 'link' && item.qrLinks && item.qrLinks.includes(rawText)) {
                hasExisting = true;
                existingField = '链接';
                existingValue = rawText;
            }
        }

        // 设置类型下拉框
        associateTypeSelect.value = detectedType;

        // 显示内容
        let typeName = '';
        if (detectedType === 'tracking') typeName = '快递单号';
        else if (detectedType === 'order') typeName = '订单号';
        else if (detectedType === 'link') typeName = '链接';
        else typeName = '未知类型';

        let targetInfo = '';
        if (currentProductInfo.type === 'node') {
            targetInfo = `商品-${currentProductInfo.code}`;
        } else if (currentProductInfo.type === 'item') {
            targetInfo = `库存-${currentProductInfo.itemCode || currentProductInfo.item.code}`;
        }

        let extraHtml = '';
        if (detectedType === 'tracking') {
            const courier = detectCourier(rawText);
            if (courier.matched) {
                const colorClass = COMPANY_COLOR_MAP[courier.company] || '';
                extraHtml = `<p>快递公司: <span class="courier-tag ${colorClass}">${courier.company}</span></p>`;
            }
        }

        let warningHtml = '';
        if (hasExisting) {
            warningHtml = `
                <div class="associate-warning">
                    ⚠️ 该商品已有关联 ${existingField}：<strong>${existingValue}</strong><br>
                    是否替换为新的 ${typeName}？
                </div>
            `;
            associateWarningArea.style.display = 'block';
            associateWarningArea.innerHTML = warningHtml;
        } else {
            associateWarningArea.style.display = 'none';
        }

        associateContent.innerHTML = `
            <p>正在为<strong>${targetInfo}</strong>关联</p>
            <p>识别到 ${typeName}:</p>
            <p><strong>${rawText}</strong></p>
            ${extraHtml}
            <p style="font-size:13px; color:#64748b;">如需强制指定类型，请在下拉框中选择。</p>
        `;

        associateOverlay.classList.add('active');
        currentAssociateData = { content, detectedType, rawText, hasExisting };
        associateSaveStatus.innerHTML = '';
    }

    // 确认关联
    confirmAssociateBtn.addEventListener('click', async function() {
        if (!currentAssociateData || !currentProductInfo) return;

        // 获取用户选择的类型
        const selectedType = associateTypeSelect.value;
        const rawText = currentAssociateData.rawText;
        const hasExisting = currentAssociateData.hasExisting;

        // 如果存在且用户未明确选择替换（我们通过弹窗的确认按钮表示替换，但无额外选项，直接替换）
        // 但如果有警告，用户仍然点击确认，我们视为同意替换。

        // 构建保存对象
        let targetNode = null;
        let targetItem = null;
        if (currentProductInfo.type === 'node') {
            targetNode = currentProductInfo.node;
        } else if (currentProductInfo.type === 'item') {
            targetItem = currentProductInfo.item;
        }

        // 根据选择类型更新字段
        if (selectedType === 'tracking') {
            if (targetNode) targetNode.trackingNumber = rawText;
            else if (targetItem) targetItem.trackingNumber = rawText;
        } else if (selectedType === 'order') {
            if (targetNode) targetNode.orderNumber = rawText;
            else if (targetItem) targetItem.orderNumber = rawText;
        } else if (selectedType === 'link') {
            let target = targetNode || targetItem;
            if (!target.qrLinks) target.qrLinks = [];
            if (!target.qrLinks.includes(rawText)) target.qrLinks.push(rawText);
        }

        // 自动状态变更：若当前状态为“在售”且有关联字段（快递或订单）则改为“已售”
        let statusChanged = false;
        let currentStatus = targetNode ? targetNode.status : (targetItem ? targetItem.status : null);
        if (currentStatus === '在售') {
            const hasTracking = targetNode ? targetNode.trackingNumber : (targetItem ? targetItem.trackingNumber : null);
            const hasOrder = targetNode ? targetNode.orderNumber : (targetItem ? targetItem.orderNumber : null);
            if (hasTracking || hasOrder) {
                if (targetNode) targetNode.status = '已售';
                else if (targetItem) targetItem.status = '已售';
                statusChanged = true;
            }
        }

        // 保存
        confirmAssociateBtn.disabled = true;
        confirmAssociateBtn.textContent = '保存中...';
        associateSaveStatus.innerHTML = '<span class="spinner"></span> 保存中...';
        try {
            await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
            associateSaveStatus.className = 'save-status success';
            associateSaveStatus.innerHTML = '✓ 关联成功';
            if (statusChanged) {
                associateSaveStatus.innerHTML += ' (状态已变更为已售)';
            }
            // 刷新详情
            let match;
            if (currentProductInfo.type === 'node') {
                match = { type: 'node', code: currentProductInfo.code, node: currentProductInfo.node };
            } else {
                match = { type: 'item', parentCode: currentProductInfo.parentCode, itemCode: currentProductInfo.itemCode, item: currentProductInfo.item };
            }
            renderProductDetail(match);
            associateOverlay.classList.remove('active');
            scanMode = 'normal';
            associateModeBar.style.display = 'none';
            productDetailOverlay.classList.add('active');
            // 记录历史
            let detail = `关联${selectedType}: ${rawText}`;
            history.push({ time: new Date(), typeLabel: '关联', detail: detail, debug: '关联成功' });
            renderHistory();
        } catch (e) {
            associateSaveStatus.className = 'save-status error';
            associateSaveStatus.textContent = '✗ 保存失败: ' + e.message;
            confirmAssociateBtn.disabled = false;
            confirmAssociateBtn.textContent = '确认关联';
        } finally {
            // 恢复按钮状态（如果成功，弹窗关闭，按钮重置在下次打开时）
            if (!associateOverlay.classList.contains('active')) {
                confirmAssociateBtn.disabled = false;
                confirmAssociateBtn.textContent = '确认关联';
                associateSaveStatus.innerHTML = '';
            }
        }
    });

    cancelAssociateBtn.addEventListener('click', function() {
        associateOverlay.classList.remove('active');
        exitAssociateMode();
        productDetailOverlay.classList.add('active');
    });

    closeDetailBtn.addEventListener('click', function() {
        productDetailOverlay.classList.remove('active');
        scanMode = 'normal';
        associateModeBar.style.display = 'none';
        currentProductInfo = null;
    });

    // ---------- 扫码功能 ----------
    function onScanSuccess(decodedText) {
        handleScanResult(decodedText);
    }
    function onScanError(err) {}

    function startScan() {
        if (isScanning) return;
        if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
        html5QrCode = new Html5Qrcode("reader-container");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        ).then(() => {
            isScanning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
        }).catch(err => {
            alert('启动摄像头失败: ' + (err.message || '未知错误'));
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isScanning = false;
            if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
        });
    }

    function stopScan() {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().then(() => {
                isScanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                html5QrCode.clear();
                html5QrCode = null;
            }).catch(() => {});
        } else {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isScanning = false;
        }
    }

    startBtn.addEventListener('click', startScan);
    stopBtn.addEventListener('click', stopScan);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        startBtn.disabled = true;
        startBtn.title = '当前浏览器不支持摄像头';
    }

    // ---------- 手动查询 ----------
    function manualQuery() {
        const raw = manualInput.value;
        if (!raw || raw.trim() === '') return;
        handleScanResult(raw);
        manualInput.value = '';
    }
    manualBtn.addEventListener('click', manualQuery);
    manualInput.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') manualQuery();
    });

    // ---------- 清空历史 ----------
    clearHistoryBtn.addEventListener('click', function() {
        history = [];
        renderHistory();
    });

    // ---------- 处理扫码结果（核心修改） ----------
    async function handleScanResult(rawText) {
        const cleaned = cleanText(rawText);
        if (!cleaned) return;

        // 刷新数据
        try {
            const freshData = await getGistContent(currentToken, currentGistId, currentFilename);
            if (freshData && freshData.products) {
                gistData = freshData;
            }
        } catch (e) {
            console.error('刷新数据失败:', e);
        }

        if (scanMode === 'associate') {
            // 关联模式
            stopScan(); // 先停止扫描，防止重复触发
            let type = '';
            if (cleaned.startsWith('http://') || cleaned.startsWith('https://')) {
                type = 'link';
            } else {
                const courier = detectCourier(cleaned);
                if (courier.matched) {
                    type = 'tracking';
                } else if (/^\d{10,}$/.test(cleaned)) {
                    type = 'order';
                } else {
                    // 无法识别类型，弹出提示并重新开始扫描
                    alert('无法识别为关联信息，请重新扫描或退出关联模式。');
                    // 重新启动扫描（保持关联模式）
                    startScan();
                    return;
                }
            }
            // 显示关联确认弹窗（含警告）
            showAssociatePrompt(cleaned, type, cleaned);
        } else {
            // 普通模式：查找匹配
            const matches = findProductByAny(cleaned);
            if (matches.length > 0) {
                showProductDetail(matches[0]);
                stopScan();
            } else {
                // 未匹配：弹窗提示并停止扫描
                notFoundContent.textContent = `扫描内容: "${cleaned}"\n无法关联到任何商品或库存项。`;
                notFoundOverlay.classList.add('active');
                stopScan();
                // 记录日志
                let typeLabel = '未匹配';
                let detail = `内容: ${cleaned}`;
                let debug = '未匹配到任何商品';
                history.push({ time: new Date(), typeLabel, detail, debug });
                renderHistory();
            }
        }
    }

    // 未找到弹窗确认按钮
    notFoundOk.addEventListener('click', function() {
        notFoundOverlay.classList.remove('active');
