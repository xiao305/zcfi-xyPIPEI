<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb" />
    <title>智能扫码 · 连续扫码</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%232563eb'/%3E%3Cpath%20d='M8%208h7v7H8zm9%200h7v7h-7zM8%2017h7v7H8zm11%200h5v5h-5z'%20fill='white'/%3E%3C/svg%3E" />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- 共享核心：严格读取 / 并发安全三方合并保存 / 转义 / 状态规范化 / toast -->
    <script src="js/core.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; margin-top: 0; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: background 0.2s;
            position: relative;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
        .btn-success { background: #22c55e; }
        .btn-success:hover:not(:disabled) { background: #16a34a; }
        .btn-sm { padding: 4px 12px; font-size: 14px; }
        #reader-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; min-width: 80px; }
        .search-box { display: flex; gap: 8px; margin-top: 12px; }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        .result-area {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            min-height: 60px;
            border-left: 4px solid #94a3b8;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-area .label {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .result-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 0;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .timestamp {
            font-size: 12px;
            color: #94a3b8;
        }
        .result-item .type-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .result-item .content {
            font-size: 15px;
            word-break: break-all;
            margin-top: 4px;
            white-space: pre-wrap;
        }
        .found { border-left-color: #22c55e; background: #f0fdf4; }
        .not-found { border-left-color: #ef4444; background: #fef2f2; }
        .debug-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            border-top: 1px dashed #d1d5db;
            padding-top: 4px;
        }
        .cost-display { font-weight: 600; }
        .cost-toggle {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 4px;
            color: #475569;
        }
        .cost-toggle:hover { background: #e2e8f0; }
        .courier-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 6px;
            color: #1e293b;
        }
        .courier-jt { background: #fee2e2; }
        .courier-jd { background: #fee2e2; }
        .courier-yd { background: #ffedd5; }
        .courier-yz { background: #dcfce7; }
        .courier-ems { background: #dbeafe; }
        .courier-zto { background: #dbeafe; }
        .courier-yt { background: #bfdbfe; }
        .courier-sto { background: #f3d9c6; }
        .courier-sf { background: #e5e7eb; color: #1e293b; }
        #associate-mode-bar {
            display: none;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 14px;
            align-items: center;
            justify-content: space-between;
        }
        #associate-mode-bar .exit-associate-btn {
            background: none;
            border: 1px solid #b45309;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            color: #b45309;
            background: #fff7ed;
        }
        .remark-edit-btn {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 6px;
            color: #475569;
        }
        .remark-edit-btn:hover { background: #e2e8f0; }
        .remark-edit-area {
            display: none;
            margin-top: 6px;
        }
        .remark-edit-area.active { display: block; }
        .remark-edit-area input {
            width: calc(100% - 100px);
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .remark-edit-area .btn-group {
            margin-top: 6px;
        }
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-overlay.active { display: flex; }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }
        .login-box h2 { margin-top: 0; }
        .login-box label { display: block; margin-top: 12px; font-weight: 600; }
        .login-box input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 4px; }
        #login-error { color: #ef4444; margin-top: 10px; }
        .status-tip { font-size: 14px; color: #64748b; margin-top: 8px; text-align: center; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .modal h3 { margin-top: 0; }
        .modal .detail-item { margin-bottom: 8px; font-size: 15px; }
        .modal .btn-group { margin-top: 16px; }
        .modal .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            color: white;
        }
        .status-pending { background: #f59e0b; }
        .status-onsale { background: #22c55e; }
        .status-sold { background: #94a3b8; }
        .status-unknown { background: #e2e8f0; color: #475569; }
        #not-found-content { white-space: pre-line; }
        .save-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
        }
        .save-status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .save-status.success { color: #16a34a; }
        .save-status.error { color: #dc2626; }
        .not-found-modal .modal {
            border-left: 6px solid #ef4444;
        }
        .not-found-modal .modal h3 { color: #dc2626; }
        .associate-type-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 4px;
        }
        .associate-warning {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            color: #b91c1c;
            word-break: break-all;
        }
        #associate-content {
            word-break: break-all;
        }
        #associate-content p {
            word-break: break-all;
        }
        .associate-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
        .associate-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        /* ============================================================
         * R2：连续扫码 / 移动端 UI 打磨
         * ============================================================ */
        body {
            padding: calc(10px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px))
                calc(18px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
        }
        /* 所有可点元素 ≥ 44px（移动端触控目标） */
        .btn, .btn-sm, .icon-btn, .menu-item, .switch, .undo-btn,
        .cost-toggle, .remark-edit-btn, .exit-associate-btn,
        .associate-type-select, .login-box input {
            min-height: 44px;
        }
        .btn-sm { padding: 8px 14px; font-size: 14px; }
        .icon-btn {
            min-width: 44px;
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:disabled { opacity: .5; cursor: not-allowed; }
        .icon-btn.refreshing { animation: spin 0.9s linear infinite; }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .app-header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 6px; }
        .app-version {
            font-size: 11px;
            color: #64748b;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 1px 7px;
            font-weight: 600;
        }
        .app-header-actions { display: flex; gap: 8px; }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .sync-status { font-size: 13px; color: #64748b; }
        .sync-status.stale { color: #b45309; font-weight: 600; }
        .top-bar-right { display: flex; align-items: center; gap: 8px; }
        .switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
        }
        .switch input { width: 20px; height: 20px; accent-color: #2563eb; }
        .more-menu {
            position: absolute;
            right: calc(12px + env(safe-area-inset-right, 0px));
            top: calc(60px + env(safe-area-inset-top, 0px));
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .22);
            z-index: 20000;
            min-width: 168px;
            padding: 6px;
        }
        .menu-item {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 0 12px;
            border: 0;
            background: none;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            color: #0f172a;
            text-align: left;
        }
        .menu-item:hover { background: #f1f5f9; }
        .menu-item.danger { color: #dc2626; }
        .offline-bar {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        /* 取景框四角动画 */
        .reader-wrap { position: relative; }
        .scan-frame { position: absolute; inset: 8%; pointer-events: none; z-index: 2; }
        .scan-frame .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 3px solid #38bdf8;
            border-radius: 5px;
            opacity: .9;
            animation: cornerPulse 1.8s ease-in-out infinite;
        }
        .scan-frame .corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .scan-frame .corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
        .scan-frame .corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
        .scan-frame .corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
        .scan-frame.paused .corner { animation-play-state: paused; opacity: .3; border-color: #94a3b8; }
        @keyframes cornerPulse {
            0%, 100% { opacity: .55; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        .scan-hint {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, .58);
            color: #e2e8f0;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            max-width: 94%;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 2;
        }
        .scan-actions { margin-top: 12px; }
        .scan-actions .btn { min-width: 44px; }
        .file-scan-reader {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 320px;
            height: 320px;
            overflow: hidden;
        }
        /* 文件选择框：不用 display:none，避免部分移动浏览器对程序化 click 的限制 */
        .photo-input-hidden {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
        }
        /* 底部抽屉详情 */
        .sheet-overlay { align-items: flex-end; }
        .sheet-overlay .sheet {
            width: 100%;
            max-width: 560px;
            border-radius: 20px 20px 0 0;
            max-height: 86vh;
            padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            animation: sheetUp .22s ease-out;
        }
        .sheet-handle {
            width: 44px;
            height: 5px;
            border-radius: 3px;
            background: #cbd5e1;
            margin: 0 auto 10px;
        }
        @keyframes sheetUp {
            from { transform: translateY(24px); opacity: .6; }
            to { transform: translateY(0); opacity: 1; }
        }
        /* 多匹配候选列表 */
        .match-warning {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .match-list { display: flex; flex-direction: column; gap: 8px; }
        .match-item {
            width: 100%;
            text-align: left;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            color: #0f172a;
            min-height: 44px;
        }
        .match-item:hover { background: #eff6ff; border-color: #93c5fd; }
        .match-item .match-title { font-weight: 700; font-size: 15px; word-break: break-all; }
        .match-item .match-meta {
            font-size: 13px;
            color: #475569;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .type-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        /* 历史分组 / 可点击回看 */
        .history-group { margin-bottom: 10px; }
        .history-group-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
            margin: 6px 0 2px;
            letter-spacing: .02em;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .history-group-label .group-relative { color: #2563eb; font-weight: 600; }
        .result-item.clickable { cursor: pointer; border-radius: 8px; }
        .result-item.clickable:hover { background: #eff6ff; }
        .result-item.clickable:focus { outline: 2px solid #93c5fd; outline-offset: 1px; }
        /* 清空历史撤销条 */
        .undo-bar {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 21000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 12px;
            padding: 8px 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .35);
            font-size: 14px;
            max-width: 92vw;
        }
        .undo-btn {
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid #38bdf8;
            background: #0ea5e9;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        /* 设置 */
        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            font-size: 15px;
            cursor: pointer;
        }
        .setting-row input { width: 22px; height: 22px; accent-color: #2563eb; }
        .settings-hint { font-size: 12px; color: #64748b; line-height: 1.7; }
        /* 登录遮罩：键盘弹出时可滚动、不被底部截断 */
        #login-overlay {
            align-items: flex-start;
            overflow-y: auto;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 12px
                calc(16px + env(safe-area-inset-bottom, 0px));
        }
        .login-box { margin: 6vh auto 24px; }
        /* 页脚 */
        .app-footer {
            margin-top: 8px;
            padding: 12px 4px calc(8px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.7;
        }
        .app-footer .version { color: #64748b; font-weight: 600; }
        @media (max-width: 380px) {
            .app-header h1 { font-size: 18px; }
            .scan-actions .btn { font-size: 14px; padding: 8px 10px; }
        }
    </style>
</head>
<body>
<!-- 登录遮罩 -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>登录</h2>
        <p style="color:#64748b; font-size:14px;">请输入 GitHub 凭证</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <div class="btn-group" style="margin-top:20px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- 主界面 -->
<div id="app-container" style="display:none;">
    <div class="container">
        <header class="app-header">
            <h1>智能扫码 <span class="app-version" id="header-version">R2</span></h1>
            <div class="app-header-actions">
                <button class="icon-btn" id="more-btn" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false">更多</button>
            </div>
        </header>
        <div class="top-bar">
            <label class="switch" for="continuous-toggle">
                <input type="checkbox" id="continuous-toggle" checked />
                <span>连续模式</span>
            </label>
            <div class="top-bar-right">
                <span class="sync-status" id="sync-status" title="数据新鲜度">数据更新于 --:--</span>
                <button class="icon-btn" id="refresh-btn" type="button" aria-label="刷新数据" title="刷新数据">⟳</button>
            </div>

<script>
    'use strict';
    /* ============================================================
     * 智能扫码页（scan.html）R2
     * - 数据读写统一走 js/core.js：ZCFI.get 严格读取 / ZCFI.save 并发安全三方合并（R1）
     * - 所有动态 HTML 一律 escapeHtml；备注/链接只按纯文本处理（R1）
     * - 摄像头 idle/starting/scanning/stopping 串行状态机 + 扫码锁 + 2 秒去重（R1）
     * - 历史记录 localStorage 持久化（R1），R2 增加日期分组/点击回看/清空撤销
     * - R2：连续扫码（摄像头常开 + 解码暂停/恢复）、多匹配候选、手电筒/震动/提示音、
     *       相册图片识别、30s TTL 后台刷新、软删除过滤、移动端 UI 打磨
     * ============================================================ */
    const SCAN_VERSION = 'R2.0';
    const Z = window.ZCFI;
    if (!Z) {
        console.error('[scan] js/core.js 未加载，数据读写功能不可用');
    }

    // ============================================================
    // 快递识别库
    // ============================================================
    const COURIER_RULES = [
        { company: '京东', regex: /^JDX\d{12}$/i },
        { company: '京东', regex: /^JD[A-Z]{2}\d{11}$/i },
        { company: '京东', regex: /^JD[A-Z]{3}\d{10}$/i },
        { company: '京东', regex: /^JD\d{13}$/i },
        { company: '极兔', regex: /^JT\d{13}$/i },
        { company: '申通(7734)', regex: /^7734\d{11}$/ },
        { company: '申通(7720)', regex: /^7720\d{11}$/ },
        { company: '申通', regex: /^77\d{13}$/ },
        { company: '韵达(434)', regex: /^434\d{12}$/ },
        { company: '韵达(435)', regex: /^435\d{12}$/ },
        { company: '韵达', regex: /^43\d{13}$/ },
        { company: '中通', regex: /^790\d{11}$/ },
        { company: '圆通', regex: /^YT\d{13}$/i },
        { company: '顺丰', regex: /^SF\d{13}$/i },
        { company: '邮政', regex: /^9\d{12}$/ },
        { company: 'EMS', regex: /^1\d{12}$/ }
    ];

    const COMPANY_COLOR_MAP = {
        '极兔': 'courier-jt',
        '京东': 'courier-jd',
        '韵达': 'courier-yd',
        '韵达(434)': 'courier-yd',
        '韵达(435)': 'courier-yd',
        '邮政': 'courier-yz',
        'EMS': 'courier-ems',
        '中通': 'courier-zto',
        '圆通': 'courier-yt',
        '申通': 'courier-sto',
        '申通(7734)': 'courier-sto',
        '申通(7720)': 'courier-sto',
        '顺丰': 'courier-sf'
    };

    // 关联类型 / 匹配字段的中文映射
    const TYPE_LABELS = { tracking: '快递单号', order: '订单号', link: '链接' };
    const MATCH_FIELD_LABELS = {
        code: '内部编码',
        orderNumber: '订单号',
        trackingNumber: '快递单号',
        qrLink: '关联链接'
    };

    // ============================================================
    // 本地存储键与状态
    // ============================================================
    const STORAGE_KEYS = { TOKEN: 'github_token', GIST_ID: 'gist_id', FILENAME: 'gist_filename' };
    const HISTORY_KEY = 'zcfi_scan_history_v1';
    const HISTORY_BACKUP_KEY = 'zcfi_scan_history_backup_v1';
    const SETTINGS_KEY = 'zcfi_scan_settings_v1';
    const HISTORY_LIMIT = 200;
    const HISTORY_UNDO_BACKUP = 20;      // 清空历史时保留最近 N 条用于撤销
    const DEDUPE_MS = 2000;
    const DATA_TTL_MS = 30000;           // 数据后台刷新 TTL
    const RESUME_GUARD_MS = 800;         // 恢复解码后忽略回调的时间窗
    const HISTORY_UNDO_TIMEOUT = 12000;

    const DEFAULT_SETTINGS = { continuous: true, vibrate: true, sound: true };

    function loadSettings() {
        const raw = Z ? Z.storage.getJson(SETTINGS_KEY, null) : null;
        const merged = Object.assign({}, DEFAULT_SETTINGS);
        if (raw && typeof raw === 'object') {
            if (typeof raw.continuous === 'boolean') merged.continuous = raw.continuous;
            if (typeof raw.vibrate === 'boolean') merged.vibrate = raw.vibrate;
            if (typeof raw.sound === 'boolean') merged.sound = raw.sound;
        }
        return merged;
    }

    var gistData = { products: {} };
    let baseDoc = null;                 // 最近一次成功加载/保存的完整文档快照（三方合并基准）
    let currentToken = '';
    let currentGistId = '';
    let currentFilename = 'data.json';
    let dataUpdatedAt = null;

    let loginBusy = false;
    let scanMode = 'normal';            // normal | associate
    let currentProductInfo = null;      // { type:'node', code } | { type:'item', parentCode, itemCode }
    let currentAssociateData = null;    // { rawText, detectedType, selectedType }
    let processing = false;             // 扫码锁：进入 handleScanResult 同步置位
    let lastHandled = { text: '', time: 0 };
    let history = [];

    // R2 状态
    let settings = loadSettings();
    let continuousMode = settings.continuous !== false;
    let decodingPaused = false;         // 是否暂停解码回调（连续模式下打开抽屉/弹窗时为 true）
    let cameraPaused = false;           // Html5Qrcode 是否真的处于 pause 状态
    let pauseChain = Promise.resolve();
    let resumeGuardUntil = 0;
    let lastSyncAt = null;              // 最近一次成功从 Gist 拉取的时间（本地时间）
    let refreshPromise = null;
    let offlineMode = false;
    let savingNow = false;
    let costVisible = false;            // 成本显示状态（重渲染后保持）
    let torchFeature = null;
    let torchOn = false;
    let audioCtx = null;
    let moreMenuOpen = false;
    let undoState = null;
    let undoTimer = null;
    let resumeCameraOnVisible = false;
    let currentMatches = [];            // 多匹配候选（当前弹窗使用）

    // ============================================================
    // DOM 引用
    // ============================================================
    const loginOverlay = document.getElementById('login-overlay');
    const loginToken = document.getElementById('login-token');
    const loginGistId = document.getElementById('login-gistid');
    const loginFilename = document.getElementById('login-filename');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const appContainer = document.getElementById('app-container');
    const logoutBtn = document.getElementById('logout-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const manualInput = document.getElementById('manual-input');
    const manualBtn = document.getElementById('manual-btn');
    const resultContent = document.getElementById('result-content');
    const resultArea = document.getElementById('result-area');
    const readerContainer = document.getElementById('reader-container');
    const cameraStatus = document.getElementById('camera-status');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const associateModeBar = document.getElementById('associate-mode-bar');
    const associateModeText = document.getElementById('associate-mode-text');
    const exitAssociateBtn = document.getElementById('exit-associate-btn');

    const productDetailOverlay = document.getElementById('product-detail-overlay');
    const detailContent = document.getElementById('detail-content');
    const scanAssociateBtn = document.getElementById('scan-associate-btn');
    const closeDetailBtn = document.getElementById('close-detail-btn');

    const associateOverlay = document.getElementById('associate-overlay');
    const associateContent = document.getElementById('associate-content');
    const associateWarningArea = document.getElementById('associate-warning-area');
    const associateTypeSelect = document.getElementById('associate-type-select');
    const confirmAssociateBtn = document.getElementById('confirm-associate-btn');
    const cancelAssociateBtn = document.getElementById('cancel-associate-btn');
    const associateSaveStatus = document.getElementById('associate-save-status');
    const markAsSoldCheckbox = document.getElementById('mark-as-sold-checkbox');

    const notFoundOverlay = document.getElementById('not-found-overlay');
    const notFoundContent = document.getElementById('not-found-content');
    const notFoundOk = document.getElementById('not-found-ok');

    // R2 DOM 引用
    const readerWrap = document.getElementById('reader-wrap');
    const scanFrame = document.getElementById('scan-frame');
    const scanHint = document.getElementById('scan-hint');
    const torchBtn = document.getElementById('torch-btn');
    const photoBtn = document.getElementById('photo-btn');
    const photoInput = document.getElementById('photo-input');
    const syncStatus = document.getElementById('sync-status');
    const refreshBtn = document.getElementById('refresh-btn');
    const offlineBar = document.getElementById('offline-bar');
    const continuousToggle = document.getElementById('continuous-toggle');
    const moreBtn = document.getElementById('more-btn');
    const moreMenu = document.getElementById('more-menu');
    const menuSettingsBtn = document.getElementById('menu-settings-btn');
    const continueScanBtn = document.getElementById('continue-scan-btn');
    const matchListOverlay = document.getElementById('match-list-overlay');
    const matchListTitle = document.getElementById('match-list-title');
    const matchListWarning = document.getElementById('match-list-warning');
    const matchListContent = document.getElementById('match-list-content');
    const matchListCancel = document.getElementById('match-list-cancel');
    const settingsOverlay = document.getElementById('settings-overlay');
    const settingContinuous = document.getElementById('setting-continuous');
    const settingVibrate = document.getElementById('setting-vibrate');
    const settingSound = document.getElementById('setting-sound');
    const settingsCloseBtn = document.getElementById('settings-close-btn');
    const undoBar = document.getElementById('undo-bar');
    const undoText = document.getElementById('undo-text');
    const undoBtn = document.getElementById('undo-btn');
    const footerVersion = document.getElementById('footer-version');

    // ============================================================
    // 通用小工具
    // ============================================================
    function esc(value) {
        return Z ? Z.escapeHtml(value) : String(value === undefined || value === null ? '' : value);
    }

    function toast(message, type) {
        if (Z) Z.toast(message, { type: type || 'info' });
        else console.log('[toast]', message);
    }

    function errorText(err) {
        return Z ? Z.friendlyError(err) : ((err && err.message) || String(err));
    }

    function runAsync(fn) {
        return function () {
            let result;
            try {
                result = fn.apply(this, arguments);
            } catch (e) {
                console.error('[scan] 同步异常', e);
                toast('操作失败：' + errorText(e), 'error');
                return;
            }
            if (result && typeof result.catch === 'function') {
                result.catch(function (e) {
                    console.error('[scan] 异步异常', e);
                    toast('操作失败：' + errorText(e), 'error');
                });
            }
            return result;
        };
    }

    function detectCourier(text) {
        const normalized = Z ? Z.normalizeCode(text) : String(text || '').trim();
        for (let i = 0; i < COURIER_RULES.length; i += 1) {
            if (COURIER_RULES[i].regex.test(normalized)) {
                return { matched: true, company: COURIER_RULES[i].company };
            }
        }
        return { matched: false };
    }

    function getCourierTagHtml(trackingNumber) {
        const courier = detectCourier(trackingNumber);
        if (!courier.matched) return '';
        const colorClass = COMPANY_COLOR_MAP[courier.company] || '';
        return '<span class="courier-tag ' + esc(colorClass) + '">' + esc(courier.company) + '</span>';
    }

    function formatMatchField(field) {
        return MATCH_FIELD_LABELS[field] || field || '';
    }

    function statusBadgeHtml(status) {
        const normalized = Z ? Z.normalizeStatus(status) : (status || '在售');
        const cls = Z ? Z.statusClass(normalized) : 'status-unknown';
        return '<span class="status-badge ' + esc(cls) + '">' + esc(normalized) + '</span>';
    }

    // ============================================================
    // R2：设置 / 反馈（震动、提示音）/ 撤销条
    // ============================================================
    function saveSettings() {
        if (Z) Z.storage.setJson(SETTINGS_KEY, settings);
    }

    function applySettingsToUI() {
        if (continuousToggle) continuousToggle.checked = !!continuousMode;
        if (settingContinuous) settingContinuous.checked = !!continuousMode;
        if (settingVibrate) settingVibrate.checked = !!settings.vibrate;
        if (settingSound) settingSound.checked = !!settings.sound;
        updateContinuousHint();
    }

    function updateContinuousHint() {
        if (!scanHint) return;
        scanHint.textContent = continuousMode
            ? '连续模式：扫到商品后自动暂停，关闭详情继续扫描'
            : '单次模式：扫码后停止，需要再点一次「开始扫码」';
    }

    function setContinuousMode(next, options) {
        options = options || {};
        continuousMode = !!next;
        settings.continuous = continuousMode;
        saveSettings();
        applySettingsToUI();
        if (!continuousMode) {
            if (scanState === SCAN_SCANNING || scanState === SCAN_STARTING) {
                processing = false;
                stopScan().catch(function () {});
            }
            if (cameraStatus) cameraStatus.textContent = '连续模式已关闭：扫码后摄像头会停止';
            if (!options.silent) toast('已切换为单次模式', 'info');
        } else {
            if (cameraStatus) cameraStatus.textContent = '连续模式已开启：扫码后摄像头保持开启';
            if (!options.silent) toast('已切换为连续模式', 'success');
        }
    }

    function ensureAudioContext() {
        if (audioCtx) {
            try { if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {}); } catch (e) { /* ignore */ }
            return audioCtx;
        }
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        try { audioCtx = new Ctor(); } catch (e) { audioCtx = null; }
        return audioCtx;
    }

    function playBeep() {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.0001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.14);
        } catch (e) { /* 提示音失败静默 */ }
    }

    function scanFeedbackSuccess() {
        if (settings.vibrate && typeof navigator.vibrate === 'function') {
            try { navigator.vibrate(60); } catch (e) { /* ignore */ }
        }
        if (settings.sound) playBeep();
    }

    function hideUndoBar() {
        if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
        undoState = null;
        if (undoBar) undoBar.style.display = 'none';
    }

    function showUndoBar(message, onUndo) {
        if (!undoBar) return;
        if (undoTimer) clearTimeout(undoTimer);
        undoState = onUndo;
        if (undoText) undoText.textContent = message;
        undoBar.style.display = 'flex';
        undoTimer = setTimeout(hideUndoBar, HISTORY_UNDO_TIMEOUT);
    }

    // ============================================================
    // R2：数据新鲜度（本地立即匹配 + 30s 后台刷新 + 离线提示）
    // ============================================================
    function formatSyncTime(date) {
        if (!date || isNaN(date.getTime())) return '--:--';
        return Z ? Z.formatTime(date) : String(date.toLocaleTimeString());
    }

    function updateSyncUI() {
        if (syncStatus) {
            if (lastSyncAt) {
                syncStatus.textContent = '数据更新于 ' + formatSyncTime(lastSyncAt) +
                    (offlineMode ? '（离线缓存）' : '');
                syncStatus.title = '数据更新于 ' + (Z ? Z.formatDateTime(lastSyncAt) : lastSyncAt.toLocaleString());
                const stale = offlineMode || (Date.now() - lastSyncAt.getTime() > DATA_TTL_MS * 2);
                syncStatus.classList.toggle('stale', !!stale);
            } else {
                syncStatus.textContent = '数据更新于 --:--';
                syncStatus.title = '数据尚未加载';
                syncStatus.classList.remove('stale');
            }
        }
        if (offlineBar) {
            offlineBar.style.display = offlineMode ? 'block' : 'none';
            offlineBar.textContent = '网络不可用：当前使用本地缓存数据，扫码匹配不受影响；保存时会自动重新联网校验。';
        }
    }

    function setRefreshBusy(busy) {
        if (!refreshBtn) return;
        refreshBtn.disabled = !!busy;
        refreshBtn.classList.toggle('refreshing', !!busy);
        refreshBtn.setAttribute('aria-busy', busy ? 'true' : 'false');
    }

    async function refreshData(options) {
        options = options || {};
        if (!currentToken || !currentGistId) return false;
        if (savingNow) return false;
        if (refreshPromise) return refreshPromise;
        refreshPromise = (async function () {
            if (options.manual) setRefreshBusy(true);
            const tokenAtStart = currentToken;
            try {
                const loaded = await loadDocument(currentToken, currentGistId, currentFilename);
                // 期间用户已退出登录：丢弃本次刷新结果
                if (currentToken !== tokenAtStart) return false;
                gistData = loaded.data;
                baseDoc = Z.clone(loaded.data);
                dataUpdatedAt = loaded.updatedAt || null;
                lastSyncAt = new Date();
                const wasOffline = offlineMode;
                offlineMode = false;
                updateSyncUI();
                if (wasOffline) toast('已恢复在线，数据已更新', 'success');
                else if (options.manual) toast('数据已更新', 'success');
                // 详情抽屉打开时尽量同步刷新显示；正在编辑备注则不打断
                if (productDetailOverlay.classList.contains('active') &&
                    !document.querySelector('#detail-content .remark-edit-area.active')) {
                    renderProductDetail();
                }
                return true;
            } catch (e) {
                offlineMode = true;
                updateSyncUI();
                if (options.manual) {
                    toast('刷新失败：' + errorText(e) + '。继续使用本地缓存。', 'error');
                }
                return false;
            } finally {
                refreshPromise = null;
                if (options.manual) setRefreshBusy(false);
            }
        })();
        return refreshPromise;
    }

    function maybeRefreshInBackground(force) {
        if (!currentToken || !currentGistId || savingNow) return;
        const stale = !lastSyncAt || (Date.now() - lastSyncAt.getTime() > DATA_TTL_MS);
        if (!force && !stale) return;
        refreshData({ manual: false }).catch(function () {});
    }

    // ============================================================
    // R2：界面浮层 / 解码暂停恢复（连续模式核心）
    // ============================================================
    function isSurfaceOpen() {
        return (productDetailOverlay && productDetailOverlay.classList.contains('active')) ||
            (associateOverlay && associateOverlay.classList.contains('active')) ||
            (notFoundOverlay && notFoundOverlay.classList.contains('active')) ||
            (matchListOverlay && matchListOverlay.classList.contains('active')) ||
            (settingsOverlay && settingsOverlay.classList.contains('active')) ||
            !!moreMenuOpen;
    }

    function updateScanFrameState() {
        if (!scanFrame) return;
        const active = scanState === SCAN_SCANNING && !decodingPaused;
        scanFrame.classList.toggle('paused', !active);
    }

    function pauseDecoding() {
        decodingPaused = true;
        updateScanFrameState();
        if (!continuousMode) return;
        const instance = html5QrCode;
        if (!instance || scanState !== SCAN_SCANNING || cameraPaused || typeof instance.pause !== 'function') return;
        pauseChain = pauseChain.then(async function () {
            if (!decodingPaused || cameraPaused) return;
            if (typeof instance.pause !== 'function') return;
            try {
                await instance.pause(true);
                cameraPaused = true;
            } catch (e) {
                cameraPaused = false;
            }
        }).catch(function () {});
    }

    function resumeDecoding() {
        decodingPaused = false;
        updateScanFrameState();
        resumeGuardUntil = Date.now() + RESUME_GUARD_MS;
        if (!continuousMode) return;
        pauseChain = pauseChain.then(async function () {
            if (decodingPaused || !cameraPaused) return;
            const instance = html5QrCode;
            if (!instance || typeof instance.resume !== 'function') {
                cameraPaused = false;
                return;
            }
            try { await instance.resume(); } catch (e) { /* ignore */ }
            cameraPaused = false;
        }).catch(function () {});
    }

    function syncSurfaceState() {
        const open = isSurfaceOpen();
        if (open) {
            processing = true;
            pauseDecoding();
        } else {
            processing = false;
            resumeDecoding();
        }
    }

    // ============================================================
    // R2：顶部“更多”菜单 / 设置弹窗
    // ============================================================
    function openMoreMenu() {
        moreMenuOpen = true;
        if (moreMenu) moreMenu.style.display = 'block';
        if (moreBtn) moreBtn.setAttribute('aria-expanded', 'true');
        syncSurfaceState();
    }

    function closeMoreMenu() {
        if (!moreMenuOpen) return;
        moreMenuOpen = false;
        if (moreMenu) moreMenu.style.display = 'none';
        if (moreBtn) moreBtn.setAttribute('aria-expanded', 'false');
        syncSurfaceState();
    }

    function toggleMoreMenu() {
        if (moreMenuOpen) closeMoreMenu();
        else openMoreMenu();
    }

    function openSettings() {
        closeMoreMenu();
        applySettingsToUI();
        if (settingsOverlay) settingsOverlay.classList.add('active');
        syncSurfaceState();
    }

    function closeSettings() {
        if (settingsOverlay) settingsOverlay.classList.remove('active');
        syncSurfaceState();
    }

    // ============================================================
    // R2：手电筒 / 相册识别
    // ============================================================
    function hideTorchButton() {
        torchFeature = null;
        torchOn = false;
        if (torchBtn) {
            torchBtn.style.display = 'none';
            torchBtn.textContent = '手电筒';
            torchBtn.classList.remove('active');
        }
    }

    function initTorchSupport() {
        hideTorchButton();
        const instance = html5QrCode;
        if (!instance || typeof instance.getRunningTrackCameraCapabilities !== 'function') return;
        try {
            const capabilities = instance.getRunningTrackCameraCapabilities();
            if (!capabilities || typeof capabilities.torchFeature !== 'function') return;
            const feature = capabilities.torchFeature();
            if (!feature || typeof feature.isSupported !== 'function' || !feature.isSupported()) return;
            torchFeature = feature;
            if (torchBtn) torchBtn.style.display = 'inline-block';
        } catch (e) {
            hideTorchButton();
        }
    }

    async function toggleTorch() {
        if (!torchFeature) return;
        const next = !torchOn;
        try {
            await torchFeature.apply(next);
            torchOn = next;
            if (torchBtn) {
                torchBtn.textContent = next ? '关闭手电筒' : '手电筒';
                torchBtn.classList.toggle('active', next);
            }
        } catch (e) {
            toast('手电筒切换失败：' + errorText(e), 'error');
        }
    }

    async function handlePhotoFile(file) {
        if (!file) return;
        if (!window.Html5Qrcode) {
            toast('扫码组件未加载，暂时无法识别图片', 'error');
            return;
        }
        if (processing) {
            toast('正在处理上一条扫码结果，请稍后再试', 'warn');
            return;
        }
        processing = true;
        pauseDecoding();
        let reader = null;
        try {
            reader = new window.Html5Qrcode('file-scan-reader');
            if (typeof reader.scanFile !== 'function') throw new Error('当前浏览器不支持图片识别');
            const decoded = await reader.scanFile(file, true);
            try { if (reader && typeof reader.clear === 'function') reader.clear(); } catch (e) { /* ignore */ }
            reader = null;
            processing = false;
            if (!decoded || !String(decoded).trim()) throw new Error('图片中未识别到二维码 / 条形码');
            await handleScanResult(decoded);
        } catch (e) {
            try { if (reader && typeof reader.clear === 'function') reader.clear(); } catch (ignore) { /* ignore */ }
            processing = false;
            syncSurfaceState();
            toast('图片识别失败：' + errorText(e) + '。请换一张更清晰的图片重试。', 'error');
        } finally {
            if (photoInput) photoInput.value = '';
        }
    }

    // ============================================================
    // 历史记录（localStorage 持久化，最近 200 条）
    // R2：日期分组 / 点击回看 / 清空可撤销（保留最近 20 条备份）
    // ============================================================
    function normalizeHistoryEntry(entry) {
        const row = (entry && typeof entry === 'object') ? entry : {};
        const date = row.time ? new Date(row.time) : new Date();
        const normalized = {
            time: isNaN(date.getTime()) ? new Date() : date,
            typeLabel: row.typeLabel ? String(row.typeLabel) : '记录',
            detail: row.detail ? String(row.detail) : '',
            debug: row.debug ? String(row.debug) : '',
            matched: !!row.matched
        };
        if (row.ref && typeof row.ref === 'object' &&
            (row.ref.type === 'node' || row.ref.type === 'item')) {
            if (row.ref.type === 'node' && row.ref.code) {
                normalized.ref = { type: 'node', code: String(row.ref.code), matchField: row.ref.matchField || null };
            } else if (row.ref.type === 'item' && row.ref.parentCode && row.ref.itemCode) {
                normalized.ref = {
                    type: 'item',
                    parentCode: String(row.ref.parentCode),
                    itemCode: String(row.ref.itemCode),
                    matchField: row.ref.matchField || null
                };
            }
        }
        return normalized;
    }

    function loadHistory() {
        const raw = Z ? Z.storage.getJson(HISTORY_KEY, []) : [];
        if (!Array.isArray(raw)) return [];
        return raw.slice(-HISTORY_LIMIT).map(normalizeHistoryEntry);
    }

    function persistHistory() {
        if (!Z) return;
        const payload = history.slice(-HISTORY_LIMIT).map(function (item) {
            const time = item.time instanceof Date ? item.time.getTime() : Number(item.time);
            const row = {
                time: isFinite(time) ? time : Date.now(),
                typeLabel: item.typeLabel,
                detail: item.detail,
                debug: item.debug,
                matched: !!item.matched
            };
            if (item.ref) row.ref = item.ref;
            return row;
        });
        Z.storage.setJson(HISTORY_KEY, payload);
    }

    function pushHistory(entry) {
        history.push(entry);
        if (history.length > HISTORY_LIMIT) history = history.slice(-HISTORY_LIMIT);
        persistHistory();
        renderHistory();
    }

    function historyGroupInfo(date) {
        const d = date instanceof Date ? date : new Date(date);
        if (isNaN(d.getTime())) return { key: 'unknown', dateText: '未知日期', relative: '' };
        const dateText = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        const diffDays = Math.round((startOfToday - dayStart) / 86400000);
        let relative = '';
        if (diffDays === 0) relative = '今天';
        else if (diffDays === 1) relative = '昨天';
        return { key: dateText, dateText: dateText, relative: relative };
    }

    function renderHistory() {
        if (!history.length) {
            // 静态字符串，不含用户数据
            resultContent.innerHTML = '<div style="color:#64748b;">暂无记录</div>';
            resultArea.className = 'result-area';
            return;
        }
        let html = '';
        let lastGroup = '';
        history.forEach(function (item, index) {
            const group = historyGroupInfo(item.time);
            if (group.key !== lastGroup) {
                if (lastGroup) html += '</div>';
                html += '<div class="history-group"><div class="history-group-label">' +
                    '<span class="group-date">' + esc(group.dateText) + '</span>' +
                    (group.relative ? '<span class="group-relative">' + esc(group.relative) + '</span>' : '') +
                    '</div>';
                lastGroup = group.key;
            }
            const time = Z ? Z.formatTime(item.time) : String(item.time);
            const clickable = !!item.ref;
            html += '<div class="result-item' + (clickable ? ' clickable' : '') + '"' +
                (clickable ? ' data-history-index="' + index + '" role="button" tabindex="0" title="点击回看"' : '') + '>' +
                '<div><span class="timestamp">' + esc(time) + '</span> ' +
                '<span class="type-badge">' + esc(item.typeLabel) + '</span></div>' +
                '<div class="content">' + esc(item.detail) + '</div>' +
                (item.debug ? '<div class="debug-info">' + esc(item.debug) + '</div>' : '') +
                '</div>';
        });
        if (lastGroup) html += '</div>';
        resultContent.innerHTML = html;
        const hasMatched = history.some(function (item) { return item.matched; });
        resultArea.className = 'result-area ' + (hasMatched ? 'found' : 'not-found');
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    function openHistoryEntry(index) {
        const entry = history[index];
        if (!entry) return;
        if (!entry.ref) {
            toast('该记录没有可回看的商品', 'info');
            return;
        }
        const ref = entry.ref;
        if (ref.type === 'node') {
            const node = Z.findNodeByCode(gistData, ref.code);
            if (!node || Z.isDeleted(node)) {
                toast('该商品已删除，请到后台回收站恢复', 'warn');
                return;
            }
            currentProductInfo = { type: 'node', code: ref.code, matchField: ref.matchField || null };
        } else {
            const parent = Z.findNodeByCode(gistData, ref.parentCode);
            const item = parent ? Z.findItem(parent, ref.itemCode) : null;
            if (!parent || !item || Z.isDeleted(parent) || Z.isDeleted(item)) {
                toast('该商品已删除，请到后台回收站恢复', 'warn');
                return;
            }
            currentProductInfo = {
                type: 'item',
                parentCode: ref.parentCode,
                itemCode: ref.itemCode,
                matchField: ref.matchField || null
            };
        }
        if (continueScanBtn) continueScanBtn.style.display = 'none';
        renderProductDetail();
        productDetailOverlay.classList.add('active');
        syncSurfaceState();
    }

    function clearHistoryWithUndo() {
        if (!history.length) return;
        if (!window.confirm('确定清空扫码历史？可在清空后 12 秒内撤销。')) return;
        const backup = history.slice(-HISTORY_UNDO_BACKUP).map(function (item) {
            const row = {
                time: item.time instanceof Date ? item.time.getTime() : item.time,
                typeLabel: item.typeLabel,
                detail: item.detail,
                debug: item.debug,
                matched: !!item.matched
            };
            if (item.ref) row.ref = item.ref;
            return row;
        });
        if (Z) Z.storage.setJson(HISTORY_BACKUP_KEY, backup);
        history = [];
        persistHistory();
        renderHistory();
        toast('已清空扫码历史', 'success');
        showUndoBar('已清空历史（保留最近 ' + backup.length + ' 条备份）', function () {
            const rawBackup = Z ? Z.storage.getJson(HISTORY_BACKUP_KEY, []) : [];
            const restored = Array.isArray(rawBackup) ? rawBackup.map(normalizeHistoryEntry) : [];
            if (!restored.length) {
                toast('没有可恢复的历史备份', 'warn');
                return;
            }
            history = restored.concat(history).slice(-HISTORY_LIMIT);
            persistHistory();
            renderHistory();
            toast('已恢复 ' + restored.length + ' 条历史记录', 'success');
        });
    }

    // ============================================================
    // 文案化的摄像头错误提示
    // ============================================================
    function cameraErrorMessage(err) {
        const name = err && (err.name || err.code) ? String(err.name || err.code) : '';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
            return '摄像头权限被拒绝，请在浏览器设置中允许摄像头后重试';
        }
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') {
            return '未找到可用摄像头，请改用“手动输入”';
        }
        if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') {
            return '摄像头被其他应用占用或无法启动，请关闭其他相机应用后重试';
        }
        const raw = err && err.message ? String(err.message) : '未知错误';
        return '摄像头启动失败：' + raw + '。可重试，或使用手动输入';
    }

    // ============================================================
    // 数据加载（严格读取，失败抛出带 code 的错误）
    // ============================================================
    async function loadDocument(token, gistId, filename) {
        if (!Z) throw new Error('js/core.js 未加载，无法读取数据');
        const result = await Z.get(token, gistId, filename);
        return result;
    }

    async function performLogin() {
        if (loginBusy) return;
        const token = loginToken.value.trim();
        const gistId = loginGistId.value.trim();
        const filename = loginFilename.value.trim() || 'data.json';
        if (!token || !gistId) {
            loginError.textContent = '请填写 Token 和 Gist ID';
            return;
        }
        loginBusy = true;
        loginBtn.disabled = true;
        const oldBtnText = loginBtn.textContent;
        loginBtn.textContent = '登录中…';
        loginError.textContent = '';
        try {
            const result = await loadDocument(token, gistId, filename);
            // 仅在读取彻底成功后，才切换页面状态并落 localStorage
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            gistData = result.data;
            baseDoc = Z.clone(result.data);
            dataUpdatedAt = result.updatedAt || null;
            lastSyncAt = new Date();
            offlineMode = false;
            Z.storage.set(STORAGE_KEYS.TOKEN, token);
            Z.storage.set(STORAGE_KEYS.GIST_ID, gistId);
            Z.storage.set(STORAGE_KEYS.FILENAME, filename);

            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            if (cameraStatus) cameraStatus.textContent = '请允许摄像头权限';
            setScanState(SCAN_IDLE);
            resetReaderArea();
            hideTorchButton();
            applySettingsToUI();
            updateSyncUI();

            processing = false;
            decodingPaused = false;
            cameraPaused = false;
            currentProductInfo = null;
            currentAssociateData = null;
            scanMode = 'normal';
            lastHandled = { text: '', time: 0 };
            if (continueScanBtn) continueScanBtn.style.display = 'none';

            if (history.length) {
                renderHistory();
            } else {
                resultContent.innerHTML = '<div style="color:#64748b;">已登录，请扫码或输入</div>';
                resultArea.className = 'result-area';
            }
            toast('登录成功', 'success');
        } catch (e) {
            loginError.textContent = '登录失败：' + errorText(e);
        } finally {
            loginBusy = false;
            loginBtn.disabled = false;
            loginBtn.textContent = oldBtnText || '登录';
        }
    }
