<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能扫码</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* 样式同前 */
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; margin-top: 0; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        #reader-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; min-width: 80px; }
        .search-box { display: flex; gap: 8px; margin-top: 12px; }
        .search-box input { flex:1; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:16px; }
        .result-area {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            min-height: 60px;
            border-left: 4px solid #94a3b8;
        }
        .result-area .label { font-weight: 600; color: #475569; font-size: 14px; }
        .result-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 0;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .timestamp { font-size: 12px; color: #94a3b8; }
        .result-item .type-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .result-item .content {
            font-size: 15px;
            word-break: break-all;
            margin-top: 4px;
        }
        .found { border-left-color: #22c55e; background: #f0fdf4; }
        .not-found { border-left-color: #ef4444; background: #fef2f2; }
        #login-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center; z-index: 9999;
        }
        #login-overlay.active { display: flex; }
        .login-box {
            background: white; border-radius: 16px; padding: 24px;
            max-width: 400px; width: 90%;
        }
        .login-box h2 { margin-top: 0; }
        .login-box label { display: block; margin-top: 12px; font-weight: 600; }
        .login-box input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; margin-top:4px; }
        #login-error { color:#ef4444; margin-top:10px; }
        .status-tip { font-size:14px; color:#64748b; margin-top:8px; text-align:center; }
        .clear-btn { margin-top:8px; }
    </style>
</head>
<body>
<!-- Login -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>🔐 登录</h2>
        <p style="color:#64748b; font-size:14px;">请输入 GitHub 凭证</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <div class="btn-group" style="margin-top:20px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- Main -->
<div id="app-container" style="display:none;">
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h1>🔍 智能扫码</h1>
            <div>
                <button class="btn btn-danger" id="clear-history-btn" style="padding:6px 12px; font-size:14px;">清空历史</button>
                <button class="btn btn-danger" id="logout-btn" style="padding:6px 12px; font-size:14px;">退出</button>
            </div>
        </div>
        <div class="card">
            <div id="reader-container">
                <div class="placeholder-text">点击「开始扫码」<br>支持二维码 / PDF417</div>
            </div>
            <div class="btn-group">
                <button id="start-btn" class="btn btn-primary">▶ 开始扫码</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>⏹ 停止</button>
            </div>
            <div class="status-tip">请允许摄像头权限</div>
        </div>
        <div class="card">
            <div class="search-box">
                <input type="text" id="manual-input" placeholder="手动输入编码/订单号/快递单号" />
                <button class="btn btn-primary" id="manual-btn">查询</button>
            </div>
        </div>
        <div class="card">
            <div id="result-area" class="result-area">
                <div class="label">扫码历史</div>
                <div id="result-content" style="margin-top:4px; color:#64748b;">等待扫码或输入...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- 与后台共享的存储逻辑 ----------
    const STORAGE_KEYS = {
        TOKEN: 'github_token',
        GIST_ID: 'gist_id',
        FILENAME: 'gist_filename'
    };
    let gistData = { products: {} };
    let currentToken = '', currentGistId = '', currentFilename = 'data.json';

    // DOM
    const loginOverlay = document.getElementById('login-overlay');
    const loginToken = document.getElementById('login-token');
    const loginGistId = document.getElementById('login-gistid');
    const loginFilename = document.getElementById('login-filename');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const appContainer = document.getElementById('app-container');
    const logoutBtn = document.getElementById('logout-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const manualInput = document.getElementById('manual-input');
    const manualBtn = document.getElementById('manual-btn');
    const resultContent = document.getElementById('result-content');
    const resultArea = document.getElementById('result-area');
    const readerContainer = document.getElementById('reader-container');
    const clearHistoryBtn = document.getElementById('clear-history-btn');

    let html5QrCode = null;
    let isScanning = false;
    let history = [];

    // ---------- GitHub API ----------
    async function getGistContent(token, gistId, filename) {
        const url = `https://api.github.com/gists/${gistId}`;
        const resp = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`GitHub API 错误: ${err.message || resp.statusText}`);
        }
        const data = await resp.json();
        const files = data.files;
        if (!files || !files[filename]) return {};
        try { return JSON.parse(files[filename].content); } catch { return {}; }
    }

    // ---------- 登录 ----------
    async function performLogin() {
        const token = loginToken.value.trim();
        const gistId = loginGistId.value.trim();
        const filename = loginFilename.value.trim() || 'data.json';
        if (!token || !gistId) { loginError.textContent = '请填写 Token 和 Gist ID'; return; }
        loginError.textContent = '';
        try {
            const data = await getGistContent(token, gistId, filename);
            if (!data.products) data.products = {};
            localStorage.setItem(STORAGE_KEYS.TOKEN, token);
            localStorage.setItem(STORAGE_KEYS.GIST_ID, gistId);
            localStorage.setItem(STORAGE_KEYS.FILENAME, filename);
            currentToken = token; currentGistId = gistId; currentFilename = filename;
            gistData = data;
            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            resultContent.innerHTML = '<div style="color:#64748b;">已登录，请扫码或输入</div>';
            resultArea.className = 'result-area';
        } catch (e) {
            loginError.textContent = `登录失败: ${e.message}`;
        }
    }

    function logout() {
        localStorage.removeItem(STORAGE_KEYS.TOKEN);
        localStorage.removeItem(STORAGE_KEYS.GIST_ID);
        localStorage.removeItem(STORAGE_KEYS.FILENAME);
        currentToken = ''; currentGistId = ''; currentFilename = 'data.json';
        gistData = { products: {} };
        appContainer.style.display = 'none';
        loginOverlay.classList.add('active');
        loginError.textContent = '';
        loginToken.value = '';
        loginGistId.value = 'f13d97c430522e4851afbf3cd2331e14';
        loginFilename.value = 'data.json';
        stopScan();
        history = [];
        renderHistory();
    }

    loginBtn.addEventListener('click', performLogin);
    document.querySelectorAll('#login-token, #login-gistid, #login-filename').forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') performLogin(); });
    });
    logoutBtn.addEventListener('click', logout);

    (function autoLogin() {
        const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
        const gistId = localStorage.getItem(STORAGE_KEYS.GIST_ID);
        const filename = localStorage.getItem(STORAGE_KEYS.FILENAME) || 'data.json';
        if (token && gistId) {
            loginToken.value = token; loginGistId.value = gistId; loginFilename.value = filename;
            performLogin();
        } else {
            loginOverlay.classList.add('active');
            appContainer.style.display = 'none';
        }
    })();

    // ---------- 智能识别类型 ----------
    function detectType(text) {
        text = text.trim();
        if (text.startsWith('http://') || text.startsWith('https://')) {
            return { type: 'link', label: '🔗 链接' };
        }
        if (/^\d{10,}$/.test(text)) {
            return { type: 'order', label: '📋 订单号' };
        }
        if (text.length >= 10 && /[a-zA-Z]/.test(text) && /\d/.test(text)) {
            return { type: 'tracking', label: '📦 快递单号' };
        }
        return { type: 'code', label: '🔖 编码' };
    }

    // ---------- 查找商品 ----------
    function findProductByAny(query) {
        const products = gistData.products || {};
        let results = [];

        function searchNode(obj, path) {
            for (let key in obj) {
                const node = obj[key];
                if (key === query) {
                    results.push({ type: 'node', code: key, node: node, path: path + '/' + key });
                }
                if (node.orderNumber === query) {
                    results.push({ type: 'node', code: key, node: node, path: path + '/' + key, matchField: 'orderNumber' });
                }
                if (node.trackingNumber === query) {
                    results.push({ type: 'node', code: key, node: node, path: path + '/' + key, matchField: 'trackingNumber' });
                }
                if (node.qrLinks && node.qrLinks.includes(query)) {
                    results.push({ type: 'node', code: key, node: node, path: path + '/' + key, matchField: 'qrLink' });
                }
                if (node.items) {
                    node.items.forEach(item => {
                        if (item.code === query) {
                            results.push({ type: 'item', parentCode: key, item: item });
                        }
                        if (item.orderNumber === query) {
                            results.push({ type: 'item', parentCode: key, item: item, matchField: 'orderNumber' });
                        }
                        if (item.trackingNumber === query) {
                            results.push({ type: 'item', parentCode: key, item: item, matchField: 'trackingNumber' });
                        }
                        if (item.qrLinks && item.qrLinks.includes(query)) {
                            results.push({ type: 'item', parentCode: key, item: item, matchField: 'qrLink' });
                        }
                    });
                }
                if (node.children) {
                    searchNode(node.children, path + '/' + key);
                }
            }
        }
        searchNode(products, '');
        return results;
    }

    // ---------- 渲染历史 ----------
    function renderHistory() {
        if (history.length === 0) {
            resultContent.innerHTML = '<div style="color:#64748b;">暂无记录</div>';
            resultArea.className = 'result-area';
            return;
        }
        let html = '';
        history.forEach((item) => {
            const time = item.time.toLocaleTimeString();
            const typeLabel = item.typeLabel || '📌';
            html += `<div class="result-item">
                <div>
                    <span class="timestamp">${time}</span>
                    <span class="type-badge">${typeLabel}</span>
                </div>
                <div class="content">${item.detail || item.content}</div>
            </div>`;
        });
        resultContent.innerHTML = html;
        resultArea.className = 'result-area found';
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    // ---------- 处理扫码结果 ----------
    function handleScanResult(decodedText) {
        const query = decodedText.trim();
        if (!query) {
            alert('无效内容');
            return;
        }

        const detected = detectType(query);
        let typeLabel = detected.label;
        let detail = query;

        const matches = findProductByAny(query);
        let foundInfo = '';
        if (matches.length > 0) {
            const match = matches[0];
            if (match.type === 'node') {
                const node = match.node;
                const name = node.name || match.code;
                const status = node.status || '在售';
                foundInfo = `📦 商品: ${name} (${match.code}) 状态: ${status}`;
                if (node.cost !== undefined) foundInfo += ` 成本: ${node.cost}`;
                if (node.trackingNumber) foundInfo += ` 快递: ${node.trackingNumber}`;
                if (node.orderNumber) foundInfo += ` 订单: ${node.orderNumber}`;
                if (node.qrLinks && node.qrLinks.length) foundInfo += ` 链接数: ${node.qrLinks.length}`;
            } else if (match.type === 'item') {
                const item = match.item;
                const parentNode = findNodeByCode(match.parentCode);
                const parentName = parentNode?.name || match.parentCode;
                const name = item.name || parentName;
                const status = item.status || '在售';
                foundInfo = `📦 库存: ${name} (${item.code}) 父级: ${parentName} 状态: ${status}`;
                if (item.cost !== undefined) foundInfo += ` 成本: ${item.cost}`;
                if (item.trackingNumber) foundInfo += ` 快递: ${item.trackingNumber}`;
                if (item.orderNumber) foundInfo += ` 订单: ${item.orderNumber}`;
                if (item.qrLinks && item.qrLinks.length) foundInfo += ` 链接数: ${item.qrLinks.length}`;
            }
            if (match.matchField) {
                foundInfo += ` (匹配${match.matchField})`;
            }
            detail += `\n${foundInfo}`;
        } else {
            detail += `\n（未找到关联商品）`;
        }

        history.push({
            time: new Date(),
            typeLabel: typeLabel,
            content: query,
            detail: detail
        });
        renderHistory();
        stopScan(); // 扫码成功后自动停止（连续扫码可注释此行）
    }

    // ---------- 扫码功能 ----------
    function onScanSuccess(decodedText) {
        handleScanResult(decodedText);
    }
    function onScanError(err) {}

    function startScan() {
        if (isScanning) return;
        if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
        html5QrCode = new Html5Qrcode("reader-container");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        ).then(() => {
            isScanning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
        }).catch(err => {
            alert('启动摄像头失败: ' + (err.message || '未知错误'));
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isScanning = false;
            if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
        });
    }

    function stopScan() {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().then(() => {
                isScanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                html5QrCode.clear();
                html5QrCode = null;
            }).catch(() => {});
        } else {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isScanning = false;
        }
    }

    startBtn.addEventListener('click', startScan);
    stopBtn.addEventListener('click', stopScan);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        startBtn.disabled = true;
        startBtn.title = '当前浏览器不支持摄像头';
    }

    // ---------- 手动查询 ----------
    function manualQuery() {
        const val = manualInput.value.trim();
        if (!val) {
            alert('请输入内容');
            return;
        }
        handleScanResult(val);
        manualInput.value = '';
    }

    manualBtn.addEventListener('click', manualQuery);
    manualInput.addEventListener('keyup', e => { if (e.key === 'Enter') manualQuery(); });

    // ---------- 清空历史 ----------
    clearHistoryBtn.addEventListener('click', function() {
        history = [];
        renderHistory();
    });

    console.log('智能扫码页面已加载');
</script>
</body>
</html>
