function buildNodeHtml(code, node, depth, term, ctx) {
    // 软删除：已删除节点（含其整个子树）不参与渲染/搜索/打印
    if (Z.isDeleted(node)) return { html: '', visible: false };
    ctx = ctx || {};
    var children = (node.children && typeof node.children === 'object' && !Array.isArray(node.children)) ? node.children : {};
    var allItems = (Array.isArray(node.items) ? node.items : []).filter(function (item) { return item && !Z.isDeleted(item); });
    var selfMatch = term ? nodeMatchesTerm(node, code, term) : false;
    var showAllItems = !term || selfMatch;

    var childResults = [];
    sortNodeKeys(children).forEach(function (childCode) {
        var child = children[childCode];
        if (!child || typeof child !== 'object' || Z.isDeleted(child)) return;
        childResults.push(buildNodeHtml(childCode, child, depth + 1, term, ctx));
    });
    var childMatch = childResults.some(function (r) { return r.visible; });

    var matchedItems = allItems.filter(function (item) { return showAllItems || itemMatchesTerm(item, term); });
    var visibleBySearch = !term || selfMatch || childMatch || matchedItems.length > 0;
    var hiddenByFilter = !!(ctx.filterRoot && code !== ctx.filterRoot);
    var visible = visibleBySearch && !hiddenByFilter;
    var forceExpand = term ? (selfMatch || childMatch || matchedItems.length > 0) : false;
    var expanded = isCodeExpanded(code, term, forceExpand);

    var displayItems = sortItems(showAllItems ? allItems : matchedItems);
    var stats = nodeSubtreeStats(node, false);
    var unified = node.unified !== false;
    var nodeStatus = Z.normalizeStatus(node.status);
    var hasToggle = childResults.length > 0 || allItems.length > 0;

    var toggleIcon = hasToggle
        ? '<span class="toggle" data-action="toggle" data-code="' + esc(code) + '" title="展开/收起" aria-label="展开或收起 ' + esc(code) + '">▼</span>'
        : '';

    var actions = [
        '<button type="button" class="btn btn-secondary btn-sm" data-action="edit-node" data-code="' + esc(code) + '">编辑</button>',
        '<button type="button" class="btn btn-secondary btn-sm" data-action="copy-node" data-code="' + esc(code) + '">复制</button>',
        unified
            ? '<button type="button" class="btn btn-secondary btn-sm" data-action="add-node" data-parent="' + esc(code) + '">添加子类</button>'
            : '<button type="button" class="btn btn-success btn-sm" data-action="add-item" data-parent="' + esc(code) + '">添加库存</button>',
        '<button type="button" class="btn btn-primary btn-sm" data-action="print-node" data-code="' + esc(code) + '">打印标签</button>',
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete-node" data-code="' + esc(code) + '">删除</button>'
    ].join('');

    var nodeSummaryHtml = '<span class="node-summary" title="当前节点汇总">'
        + '<span>子类 ' + stats.directChildren + '</span>'
        + '<span>库存 ' + stats.items + '</span>'
        + '<span class="onsale">在售 ' + stats.onSale + '</span>'
        + '<span class="sold">售出 ' + stats.sold + '</span>'
        + '<span class="pending">待售 ' + stats.pending + '</span>'
        + '</span>';

    var itemsHtml = '';
    if (displayItems.length) {
        var rows = displayItems.map(function (item) { return buildItemRowHtml(code, item, term); }).join('');
        itemsHtml = '<div class="batch-actions">'
            + '<button type="button" class="btn btn-secondary btn-sm" data-action="batch-print" data-parent="' + esc(code) + '">批量打印</button>'
            + '<button type="button" class="btn btn-secondary btn-sm" data-action="batch-status" data-parent="' + esc(code) + '">批量修改状态</button>'
            + '</div>'
            + '<div class="table-scroll"><table class="items-table"><thead><tr>'
            + itemTableHeaderHtml(code)
            + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    var hiddenClass = visible ? '' : ' tree-node-hidden';
    var html = '<div class="tree-node' + (expanded ? ' expanded' : '') + hiddenClass + '" data-code="' + esc(code) + '" data-depth="' + depth + '">'
        + '<div class="node-content">'
        + toggleIcon
        + '<span class="name" data-action="toggle" data-code="' + esc(code) + '">' + highlightText(node.name || code, term) + '</span>'
        + '<span class="code">' + highlightText(code, term) + '</span>'
        + '<span class="badge" style="background:' + (unified ? '#dbeafe' : '#fef3c7') + ';">' + (unified ? '统一' : '不统一') + '</span>'
        + '<span class="status-badge ' + Z.statusClass(nodeStatus) + '">' + esc(nodeStatus) + '</span>'
        + (node.orderNumber ? '<span class="badge" style="background:#e0e7ff;">📋' + highlightText(node.orderNumber, term) + '</span>' : '')
        + nodeSummaryHtml
        + '<span class="actions">' + actions + '</span>'
        + '</div>'
        + (childResults.length ? '<div class="children">' + childResults.map(function (r) { return r.html; }).join('') + '</div>' : '')
        + (itemsHtml ? '<div class="children">' + itemsHtml + '</div>' : '')
        + '</div>';

    return { html: html, visible: visible };
}

function renderTree() {
    var products = gistData.products || {};
    var term = Z.normalizeQuery(searchInput.value);
    var filter = filterSelect.value || 'all';
    var roots = sortNodeKeys(products);
    var parts = [];
    var visibleCount = 0;
    roots.forEach(function (code) {
        var node = products[code];
        if (!node || typeof node !== 'object') return;
        var result = buildNodeHtml(code, node, 0, term, { filterRoot: filter !== 'all' ? filter : null });
        if (result.html) {
            parts.push(result.html);
            if (result.visible) visibleCount += 1;
        }
    });
    var scrollY = window.scrollY;
    if (!parts.length) {
        treeContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div>' +
            '<p>暂无商品数据<br />可以点击“＋ 添加大类”开始录入，或从“数据 → 导入”恢复备份</p></div>';
    } else {
        var emptyHint = (visibleCount === 0)
            ? '<div class="empty-state"><div class="empty-icon">🔍</div><p>没有匹配的商品或库存<br />试试清空搜索词或切换筛选</p></div>'
            : '';
        treeContainer.innerHTML = emptyHint + parts.join('');
    }
    if (scrollY) window.scrollTo(0, scrollY);
    updateSummaryBar();
    updateGlobalSelection();
}

function findTreeEl(code) {
    var nodes = treeContainer.querySelectorAll('.tree-node');
    for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].dataset.code === code) return nodes[i];
    }
    return null;
}

function toggleNode(code) {
    var el = findTreeEl(code);
    if (!el) return;
    ensureExpandedExplicit();
    if (el.classList.contains('expanded')) {
        el.classList.remove('expanded');
        delete expandedSet[code];
    } else {
        el.classList.add('expanded');
        expandedSet[code] = true;
    }
    saveViewState();
    updateGlobalSelection();
}

function populateFilter() {
    var products = gistData.products || {};
    var current = (filterSelect.value && filterSelect.value !== 'all') ? filterSelect.value : (viewState.filter || 'all');
    var codes = sortNodeKeys(products);
    filterSelect.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = '全部大类';
    filterSelect.appendChild(allOpt);
    codes.forEach(function (code) {
        var opt = document.createElement('option');
        opt.value = code;
        opt.textContent = (products[code] && products[code].name ? products[code].name : code) + ' (' + code + ')';
        filterSelect.appendChild(opt);
    });
    filterSelect.value = codes.indexOf(current) !== -1 ? current : 'all';
    viewState.filter = filterSelect.value;
}

// 事件委托：树 / 表格 / 批量 / 打印 / 排序 / 复制
function toggleTableSort(key) {
    if (viewState.sortKey === key) {
        viewState.sortDir = viewState.sortDir === 'desc' ? 'asc' : 'desc';
    } else {
        viewState.sortKey = key;
        viewState.sortDir = 'asc';
    }
    saveViewState();
    renderTree();
}

function onTreeClick(event) {
    var target = event.target;
    if (!target || !target.closest) return;
    var th = target.closest('th[data-sort]');
    if (th && treeContainer.contains(th)) {
        toggleTableSort(th.getAttribute('data-sort'));
        return;
    }
    var el = target.closest('[data-action]');
    if (!el || !treeContainer.contains(el)) return;
    var action = el.getAttribute('data-action');
    var code = el.getAttribute('data-code');
    var parent = el.getAttribute('data-parent');
    var itemCode = el.getAttribute('data-item');
    if (isSaving && action !== 'toggle') { toast('正在保存，请稍候…', 'warn'); return; }
    switch (action) {
        case 'toggle': toggleNode(code); break;
        case 'edit-node': openNodeModal('edit', code); break;
        case 'add-node': openNodeModal('add', '', parent); break;
        case 'add-item': openItemModal('add', parent); break;
        case 'copy-node': requestCopyNode(code); break;
        case 'print-node': {
            var printNode = findNodeByCode(code);
            if (!printNode || Z.isDeleted(printNode)) { toast('该节点已在回收站，无法打印', 'warn'); break; }
            window.printNodeLabel(code);
            break;
        }
        case 'delete-node': deleteNode(code); break;
        case 'edit-item': openItemModal('edit', parent, itemCode); break;
        case 'copy-item': requestCopyItem(parent, itemCode); break;
        case 'copy-code': copyCodeToClipboard(code); break;
        case 'print-item': {
            var printParent = findNodeByCode(parent);
            var printItem = printParent ? Z.findItem(printParent, itemCode) : null;
            if (!printParent || Z.isDeleted(printParent) || !printItem || Z.isDeleted(printItem)) { toast('该库存已在回收站，无法打印', 'warn'); break; }
            window.printItemLabel(parent, itemCode);
            break;
        }
        case 'delete-item': deleteItem(parent, itemCode); break;
        case 'batch-print': window.batchPrintItems(parent); break;
        case 'batch-status': openBatchStatus(parent); break;
    }
}

function onTreeChange(event) {
    var target = event.target;
    if (!target) return;
    if (target.classList && target.classList.contains('select-all')) {
        toggleSelectAll(target, target.getAttribute('data-parent') || '');
        updateGlobalSelection();
    }
    if (target.classList && target.classList.contains('item-checkbox')) {
        updateGlobalSelection();
    }
}

function onTreeDblClick(event) {
    var target = event.target;
    if (!target || !target.closest) return;
    if (target.closest('button, input, select, textarea, a, label')) return;
    var tr = target.closest('tr[data-item-code]');
    if (!tr || !treeContainer.contains(tr)) return;
    var nodeEl = tr.closest('.tree-node');
    if (!nodeEl) return;
    var parentCode = nodeEl.getAttribute('data-code');
    var itemCode = tr.getAttribute('data-item-code');
    if (parentCode && itemCode) openItemModal('edit', parentCode, itemCode);
}

// ============================================================
// 保存引擎封装（ops + 三方合并 + 串行锁 + 冲突 UI）
// ============================================================
function setGlobalBusy(busy) {
    [addRootBtn, refreshBtn, logoutBtn, modalNodeSave, modalItemSave, batchStatusSave, deleteConfirmOk, dataMenuBtn].forEach(function (btn) {
        if (!btn) return;
        if (busy) btn.disabled = true;
        else btn.disabled = false;
    });
    if (!busy) updateDeleteConfirmState();
}

function fieldDiff(values, base) {
    var fields = {};
    ['name', 'unified', 'cost', 'trackingNumber', 'orderNumber', 'remark', 'qrLinks', 'status'].forEach(function (field) {
        if (!Z.valuesEqual(values[field], base ? base[field] : undefined)) fields[field] = values[field];
    });
    return fields;
}

function saveWithOps(ops, options) {
    options = options || {};
    if (readOnly) {
        toast('当前处于只读保护状态，无法写入数据。请先重试加载成功。', { type: 'error', duration: 7000 });
        return Promise.resolve(null);
    }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return Promise.resolve(null); }
    if (isLoading) { toast('正在加载最新数据，请稍候…', 'warn'); return Promise.resolve(null); }
    if (!ops || !ops.length) { toast('没有需要保存的修改', 'info'); return Promise.resolve(null); }
    isSaving = true;
    setGlobalBusy(true);
    if (treeSavingMask) treeSavingMask.classList.add('active');
    // 保存前自动做本地快照（失败不影响远端保存）
    takeSnapshotBeforeSave();
    return Z.save({
        token: currentToken,
        gistId: currentGistId,
        filename: currentFilename,
        baseDoc: baseDoc,
        ops: ops,
        onConflict: options.onConflict || showConflictDialog,
        onRetry: function (err, attempt) {
            if (options.onRetry) options.onRetry(err, attempt);
            else toast('网络异常，正在自动重试（第 ' + (attempt + 1) + ' 次）…', 'warn');
        }
    }).then(function (result) {
        // 与加载时一致：baseDoc 保留远端原始值（含历史别名），展示态数据做归一
        var rawDoc = Z.clone(result.data);
        normalizeDoc(result.data);
        gistData = result.data;
        baseDoc = rawDoc;
        syncMeta = {
            updatedAt: result.updatedAt || syncMeta.updatedAt,
            revision: result.revision || syncMeta.revision,
            size: result.size || syncMeta.size,
            lastSyncAt: Date.now()
        };
        updateSyncMeta();
        invalidateViewCaches();
        populateFilter();
        renderTree();
        updateSummaryBar();
        updateRecycleCount();
        if (result.unchanged) {
            if (result.conflicts && result.conflicts.length) toast('未写入改动：冲突已按你的选择保留远端版本', { type: 'warn', duration: 5000 });
            else toast('数据没有变化', 'info');
        } else {
            toast(options.successMessage || '保存成功', 'success');
        }
        if (result.conflicts && result.conflicts.length) {
            toast('已按你的选择解决 ' + result.conflicts.length + ' 处冲突', { type: 'warn', duration: 5000 });
        }
        return result;
    }).catch(function (err) {
        var tip = Z.friendlyError(err);
        toast('保存失败：' + tip, { type: 'error', duration: 7000 });
        if (options.onError) options.onError(err, tip);
        return null;
    }).finally(function () {
        isSaving = false;
        if (treeSavingMask) treeSavingMask.classList.remove('active');
        setGlobalBusy(false);
    });
}

// ---------- 冲突处理弹窗 ----------
function conflictFieldLabel(conflict) {
    if (conflict.kind === 'remote-deleted' || conflict.field === '__deleted__') return '已被其它设备删除';
    if (conflict.kind === 'remote-modified' || conflict.field === '__modified__') return '已被其它设备修改';
    return conflict.label || conflict.field || '字段';
}

function conflictValueText(conflict, side) {
    var isRemote = (side === 'remote' || side === 'theirs');
    if (conflict.kind === 'remote-deleted') return isRemote ? '接受远端删除' : '保留我的版本（重建）';
    if (conflict.kind === 'remote-modified') return isRemote ? '放弃删除，保留远端修改' : '仍然删除';
    var value = isRemote ? conflict.remote : conflict.mine;
    if (value === undefined || value === null) return '（空）';
    if (typeof value === 'boolean') return value ? '是' : '否';
    if (typeof value === 'object') {
        try { return JSON.stringify(value); } catch (e) { return String(value); }
    }
    return String(value);
}

function showConflictDialog(conflicts) {
    return new Promise(function (resolve) {
        conflictState = {
            conflicts: conflicts,
            choices: conflicts.map(function () { return 'mine'; }),
            resolve: resolve
        };
        conflictList.innerHTML = '';
        conflicts.forEach(function (conflict, index) {
            var item = document.createElement('div');
            item.className = 'conflict-item';
            var scopeName = conflict.scope === 'item' ? '库存' : '节点';
            var target = conflict.target === undefined || conflict.target === null ? '' : String(conflict.target);
            item.innerHTML = '<div class="conflict-head">'
                + '<span class="badge">' + esc(scopeName) + '</span>'
                + '<span class="conflict-target">' + esc(target) + '</span>'
                + '<span class="badge">' + esc(conflictFieldLabel(conflict)) + '</span>'
                + '</div>'
                + '<div class="conflict-values">'
                + '<label class="conflict-choice"><span><input type="radio" name="conflict-' + index + '" value="mine" checked> 用我的</span>'
                + '<span class="value">' + esc(conflictValueText(conflict, 'mine')) + '</span></label>'
                + '<label class="conflict-choice"><span><input type="radio" name="conflict-' + index + '" value="theirs"> 用远端</span>'
                + '<span class="value">' + esc(conflictValueText(conflict, 'theirs')) + '</span></label>'
                + '</div>';
            item.querySelectorAll('input[type="radio"]').forEach(function (radio) {
                radio.addEventListener('change', function () {
                    if (!conflictState) return;
                    conflictState.choices[index] = radio.value;
                });
            });
            conflictList.appendChild(item);
        });
        setText(conflictSummary, '检测到 ' + conflicts.length + ' 处与其它设备/扫码端的修改冲突，请逐项选择保留哪一边（默认“用我的”）。');
        conflictOverlay.classList.add('active');
        conflictConfirm.focus();
    });
}

function finishConflict(mode) {
    if (!conflictState) return;
    var state = conflictState;
    conflictState = null;
    conflictOverlay.classList.remove('active');
    if (mode === 'cancel') { state.resolve(null); return; }
    state.resolve(state.choices.slice());
}

function selectAllConflictChoices(side) {
    if (!conflictState) return;
    conflictState.choices = conflictState.conflicts.map(function () { return side; });
    conflictList.querySelectorAll('input[type="radio"]').forEach(function (radio) {
        radio.checked = radio.value === side;
    });
}

// ============================================================
// 节点弹窗
// ============================================================
function resetSaveButton(btn, statusDiv) {
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
    if (statusDiv) { statusDiv.textContent = ''; }
}

function collectNodeFormValues() {
    return {
        name: modalNodeName.value.trim(),
        unified: modalNodeUnified.value === 'true',
        cost: parseCost(modalNodeCost.value),
        trackingNumber: trimOrUndefined(modalNodeTracking.value),
        orderNumber: trimOrUndefined(modalNodeOrder.value),
        qrLinks: parseLinks(modalNodeQrlinks.value),
        remark: trimOrUndefined(modalNodeRemark.value),
        status: Z.normalizeStatus(modalNodeStatus.value)
    };
}

function openNodeModal(mode, code, parentCode) {
    if (readOnly) { toast('当前为只读保护状态，无法编辑。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    modalNodeCodeCustom.checked = false;
    if (mode === 'add') {
        // 新增节点：只有新增时才创建空 children（编辑绝不携带 children/items）
        var defaultCode = parentCode ? generateChildCode(parentCode) : generateRootCode();
        if (!defaultCode) return;
        editContext = { nodeMode: 'add', originalCode: null, parentCode: parentCode || '', baseNode: null, autoCode: defaultCode };
        modalNodeMode.value = 'add';
        modalNodeParent.value = parentCode || '';
        modalNodeTitle.textContent = parentCode ? '添加子类' : '添加大类';
        modalNodeCode.value = defaultCode;
        modalNodeName.value = '';
        modalNodeUnified.value = 'true';
        modalNodeCost.value = '';
        modalNodeTracking.value = '';
        modalNodeOrder.value = '';
        modalNodeQrlinks.value = '';
        modalNodeRemark.value = '';
        modalNodeOriginalCode.value = '';
        fillStatusSelect(modalNodeStatus, STATUS.ON_SALE);
    } else {
        var node = findNodeByCode(code);
        if (!node || Z.isDeleted(node)) { toast('节点不存在或已在回收站', 'error'); return; }
        editContext = {
            nodeMode: 'edit',
            originalCode: code,
            parentCode: '',
            baseNode: Z.clone(baseNodeOf(code) || node),
            autoCode: code
        };
        modalNodeMode.value = 'edit';
        modalNodeOriginalCode.value = code;
        modalNodeParent.value = '';
        modalNodeTitle.textContent = '编辑节点';
        modalNodeCode.value = code;
        modalNodeName.value = node.name || '';
        modalNodeUnified.value = node.unified !== false ? 'true' : 'false';
        modalNodeCost.value = node.cost === undefined || node.cost === null ? '' : node.cost;
        modalNodeTracking.value = node.trackingNumber || '';
        modalNodeOrder.value = node.orderNumber || '';
        modalNodeQrlinks.value = (Array.isArray(node.qrLinks) && node.qrLinks.length) ? node.qrLinks.join(', ') : '';
        modalNodeRemark.value = node.remark || '';
        fillStatusSelect(modalNodeStatus, node.status);
    }
    updateNodeCodeUI();
    modalNodeOverlay.classList.add('active');
    resetSaveButton(modalNodeSave, nodeSaveStatus);
    setTimeout(function () { modalNodeName.focus(); }, 30);
}

function closeNodeModal() {
    modalNodeOverlay.classList.remove('active');
    resetSaveButton(modalNodeSave, nodeSaveStatus);
    editContext = null;
}

function saveNode() {
    if (readOnly) { toast('当前为只读保护状态，无法保存。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    if (!editContext) return;
    var mode = editContext.nodeMode;
    var custom = !!(modalNodeCodeCustom && modalNodeCodeCustom.checked);
    var code = Z.normalizeCode(modalNodeCode.value);
    var values = collectNodeFormValues();
    if (!values.name) {
        toast('名称不能为空', 'error');
        modalNodeName.focus();
        return;
    }
    if (!code) {
        if (mode === 'add') {
            code = editContext.autoCode || (editContext.parentCode ? generateChildCode(editContext.parentCode) : generateRootCode());
            if (!code) return;
        } else {
            toast('编码不能为空', 'error');
            return;
        }
    }
    if (mode === 'add' && !custom) {
        code = editContext.autoCode || code;
    }
    var originalCode = editContext.originalCode;
    if (custom) {
        var formatError = validateNodeCodeFormat(code, mode);
        if (formatError) { toast(formatError, { type: 'error', duration: 7000 }); modalNodeCode.focus(); return; }
    } else if (mode === 'edit') {
        // 未开启“自定义编码”时，编码只读，不允许被脚本/输入意外修改
        code = originalCode;
    }
    modalNodeCode.value = code;
    if (mode === 'add') {
        if (findCodeCollision(code, null)) {
            toast('编码已被占用（节点与库存编码全局唯一）：' + code, { type: 'error', duration: 7000 });
            return;
        }
    } else if (!Z.sameCode(code, originalCode)) {
        var currentNode = findNodeByCode(originalCode);
        if (!currentNode) { toast('节点不存在或已被删除', 'error'); return; }
        var renameCollision = findNodeRenameCollision(code, originalCode, currentNode);
        if (renameCollision) {
            toast('改名后的编码与现有记录冲突：' + renameCollision, { type: 'error', duration: 7000 });
            return;
        }
    }
    var fields;
    if (mode === 'add') {
        fields = fieldDiff(values, null);
    } else {
        var baseNode = editContext.baseNode;
        fields = fieldDiff(values, baseNode);
        // 历史数据节点可能没有 status 字段：默认“在售”不主动写入，避免制造无意义改动
        if (fields.status !== undefined && baseNode.status === undefined && fields.status === STATUS.ON_SALE) {
            delete fields.status;
        }
        if (!Object.keys(fields).length && Z.sameCode(code, originalCode)) {
            toast('没有需要保存的修改', 'info');
            closeNodeModal();
            return;
        }
    }
    var op = {
        type: 'node.upsert',
        code: code,
        originalCode: mode === 'add' ? null : originalCode,
        parentCode: mode === 'add' ? (editContext.parentCode || null) : null,
        baseNode: mode === 'add' ? null : Z.clone(editContext.baseNode),
        fields: fields
    };
    function proceed() {
        modalNodeSave.disabled = true;
        modalNodeSave.textContent = '保存中…';
        nodeSaveStatus.innerHTML = '<span class="spinner"></span> 保存中…';
        var successMessage = (mode === 'add' ? '已添加节点 ' : '已保存节点 ') + code;
        return saveWithOps([op], {
            successMessage: successMessage,
            onError: function (err, tip) { nodeSaveStatus.textContent = '保存失败：' + tip; }
        }).then(function (result) {
            if (result) {
                closeNodeModal();
            } else {
                modalNodeSave.disabled = false;
                modalNodeSave.textContent = '重试保存';
                if (!nodeSaveStatus.textContent) nodeSaveStatus.textContent = '保存失败，请重试';
            }
            return !!result;
        });
    }
    if (mode === 'edit' && !Z.sameCode(code, originalCode)) {
        showConfirm({
            title: '确认修改编码',

            confirmText: '确认改名并保存',
            onConfirm: function () { return proceed().then(function () { return true; }); }
        });

    }
}

function collectItemFormValues() {
    return {
        name: trimOrUndefined(modalItemName.value),
        cost: parseCost(modalItemCost.value),
        trackingNumber: trimOrUndefined(modalItemTracking.value),
        orderNumber: trimOrUndefined(modalItemOrder.value),
        status: Z.normalizeStatus(modalItemStatus.value),
        qrLinks: parseLinks(modalItemQrlinks.value),
        remark: trimOrUndefined(modalItemRemark.value)
    };
}

function openItemModal(mode, parentCode, itemCode) {
    if (readOnly) { toast('当前为只读保护状态，无法编辑。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var parent = findNodeByCode(parentCode);
    if (!parent || Z.isDeleted(parent)) { toast('父节点不存在或已在回收站', 'error'); return; }
    modalItemParentCode.value = parentCode;
    modalItemCodeCustom.checked = false;
    if (mode === 'add') {
        var defaultCode = generateItemCode(parentCode);
        if (!defaultCode) return;
        itemContext = { itemMode: 'add', parentCode: parentCode, originalCode: null, baseItem: null, autoCode: defaultCode };
        modalItemTitle.textContent = '添加库存';
        if (itemQtyRow) itemQtyRow.style.display = 'block';
        if (modalItemQty) modalItemQty.value = '1';
        modalItemCode.value = defaultCode;
        modalItemName.value = '';
        modalItemCost.value = '';
        modalItemTracking.value = '';
        modalItemOrder.value = '';
        modalItemQrlinks.value = '';
        modalItemRemark.value = '';
        modalItemOriginalCode.value = '';
        fillStatusSelect(modalItemStatus, STATUS.ON_SALE);
    } else {
        var item = Z.findItem(parent, itemCode);
        if (!item || Z.isDeleted(item)) { toast('库存项不存在或已在回收站', 'error'); return; }
        itemContext = {
            itemMode: 'edit',
            parentCode: parentCode,
            originalCode: itemCode,
            baseItem: Z.clone(baseItemOf(parentCode, itemCode) || item),
            autoCode: itemCode
        };
        modalItemTitle.textContent = '编辑库存';
        if (itemQtyRow) itemQtyRow.style.display = 'none';
        modalItemCode.value = item.code || '';
        modalItemName.value = item.name || '';
        modalItemCost.value = item.cost === undefined || item.cost === null ? '' : item.cost;
        modalItemTracking.value = item.trackingNumber || '';
        modalItemOrder.value = item.orderNumber || '';
        modalItemQrlinks.value = (Array.isArray(item.qrLinks) && item.qrLinks.length) ? item.qrLinks.join(', ') : '';
        modalItemRemark.value = item.remark || '';
        modalItemOriginalCode.value = itemCode;
        fillStatusSelect(modalItemStatus, item.status);
    }
    updateItemCodeUI();
    modalItemOverlay.classList.add('active');
    resetSaveButton(modalItemSave, itemSaveStatus);
    setTimeout(function () { modalItemName.focus(); }, 30);
}

function closeItemModal() {
    modalItemOverlay.classList.remove('active');
    resetSaveButton(modalItemSave, itemSaveStatus);
    itemContext = null;
}

function saveItem() {
    if (readOnly) { toast('当前为只读保护状态，无法保存。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    if (!itemContext) return;
    var parentCode = itemContext.parentCode;
    var parent = findNodeByCode(parentCode);
    if (!parent || Z.isDeleted(parent)) { toast('父节点不存在或已在回收站', 'error'); return; }
    var custom = !!(modalItemCodeCustom && modalItemCodeCustom.checked);
    var code = Z.normalizeCode(modalItemCode.value);
    if (!code) {
        code = itemContext.autoCode || generateItemCode(parentCode);
        if (!code) return;
    }
    if (itemContext.itemMode === 'add' && !custom) {
        code = itemContext.autoCode || code;
    }
    var originalCode = itemContext.originalCode;
    if (custom) {
        var formatError = validateItemCodeFormat(code, parentCode);
        if (formatError) { toast(formatError, { type: 'error', duration: 7000 }); modalItemCode.focus(); return; }
        if (findCodeCollision(code, originalCode)) {
            toast('编码已被占用（节点与库存编码全局唯一）：' + code, { type: 'error', duration: 7000 });
            return;
        }
    } else if (itemContext.itemMode === 'edit') {
        // 未开启“自定义编码”时，编码只读
        code = originalCode;
    }
    modalItemCode.value = code;
    var values = collectItemFormValues();
    // 添加 N 件：一次保存写入 N 个 item.upsert（自动连续编码）
    if (itemContext.itemMode === 'add') {
        var qty = parseInt(modalItemQty ? modalItemQty.value : '1', 10);
        if (!isFinite(qty) || qty < 1) qty = 1;
        qty = Math.min(100, Math.floor(qty));
        if (qty > 1) {
            if (custom) toast('批量添加将使用自动连续编码（忽略自定义编码）', 'warn');
            var batchFields = fieldDiff(values, null);
            var codes = generateItemCodes(parentCode, qty);
            if (codes.length !== qty) {
                toast('可用库存编码不足（最多到 999），请减少数量或先整理编码', { type: 'error', duration: 7000 });
                return;
            }
            var batchOps = codes.map(function (newCode) {
                return {
                    type: 'item.upsert',
                    parentCode: parentCode,
                    code: newCode,
                    originalCode: null,
                    baseItem: null,
                    fields: Z.clone(batchFields)
                };
            });
            modalItemSave.disabled = true;
            modalItemSave.textContent = '保存中…';
            itemSaveStatus.innerHTML = '<span class="spinner"></span> 批量保存 ' + qty + ' 件…';
            saveWithOps(batchOps, {
                successMessage: '已批量添加 ' + qty + ' 件库存（' + codes[0] + ' ~ ' + codes[codes.length - 1] + '）',
                onError: function (err, tip) { itemSaveStatus.textContent = '保存失败：' + tip; }
            }).then(function (result) {
                if (result) {
                    closeItemModal();
                } else {
                    modalItemSave.disabled = false;
                    modalItemSave.textContent = '重试保存';
                    if (!itemSaveStatus.textContent) itemSaveStatus.textContent = '保存失败，请重试';
                }
            });
            return;
        }
    }
    var op;
    if (itemContext.itemMode === 'add') {
        op = {
            type: 'item.upsert',
            parentCode: parentCode,
            code: code,
            originalCode: null,
            baseItem: null,
            fields: fieldDiff(values, null)
        };
    } else {
        var baseItem = itemContext.baseItem;
        var fields = fieldDiff(values, baseItem);
        if (!Object.keys(fields).length && Z.sameCode(code, originalCode)) {
            toast('没有需要保存的修改', 'info');
            closeItemModal();
            return;
        }
        op = {
            type: 'item.upsert',
            parentCode: parentCode,
            code: code,
            originalCode: originalCode,
            baseItem: Z.clone(baseItem),
            fields: fields
        };
    }
    modalItemSave.disabled = true;
    modalItemSave.textContent = '保存中…';
    itemSaveStatus.innerHTML = '<span class="spinner"></span> 保存中…';
    var successMessage = (itemContext.itemMode === 'add' ? '已添加库存 ' : '已保存库存 ') + code;
    saveWithOps([op], {
        successMessage: successMessage,
        onError: function (err, tip) {
            itemSaveStatus.textContent = '保存失败：' + tip;
        }
    }).then(function (result) {
        if (result) {
            closeItemModal();
        } else {
            modalItemSave.disabled = false;
            modalItemSave.textContent = '重试保存';
            if (!itemSaveStatus.textContent) itemSaveStatus.textContent = '保存失败，请重试';
        }
    });
}

function updateDeleteConfirmState() {
    if (!deleteState) return;
    var typed = deleteConfirmInput.value;
    var ok = Z.sameCode(typed, deleteState.code);
    deleteConfirmOk.disabled = !ok || isSaving;
}

function showDeleteConfirm(opts) {
    deleteState = { code: opts.code, onConfirm: opts.onConfirm, okText: opts.okText || '确认删除' };
    setText(deleteConfirmTitle, opts.title || '确认删除');
    deleteConfirmMessage.textContent = opts.message || '';
    setText(deleteConfirmCode, opts.code);
    deleteConfirmInput.value = '';
    setText(deleteConfirmStatus, '');
    deleteConfirmOk.disabled = true;
    deleteConfirmCancel.disabled = false;
    deleteConfirmOk.textContent = deleteState.okText;
    deleteConfirmOverlay.classList.add('active');
    setTimeout(function () { deleteConfirmInput.focus(); }, 40);
}

function cancelDelete() {
    deleteConfirmOverlay.classList.remove('active');
    deleteState = null;
}

function confirmDelete() {
    if (!deleteState || isSaving) return;
    if (!Z.sameCode(deleteConfirmInput.value, deleteState.code)) return;
    var state = deleteState;
    deleteConfirmOk.disabled = true;
    deleteConfirmCancel.disabled = true;
    deleteConfirmOk.textContent = '处理中…';
    Promise.resolve(state.onConfirm()).then(function (ok) {
        deleteConfirmOk.textContent = state.okText || '确认删除';
        deleteConfirmCancel.disabled = false;
        if (ok) {
            deleteConfirmOverlay.classList.remove('active');
            deleteState = null;
        } else {
            updateDeleteConfirmState();
        }
    });
}

function deleteNode(code) {
    if (readOnly) { toast('当前为只读保护状态，无法删除。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var entry = findNodeEntry(code);
    if (!entry || Z.isDeleted(entry.node)) { toast('节点不存在或已在回收站', 'error'); return; }
    var counts = countNodeContents(entry.node, false);
    var baseNode = baseNodeOf(code);
    var parts = ['将把节点「' + code + '」'];
    if (counts.children > 0) parts.push('及其下 ' + counts.children + ' 个子类');
    if (counts.items > 0) parts.push('、' + counts.items + ' 个库存');
    var message = parts.join('') + '移入回收站。\n数据仍保留在 Gist 中，可在“数据 → 回收站”中恢复。';
    showDeleteConfirm({
        title: '移入回收站',
        code: code,
        okText: '移入回收站',
        message: message,
        onConfirm: function () {
            deleteConfirmStatus.textContent = '处理中…';
            return saveWithOps([{
                type: 'node.upsert',
                code: code,
                originalCode: code,
                parentCode: null,
                baseNode: baseNode ? Z.clone(baseNode) : null,
                fields: { deletedAt: new Date().toISOString() }
            }], {
                successMessage: '已将节点 ' + code + ' 移入回收站（' + counts.children + ' 个子类 / ' + counts.items + ' 个库存）',
                onError: function (err, tip) { deleteConfirmStatus.textContent = '操作失败：' + tip; }
            }).then(function (result) {
                return !!result;
            });
        }
    });
}

function deleteItem(parentCode, itemCode) {
    if (readOnly) { toast('当前为只读保护状态，无法删除。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var parent = findNodeByCode(parentCode);
    if (!parent || Z.isDeleted(parent)) { toast('父节点不存在或已在回收站', 'error'); return; }
    var item = Z.findItem(parent, itemCode);
    if (!item || Z.isDeleted(item)) { toast('库存项不存在或已在回收站', 'error'); return; }
    var baseItem = baseItemOf(parentCode, itemCode);
    showDeleteConfirm({
        title: '移入回收站',
        code: itemCode,
        okText: '移入回收站',
        message: '将把库存「' + itemCode + '」移入回收站。\n数据仍保留在 Gist 中，可在“数据 → 回收站”中恢复。',
        onConfirm: function () {
            deleteConfirmStatus.textContent = '处理中…';
            return saveWithOps([{
                type: 'item.upsert',
                parentCode: parentCode,
                code: itemCode,
                originalCode: itemCode,
                baseItem: baseItem ? Z.clone(baseItem) : null,
                fields: { deletedAt: new Date().toISOString() }
            }], {
                successMessage: '已将库存 ' + itemCode + ' 移入回收站',
                onError: function (err, tip) { deleteConfirmStatus.textContent = '操作失败：' + tip; }
            }).then(function (result) {
                return !!result;
            });
        }
    });
}

function getSelectedItems(parentCode) {
    var checkboxes = treeContainer.querySelectorAll('.item-checkbox');

function toggleSelectAll(checkbox, parentCode) {

    });

function batchPrintItems(parentCode) {
    var selected = getSelectedItems(parentCode);
    if (!selected.length) { toast('请先选择要打印的库存项', 'warn'); return; }
    var parent = findNodeByCode(parentCode);
    if (!parent || Z.isDeleted(parent)) { toast('父节点不存在或已在回收站', 'warn'); return; }
    var dataList = [];
    selected.forEach(function (itemCode) {
        var item = Z.findItem(parent, itemCode);
        if (!item || Z.isDeleted(item)) return;
        dataList.push({
            code: itemCode,
            name: item.name || parent.name || '',
            cost: item.cost,
            orderNumber: item.orderNumber,
            trackingNumber: item.trackingNumber,
            qrLinks: item.qrLinks
        });
    });
    if (!dataList.length) { toast('所选库存均已在回收站，无法打印', 'warn'); return; }
    openPrintPreview(dataList);
}

function openBatchStatus(parentCode) {
    if (readOnly) { toast('当前为只读保护状态，无法修改。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var selected = getSelectedItems(parentCode);
    if (!selected.length) { toast('请先选择要修改的库存项', 'warn'); return; }
    batchContext = { entries: [{ parentCode: parentCode, itemCodes: selected }] };
    fillStatusSelect(batchStatusSelect, STATUS.ON_SALE);
    setText(batchStatusNote, '已选择 ' + selected.length + ' 项库存，将统一修改为下方状态。');
    batchStatusOverlay.classList.add('active');
}

function openGlobalBatchStatus() {
    if (readOnly) { toast('当前为只读保护状态，无法修改。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var entries = collectCheckedItemEntries();
    var total = entries.reduce(function (sum, entry) { return sum + entry.itemCodes.length; }, 0);
    if (!total) { toast('请先勾选要修改状态的库存项（可用“全选当前筛选结果”）', 'warn'); return; }
    batchContext = { entries: entries };
    fillStatusSelect(batchStatusSelect, STATUS.ON_SALE);
    setText(batchStatusNote, '已跨 ' + entries.length + ' 个节点选择 ' + total + ' 项库存，将统一修改为下方状态。');
    batchStatusOverlay.classList.add('active');
}

function applyBatchStatus() {
    if (!batchContext) return;
    if (readOnly) { toast('当前为只读保护状态，无法保存。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var target = Z.normalizeStatus(batchStatusSelect.value);
    var ops = [];
    (batchContext.entries || []).forEach(function (entry) {
        var parent = findNodeByCode(entry.parentCode);
        if (!parent || Z.isDeleted(parent)) return;
        var baseParent = Z.findNodeByCode(baseDoc.products, entry.parentCode);
        entry.itemCodes.forEach(function (itemCode) {
            var item = Z.findItem(parent, itemCode);
            if (!item || Z.isDeleted(item)) return;
            if (Z.normalizeStatus(item.status) === target) return;
            var baseItem = baseParent ? Z.findItem(baseParent, itemCode) : null;
            ops.push({
                type: 'item.upsert',
                parentCode: entry.parentCode,
                code: itemCode,
                originalCode: itemCode,
                baseItem: baseItem ? Z.clone(baseItem) : null,
                fields: { status: target }
            });
        });
    });
    if (!ops.length) { toast('所选库存状态未变化', 'info'); batchStatusOverlay.classList.remove('active'); return; }
    batchStatusSave.disabled = true;
    batchStatusSave.textContent = '保存中…';
    saveWithOps(ops, { successMessage: '已修改 ' + ops.length + ' 项库存状态为「' + target + '」' }).then(function (result) {
        batchStatusSave.disabled = false;
        batchStatusSave.textContent = '确定修改';
        if (result) {
            batchStatusOverlay.classList.remove('active');
            updateGlobalSelection();
        }
    });
}

// 快捷键 / Esc 关闭 / Enter 保存 / 焦点陷阱
document.addEventListener('keydown', function (event) {
    var key = event.key;
    var mod = event.ctrlKey || event.metaKey;
    if (mod && !event.shiftKey && (key === 's' || key === 'S')) {
        event.preventDefault();
        if (modalNodeOverlay.classList.contains('active')) saveNode();
        else if (modalItemOverlay.classList.contains('active')) saveItem();
        else toast('当前没有打开的编辑弹窗', 'info');
        return;
    }
    if (mod && !event.shiftKey && (key === 'f' || key === 'F')) {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
    }
    if (handleFocusTrap(event)) return;
    if (key === 'Escape') {
        if (dataMenu.classList.contains('open')) { closeDataMenu(); return; }
        if (confirmOverlay.classList.contains('active')) { cancelConfirm(); return; }
        if (conflictOverlay.classList.contains('active')) { finishConflict('cancel'); return; }
        if (deleteConfirmOverlay.classList.contains('active')) { cancelDelete(); return; }
        if (modalNodeOverlay.classList.contains('active')) { closeNodeModal(); return; }
        if (modalItemOverlay.classList.contains('active')) { closeItemModal(); return; }
        if (batchStatusOverlay.classList.contains('active')) { batchStatusOverlay.classList.remove('active'); return; }
        if (dataModalOverlay.classList.contains('active')) { closeDataModal(); return; }
        if (printPreviewOverlay.classList.contains('active')) { printPreviewOverlay.classList.remove('active'); return; }
        return;
    }
    if (key === 'Enter' && !event.isComposing) {
        var target = event.target;
        if (!target || !target.tagName) return;
        if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
        if (modalNodeOverlay.classList.contains('active') && modalNodeOverlay.contains(target)) {
            event.preventDefault();
            saveNode();
        } else if (modalItemOverlay.classList.contains('active') && modalItemOverlay.contains(target)) {
            event.preventDefault();
            saveItem();
        }
    }
});

    function escapeHtml(text) {
        if (typeof text !== 'string') return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getTextLines(text, fontSizePt, fontName, bold, maxWidthPx) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSizePx = fontSizePt * 1.3333;
        ctx.font = `${bold ? 'bold ' : ''}${fontSizePx}px ${fontName || 'SimHei'}`;
        
        const lines = [];
        let currentLine = '';
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const testLine = currentLine + char;
            const metrics = ctx.measureText(testLine);
            
            if (metrics.width > maxWidthPx && currentLine !== '') {
                lines.push(currentLine);
                currentLine = char;
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine) {
            lines.push(currentLine);
        }
        return lines;
    }

    function calcDynamicFontSize(text, maxWidthMm, maxHeightMm, baseSize, fontName, bold) {
        const displayText = '内部编码: ' + (text || '').toString();
        const maxWidthPx = maxWidthMm * 3.7795;
        const maxHeightPx = maxHeightMm * 3.7795;
        const lineHeightRatio = 1.05;
        
        let low = 2;
        let high = 40;
        let bestSize = low;
        
        while (high - low > 0.05) {
            const mid = (low + high) / 2;
            const lines = getTextLines(displayText, mid, fontName, bold, maxWidthPx);
            const fontSizePx = mid * 1.3333;
            const totalHeightPx = lines.length * fontSizePx * lineHeightRatio;
            
            if (totalHeightPx <= maxHeightPx) {
                bestSize = mid;
                low = mid;
            } else {
                high = mid;
            }
        }
        return bestSize;
    }

    function getLodopInstance() {
        if (typeof getLodop === 'function') {
            return getLodop();
        } else if (window.LODOP) {
            return window.LODOP;
        } else if (window.CLodop) {
            return window.CLodop;
        } else {
            alert('打印服务未加载，请确保已安装 C-Lodop 并刷新页面。');
            return null;
        }
    }

    function getPrinterList() {
        const LODOP = getLodopInstance();
        if (!LODOP) return [];
        try {
            const count = LODOP.GET_PRINTER_COUNT();
            const printers = [];
            for (let i = 0; i < count; i++) {
                printers.push(LODOP.GET_PRINTER_NAME(i));
            }
            return printers;
        } catch (e) {
            console.error('获取打印机列表失败:', e);
            return [];
        }
    }

    function drawTemplatePreview(canvas, template, data) {
        const scale = canvas.width / template.paperWidth;
        canvas.height = template.paperHeight * scale;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#cccccc';
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        template.elements.forEach(el => {
            const x = el.x * scale;
            const y = el.y * scale;
            const width = el.width * scale;
            const height = el.height * scale;

            if (el.type === 'text') {
                ctx.fillStyle = '#000000';
                let text = '';
                if (el.field === 'static') {
                    text = el.text || '';
                } else if (data && data[el.field] !== undefined) {
                    let rawData = data[el.field].toString();
                    if (el.showLastLevelOnly && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    text = rawData;
                    if (el.prefix) text = el.prefix + text;
                } else {
                    text = (el.prefix || '') + 'C001'; 
                }
                
                let fontSize = el.fontSize;
                if (el.dynamicSize) {
                    const demoText = text.replace(el.prefix || '', '');
                    fontSize = calcDynamicFontSize(demoText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                }
                const fontSizePx = fontSize * 0.3528 * scale; 
                ctx.font = `${el.bold ? 'bold ' : ''}${fontSizePx}px ${el.fontName || 'SimHei'}, sans-serif`;
                
                const maxWidthPx = el.width * scale;
                const lineHeightPx = fontSizePx * 1.05;
                
                const lines = [];
                let currentLine = '';
                const chars = text.split('');
                for (let i = 0; i < chars.length; i++) {
                    const testLine = currentLine + chars[i];
                    if (ctx.measureText(testLine).width > maxWidthPx && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = chars[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const totalTextHeightPx = lines.length * lineHeightPx;
                const startY = y + (height - totalTextHeightPx) / 2;
                
                ctx.textAlign = el.align === 'center' ? 'center' : 'left';
                ctx.textBaseline = 'middle';
                
                lines.forEach((line, index) => {
                    const drawX = el.align === 'center' ? (x + width / 2) : x;
                    const drawY = startY + (index * lineHeightPx) + (lineHeightPx / 2);
                    ctx.fillText(line, drawX, drawY);
                });
            } else if (el.type === 'barcode') {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(x, y, width, height);
                ctx.fillStyle = '#333333';
                ctx.font = `${Math.max(scale * 2, 8)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const codeText = data && data[el.field] ? data[el.field] : '条码区域';
                let displayText = codeText;
                if (displayText.length > 15) {
                    displayText = displayText.substring(0, 12) + '...';
                }
                ctx.fillText(displayText, x + width / 2, y + height / 2);
            }
        });
    }

    function renderInnerPreview(dataList, template) {
        const container = document.getElementById('inner-preview-container');
        container.innerHTML = '';
        
        dataList.forEach(data => {
            const canvas = document.createElement('canvas');
            canvas.width = template.paperWidth * 3.78; 
            drawTemplatePreview(canvas, template, data);
            container.appendChild(canvas);
        });
    }

            const virtualKeywords = ['pdf', 'wps', 'fax', 'virtual', 'one note', 'onenote', 'microsoft print to pdf', 'print to pdf'];
            for (let i = 0; i < printers.length; i++) {
                const name = printers[i].toLowerCase();
                if (!virtualKeywords.some(k => name.includes(k))) {
                    defaultIndex = i;
                    break;
                }

            printers.forEach((name, index) => {

                option.value = index;
                option.textContent = name;
                printerSelect.appendChild(option);

            printerSelect.value = defaultIndex;

        window.currentPrintDataList = dataList;
        
        renderInnerPreview(dataList, printTemplates[selectedTemplateIndex]);
    }

    function buildLodopPrintData(LODOP, dataList, template, printerIndex) {
        LODOP.PRINT_INIT(template.name || '标签打印');
        LODOP.SET_PRINT_PAGESIZE(1, template.paperWidth * 10, template.paperHeight * 10, '');
        if (!isNaN(printerIndex) && printerIndex >= 0) {
            LODOP.SET_PRINTER_INDEX(printerIndex);
        }

        dataList.forEach((data, i) => {
            template.elements.forEach((el) => {
                let value = '';
                if (el.field === 'static') {
                    value = el.text || '';
                } else {
                    let rawData = data[el.field] !== undefined ? data[el.field] : '';
                    if (el.showLastLevelOnly && typeof rawData === 'string' && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    value = rawData;
                }
                if (el.prefix && value) {
                    value = el.prefix + value;
                }

                const x = el.x + 'mm';
                const y = el.y + 'mm';
                const width = el.width + 'mm';
                const height = el.height + 'mm';

                if (el.type === 'text') {
                    let finalFontSize = el.fontSize;
                    if (el.dynamicSize && value) {
                        const codeText = data[el.field] || '';
                        finalFontSize = calcDynamicFontSize(codeText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                    }
                    
                    const htmlContent = `
                        <div style="
                            width: ${el.width}mm; 
                            height: ${el.height}mm; 
                            display: table;
                            font-family: ${el.fontName || 'SimHei'}, sans-serif; 
                            font-size: ${finalFontSize}pt; 
                            font-weight: ${el.bold ? 'bold' : 'normal'}; 
                            text-align: ${el.align || 'center'};
                            line-height: 1.05; 
                            word-break: break-all; 
                            overflow: hidden;
                            margin: 0;
                            padding: 0;
                        ">
                            <div style="display: table-cell; vertical-align: middle;">
                                ${escapeHtml(value)}
                            </div>
                        </div>
                    `;
                    LODOP.ADD_PRINT_HTM(y, x, width, height, htmlContent);
                } else if (el.type === 'barcode') {
                    let barcodeValue = data[el.field] !== undefined ? data[el.field] : '';
                    LODOP.ADD_PRINT_BARCODE(y, x, width, height, el.barcodeType, barcodeValue);
                    LODOP.SET_PRINT_STYLEA(0, "Horient", 2);
                    LODOP.SET_PRINT_STYLEA(0, "Alignment", 2);
                }
            });
            if (i < dataList.length - 1) {
                LODOP.NEWPAGE();
            }
        });
    }

    function executePrint() {
        const LODOP = getLodopInstance();
        if (!LODOP) return;

        const dataList = window.currentPrintDataList;
        if (!dataList || dataList.length === 0) return;

        const template = printTemplates[selectedTemplateIndex];
        const printerIndex = parseInt(printerSelect.value);
        const copies = parseInt(printCopiesInput.value) || 1;

        if (isNaN(printerIndex)) {
            alert('请选择打印机');
            return;
        }

        LODOP.SET_PRINT_COPIES(copies);
        buildLodopPrintData(LODOP, dataList, template, printerIndex);
        LODOP.PRINT();

        printPreviewOverlay.classList.remove('active');
    }
