<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理后台（带标签打印）</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #0f172a;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .top-bar {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            justify-content: space-between; background: white; padding: 12px 20px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; font-size: 14px;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-sm { padding: 2px 8px; font-size: 12px; }
        .card {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
        }
        .tree-container { padding: 10px 0; overflow-x: auto; }
        .tree-node {
            margin-left: 20px; padding-left: 10px; border-left: 2px solid #e2e8f0;
        }
        .tree-node .node-content {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0;
        }
        .tree-node .node-content .name { font-weight: 600; cursor: pointer; }
        .tree-node .node-content .code { color: #64748b; font-size: 12px; background: #f1f5f9; padding: 0 8px; border-radius: 4px; }
        .tree-node .node-content .badge { font-size: 11px; background: #dbeafe; color: #1e40af; padding: 0 6px; border-radius: 12px; }
        .tree-node .node-content .status-badge { font-size: 11px; padding: 0 6px; border-radius: 12px; color: white; }
        .tree-node .node-content .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .tree-node .node-content .actions .btn { padding: 2px 8px; font-size: 12px; }
        .tree-node .children { display: none; }
        .tree-node.expanded > .children { display: block; }
        .filter-bar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;
        }
        .filter-bar select, .filter-bar input {
            padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
        }
        .items-table {
            width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px;
        }
        .items-table th { background: #f8fafc; text-align: left; padding: 6px 8px; border-bottom: 2px solid #e2e8f0; }
        .items-table td { padding: 6px 8px; border-bottom: 1px solid #e2e8f0; word-break: break-all; }
        .items-table .actions { display: flex; gap: 4px; }
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 16px; padding: 24px; max-width: 580px;
            width: 90%; max-height: 90vh; overflow-y: auto;
        }
        .modal h3 { margin-top: 0; }
        .modal label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
        .modal input, .modal textarea, .modal select {
            width: 100%; padding: 8px 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 14px; margin-top: 4px;
        }
        .modal .btn-group { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal .inline-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .modal .inline-group label { margin-top: 0; }
        #login-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center; z-index: 9999;
        }
        #login-overlay.active { display: flex; }
        .login-box {
            background: white; border-radius: 16px; padding: 30px; max-width: 400px; width: 90%;
        }
        .login-box h2 { margin-top: 0; }
        .login-box label { display: block; margin-top: 12px; font-weight: 600; }
        .login-box input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 4px; }
        #login-error { color: #ef4444; margin-top: 10px; }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; }

        /* 打印状态提示 */
        .lodop-status {
            font-size: 12px;
            color: #475569;
            margin-top: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            background: #f1f5f9;
            display: inline-block;
        }
        .lodop-status.error { background: #fee2e2; color: #b91c1c; }
        .lodop-status.success { background: #dcfce7; color: #166534; }
    </style>
</head>

<!-- ========== 引入 C-Lodop ========== -->
<script src="CLodopFuncs.js" onerror="console.warn('本地CLodopFuncs.js加载失败，尝试远程...')"></script>
<script>
    (function() {
        if (typeof getLodop === 'function') {
            console.log('C-Lodop 已从本地加载');
            updateLodopStatus(true);
            return;
        }
        const isHttps = window.location.protocol === 'https:';
        const remoteUrl = isHttps ? 'https://localhost.lodop.net:8443/CLodopFuncs.js' : 'http://localhost:8000/CLodopFuncs.js';
        const script = document.createElement('script');
        script.src = remoteUrl;
        script.onload = function() {
            if (typeof getLodop === 'function') {
                console.log('C-Lodop 从远程加载成功: ' + remoteUrl);
                updateLodopStatus(true);
            } else {
                console.warn('远程加载成功但 getLodop 未定义');
                updateLodopStatus(false);
            }
        };
        script.onerror = function() {
            console.error('远程 C-Lodop 加载失败: ' + remoteUrl);
            updateLodopStatus(false);
            alert('无法加载 C-Lodop 打印服务。\n' +
                  '请确保已安装 C-Lodop 并运行。\n' +
                  '如果网站是 HTTPS，请先手动信任证书：\n' +
                  '在浏览器中打开 ' + remoteUrl + ' 并点击"高级"->"继续前往"。');
        };
        document.head.appendChild(script);
        setTimeout(function() {
            if (typeof getLodop === 'function') {
                updateLodopStatus(true);
            }
        }, 3000);
    })();

    function updateLodopStatus(ok) {
        const el = document.getElementById('lodop-status');
        if (el) {
            if (ok) {
                el.textContent = '✅ 打印服务已就绪';
                el.className = 'lodop-status success';
            } else {
                el.textContent = '❌ 打印服务未连接，请安装 C-Lodop 并手动信任证书';
                el.className = 'lodop-status error';
            }
        }
    }

    function waitForLodop(callback, retries) {
        retries = retries || 10;
        if (typeof getLodop === 'function') {
            callback(true);
            return;
        }
        if (retries <= 0) {
            callback(false);
            return;
        }
        setTimeout(function() {
            waitForLodop(callback, retries - 1);
        }, 500);
    }

    window.addEventListener('load', function() {
        waitForLodop(function(ok) {
            updateLodopStatus(ok);
        });
    });
</script>

<!-- ========== 主脚本 ========== -->
<script>
    const STORAGE_KEYS = {
        TOKEN: 'github_token',
        GIST_ID: 'gist_id',
        FILENAME: 'gist_filename'
    };

    let gistData = { products: {} };
    let currentToken = '';
    let currentGistId = 'f13d97c430522e4851afbf3cd2331e14';
    let currentFilename = 'data.json';

    const loginOverlay = document.getElementById('login-overlay');
    const loginToken = document.getElementById('login-token');
    const loginGistId = document.getElementById('login-gistid');
    const loginFilename = document.getElementById('login-filename');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const appContainer = document.getElementById('app-container');
    const userStatus = document.getElementById('user-status');

    const modalItemTitle = document.getElementById('modal-item-title');
    const modalItemCode = document.getElementById('modal-item-code');
    const modalItemName = document.getElementById('modal-item-name');
    const modalItemCost = document.getElementById('modal-item-cost');
    const modalItemTracking = document.getElementById('modal-item-tracking');
    const modalItemOrder = document.getElementById('modal-item-order');
    const modalItemStatus = document.getElementById('modal-item-status');
    const modalItemQrlinks = document.getElementById('modal-item-qrlinks');
    const modalItemRemark = document.getElementById('modal-item-remark');
    const modalItemParentCode = document.getElementById('modal-item-parent-code');
    const modalItemOriginalCode = document.getElementById('modal-item-original-code');
    const modalItemSave = document.getElementById('modal-item-save');
    const modalItemCancel = document.getElementById('modal-item-cancel');

    async function getGistContent(token, gistId, filename) {
        const url = `https://api.github.com/gists/${gistId}`;
        const resp = await fetch(url, {
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`GitHub API 错误: ${err.message || resp.statusText}`);
        }
        const data = await resp.json();
        const files = data.files;
        if (!files || !files[filename]) return {};
        try { return JSON.parse(files[filename].content); }
        catch { return {}; }
    }

    async function updateGistContent(token, gistId, filename, content) {
        const contentStr = JSON.stringify(content, null, 2);
        const url = `https://api.github.com/gists/${gistId}`;
        const payload = {
            files: {
                [filename]: { content: contentStr }
            }
        };
        const resp = await fetch(url, {
            method: 'PATCH',
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`更新失败: ${err.message || resp.statusText}`);
        }
        return await resp.json();
    }

    async function loadData() {
        try {
            const data = await getGistContent(currentToken, currentGistId, currentFilename);
            if (!data.products) data.products = {};
            gistData = data;
            renderTree();
            populateFilter();
            userStatus.textContent = `已连接 (${currentGistId})`;
            return true;
        } catch (e) {
            alert(`加载数据失败: ${e.message}`);
            return false;
        }
    }

    async function saveData() {
        try {
            await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
            return true;
        } catch (e) {
            alert(`保存失败: ${e.message}`);
            return false;
        }
    }

    function findNodeByCode(code, obj) {
        if (!obj) obj = gistData.products;
        if (obj[code]) return obj[code];
        for (let key in obj) {
            if (obj[key].children) {
                const found = findNodeByCode(code, obj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findParentNode(code, parentObj) {
        if (!parentObj) parentObj = gistData.products;
        for (let key in parentObj) {
            if (parentObj[key].children && parentObj[key].children[code]) {
                return parentObj[key];
            }
            if (parentObj[key].children) {
                const found = findParentNode(code, parentObj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findItemByCode(itemCode) {
        const products = gistData.products;
        for (let rootKey in products) {
            let found = findItemInNode(products[rootKey], itemCode);
            if (found) return found;
        }
        return null;
    }
    function findItemInNode(node, itemCode) {
        if (node.items) {
            const item = node.items.find(it => it.code === itemCode);
            if (item) return item;
        }
        if (node.children) {
            for (let childKey in node.children) {
                const found = findItemInNode(node.children[childKey], itemCode);
                if (found) return found;
            }
        }
        return null;
    }

    function generateRootCode() {
        const products = gistData.products;
        const keys = Object.keys(products).filter(k => /^A\d{3}$/.test(k));
        let maxNum = 0;
        keys.forEach(k => { const num = parseInt(k.substring(1)); if (num > maxNum) maxNum = num; });
        const next = maxNum + 1;
        if (next > 999) { alert('达到上限'); return null; }
        return 'A' + String(next).padStart(3, '0');
    }

    function generateChildCode(parentCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) return null;
        if (!parent.children) parent.children = {};
        const children = parent.children;
        const keys = Object.keys(children).filter(k => k.startsWith(parentCode + '/B'));
        let maxNum = 0;
        keys.forEach(k => {
            const parts = k.split('/');
            const last = parts[parts.length - 1];
            if (last.startsWith('B')) {
                const num = parseInt(last.substring(1));
                if (num > maxNum) maxNum = num;
            }
        });
        const next = maxNum + 1;
        if (next > 999) { alert('子编码超过 B999'); return null; }
        return parentCode + '/B' + String(next).padStart(3, '0');
    }

    function generateItemCode(parentCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) return null;
        if (!parent.items) parent.items = [];
        const items = parent.items;
        let maxNum = 0;
        items.forEach(item => {
            const parts = item.code.split('/');
            const last = parts[parts.length - 1];
            const num = parseInt(last);
            if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        const next = maxNum + 1;
        if (next > 999) { alert('库存编码超过 999'); return null; }
        return parentCode + '/' + String(next).padStart(3, '0');
    }

    function statusColor(status) {
        if (status === '待售') return '#f59e0b';
        if (status === '在售') return '#22c55e';
        if (status === '售出') return '#94a3b8';
        return '#94a3b8';
    }

    function renderNode(code, node, depth) {
        const hasChildren = node.children && Object.keys(node.children).length > 0;
        const hasItems = node.items && node.items.length > 0;
        const unified = node.unified !== false;
        const badge = unified ? '统一' : '不统一';
        const badgeColor = unified ? '#dbeafe' : '#fef3c7';
        const status = node.status || '在售';
        const statusColorClass = statusColor(status);

        let childrenHtml = '';
        if (hasChildren) {
            const childKeys = Object.keys(node.children).sort();
            childrenHtml = childKeys.map(c => renderNode(c, node.children[c], depth + 1)).join('');
        }

        let itemsHtml = '';
        if (hasItems) {
            itemsHtml = `<table class="items-table">
                <thead><tr><th>库存编码</th><th>名称</th><th>成本</th><th>快递单号</th><th>订单号</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                    ${node.items.map((item, idx) => `
                        <tr>
                            <td>${item.code}</td>
                            <td>${item.name || ''}</td>
                            <td>${item.cost !== undefined ? item.cost : ''}</td>
                            <td>${item.trackingNumber || ''}</td>
                            <td>${item.orderNumber || ''}</td>
                            <td><span style="background:${statusColor(item.status || '在售')};color:white;padding:0 6px;border-radius:12px;font-size:11px;">${item.status || '在售'}</span></td>
                            <td class="actions">
                                <button class="btn btn-primary btn-sm" onclick="editItem('${code}','${item.code}')">编辑</button>
                                <button class="btn btn-primary btn-sm" onclick="printItemLabel('${code}','${item.code}')">🖨️打印标签</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem('${code}','${item.code}')">删除</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
        }

        const actions = `
            <button class="btn btn-secondary btn-sm" onclick="openNodeModal('edit','${code}')">编辑</button>
            ${unified ? `<button class="btn btn-secondary btn-sm" onclick="openNodeModal('add','','${code}')">添加子类</button>` :
                        `<button class="btn btn-success btn-sm" onclick="openItemModal('add','${code}')">添加库存</button>`}
            <button class="btn btn-primary btn-sm" onclick="printNodeLabel('${code}')">🖨️打印标签</button>
            <button class="btn btn-danger btn-sm" onclick="deleteNode('${code}')">删除</button>
        `;

        const toggleIcon = (hasChildren || hasItems) ?
            `<span class="toggle" onclick="toggleNode('${code}')">▼</span>` : '';

        const orderInfo = node.orderNumber ? `📋${node.orderNumber}` : '';
        const statusInfo = `<span class="status-badge" style="background:${statusColor(status)};">${status}</span>`;

        return `
            <div class="tree-node" data-code="${code}" data-depth="${depth}">
                <div class="node-content">
                    ${toggleIcon}
                    <span class="name" onclick="toggleNode('${code}')">${node.name || code}</span>
                    <span class="code">${code}</span>
                    <span class="badge" style="background:${badgeColor};">${badge}</span>
                    ${orderInfo ? `<span class="badge" style="background:#e0e7ff;">${orderInfo}</span>` : ''}
                    ${statusInfo}
                    <span class="actions">${actions}</span>
                </div>
                ${hasChildren ? `<div class="children">${childrenHtml}</div>` : ''}
                ${hasItems ? `<div class="children">${itemsHtml}</div>` : ''}
            </div>
        `;
    }

    function buildTreeHtml() {
        const products = gistData.products || {};
        const codes = Object.keys(products).sort();
        if (codes.length === 0) return '<p style="color:#94a3b8;">暂无商品，请添加大类</p>';
        return codes.map(code => renderNode(code, products[code], 0)).join('');
    }

    function renderTree() {
        const filter = filterSelect.value;
        const searchTerm = searchInput.value.trim().toLowerCase();
        let fullHtml = buildTreeHtml();
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = fullHtml;
        if (filter !== 'all') {
            const rootNodes = tempDiv.querySelectorAll('.tree-node[data-depth="0"]');
            rootNodes.forEach(node => {
                const code = node.dataset.code;
                if (code !== filter) {
                    node.style.display = 'none';
                } else {
                    node.classList.add('expanded');
                    const allChildren = node.querySelectorAll('.tree-node');
                    allChildren.forEach(c => c.style.display = '');
                    allChildren.forEach(c => c.classList.add('expanded'));
                }
            });
        } else {
            tempDiv.querySelectorAll('.tree-node').forEach(n => n.classList.add('expanded'));
        }
        if (searchTerm) {
            const allNodes = tempDiv.querySelectorAll('.tree-node');
            allNodes.forEach(node => {
                const name = node.querySelector('.name')?.textContent?.toLowerCase() || '';
                const code = node.dataset.code?.toLowerCase() || '';
                if (name.includes(searchTerm) || code.includes(searchTerm)) {
                    node.style.display = '';
                    let parent = node.parentElement.closest('.tree-node');
                    while (parent) {
                        parent.classList.add('expanded');
                        parent.style.display = '';
                        parent = parent.parentElement.closest('.tree-node');
                    }
                } else {
                    const hasMatch = node.querySelector('.tree-node') &&
                        Array.from(node.querySelectorAll('.tree-node')).some(child => child.style.display !== 'none');
                    if (!hasMatch) {
                        node.style.display = 'none';
                    }
                }
            });
        }
        treeContainer.innerHTML = tempDiv.innerHTML;
    }

    window.toggleNode = function(code) {
        const el = document.querySelector(`.tree-node[data-code="${code}"]`);
        if (el) el.classList.toggle('expanded');
    };

    function populateFilter() {
        const products = gistData.products || {};
        const codes = Object.keys(products).sort();
        filterSelect.innerHTML = '<option value="all">全部展开</option>';
        codes.forEach(code => {
            const name = products[code].name || code;
            filterSelect.innerHTML += `<option value="${code}">${name} (${code})</option>`;
        });
    }

    function openNodeModal(mode, code, parentCode) {
        if (mode === 'add') {
            modalNodeMode.value = 'add';
            modalNodeParent.value = parentCode || '';
            modalNodeTitle.textContent = parentCode ? '添加子类' : '添加大类';
            let defaultCode = parentCode ? generateChildCode(parentCode) : generateRootCode();
            modalNodeCode.value = defaultCode || '';
            modalNodeName.value = '';
            modalNodeUnified.value = 'true';
            modalNodeCost.value = '';
            modalNodeTracking.value = '';
            modalNodeOrder.value = '';
            modalNodeStatus.value = '在售';
            modalNodeQrlinks.value = '';
            modalNodeRemark.value = '';
            modalNodeOriginalCode.value = '';
        } else {
            const node = findNodeByCode(code);
            if (!node) { alert('节点不存在'); return; }
            modalNodeMode.value = 'edit';
            modalNodeOriginalCode.value = code;
            modalNodeParent.value = '';
            modalNodeTitle.textContent = '编辑节点';
            modalNodeCode.value = code;
            modalNodeName.value = node.name || '';
            modalNodeUnified.value = node.unified !== false ? 'true' : 'false';
            modalNodeCost.value = node.cost !== undefined ? node.cost : '';
            modalNodeTracking.value = node.trackingNumber || '';
            modalNodeOrder.value = node.orderNumber || '';
            modalNodeStatus.value = node.status || '在售';
            modalNodeQrlinks.value = (node.qrLinks && node.qrLinks.length) ? node.qrLinks.join(', ') : '';
            modalNodeRemark.value = node.remark || '';
        }
        modalNodeOverlay.classList.add('active');
    }

    async function saveNode() {
        const mode = modalNodeMode.value;
        let code = modalNodeCode.value.trim();
        const name = modalNodeName.value.trim();
        if (!name) { alert('名称不能为空'); return; }
        const unified = modalNodeUnified.value === 'true';
        const cost = parseFloat(modalNodeCost.value);
        const tracking = modalNodeTracking.value.trim();
        const order = modalNodeOrder.value.trim();
        const status = modalNodeStatus.value;
        const qrlinksRaw = modalNodeQrlinks.value;
        const qrLinks = qrlinksRaw.split(/[,，\n]+/).map(s => s.trim()).filter(s => s);
        const remark = modalNodeRemark.value.trim();

        if (!code) {
            if (mode === 'add') {
                const parentCode = modalNodeParent.value;
                code = parentCode ? generateChildCode(parentCode) : generateRootCode();
                if (!code) { alert('编码生成失败'); return; }
            } else {
                alert('编码不能为空');
                return;
            }
        }

        const originalCode = modalNodeOriginalCode.value;

        if (mode === 'add') {
            if (findNodeByCode(code)) { alert('编码已存在，请修改'); return; }
            const newNode = {
                name: name,
                unified: unified,
                children: {},
                cost: isNaN(cost) ? undefined : cost,
                trackingNumber: tracking || undefined,
                orderNumber: order || undefined,
                status: status,
                qrLinks: qrLinks.length ? qrLinks : undefined,
                remark: remark || undefined
            };
            const parentCode = modalNodeParent.value;
            if (!parentCode) {
                gistData.products[code] = newNode;
            } else {
                const parent = findNodeByCode(parentCode);
                if (parent) {
                    if (!parent.children) parent.children = {};
                    parent.children[code] = newNode;
                } else {
                    alert('父节点不存在');
                    return;
                }
            }
        } else {
            const node = findNodeByCode(originalCode);
            if (!node) { alert('节点不存在'); return; }
            node.name = name;
            node.unified = unified;
            node.cost = isNaN(cost) ? undefined : cost;
            node.trackingNumber = tracking || undefined;
            node.orderNumber = order || undefined;
            node.status = status;
            node.qrLinks = qrLinks.length ? qrLinks : undefined;
            node.remark = remark || undefined;
            if (code !== originalCode) {
                if (findNodeByCode(code)) { alert('新编码已被占用，请修改'); return; }
                const parent = findParentNode(originalCode);
                if (parent) {
                    delete parent.children[originalCode];
                    parent.children[code] = node;
                } else if (gistData.products[originalCode]) {
                    delete gistData.products[originalCode];
                    gistData.products[code] = node;
                } else {
                    alert('未找到父节点');
                    return;
                }
                if (node.children && Object.keys(node.children).length > 0) {
                    alert('⚠️ 编码已更改，但子节点编码未自动更新，请手动调整子节点编码以避免数据混乱。');
                }
            }
        }
        const success = await saveData();
        if (success) {
            modalNodeOverlay.classList.remove('active');
            renderTree();
            populateFilter();
        }
    }

    async function deleteNode(code) {
        if (!confirm(`确定删除节点 "${code}" 及其所有子项/库存吗？`)) return;
        const parent = findParentNode(code);
        if (parent) {
            delete parent.children[code];
        } else if (gistData.products[code]) {
            delete gistData.products[code];
        } else {
            alert('节点不存在');
            return;
        }
        const success = await saveData();
        if (success) {
            renderTree();
            populateFilter();
        }
    }

    window.openNodeModal = openNodeModal;
    window.deleteNode = deleteNode;
    modalNodeSave.addEventListener('click', saveNode);
    modalNodeCancel.addEventListener('click', () => modalNodeOverlay.classList.remove('active'));

    function openItemModal(mode, parentCode, itemCode) {
        modalItemParentCode.value = parentCode;
        if (mode === 'add') {
            modalItemTitle.textContent = '添加库存';
            let defaultCode = generateItemCode(parentCode);
            modalItemCode.value = defaultCode || '';
            modalItemName.value = '';
            modalItemCost.value = '';
            modalItemTracking.value = '';
            modalItemOrder.value = '';
            modalItemStatus.value = '在售';
            modalItemQrlinks.value = '';
            modalItemRemark.value = '';
            modalItemOriginalCode.value = '';
        } else {
            const parent = findNodeByCode(parentCode);
            if (!parent || !parent.items) { alert('库存不存在'); return; }
            const item = parent.items.find(it => it.code === itemCode);
            if (!item) { alert('库存项不存在'); return; }
            modalItemTitle.textContent = '编辑库存';
            modalItemCode.value = item.code;
            modalItemName.value = item.name || '';
            modalItemCost.value = item.cost !== undefined ? item.cost : '';
            modalItemTracking.value = item.trackingNumber || '';
            modalItemOrder.value = item.orderNumber || '';
            modalItemStatus.value = item.status || '在售';
            modalItemQrlinks.value = (item.qrLinks && item.qrLinks.length) ? item.qrLinks.join(', ') : '';
            modalItemRemark.value = item.remark || '';
            modalItemOriginalCode.value = itemCode;
        }
        modalItemOverlay.classList.add('active');
    }

    async function saveItem() {
        const parentCode = modalItemParentCode.value;
        const parent = findNodeByCode(parentCode);
        if (!parent) { alert('父节点不存在'); return; }
        if (!parent.items) parent.items = [];

        let code = modalItemCode.value.trim();
        if (!code) {
            code = generateItemCode(parentCode);
            if (!code) { alert('编码生成失败'); return; }
        }
        const name = modalItemName.value.trim();
        const cost = parseFloat(modalItemCost.value);
        const tracking = modalItemTracking.value.trim();
        const order = modalItemOrder.value.trim();
        const status = modalItemStatus.value;
        const qrlinksRaw = modalItemQrlinks.value;
        const qrLinks = qrlinksRaw.split(/[,，\n]+/).map(s => s.trim()).filter(s => s);
        const remark = modalItemRemark.value.trim();

        const originalCode = modalItemOriginalCode.value;
        const exists = parent.items.some(it => it.code === code && it.code !== originalCode);
        if (exists) { alert('编码已存在'); return; }

        const itemData = {
            code: code,
            name: name || undefined,
            cost: isNaN(cost) ? undefined : cost,
            trackingNumber: tracking || undefined,
            orderNumber: order || undefined,
            status: status,
            qrLinks: qrLinks.length ? qrLinks : undefined,
            remark: remark || undefined
        };

        if (originalCode) {
            const idx = parent.items.findIndex(it => it.code === originalCode);
            if (idx === -1) { alert('库存项不存在'); return; }
            parent.items[idx] = itemData;
        } else {
            parent.items.push(itemData);
        }
        const success = await saveData();
        if (success) {
            modalItemOverlay.classList.remove('active');
            renderTree();
        }
    }

    async function deleteItem(parentCode, itemCode) {
        if (!confirm(`确定删除库存 "${itemCode}" 吗？`)) return;
        const parent = findNodeByCode(parentCode);
        if (!parent || !parent.items) { alert('库存不存在'); return; }
        const idx = parent.items.findIndex(it => it.code === itemCode);
        if (idx === -1) { alert('库存项不存在'); return; }
        parent.items.splice(idx, 1);
        const success = await saveData();
        if (success) renderTree();
    }

    window.openItemModal = openItemModal;
    window.editItem = function(parentCode, itemCode) { openItemModal('edit', parentCode, itemCode); };
    window.deleteItem = deleteItem;
    modalItemSave.addEventListener('click', saveItem);
    modalItemCancel.addEventListener('click', () => modalItemOverlay.classList.remove('active'));

    searchBtn.addEventListener('click', renderTree);
    clearSearchBtn.addEventListener('click', function() {
        searchInput.value = '';
        renderTree();
    });
    searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') renderTree(); });
    filterSelect.addEventListener('change', renderTree);

    async function performLogin() {
        const token = loginToken.value.trim();
        const gistId = loginGistId.value.trim();
        const filename = loginFilename.value.trim() || 'data.json';
        if (!token || !gistId) {
            loginError.textContent = '请填写 Token 和 Gist ID';
            return;
        }
        loginError.textContent = '';
        try {
            const data = await getGistContent(token, gistId, filename);
            if (!data.products) data.products = {};
            localStorage.setItem(STORAGE_KEYS.TOKEN, token);
            localStorage.setItem(STORAGE_KEYS.GIST_ID, gistId);
            localStorage.setItem(STORAGE_KEYS.FILENAME, filename);
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            gistData = data;
            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            userStatus.textContent = `已连接 (${gistId})`;
            renderTree();
            populateFilter();
        } catch (e) {
            loginError.textContent = `登录失败: ${e.message}`;
        }
    }

    function logout() {
        localStorage.removeItem(STORAGE_KEYS.TOKEN);
        localStorage.removeItem(STORAGE_KEYS.GIST_ID);
        localStorage.removeItem(STORAGE_KEYS.FILENAME);
        currentToken = '';
        currentGistId = '';
        currentFilename = 'data.json';
        gistData = { products: {} };
        appContainer.style.display = 'none';
        loginOverlay.classList.add('active');
        loginError.textContent = '';
        loginToken.value = '';
        loginGistId.value = 'f13d97c430522e4851afbf3cd2331e14';
        loginFilename.value = 'data.json';
    }

    loginBtn.addEventListener('click', performLogin);
    document.querySelectorAll('#login-token, #login-gistid, #login-filename').forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') performLogin(); });
    });
    logoutBtn.addEventListener('click', logout);
    refreshBtn.addEventListener('click', loadData);
    addRootBtn.addEventListener('click', () => openNodeModal('add', '', ''));

    function autoLogin() {
        const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
        const gistId = localStorage.getItem(STORAGE_KEYS.GIST_ID);
        const filename = localStorage.getItem(STORAGE_KEYS.FILENAME) || 'data.json';
        if (token && gistId) {
            loginToken.value = token;
            loginGistId.value = gistId;
            loginFilename.value = filename;
            performLogin();
        } else {
            loginOverlay.classList.add('active');
            appContainer.style.display = 'none';
        }
    }
    autoLogin();

    // ========== 标签打印功能 ==========
    const PRESET_TEMPLATE = {
        name: '商品标签（50×30）',
        paperWidth: 50,
        paperHeight: 30,
        elements: [
            {
                type: 'text',
                field: 'code',
                x: 0,
                y: 3.5,
                width: 50,
                height: 6,
                fontSize: 12,
                fontName: '黑体',
                bold: true,
                align: 'center',
                prefix: '内部编码: '
            },
            {
                type: 'text',
                field: 'static',
                text: '仅供内部查询使用',
                x: 0,
                y: 10,
                width: 50,
                height: 5,
                fontSize: 9,
                fontName: '黑体',
                bold: true,
                align: 'center'
            },
            {
                type: 'barcode',
                field: 'code',
                x: (50 - 43) / 2,
                y: 15.3,
                width: 43,
                height: 10,
                barcodeType: 'PDF417',   // 使用字符串形式
                align: 'center'
            }
        ]
    };

    function getLodopInstance() {
        if (typeof getLodop === 'function') {
            return getLodop();
        } else {
            if (window.LODOP) return window.LODOP;
            if (window.getLodop) return window.getLodop;
            alert('打印服务未加载，请确保已安装 C-Lodop 并刷新页面。\n' +
                  '如果已安装，请检查服务是否运行（访问 http://localhost:8000/CLodopFuncs.js 测试）。\n' +
                  '如果网站是 HTTPS，请先手动信任证书：在浏览器中打开 https://localhost.lodop.net:8443/CLodopFuncs.js 并点击"高级"->"继续前往"。');
            return null;
        }
    }

    function printWithTemplate(template, data) {
        const LODOP = getLodopInstance();
        if (!LODOP) return;

        try {
            LODOP.PRINT_INIT(template.name || '标签打印');
            LODOP.SET_PRINT_PAGESIZE(1, template.paperWidth * 10, template.paperHeight * 10, '');

            template.elements.forEach((el, idx) => {
                let value = '';
                if (el.field === 'static') {
                    value = el.text || '';
                } else {
                    value = data[el.field] !== undefined ? data[el.field] : '';
                }
                if (el.prefix && value) {
                    value = el.prefix + value;
                }

                if (el.type === 'text') {
                    LODOP.ADD_PRINT_TEXT(el.y, el.x, el.width, el.height, value);
                    if (el.fontSize) LODOP.SET_PRINT_STYLEA(idx + 1, "FontSize", el.fontSize);
                    if (el.fontName) LODOP.SET_PRINT_STYLEA(idx + 1, "FontName", el.fontName);
                    if (el.bold) LODOP.SET_PRINT_STYLEA(idx + 1, "Bold", 1);
                    if (el.align === 'center') {
                        LODOP.SET_PRINT_STYLEA(idx + 1, "Alignment", 2);
                    }
                } else if (el.type === 'barcode') {
                    LODOP.ADD_PRINT_BARCODE(el.y, el.x, el.width, el.height, el.barcodeType, value);
                }
            });

            LODOP.PREVIEW();
        } catch (e) {
            alert('打印出错: ' + e.message);
            console.error(e);
        }
    }

    window.printNodeLabel = function(code) {
        const node = findNodeByCode(code);
        if (!node) { alert('节点不存在'); return; }
        const data = {
            code: code,
            name: node.name || '',
            cost: node.cost,
            orderNumber: node.orderNumber,
            trackingNumber: node.trackingNumber,
            qrLinks: node.qrLinks
        };
        printWithTemplate(PRESET_TEMPLATE, data);
    };

    window.printItemLabel = function(parentCode, itemCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) { alert('父节点不存在'); return; }
        const item = parent.items ? parent.items.find(it => it.code === itemCode) : null;
        if (!item) { alert('库存项不存在'); return; }
        const data = {
            code: itemCode,
            name: item.name || parent.name || '',
            cost: item.cost,
            orderNumber: item.orderNumber,
            trackingNumber: item.trackingNumber,
            qrLinks: item.qrLinks
        };
        printWithTemplate(PRESET_TEMPLATE, data);
    };

    console.log('管理后台已加载（带标签打印）');
</script>
</body>
