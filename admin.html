<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品管理后台（带标签打印）</title>
    <link rel="icon" href="data:," />
    <style>
        /* ===== 全局重置与变量 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #4f46e5;
            --color-primary-light: #818cf8;
            --color-primary-dark: #4338ca;
            --color-success: #10b981;
            --color-success-light: #34d399;
            --color-danger: #f43f5e;
            --color-danger-light: #fb7185;
            --color-warning: #f59e0b;
            --color-gray-50: #f8fafc;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-400: #94a3b8;
            --color-gray-500: #64748b;
            --color-gray-600: #475569;
            --color-gray-700: #334155;
            --color-gray-800: #1e293b;
            --color-gray-900: #0f172a;
            --radius: 16px;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f1f5f9 0%, #e9eef3 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--color-gray-800);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-gray-100);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-gray-300);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-gray-400);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            position: relative;
            z-index: 900;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .top-bar h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .top-bar .sub {
            font-size: 14px;
            color: var(--color-gray-500);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-bar .sub #lodop-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            transition: var(--transition);
        }
        .top-bar .sub #lodop-status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .top-bar .sub #lodop-status.error {
            background: #fce4ec;
            color: #b91c1c;
        }

        .top-bar .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 按钮系统 ===== */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
            background: var(--color-gray-100);
            color: var(--color-gray-700);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        .btn:active {
            transform: translateY(0px) scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
        }

        .btn-success {
            background: linear-gradient(135deg, var(--color-success), #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669, var(--color-success));
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--color-danger), #e11d48);
            color: #fff;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
            background: linear-gradient(135deg, #e11d48, var(--color-danger));
        }

        .btn-secondary {
            background: var(--color-gray-200);
            color: var(--color-gray-700);
        }
        .btn-secondary:hover {
            background: var(--color-gray-300);
        }

        .btn-sm {
            padding: 2px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
            transform: none;
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow-card);
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.5);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 8px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            transition: var(--transition);
            outline: none;
            color: var(--color-gray-800);
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* ===== 树形结构 ===== */
        .tree-container {
            padding: 4px 0;
        }
        .tree-node {
            margin-left: 0;
            padding-left: 0;
            border-left: none;
            position: relative;
        }
        .tree-node .node-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--color-gray-50);
            margin-bottom: 4px;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }
        .tree-node .node-content:hover {
            background: #fff;
            border-left-color: var(--color-primary-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .tree-node .node-content .name {
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .tree-node .node-content .code {
            color: var(--color-gray-500);
            font-size: 12px;
            background: var(--color-gray-200);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .tree-node .node-content .badge {
            font-size: 11px;
            background: #e0e7ff;
            color: var(--color-primary-dark);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .tree-node .node-content .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .tree-node .node-content .toggle {
            cursor: pointer;
            font-size: 12px;
            color: var(--color-gray-400);
            transition: var(--transition);
            display: inline-block;
            width: 20px;
            text-align: center;
        }
        .tree-node .node-content .toggle:hover {
            color: var(--color-primary);
        }
        .tree-node .children {
            display: none;
            margin-left: 24px;
            padding-left: 16px;
            border-left: 2px dashed var(--color-gray-200);
        }
        .tree-node.expanded > .children {
            display: block;
            margin-top: 6px;
        }
        .tree-node.tree-node-hidden { display: none; }

        /* ===== 表格 ===== */
        .items-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            margin-top: 12px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .items-table th {
            background: var(--color-gray-50);
            color: var(--color-gray-600);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--color-gray-200);
            font-size: 12px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--color-gray-100);
            vertical-align: middle;
            background: #fff;
            transition: var(--transition);
        }
        .items-table tr:hover td {
            background: var(--color-gray-50);
        }
        .items-table .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .items-table .status-badge {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.待售 { background: #fef3c7; color: #92400e; }
        .status-badge.在售 { background: #d1fae5; color: #065f46; }
        .status-badge.售出 { background: #e2e8f0; color: #475569; }

        /* ===== 批量操作栏 ===== */
        .batch-actions {
            display: flex;
            gap: 8px;
            margin: 8px 0 12px 0;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes scaleIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal h3 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 20px;
        }
        .modal label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            margin-top: 4px;
            transition: var(--transition);
            background: #fff;
            color: var(--color-gray-800);
        }
        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .modal .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
            align-items: center;
        }
        .modal .save-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--color-success);
            flex: 1;
        }

        /* ===== 登录页 ===== */
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        #login-overlay.active {
            display: flex;
        }
        #login-overlay::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            pointer-events: none;
        }
        #login-overlay::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.10) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            pointer-events: none;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.1);
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .login-box h2 {
            margin-top: 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 6px;
        }
        .login-box .subtitle {
            color: var(--color-gray-500);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            margin-top: 4px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        .login-box input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .login-box .btn-group {
            margin-top: 24px;
            justify-content: flex-end;
        }
        #login-error {
            color: var(--color-danger);
            margin-top: 12px;
            font-size: 14px;
        }

        /* ===== 打印预览 ===== */
        #print-preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
        }
        #print-preview-overlay.active {
            display: flex;
        }
        .print-preview-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .print-preview-box h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .print-info {
            background: var(--color-gray-50);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .print-info p {
            margin: 4px 0;
        }
        .print-settings label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .print-settings select,
        .print-settings input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            margin-top: 4px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        .print-settings select:focus,
        .print-settings input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .template-select-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
        }
        .template-card {
            border: 2px solid var(--color-gray-200);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            background: #fff;
        }
        .template-card:hover {
            border-color: var(--color-primary-light);
            transform: translateY(-2px);
        }
        .template-card.selected {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .template-card canvas {
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }
        .template-card .template-name {
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray-700);
        }
        #inner-preview-container {
            width: 100%;
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--color-gray-200);
            border-radius: 12px;
            background: var(--color-gray-50);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }
        #inner-preview-container canvas {
            border: 1px solid var(--color-gray-300);
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* ===== 加载动画 & 刷新按钮 ===== */
        .refresh-btn .refresh-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
        .refresh-btn .refresh-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }
        .refresh-btn.loading .refresh-icon svg {
            animation: spin-arrow 0.9s linear infinite;
        }
        @keyframes spin-arrow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--color-gray-200);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 选中状态 ===== */
        .item-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--color-primary);
            cursor: pointer;
        }

        /* ===== 状态徽章（统一词表：待售/在售/售出） ===== */
        .status-badge.status-pending { background: #fef3c7; color: #92400e; }
        .status-badge.status-onsale { background: #d1fae5; color: #065f46; }
        .status-badge.status-sold { background: #e2e8f0; color: #475569; }
        .status-badge.status-unknown { background: #fee2e2; color: #991b1b; }

        /* ===== 顶栏同步信息 ===== */
        .sync-meta {
            font-size: 12px;
            color: var(--color-gray-500);
            white-space: nowrap;
        }

        /* ===== 严格加载错误遮罩 ===== */
        #load-error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        #load-error-overlay.active { display: flex; }
        .load-error-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .load-error-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 14px;
        }
        .load-error-code {
            display: inline-block;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            border-radius: 20px;
            padding: 2px 10px;
            margin-bottom: 12px;
        }
        #load-error-message {
            font-size: 14px;
            line-height: 1.7;
            color: var(--color-danger);
            word-break: break-word;
        }
        #load-error-hint {
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--color-gray-500);
        }
        .load-error-box .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* ===== 冲突处理弹窗 ===== */
        #conflict-overlay { z-index: 1300; }
        #conflict-overlay .modal { max-width: 720px; }
        #conflict-summary {
            font-size: 13px;
            line-height: 1.7;
            color: var(--color-gray-600);
            margin-bottom: 4px;
        }
        .conflict-list {
            max-height: 46vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0;
            padding-right: 4px;
        }
        .conflict-item {
            border: 1px solid var(--color-gray-200);
            border-radius: 10px;
            background: var(--color-gray-50);
            padding: 10px 12px;
        }
        .conflict-head {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .conflict-target {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray-800);
            word-break: break-all;
        }
        .conflict-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .conflict-choice {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 8px;
            background: #fff;
            font-size: 12px;
            cursor: pointer;
            margin-top: 0;
            font-weight: 500;
            color: var(--color-gray-700);
        }
        .conflict-choice input { margin-right: 4px; }
        .conflict-choice .value {
            font-size: 13px;
            color: var(--color-gray-900);
            word-break: break-all;
            line-height: 1.5;
        }
        .conflict-choice:has(input:checked) {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        /* ===== 删除二次确认弹窗 ===== */
        #delete-confirm-overlay { z-index: 1300; }
        #delete-confirm-overlay .modal { max-width: 540px; }
        .delete-warn {
            background: #fef2f2;
            border-left: 4px solid var(--color-danger);
            border-radius: 8px;
            padding: 12px 14px;
            color: #7f1d1d;
            font-size: 13px;
            line-height: 1.7;
            margin: 12px 0;
            white-space: pre-line;
            word-break: break-word;
        }
        .delete-code {
            font-family: ui-monospace, Consolas, monospace;
            background: var(--color-gray-100);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 13px;
            word-break: break-all;
        }
        #delete-confirm-status {
            min-height: 20px;
            font-size: 13px;
            color: var(--color-danger);
            margin-top: 10px;
        }
        .batch-status-note {
            font-size: 13px;
            line-height: 1.7;
            color: var(--color-gray-600);
            margin-top: 10px;
        }

        /* ===== 数据菜单（右侧下拉） ===== */
        .data-menu-wrap {
            position: relative;
        }
        .data-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 210px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
            border: 1px solid var(--color-gray-200);
            padding: 6px;
            z-index: 1200;
        }
        .data-menu.open { display: block; }
        .data-menu button {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-gray-700);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
        }
        .data-menu button:hover { background: var(--color-gray-100); }
        .data-menu button:disabled { opacity: 0.5; cursor: not-allowed; }
        .data-menu .menu-sep { height: 1px; margin: 4px 8px; background: var(--color-gray-200); }
        .data-menu .recycle-badge {
            margin-left: auto;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: var(--color-danger);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            line-height: 18px;
            text-align: center;
        }

        /* ===== 记住登录 ===== */
        .login-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray-700);
            cursor: pointer;
        }
        .login-remember input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--color-primary);
        }
        .login-note {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--color-gray-500);
        }

        /* ===== 数据工具弹窗（导入/体检/历史/快照/回收站共用） ===== */
        .modal.modal-wide { max-width: 880px; }
        .data-note {
            font-size: 13px;
            line-height: 1.7;
            color: var(--color-gray-600);
            background: var(--color-gray-50);
            border-radius: 10px;
            padding: 10px 14px;
            margin: 10px 0;
            white-space: pre-line;
            word-break: break-word;
        }
        .data-stat {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .data-stat .item {
            flex: 1;
            min-width: 110px;
            background: var(--color-gray-50);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 12px;
            color: var(--color-gray-500);
        }
        .data-stat .item strong {
            display: block;
            font-size: 18px;
            color: var(--color-gray-900);
            margin-bottom: 2px;
        }
        .data-list {
            max-height: 46vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
            padding-right: 4px;
        }
        .data-row {
            border: 1px solid var(--color-gray-200);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .data-row .row-main { flex: 1; min-width: 220px; }
        .data-row .row-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--color-gray-800);
            word-break: break-all;
        }
        .data-row .row-sub {
            font-size: 12px;
            color: var(--color-gray-500);
            margin-top: 3px;
            word-break: break-all;
        }
        .data-row .row-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .data-list .issue {
            font-size: 12px;
            line-height: 1.7;
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
        }
        .data-list .issue.error { background: #fef2f2; color: #991b1b; }
        .data-list .issue.warning { background: #fffbeb; color: #92400e; }
        .data-empty {
            padding: 24px;
            text-align: center;
            color: var(--color-gray-400);
            font-size: 13px;
        }
        .data-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        /* ===== 编码自定义开关 ===== */
        .code-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-gray-600);
            cursor: pointer;
        }
        .code-toggle input {
            width: 14px;
            height: 14px;
            margin: 0;
            accent-color: var(--color-primary);
        }
        .code-hint {
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--color-gray-500);
            word-break: break-word;
        }
        .modal input[readonly] {
            background: var(--color-gray-50);
            color: var(--color-gray-500);
            cursor: not-allowed;
        }

        /* ===== 通用二次确认弹窗 ===== */
        #confirm-overlay { z-index: 1350; }
        #confirm-overlay .modal { max-width: 580px; }
        #confirm-message {
            font-size: 13px;
            line-height: 1.8;
            color: var(--color-gray-700);
            white-space: pre-line;
            word-break: break-word;
        }
        #confirm-status {
            min-height: 18px;
            font-size: 13px;
            color: var(--color-danger);
            margin-top: 8px;
        }
        .confirm-require { margin-top: 12px; }

        /* ===== 搜索高亮 ===== */
        #tree-container mark {
            background: #fef08a;
            color: #713f12;
            padding: 0 1px;
            border-radius: 3px;
        }

        /* ===== 汇总条 / 节点行汇总 ===== */
        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .summary-chip {
            font-size: 12px;
            color: var(--color-gray-600);
            background: var(--color-gray-100);
            border-radius: 20px;
            padding: 3px 12px;
            white-space: nowrap;
        }
        .summary-chip b {
            color: var(--color-gray-900);
            font-size: 13px;
            margin-left: 2px;
        }
        .summary-chip.sold { background: #e2e8f0; color: #475569; }
        .summary-chip.onsale { background: #d1fae5; color: #065f46; }
        .summary-chip.pending { background: #fef3c7; color: #92400e; }
        .node-summary {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 11px;
            color: var(--color-gray-500);
        }
        .node-summary span {
            background: #f1f5f9;
            border-radius: 14px;
            padding: 1px 9px;
            white-space: nowrap;
        }
        .node-summary span.onsale { background: #ecfdf5; color: #047857; }
        .node-summary span.sold { background: #f1f5f9; color: #475569; }
        .node-summary span.pending { background: #fffbeb; color: #b45309; }

        /* ===== 批量选择条 ===== */
        .batch-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 0 12px 0;
            padding: 8px 12px;
            background: var(--color-gray-50);
            border-radius: 10px;
            font-size: 13px;
            color: var(--color-gray-600);
        }
        .global-select {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .global-select input {
            width: 16px;
            height: 16px;
            accent-color: var(--color-primary);
            margin: 0;
        }
        #global-selected-count { color: var(--color-gray-500); }

        /* ===== 表格横向滚动容器 ===== */
        .table-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 12px;
            border-radius: 12px;
        }
        .table-scroll .items-table { margin-top: 0; }

        /* ===== 可排序表头 ===== */
        .items-table th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .items-table th.sortable:hover { color: var(--color-primary-dark); }
        .items-table th.sort-asc,
        .items-table th.sort-desc { color: var(--color-primary-dark); background: #eef2ff; }

        /* ===== 备注 / 链接 / 复制编码 ===== */
        .item-remark { font-size: 12px; color: var(--color-gray-500); max-width: 140px; }
        .item-remark .remark-text { display: inline-block; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
        .qr-count {
            font-size: 11px;
            background: #e0e7ff;
            color: var(--color-primary-dark);
            border-radius: 12px;
            padding: 1px 7px;
            white-space: nowrap;
        }

        /* ===== 树级保存遮罩 ===== */
        .tree-saving-mask {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(248, 250, 252, 0.72);
            backdrop-filter: blur(1.5px);
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--color-gray-600);
        }
        .tree-saving-mask.active { display: flex; }

        /* ===== 页脚 ===== */
        .app-footer {
            text-align: center;
            font-size: 12px;
            color: var(--color-gray-400);
            padding: 8px 0 24px;
            line-height: 1.7;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--color-gray-400);
        }
        .empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; line-height: 1.8; }

        /* ===== 响应式微调 ===== */
        @media (max-width: 768px) {
            .conflict-values { grid-template-columns: 1fr; }
            .sync-meta { font-size: 11px; }
            .load-error-box { padding: 24px 20px; }
            body { padding: 12px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .top-bar .actions { justify-content: flex-start; }
            .modal { padding: 20px; }
            .print-preview-box { padding: 20px; }
            .tree-node .node-content { flex-wrap: wrap; }
            .tree-node .node-content .actions { margin-left: 0; width: 100%; }
            .items-table { font-size: 12px; }
            .items-table th, .items-table td { padding: 8px 10px; }
            .items-table { min-width: 760px; }
            .table-scroll { margin-left: -4px; margin-right: -4px; }
            #app-container .btn,
            #app-container button {
                min-height: 44px;
                min-width: 44px;
            }
            #app-container .btn-sm {
                min-height: 44px;
                min-width: 44px;
                padding: 8px 12px;
                font-size: 13px;
            }
            #tree-container [data-action] {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 44px;
                min-width: 44px;
            }
            .tree-node .node-content .toggle {
                width: 44px;
                height: 44px;
                line-height: 44px;
                font-size: 16px;
            }
            .tree-node .node-content .name { padding: 8px 2px; word-break: break-word; overflow-wrap: anywhere; }
            .tree-node .node-content .code { word-break: break-all; }
            .tree-node .node-content { min-width: 0; }
            .tree-node .node-content .node-summary { min-width: 0; }
            .top-bar { min-width: 0; }
            .top-bar .actions { min-width: 0; }
            .filter-bar > * { max-width: 100%; }
            .modal-overlay { padding: 0; }
            .modal {
                width: 100%;
                max-width: 100%;
                max-height: 100vh;
                min-height: 100vh;
                border-radius: 0;
                padding: 20px;
            }
            .data-menu { max-width: calc(100vw - 32px); }
            .filter-bar select,
            .filter-bar input { max-width: 100%; }
            .summary-bar { gap: 6px; }
            .summary-chip { font-size: 11px; padding: 2px 9px; }
            .node-summary { width: 100%; }
            .node-summary span { padding: 2px 10px; font-size: 12px; }
            .batch-bar { font-size: 12px; }
            .app-footer { padding-bottom: 32px; }
        }

        /* ===== 通用工具 ===== */
        .flex { display: flex; align-items: center; gap: 8px; }
        .gap-2 { gap: 8px; }
        .ml-auto { margin-left: auto; }
        .text-muted { color: var(--color-gray-500); }
    </style>
</head>
<body>

<!-- 登录遮罩 -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>商品管理</h2>
        <p class="subtitle">登录以同步 GitHub Gist 数据</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <label class="login-remember">
            <input type="checkbox" id="login-remember" checked />
            记住登录（本机）
        </label>
        <p class="login-note">Token 仅保存在本机浏览器（localStorage/sessionStorage），不会上传到任何服务器。</p>
        <div class="btn-group" style="display:flex; gap:12px; margin-top:24px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- 严格加载错误遮罩（只读保护：加载失败时禁止一切写入） -->
<div id="load-error-overlay">
    <div class="load-error-box">
        <h2>数据未加载 · 只读保护</h2>
        <div id="load-error-code" class="load-error-code">错误码：UNKNOWN</div>
        <p id="load-error-message"></p>
        <p id="load-error-hint"></p>
        <div class="btn-group">
            <button type="button" class="btn btn-secondary" id="load-error-login">返回登录</button>
            <button type="button" class="btn btn-primary" id="load-error-retry">重试</button>
        </div>
    </div>
</div>

<!-- 主界面 -->
<div id="app-container" style="display:none;">
    <div class="container">
        <div class="top-bar">
            <div>
                <h1>📦 商品管理</h1>
                <div class="sub">
                    <span id="user-status">已登录</span>
                    <span id="sync-time" class="sync-meta">最后同步：—</span>
                    <span id="data-revision" class="sync-meta">版本：未知</span>
                    <span id="lodop-status">⏳ 检测打印服务…</span>
                </div>
                <div class="summary-bar" id="summary-bar" aria-label="数据汇总">
                    <span class="summary-chip">节点 <b id="sum-nodes">0</b></span>
                    <span class="summary-chip">库存 <b id="sum-items">0</b></span>
                    <span class="summary-chip onsale">在售 <b id="sum-onsale">0</b></span>
                    <span class="summary-chip sold">售出 <b id="sum-sold">0</b></span>
                    <span class="summary-chip pending">待售 <b id="sum-pending">0</b></span>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-success" id="add-root-btn">＋ 添加大类</button>
                <button class="btn btn-secondary refresh-btn" id="refresh-btn">
                    <span class="refresh-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 4v6h6" />
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                        </svg>
                    </span>
                    刷新
                </button>
                <div class="data-menu-wrap">
                    <button class="btn btn-secondary" id="data-menu-btn" type="button">🗄 数据 ▾</button>
                    <div class="data-menu" id="data-menu">
                        <button type="button" data-menu-action="export">⬇️ 导出备份 JSON</button>
                        <button type="button" data-menu-action="import">⬆️ 导入 JSON…</button>
                        <button type="button" data-menu-action="inspect">🩺 数据体检</button>
                        <div class="menu-sep"></div>
                        <button type="button" data-menu-action="history">🕘 历史版本…</button>
                        <button type="button" data-menu-action="snapshots">🧷 恢复本地快照…</button>
                        <button type="button" data-menu-action="recycle">🗑️ 回收站 <span class="recycle-badge" id="recycle-count" style="display:none;"></span></button>
                    </div>
                </div>
                <input type="file" id="import-file" accept=".json,application/json" style="display:none;" />
                <button class="btn btn-danger" id="logout-btn">退出</button>
            </div>
        </div>

        <div class="card">
            <div class="filter-bar">
                <select id="filter-select" aria-label="筛选大类"><option value="all">全部大类</option></select>
                <select id="node-sort-select" aria-label="节点排序">
                    <option value="code-asc">编码 ↑</option>
                    <option value="code-desc">编码 ↓</option>
                    <option value="name-asc">名称 A→Z</option>
                    <option value="name-desc">名称 Z→A</option>
                    <option value="updated-desc">更新时间 ↓</option>
                </select>
                <input type="text" id="search-input" placeholder="搜索编码/名称/单号/备注…" aria-label="搜索商品或库存" />
                <button class="btn btn-secondary" id="search-btn">搜索</button>
                <button class="btn btn-secondary" id="clear-search-btn">清除</button>
                <button class="btn btn-secondary" id="expand-all-btn" type="button">全部展开</button>
                <button class="btn btn-secondary" id="collapse-all-btn" type="button">全部折叠</button>
            </div>
            <div class="batch-bar">
                <label class="global-select"><input type="checkbox" id="global-select-all" /> 全选当前筛选结果</label>
                <span id="global-selected-count">已选 0 项</span>
                <button type="button" class="btn btn-secondary btn-sm" id="global-batch-status-btn">跨节点批量改状态</button>
            </div>
            <div class="card-body-wrap" style="position:relative;">
                <div id="tree-saving-mask" class="tree-saving-mask"><span class="spinner"></span> 保存中…</div>
                <div class="tree-container" id="tree-container">
                    <p style="color:var(--color-gray-400);">加载中…</p>
                </div>
            </div>
        </div>
        <footer class="app-footer">
            <span id="app-version">管理后台</span>
        </footer>
    </div>
</div>

<!-- 模态框：节点编辑/添加 -->
<div class="modal-overlay" id="modal-node-overlay">

<script src="CLodopFuncs.js" onerror="console.warn('本地CLodopFuncs.js加载失败，尝试远程...')"></script>
<script>
    (function() {
        function checkLodop() {
            return (typeof getLodop === 'function') || window.LODOP || window.CLodop;
        }
        if (checkLodop()) {
            console.log('C-Lodop 已加载');
            updateLodopStatus(true);
            return;
        }
        const isHttps = window.location.protocol === 'https:';
        const remoteUrl = isHttps ? 'https://localhost.lodop.net:8443/CLodopFuncs.js' : 'http://localhost:8000/CLodopFuncs.js';
        const script = document.createElement('script');
        script.src = remoteUrl;
        script.onload = function() {
            if (checkLodop()) {
                console.log('C-Lodop 从远程加载成功');
                updateLodopStatus(true);
            } else {
                console.warn('远程加载成功但未找到 LODOP 对象');
                updateLodopStatus(false);
            }
        };
        script.onerror = function() {
            console.error('远程 C-Lodop 加载失败');
            updateLodopStatus(false);
            alert('无法加载 C-Lodop 打印服务。\n请确保已安装 C-Lodop 并运行。\n如果网站是 HTTPS，请先手动信任证书。');
        };
        document.head.appendChild(script);
        setTimeout(function() {
            if (checkLodop()) updateLodopStatus(true);
        }, 3000);
    })();

    function updateLodopStatus(ok) {
        const el = document.getElementById('lodop-status');
        if (el) {
            if (ok) {
                el.textContent = '✅ 打印服务已就绪';
                el.className = 'lodop-status success';
            } else {
                el.textContent = '❌ 打印服务未连接，请安装 C-Lodop 并手动信任证书';
                el.className = 'lodop-status error';
            }
        }
    }

    function waitForLodop(callback, retries) {
        retries = retries || 10;
        if ((typeof getLodop === 'function') || window.LODOP || window.CLodop) {
            callback(true);
            return;
        }
        if (retries <= 0) {
            callback(false);
            return;
        }
        setTimeout(function() {
            waitForLodop(callback, retries - 1);
        }, 500);
    }

    window.addEventListener('load', function() {
        waitForLodop(function(ok) {
            updateLodopStatus(ok);
        });
    });
</script>

function fillStatusSelect(select, selected) {

    STATUS_LIST.forEach(function (s) {
        var opt = document.createElement('option');

    if (STATUS_LIST.indexOf(value) === -1) {
        var legacy = document.createElement('option');
        legacy.value = value;

        select.appendChild(legacy);

    select.value = value;
}

/** 读取/保存后的文档在内存里统一状态词表（兼容历史“已售”） */
function normalizeDoc(doc) {
    if (!doc || !Z.isPlainObject(doc.products)) return;
    Z.walk(doc.products, function (node) {
        if (node.status !== undefined) node.status = Z.normalizeStatus(node.status);
        if (Array.isArray(node.items)) {
            node.items.forEach(function (item) {
                if (item && item.status !== undefined) item.status = Z.normalizeStatus(item.status);
            });
        }
    });
}

    if (!modal) return false;
    var focusables = Array.prototype.filter.call(
        modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'),
        function (el) { return el.offsetParent !== null; }

    if (!focusables.length) return false;

    if (event.shiftKey) {

    }
    return true;
}

        if (byteSize > SNAPSHOT_MAX_BYTES) {

            }

        var stats = countActiveStats(baseDoc);
        list.unshift({
            id: 'snap-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            time: new Date().toISOString(),
            nodes: stats.nodes,
            items: stats.items,

            data: JSON.parse(json)

        while (list.length > SNAPSHOT_MAX) list.pop();
        var saved = writeSnapshots(list);
        while (!saved && list.length > 1) {
            list.pop();
            saved = writeSnapshots(list);
        }
        if (!saved) toast('浏览器本地存储空间不足：自动快照写入失败（不影响远端保存）', { type: 'warn', duration: 6000 });

        parentCode = entry ? entry.parentCode : null;
    }
    if (parentCode) {
        if (!CODE_RE.node.test(code)) return '子节点编码格式应为 A001/B001（可更深层级），当前为“' + code + '”';
        if (code.indexOf(parentCode + '/') !== 0) return '子节点编码必须以父编码「' + parentCode + '/」开头，当前为“' + code + '”';
    } else if (!CODE_RE.root.test(code)) {
        return '大类编码格式应为 A001（A + 三位数字），当前为“' + code + '”';
    }
    return '';
}
function validateItemCodeFormat(code, parentCode) {
    var re = new RegExp('^' + escapeRegExp(parentCode) + '\\/\\d{3}$');
    if (!re.test(code)) return '库存编码必须为「' + parentCode + '/三位数字」（如 ' + parentCode + '/001），当前为“' + code + '”';
    return '';
}
function findCodeCollision(code, ignoreCode) {
    var set = collectAllCodes();
    if (ignoreCode) delete set[ignoreCode];
    return !!set[code];
}
/** 节点改名：检查新节点码与级联后的所有子/库存码是否与其它记录冲突 */
function findNodeRenameCollision(newCode, oldCode, node) {
    var oldCodes = collectSubtreeCodes(node, oldCode);
    var newCodes = oldCodes.map(function (code) {
        return code === oldCode ? newCode : newCode + code.slice(oldCode.length);
    });
    var set = collectAllCodes();
    oldCodes.forEach(function (code) { delete set[code]; });
    for (var i = 0; i < newCodes.length; i++) {
        if (set[newCodes[i]]) return newCodes[i];
    }
    return '';
}

// ---------- 文档差异（历史版本对比用） ----------
var NODE_DIFF_FIELDS = ['name', 'unified', 'cost', 'trackingNumber', 'orderNumber', 'remark', 'qrLinks', 'status', 'deletedAt'];
var ITEM_DIFF_FIELDS = ['name', 'cost', 'trackingNumber', 'orderNumber', 'remark', 'qrLinks', 'status', 'deletedAt'];
function flattenDoc(doc) {
    var nodes = Object.create(null);
    var items = Object.create(null);
    var products = doc && doc.products ? doc.products : {};
    function visit(container, parentCode) {
        Object.keys(container).forEach(function (code) {
            var node = container[code];
            if (!node || typeof node !== 'object') return;
            nodes[code] = { node: node, parentCode: parentCode || null };
            if (Array.isArray(node.items)) {
                node.items.forEach(function (item) {
                    if (!item || !item.code) return;
                    items[code + '|' + item.code] = { item: item, parentCode: code };
                });
            }
            if (node.children && typeof node.children === 'object') visit(node.children, code);
        });
    }
    visit(products, null);
    return { nodes: nodes, items: items };
}
function diffDocs(currentDoc, targetDoc) {
    var current = flattenDoc(currentDoc);
    var target = flattenDoc(targetDoc);
    var result = {
        addedNodes: [], removedNodes: [], addedItems: [], removedItems: [],
        changedNodes: [], changedItems: [], changedNodeFields: 0, changedItemFields: 0
    };
    Object.keys(target.nodes).forEach(function (code) { if (!current.nodes[code]) result.addedNodes.push(code); });
    Object.keys(current.nodes).forEach(function (code) { if (!target.nodes[code]) result.removedNodes.push(code); });
    Object.keys(target.items).forEach(function (key) { if (!current.items[key]) result.addedItems.push(key); });
    Object.keys(current.items).forEach(function (key) { if (!target.items[key]) result.removedItems.push(key); });
    Object.keys(target.nodes).forEach(function (code) {
        if (!current.nodes[code]) return;
        var changed = false;
        NODE_DIFF_FIELDS.forEach(function (field) {
            if (!Z.valuesEqual(current.nodes[code].node[field], target.nodes[code].node[field])) {
                result.changedNodeFields += 1;
                changed = true;
            }
        });
        if (changed) result.changedNodes.push(code);
    });
    Object.keys(target.items).forEach(function (key) {
        if (!current.items[key]) return;
        var changed = false;
        ITEM_DIFF_FIELDS.forEach(function (field) {
            if (!Z.valuesEqual(current.items[key].item[field], target.items[key].item[field])) {
                result.changedItemFields += 1;
                changed = true;
            }
        });
        if (changed) result.changedItems.push(key);
    });
    return result;
}
function shortList(list, max) {
    max = max || 8;
    if (!list || !list.length) return '';
    var shown = list.slice(0, max).join('、');
    return list.length > max ? shown + ' 等 ' + list.length + ' 项' : shown;
}

// ---------- 通用二次确认弹窗 ----------
function showConfirm(options) {
    return new Promise(function (resolve) {
        options = options || {};
        confirmState = { resolve: resolve, options: options };
        setText(confirmTitle, options.title || '确认操作');
        confirmMessage.textContent = options.message || '';
        var requireText = options.requireText || '';
        if (requireText) {
            confirmRequireWrap.style.display = 'block';
            setText(confirmRequireLabel, '请输入 ' + requireText + ' 以确认：');
            confirmRequireInput.value = '';
            confirmOk.disabled = true;
        } else {
            confirmRequireWrap.style.display = 'none';
            confirmOk.disabled = false;
        }
        confirmOk.textContent = options.confirmText || '确认';
        confirmOk.className = 'btn ' + (options.danger === false ? 'btn-primary' : 'btn-danger');
        setText(confirmStatus, '');
        confirmOverlay.classList.add('active');
        setTimeout(function () {
            if (requireText) confirmRequireInput.focus();
            else confirmOk.focus();
        }, 40);
    });
}
function updateConfirmState() {
    if (!confirmState) return;
    var options = confirmState.options || {};
    if (options.requireText) confirmOk.disabled = confirmRequireInput.value.trim() !== options.requireText || isSaving;
    else confirmOk.disabled = !!isSaving;
}
function finishConfirm(ok) {
    if (!confirmState) return;
    var state = confirmState;
    confirmState = null;
    confirmOverlay.classList.remove('active');
    state.resolve(!!ok);
}
function cancelConfirm() {
    if (!confirmState) return;
    finishConfirm(false);
}
function handleConfirmOk() {
    if (!confirmState || isSaving) return;
    var options = confirmState.options || {};
    if (options.requireText && confirmRequireInput.value.trim() !== options.requireText) return;
    if (typeof options.onConfirm !== 'function') { finishConfirm(true); return; }
    confirmOk.disabled = true;
    setText(confirmStatus, '处理中…');
    Promise.resolve(options.onConfirm()).then(function (ok) {
        if (ok) { finishConfirm(true); return; }
        setText(confirmStatus, '操作未完成');
        updateConfirmState();
    }).catch(function (err) {
        setText(confirmStatus, '操作失败：' + Z.friendlyError(err));
        updateConfirmState();
    });
}

// ---------- 回收站（软删除） ----------
function collectRecycleEntries() {
    var nodes = [];
    var items = [];
    var products = gistData.products || {};
    function visit(container, parentCode) {
        Object.keys(container).sort().forEach(function (code) {
            var node = container[code];
            if (!node || typeof node !== 'object') return;
            if (Z.isDeleted(node)) {
                nodes.push({
                    type: 'node',
                    code: code,
                    parentCode: parentCode || null,
                    name: node.name || '',
                    deletedAt: node.deletedAt,
                    active: countNodeContents(node, false),
                    all: countNodeContents(node, true)
                });
                return; // 已删除节点整体在回收站，不再单独展开其内部条目
            }
            if (Array.isArray(node.items)) {
                node.items.forEach(function (item) {
                    if (item && Z.isDeleted(item)) {
                        items.push({
                            type: 'item',
                            parentCode: code,
                            code: item.code || '',
                            name: item.name || node.name || '',
                            deletedAt: item.deletedAt
                        });
                    }

function setRefreshing(on) {

function applyLoaded(result) {
    // baseDoc 保留远端原始值（例如历史“已售”），用于字段级 diff / 冲突检测；
    // gistData 做展示态归一（“已售”显示为“售出”）。
    var rawDoc = Z.clone(result.data);
    normalizeDoc(result.data);
    gistData = result.data;
    baseDoc = rawDoc;
    syncMeta = {
        updatedAt: result.updatedAt || null,
        revision: result.revision || null,
        size: result.size || null,
        lastSyncAt: Date.now()
    };
    readOnly = false;
    hideLoadError();
    updateSyncMeta();
    invalidateViewCaches();
    // 恢复上次的搜索词 / 节点排序 / 筛选 / 展开状态
    if (searchInput) searchInput.value = viewState.search || '';
    if (nodeSortSelect) nodeSortSelect.value = viewState.nodeSort || 'code-asc';
    populateFilter();
    renderTree();
    updateSummaryBar();
    updateRecycleCount();
    setText(userStatus, '已连接 (' + currentGistId + ')');
    setRefreshing(false);
}

function showLoginForm() {

function refreshFromRemote() {
    if (isLoading || isSaving) return Promise.resolve(false);
    if (!currentToken) { showLoginForm(); return Promise.resolve(false); }
    isLoading = true;
    setRefreshing(true);
    return Z.get(currentToken, currentGistId, currentFilename)
        .then(function (result) {
            applyLoaded(result);
            toast('已刷新到最新数据', 'success');
            return true;
        })
        .catch(function (err) {
            readOnly = true;
            showLoadError(err, 'refresh');
            toast('刷新失败：' + Z.friendlyError(err), { type: 'error', duration: 7000 });
            return false;
        })
        .finally(function () {
            isLoading = false;
            setRefreshing(false);
        });
}

function performLogin(options) {
    options = options || {};
    var token = loginToken.value.trim();
    var gistId = loginGistId.value.trim();
    var filename = loginFilename.value.trim() || 'data.json';
    loginError.textContent = '';
    if (!token || !gistId) {
        loginError.textContent = '请填写 Token 和 Gist ID';
        showLoginForm();
        return Promise.resolve(false);
    }
    loginBtn.disabled = true;
    loginBtn.textContent = '连接中…';
    return Z.get(token, gistId, filename)
        .then(function (result) {
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            saveCredentials(token, gistId, filename, !!(loginRemember && loginRemember.checked));
            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            applyLoaded(result);
            if (!options.silent) toast('已连接，数据加载成功', 'success');
            return true;
        })
        .catch(function (err) {
            loginError.textContent = '登录失败：' + Z.friendlyError(err);
            if (options.silent) showLoadError(err, 'login');
            else showLoginForm();
            return false;
        })
        .finally(function () {
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        });
}

function retryLoad() {
    hideLoadError();
    var token = currentToken || loginToken.value.trim();
    var gistId = currentGistId || loginGistId.value.trim();
    var filename = currentFilename || loginFilename.value.trim() || 'data.json';
    if (!token || !gistId) { showLoginForm(); return; }
    loginToken.value = token;
    loginGistId.value = gistId;
    loginFilename.value = filename;
    loadErrorRetry.disabled = true;
    loadErrorRetry.textContent = '重试中…';
    var task = currentToken ? refreshFromRemote() : performLogin({ silent: true });

        loadErrorRetry.disabled = false;
        loadErrorRetry.textContent = '重试';
    });
}

function findNodeEntry(code) { return Z.findNodeEntry(gistData.products, code); }
function findParentNode(code) { return Z.findParentNode(gistData.products, code); }
function baseNodeOf(code) { return Z.findNodeByCode(baseDoc.products, code); }

// ============================================================
// 编码生成
// ============================================================
function generateRootCode() {
    var products = gistData.products || {};
    var maxNum = 0;
    Object.keys(products).forEach(function (key) {
        var code = Z.normalizeCode(key);
        if (!/^A\d{3}$/.test(code)) return;
        var num = parseInt(code.slice(1), 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
    });
    var next = maxNum + 1;
    if (next > 999) { toast('大类编码已达 A999 上限', 'error'); return null; }
    return 'A' + String(next).padStart(3, '0');
}

function generateChildCode(parentCode) {
    var parent = findNodeByCode(parentCode);
    if (!parent) return null;
    var children = (parent.children && typeof parent.children === 'object') ? parent.children : {};
    var maxNum = 0;
    Object.keys(children).forEach(function (key) {
        var last = String(key).split('/').pop();
        if (!/^B\d+$/.test(last)) return;
        var num = parseInt(last.slice(1), 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
    });
    var next = maxNum + 1;
    if (next > 999) { toast('子类编码已达 B999 上限', 'error'); return null; }
    return parentCode + '/B' + String(next).padStart(3, '0');
}

function generateItemCode(parentCode) {
    var parent = findNodeByCode(parentCode);
    if (!parent) return null;
    var items = Array.isArray(parent.items) ? parent.items : [];
    var maxNum = 0;
    items.forEach(function (item) {
        if (!item || !item.code) return;
        var last = String(item.code).split('/').pop();
        if (!/^\d+$/.test(last)) return;
        var num = parseInt(last, 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
    });
    var next = maxNum + 1;
    if (next > 999) { toast('库存编码已达 999 上限', 'error'); return null; }
    return parentCode + '/' + String(next).padStart(3, '0');
}

// ============================================================
// 树渲染（数据层过滤 + 全量转义 + data-action）
// ============================================================
function includesTerm(value, term) {
    if (value === null || value === undefined) return false;
    return String(value).toLowerCase().indexOf(term) !== -1;
}

function nodeMatchesTerm(node, code, term) {
    if (includesTerm(code, term) || includesTerm(node.name, term)) return true;
    if (includesTerm(node.orderNumber, term) || includesTerm(node.trackingNumber, term) || includesTerm(node.remark, term)) return true;
    if (includesTerm(Z.normalizeStatus(node.status), term)) return true;
    if (Array.isArray(node.qrLinks) && node.qrLinks.some(function (link) { return includesTerm(link, term); })) return true;
    return false;
}

function itemMatchesTerm(item, term) {
    if (!item) return false;
    if (includesTerm(item.code, term) || includesTerm(item.name, term)) return true;
    if (includesTerm(item.orderNumber, term) || includesTerm(item.trackingNumber, term) || includesTerm(item.remark, term)) return true;
    if (includesTerm(Z.normalizeStatus(item.status), term)) return true;
    if (Array.isArray(item.qrLinks) && item.qrLinks.some(function (link) { return includesTerm(link, term); })) return true;
    return false;
}
