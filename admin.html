<!-- ========== 加载 C-Lodop ========== -->
<script src="CLodopFuncs.js" onerror="console.warn('本地CLodopFuncs.js加载失败，尝试远程...')"></script>
<script>
    (function() {
        function checkLodop() {
            return (typeof getLodop === 'function') || window.LODOP || window.CLodop;
        }
        if (checkLodop()) {
            console.log('C-Lodop 已加载');
            updateLodopStatus(true);
            return;
        }
        const isHttps = window.location.protocol === 'https:';
        const remoteUrl = isHttps ? 'https://localhost.lodop.net:8443/CLodopFuncs.js' : 'http://localhost:8000/CLodopFuncs.js';
        const script = document.createElement('script');
        script.src = remoteUrl;
        script.onload = function() {
            if (checkLodop()) {
                console.log('C-Lodop 从远程加载成功');
                updateLodopStatus(true);
            } else {
                console.warn('远程加载成功但未找到 LODOP 对象');
                updateLodopStatus(false);
            }
        };
        script.onerror = function() {
            console.error('远程 C-Lodop 加载失败');
            updateLodopStatus(false);
            alert('无法加载 C-Lodop 打印服务。\n请确保已安装 C-Lodop 并运行。\n如果网站是 HTTPS，请先手动信任证书。');
        };
        document.head.appendChild(script);
        setTimeout(function() {
            if (checkLodop()) updateLodopStatus(true);
        }, 3000);
    })();

    function updateLodopStatus(ok) {
        const el = document.getElementById('lodop-status');
        if (el) {
            if (ok) {
                el.textContent = '✅ 打印服务已就绪';
                el.className = 'lodop-status success';
            } else {
                el.textContent = '❌ 打印服务未连接，请安装 C-Lodop 并手动信任证书';
                el.className = 'lodop-status error';
            }
        }
    }

    function waitForLodop(callback, retries) {
        retries = retries || 10;
        if ((typeof getLodop === 'function') || window.LODOP || window.CLodop) {
            callback(true);
            return;
        }
        if (retries <= 0) {
            callback(false);
            return;
        }
        setTimeout(function() {
            waitForLodop(callback, retries - 1);
        }, 500);
    }

    window.addEventListener('load', function() {
        waitForLodop(function(ok) {
            updateLodopStatus(ok);
        });
    });
</script>

    // ---------- GitHub API ----------
    async function getGistContent(token, gistId, filename) {
        const url = `https://api.github.com/gists/${gistId}`;
        const resp = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`GitHub API 错误: ${err.message || resp.statusText}`);
        }
        const data = await resp.json();
        const files = data.files;
        if (!files || !files[filename]) return {};
        try { return JSON.parse(files[filename].content); } catch { return {}; }
    }

    // 深度合并函数：递归合并两个对象，确保嵌套数据不被覆盖
    function deepMerge(target, source) {
        if (!source || typeof source !== 'object') return source;
        if (!target || typeof target !== 'object') return source;
        
        const result = {...target};
        
        for (const key in source) {
            if (source.hasOwnProperty(key)) {
                if (Array.isArray(source[key]) && Array.isArray(target[key])) {
                    // 数组合并：去重合并
                    const targetArr = target[key];
                    const sourceArr = source[key];
                    const merged = [...targetArr];
                    for (const item of sourceArr) {
                        // 简单去重：如果数组元素是对象，比较关键属性；如果是原始值，直接比较
                        let exists = false;
                        if (typeof item === 'object' && item !== null) {
                            // 对于对象，尝试用 code 或 id 作为唯一标识
                            const identifier = item.code || item.id || JSON.stringify(item);
                            exists = merged.some(m => {
                                if (typeof m === 'object' && m !== null) {
                                    return (m.code || m.id || JSON.stringify(m)) === identifier;
                                }
                                return false;
                            });
                        } else {
                            exists = merged.includes(item);
                        }
                        if (!exists) {
                            merged.push(item);
                        }
                    }
                    result[key] = merged;
                } else if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    // 对象递归合并
                    result[key] = deepMerge(target[key], source[key]);
                } else {
                    // 原始值：优先使用 source 的值（最新修改）
                    result[key] = source[key];
                }
            }
        }
        
        return result;
    }

    async function updateGistContent(token, gistId, filename, content, retryCount = 0) {
        const MAX_RETRIES = 3;
        const contentStr = JSON.stringify(content, null, 2);
        const url = `https://api.github.com/gists/${gistId}`;
        const payload = { files: { [filename]: { content: contentStr } } };
        
        // 重试前先获取最新数据，确保基于最新版本更新
        if (retryCount > 0) {
            try {
                const freshData = await getGistContent(token, gistId, filename);
                // 深度合并数据：保留双方的修改
                const mergedData = deepMerge(freshData, content);
                const newContentStr = JSON.stringify(mergedData, null, 2);
                payload.files[filename].content = newContentStr;
            } catch (e) {
                console.error('获取最新数据失败:', e);
            }
        }
        
        const resp = await fetch(url, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) {
            const err = await resp.json();
            // 如果是并发冲突（403 或特定错误），尝试重试
            if (resp.status === 403 && retryCount < MAX_RETRIES) {
                console.log(`并发冲突，重试 ${retryCount + 1}/${MAX_RETRIES}...`);
                await new Promise(resolve => setTimeout(resolve, 500 * (retryCount + 1)));
                return await updateGistContent(token, gistId, filename, content, retryCount + 1);
            }
            throw new Error(`更新失败：${err.message || resp.statusText}`);
        }
        return await resp.json();
    }

    function findNodeByCode(code, obj) {
        if (!obj) obj = gistData.products;
        if (obj[code]) return obj[code];
        for (let key in obj) {
            if (obj[key].children) {
                const found = findNodeByCode(code, obj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findParentNode(code, parentObj) {
        if (!parentObj) parentObj = gistData.products;
        for (let key in parentObj) {
            if (parentObj[key].children && parentObj[key].children[code]) {
                return parentObj[key];
            }
            if (parentObj[key].children) {
                const found = findParentNode(code, parentObj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findItemByCode(itemCode) {
        for (let rootKey in gistData.products) {
            const found = findItemInNode(gistData.products[rootKey], itemCode);
            if (found) return found;
        }
        return null;
    }

    function findItemInNode(node, itemCode) {
        if (node.items) {
            const item = node.items.find(it => it.code === itemCode);
            if (item) return item;
        }
        if (node.children) {
            for (let childKey in node.children) {
                const found = findItemInNode(node.children[childKey], itemCode);
                if (found) return found;
            }
        }
        return null;
    }

    // ---------- 编码生成 ----------
    function generateRootCode() {
        const keys = Object.keys(gistData.products).filter(k => /^A\d{3}$/.test(k));
        let maxNum = 0;
        keys.forEach(k => { const num = parseInt(k.substring(1)); if (num > maxNum) maxNum = num; });
        const next = maxNum + 1;
        if (next > 999) { alert('达到上限'); return null; }
        return 'A' + String(next).padStart(3, '0');
    }

    function generateChildCode(parentCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) return null;
        if (!parent.children) parent.children = {};
        const children = parent.children;
        const keys = Object.keys(children).filter(k => k.startsWith(parentCode + '/B'));
        let maxNum = 0;
        keys.forEach(k => {
            const parts = k.split('/');
            const last = parts[parts.length - 1];
            if (last.startsWith('B')) {
                const num = parseInt(last.substring(1));
                if (num > maxNum) maxNum = num;
            }
        });
        const next = maxNum + 1;
        if (next > 999) { alert('子编码超过 B999'); return null; }
        return parentCode + '/B' + String(next).padStart(3, '0');
    }

    function generateItemCode(parentCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) return null;
        if (!parent.items) parent.items = [];
        const items = parent.items;
        let maxNum = 0;
        items.forEach(item => {
            const parts = item.code.split('/');
            const last = parts[parts.length - 1];
            const num = parseInt(last);
            if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        const next = maxNum + 1;
        if (next > 999) { alert('库存编码超过 999'); return null; }
        return parentCode + '/' + String(next).padStart(3, '0');
    }

    // ---------- 渲染树 ----------
    function statusColor(status) {
        if (status === '待售') return '#f59e0b';
        if (status === '在售') return '#22c55e';
        if (status === '售出') return '#94a3b8';
        return '#94a3b8';
    }

    function renderNode(code, node, depth) {
        const hasChildren = node.children && Object.keys(node.children).length > 0;
        const hasItems = node.items && node.items.length > 0;
        const unified = node.unified !== false;
        const badge = unified ? '统一' : '不统一';
        const badgeColor = unified ? '#dbeafe' : '#fef3c7';

        let childrenHtml = '';
        if (hasChildren) {
            const childKeys = Object.keys(node.children).sort();
            childrenHtml = childKeys.map(c => renderNode(c, node.children[c], depth + 1)).join('');
        }

        let itemsHtml = '';
        if (hasItems) {
            itemsHtml = `
                <div class="batch-actions">
                    <button class="btn btn-secondary btn-sm" onclick="batchPrintItems('${code}')">批量打印</button>
                    <button class="btn btn-secondary btn-sm" onclick="openBatchStatus('${code}')">批量修改状态</button>
                </div>
                <table class="items-table">
                    <thead><tr>
                        <th><input type="checkbox" class="select-all" data-parent="${code}" onchange="toggleSelectAll(this, '${code}')"></th>
                        <th>库存编码</th><th>名称</th><th>成本</th><th>快递单号</th><th>订单号</th><th>状态</th><th>操作</th>
                    </tr></thead>
                    <tbody>
                        ${node.items.map((item, idx) => `
                            <tr>
                                <td><input type="checkbox" class="item-checkbox" data-parent="${code}" data-item-code="${item.code}"></td>
                                <td>${item.code}</td>
                                <td>${item.name || ''}</td>
                                <td>${item.cost !== undefined ? item.cost : ''}</td>
                                <td>${item.trackingNumber || ''}</td>
                                <td>${item.orderNumber || ''}</td>
                                <td><span style="background:${statusColor(item.status || '在售')};color:white;padding:0 6px;border-radius:12px;font-size:11px;">${item.status || '在售'}</span></td>
                                <td class="actions">
                                    <button class="btn btn-primary btn-sm" onclick="editItem('${code}','${item.code}')">编辑</button>
                                    <button class="btn btn-primary btn-sm" onclick="printItemLabel('${code}','${item.code}')">打印标签</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteItem('${code}','${item.code}')">删除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        const actions = `
            <button class="btn btn-secondary btn-sm" onclick="openNodeModal('edit','${code}')">编辑</button>
            ${unified ? `<button class="btn btn-secondary btn-sm" onclick="openNodeModal('add','','${code}')">添加子类</button>` :
                        `<button class="btn btn-success btn-sm" onclick="openItemModal('add','${code}')">添加库存</button>`}
            <button class="btn btn-primary btn-sm" onclick="printNodeLabel('${code}')">打印标签</button>
            <button class="btn btn-danger btn-sm" onclick="deleteNode('${code}')">删除</button>
        `;

        const toggleIcon = (hasChildren || hasItems) ? `<span class="toggle" onclick="toggleNode('${code}')">▼</span>` : '';

        return `
            <div class="tree-node" data-code="${code}" data-depth="${depth}">
                <div class="node-content">
                    ${toggleIcon}
                    <span class="name" onclick="toggleNode('${code}')">${node.name || code}</span>
                    <span class="code">${code}</span>
                    <span class="badge" style="background:${badgeColor};">${badge}</span>
                    ${node.orderNumber ? `<span class="badge" style="background:#e0e7ff;">📋${node.orderNumber}</span>` : ''}
                    <span class="actions">${actions}</span>
                </div>
                ${hasChildren ? `<div class="children">${childrenHtml}</div>` : ''}
                ${hasItems ? `<div class="children">${itemsHtml}</div>` : ''}
            </div>
        `;
    }

    function buildTreeHtml() {
        const products = gistData.products || {};
        const codes = Object.keys(products).sort();
        if (codes.length === 0) return '<p style="color:#94a3b8;">暂无商品，请添加大类</p>';
        return codes.map(code => renderNode(code, products[code], 0)).join('');
    }

    function renderTree() {
        const filter = filterSelect.value;
        const searchTerm = searchInput.value.trim().toLowerCase();
        let fullHtml = buildTreeHtml();
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = fullHtml;
        if (filter !== 'all') {
            const rootNodes = tempDiv.querySelectorAll('.tree-node[data-depth="0"]');
            rootNodes.forEach(node => {
                const code = node.dataset.code;
                if (code !== filter) {
                    node.style.display = 'none';
                } else {
                    node.classList.add('expanded');
                    const allChildren = node.querySelectorAll('.tree-node');
                    allChildren.forEach(c => c.style.display = '');
                    allChildren.forEach(c => c.classList.add('expanded'));
                }
            });
        } else {
            tempDiv.querySelectorAll('.tree-node').forEach(n => n.classList.add('expanded'));
        }
        if (searchTerm) {
            const allNodes = tempDiv.querySelectorAll('.tree-node');
            allNodes.forEach(node => {
                const name = node.querySelector('.name')?.textContent?.toLowerCase() || '';
                const code = node.dataset.code?.toLowerCase() || '';
                if (name.includes(searchTerm) || code.includes(searchTerm)) {
                    node.style.display = '';
                    let parent = node.parentElement.closest('.tree-node');
                    while (parent) {
                        parent.classList.add('expanded');
                        parent.style.display = '';
                        parent = parent.parentElement.closest('.tree-node');
                    }
                } else {
                    const hasMatch = node.querySelector('.tree-node') &&
                        Array.from(node.querySelectorAll('.tree-node')).some(child => child.style.display !== 'none');
                    if (!hasMatch) {
                        node.style.display = 'none';
                    }
                }
            });
        }
        treeContainer.innerHTML = tempDiv.innerHTML;
    }

    window.toggleNode = function(code) {
        const el = document.querySelector(`.tree-node[data-code="${code}"]`);
        if (el) el.classList.toggle('expanded');
    };

    function populateFilter() {
        const products = gistData.products || {};
        const codes = Object.keys(products).sort();
        filterSelect.innerHTML = '<option value="all">全部展开</option>';
        codes.forEach(code => {
            const name = products[code].name || code;
            filterSelect.innerHTML += `<option value="${code}">${name} (${code})</option>`;
        });
    }

    // ---------- 节点操作 ----------
    function openNodeModal(mode, code, parentCode) {
        if (mode === 'add') {
            modalNodeMode.value = 'add';
            modalNodeParent.value = parentCode || '';
            modalNodeTitle.textContent = parentCode ? '添加子类' : '添加大类';
            let defaultCode = parentCode ? generateChildCode(parentCode) : generateRootCode();
            modalNodeCode.value = defaultCode || '';
            modalNodeName.value = '';
            modalNodeUnified.value = 'true';
            modalNodeCost.value = '';
            modalNodeTracking.value = '';
            modalNodeOrder.value = '';
            modalNodeQrlinks.value = '';
            modalNodeRemark.value = '';
            modalNodeOriginalCode.value = '';
        } else {
            const node = findNodeByCode(code);
            if (!node) { alert('节点不存在'); return; }
            modalNodeMode.value = 'edit';
            modalNodeOriginalCode.value = code;
            modalNodeParent.value = '';
            modalNodeTitle.textContent = '编辑节点';
            modalNodeCode.value = code;
            modalNodeName.value = node.name || '';
            modalNodeUnified.value = node.unified !== false ? 'true' : 'false';
            modalNodeCost.value = node.cost !== undefined ? node.cost : '';
            modalNodeTracking.value = node.trackingNumber || '';
            modalNodeOrder.value = node.orderNumber || '';
            modalNodeQrlinks.value = (node.qrLinks && node.qrLinks.length) ? node.qrLinks.join(', ') : '';
            modalNodeRemark.value = node.remark || '';
        }
        modalNodeOverlay.classList.add('active');
        resetSaveButton(modalNodeSave, nodeSaveStatus);
    }

    function resetSaveButton(btn, statusDiv) {
        btn.disabled = false;
        btn.textContent = '保存';
        statusDiv.innerHTML = '';
    }

    async function saveNode() {
        const mode = modalNodeMode.value;
        let code = modalNodeCode.value.trim();
        const name = modalNodeName.value.trim();
        if (!name) { alert('名称不能为空'); return; }
        const unified = modalNodeUnified.value === 'true';
        const cost = parseFloat(modalNodeCost.value);
        const tracking = modalNodeTracking.value.trim();
        const order = modalNodeOrder.value.trim();
        const qrLinks = modalNodeQrlinks.value.split(/[,，\n]+/).map(s => s.trim()).filter(s => s);
        const remark = modalNodeRemark.value.trim();

        if (!code) {
            if (mode === 'add') {
                const parentCode = modalNodeParent.value;
                code = parentCode ? generateChildCode(parentCode) : generateRootCode();
                if (!code) { alert('编码生成失败'); return; }
            } else {
                alert('编码不能为空');
                return;
            }
        }

        const originalCode = modalNodeOriginalCode.value;

        modalNodeSave.disabled = true;
        modalNodeSave.textContent = '保存中...';
        nodeSaveStatus.innerHTML = '<div class="spinner"></div>';

        try {
            if (mode === 'add') {
                if (findNodeByCode(code)) { alert('编码已存在'); resetSaveButton(modalNodeSave, nodeSaveStatus); return; }
                const newNode = {
                    name: name,
                    unified: unified,
                    children: {},
                    cost: isNaN(cost) ? undefined : cost,
                    trackingNumber: tracking || undefined,
                    orderNumber: order || undefined,
                    qrLinks: qrLinks.length ? qrLinks : undefined,
                    remark: remark || undefined
                };
                const parentCode = modalNodeParent.value;
                if (!parentCode) {
                    gistData.products[code] = newNode;
                } else {
                    const parent = findNodeByCode(parentCode);
                    if (parent) {
                        if (!parent.children) parent.children = {};
                        parent.children[code] = newNode;
                    } else {
                        alert('父节点不存在');
                        resetSaveButton(modalNodeSave, nodeSaveStatus);
                        return;
                    }
                }
            } else {
                const node = findNodeByCode(originalCode);
                if (!node) { alert('节点不存在'); resetSaveButton(modalNodeSave, nodeSaveStatus); return; }
                node.name = name;
                node.unified = unified;
                node.cost = isNaN(cost) ? undefined : cost;
                node.trackingNumber = tracking || undefined;
                node.orderNumber = order || undefined;
                node.qrLinks = qrLinks.length ? qrLinks : undefined;
                node.remark = remark || undefined;
                if (code !== originalCode) {
                    if (findNodeByCode(code)) { alert('新编码已被占用'); resetSaveButton(modalNodeSave, nodeSaveStatus); return; }
                    const parent = findParentNode(originalCode);
                    if (parent) {
                        delete parent.children[originalCode];
                        parent.children[code] = node;
                    } else if (gistData.products[originalCode]) {
                        delete gistData.products[originalCode];
                        gistData.products[code] = node;
                    } else {
                        alert('未找到父节点');
                        resetSaveButton(modalNodeSave, nodeSaveStatus);
                        return;
                    }
                    if (node.children && Object.keys(node.children).length > 0) {
                        alert('⚠️ 编码已更改，但子节点编码未自动更新，请手动调整子节点编码以避免数据混乱。');
                    }
                }
            }

            const success = await saveData();
            if (success) {
                nodeSaveStatus.innerHTML = '✓ 已保存';
                modalNodeSave.textContent = '已保存';
                renderTree();
                populateFilter();
                setTimeout(() => {
                    modalNodeOverlay.classList.remove('active');
                    resetSaveButton(modalNodeSave, nodeSaveStatus);
                }, 3000);
            } else {
                resetSaveButton(modalNodeSave, nodeSaveStatus);
            }
        } catch (e) {
            alert('保存出错: ' + e.message);
            resetSaveButton(modalNodeSave, nodeSaveStatus);
        }
    }

    modalNodeCancel.addEventListener('click', () => {
        modalNodeOverlay.classList.remove('active');
        resetSaveButton(modalNodeSave, nodeSaveStatus);
    });

    async function deleteNode(code) {
        if (!confirm(`确定删除节点 "${code}" 及其所有子项/库存吗？`)) return;
        const parent = findParentNode(code);
        if (parent) {
            delete parent.children[code];
        } else if (gistData.products[code]) {
            delete gistData.products[code];
        } else {
            alert('节点不存在');
            return;
        }
        const success = await saveData();
        if (success) {
            renderTree();
            populateFilter();
        }
    }

    window.openNodeModal = openNodeModal;
    window.deleteNode = deleteNode;
    modalNodeSave.addEventListener('click', saveNode);

    // ---------- 库存操作 ----------
    function openItemModal(mode, parentCode, itemCode) {
        modalItemParentCode.value = parentCode;
        if (mode === 'add') {
            modalItemTitle.textContent = '添加库存';
            let defaultCode = generateItemCode(parentCode);
            modalItemCode.value = defaultCode || '';
            modalItemName.value = '';
            modalItemCost.value = '';
            modalItemTracking.value = '';
            modalItemOrder.value = '';
            modalItemStatus.value = '在售';
            modalItemQrlinks.value = '';
            modalItemRemark.value = '';
            modalItemOriginalCode.value = '';
        } else {
            const parent = findNodeByCode(parentCode);
            if (!parent || !parent.items) { alert('库存不存在'); return; }
            const item = parent.items.find(it => it.code === itemCode);
            if (!item) { alert('库存项不存在'); return; }
            modalItemTitle.textContent = '编辑库存';
            modalItemCode.value = item.code;
            modalItemName.value = item.name || '';
            modalItemCost.value = item.cost !== undefined ? item.cost : '';
            modalItemTracking.value = item.trackingNumber || '';
            modalItemOrder.value = item.orderNumber || '';
            modalItemStatus.value = item.status || '在售';
            modalItemQrlinks.value = (item.qrLinks && item.qrLinks.length) ? item.qrLinks.join(', ') : '';
            modalItemRemark.value = item.remark || '';
            modalItemOriginalCode.value = itemCode;
        }
        modalItemOverlay.classList.add('active');
        resetSaveButton(modalItemSave, itemSaveStatus);
    }

    async function saveItem() {
        const parentCode = modalItemParentCode.value;
        const parent = findNodeByCode(parentCode);
        if (!parent) { alert('父节点不存在'); return; }
        if (!parent.items) parent.items = [];

        let code = modalItemCode.value.trim();
        if (!code) {
            code = generateItemCode(parentCode);
            if (!code) { alert('编码生成失败'); return; }
        }
        const name = modalItemName.value.trim();
        const cost = parseFloat(modalItemCost.value);
        const tracking = modalItemTracking.value.trim();
        const order = modalItemOrder.value.trim();
        const status = modalItemStatus.value;
        const qrLinks = modalItemQrlinks.value.split(/[,，\n]+/).map(s => s.trim()).filter(s => s);
        const remark = modalItemRemark.value.trim();

        const originalCode = modalItemOriginalCode.value;
        const exists = parent.items.some(it => it.code === code && it.code !== originalCode);
        if (exists) { alert('编码已存在'); return; }

        modalItemSave.disabled = true;
        modalItemSave.textContent = '保存中...';
        itemSaveStatus.innerHTML = '<div class="spinner"></div>';

        try {
            const itemData = {
                code: code,
                name: name || undefined,
                cost: isNaN(cost) ? undefined : cost,
                trackingNumber: tracking || undefined,
                orderNumber: order || undefined,
                status: status,
                qrLinks: qrLinks.length ? qrLinks : undefined,
                remark: remark || undefined
            };

            if (originalCode) {
                const idx = parent.items.findIndex(it => it.code === originalCode);
                if (idx === -1) { alert('库存项不存在'); resetSaveButton(modalItemSave, itemSaveStatus); return; }
                parent.items[idx] = itemData;
            } else {
                parent.items.push(itemData);
            }

            const success = await saveData();
            if (success) {
                itemSaveStatus.innerHTML = '✓ 已保存';
                modalItemSave.textContent = '已保存';
                renderTree();
                setTimeout(() => {
                    modalItemOverlay.classList.remove('active');
                    resetSaveButton(modalItemSave, itemSaveStatus);
                }, 3000);
            } else {
                resetSaveButton(modalItemSave, itemSaveStatus);
            }

            alert('保存出错: ' + e.message);
            resetSaveButton(modalItemSave, itemSaveStatus);
        }

        const idx = parent.items.findIndex(it => it.code === itemCode);
        if (idx === -1) { alert('库存项不存在'); return; }
        parent.items.splice(idx, 1);
        const success = await saveData();
        if (success) renderTree();
    }

    // ---------- 打印相关 ----------
    const printTemplates = [

    // HTML 转义，防止特殊字符破坏打印排版
    function escapeHtml(text) {
        if (typeof text !== 'string') return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 【核心修复】：统一使用 px 单位进行测量，避免 pt/px 混用导致的字号偏差
    function getTextLines(text, fontSizePt, fontName, bold, maxWidthPx) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSizePx = fontSizePt * 1.3333; // 1pt ≈ 1.3333px
        ctx.font = `${bold ? 'bold ' : ''}${fontSizePx}px ${fontName || 'SimHei'}`;
        
        const lines = [];
        let currentLine = '';
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const testLine = currentLine + char;
            const metrics = ctx.measureText(testLine);
            
            if (metrics.width > maxWidthPx && currentLine !== '') {
                lines.push(currentLine);
                currentLine = char;
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine) {
            lines.push(currentLine);
        }
        return lines;
    }

    // 【核心修复】：二分查找法，统一使用 px 单位计算
    function calcDynamicFontSize(text, maxWidthMm, maxHeightMm, baseSize, fontName, bold) {
        const displayText = '内部编码: ' + (text || '').toString();
        const maxWidthPx = maxWidthMm * 3.7795; // 1mm ≈ 3.7795px
        const maxHeightPx = maxHeightMm * 3.7795;
        const lineHeightRatio = 1.05; // 更激进的行高，让字号更大
        
        let low = 2;
        let high = 40;
        let bestSize = low;
        
        while (high - low > 0.05) {
            const mid = (low + high) / 2;
            const lines = getTextLines(displayText, mid, fontName, bold, maxWidthPx);
            const fontSizePx = mid * 1.3333;
            const totalHeightPx = lines.length * fontSizePx * lineHeightRatio;
            
            if (totalHeightPx <= maxHeightPx) {
                bestSize = mid;
                low = mid;
            } else {
                high = mid;
            }
        }
        return bestSize;
    }

    function getLodopInstance() {
        if (typeof getLodop === 'function') {
            return getLodop();
        } else if (window.LODOP) {
            return window.LODOP;
        } else if (window.CLodop) {
            return window.CLodop;
        } else {
            alert('打印服务未加载，请确保已安装 C-Lodop 并刷新页面。');
            return null;
        }
    }

    function getPrinterList() {
        const LODOP = getLodopInstance();
        if (!LODOP) return [];
        try {
            const count = LODOP.GET_PRINTER_COUNT();
            const printers = [];
            for (let i = 0; i < count; i++) {
                printers.push(LODOP.GET_PRINTER_NAME(i));
            }
            return printers;
        } catch (e) {
            console.error('获取打印机列表失败:', e);
            return [];
        }
    }

    // Canvas 预览同步优化，精确绘制多行并垂直居中
    function drawTemplatePreview(canvas, template, data) {
        const scale = canvas.width / template.paperWidth;
        canvas.height = template.paperHeight * scale;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#cccccc';
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        template.elements.forEach(el => {
            const x = el.x * scale;
            const y = el.y * scale;
            const width = el.width * scale;
            const height = el.height * scale;

            if (el.type === 'text') {
                ctx.fillStyle = '#000000';
                let text = '';
                if (el.field === 'static') {
                    text = el.text || '';
                } else if (data && data[el.field] !== undefined) {
                    let rawData = data[el.field].toString();
                    if (el.showLastLevelOnly && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    text = rawData;
                    if (el.prefix) text = el.prefix + text;
                } else {
                    text = (el.prefix || '') + 'C001'; 
                }
                
                let fontSize = el.fontSize;
                if (el.dynamicSize) {
                    const demoText = text.replace(el.prefix || '', '');
                    fontSize = calcDynamicFontSize(demoText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                }
                const fontSizePx = fontSize * 0.3528 * scale; 
                ctx.font = `${el.bold ? 'bold ' : ''}${fontSizePx}px ${el.fontName || 'SimHei'}, sans-serif`;
                
                const maxWidthPx = el.width * scale;
                const lineHeightPx = fontSizePx * 1.05; // 同步调整为 1.05
                
                const lines = [];
                let currentLine = '';
                const chars = text.split('');
                for (let i = 0; i < chars.length; i++) {
                    const testLine = currentLine + chars[i];
                    if (ctx.measureText(testLine).width > maxWidthPx && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = chars[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const totalTextHeightPx = lines.length * lineHeightPx;
                const startY = y + (height - totalTextHeightPx) / 2;
                
                ctx.textAlign = el.align === 'center' ? 'center' : 'left';
                ctx.textBaseline = 'middle';
                
                lines.forEach((line, index) => {
                    const drawX = el.align === 'center' ? (x + width / 2) : x;
                    const drawY = startY + (index * lineHeightPx) + (lineHeightPx / 2);
                    ctx.fillText(line, drawX, drawY);
                });
            } else if (el.type === 'barcode') {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(x, y, width, height);
                ctx.fillStyle = '#333333';
                ctx.font = `${Math.max(scale * 2, 8)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const codeText = data && data[el.field] ? data[el.field] : '条码区域';
                let displayText = codeText;
                if (displayText.length > 15) {
                    displayText = displayText.substring(0, 12) + '...';
                }
                ctx.fillText(displayText, x + width / 2, y + height / 2);
            }
        });
    }

    function renderInnerPreview(dataList, template) {
        const container = document.getElementById('inner-preview-container');
        container.innerHTML = '';
        
        dataList.forEach(data => {
            const canvas = document.createElement('canvas');
            canvas.width = template.paperWidth * 3.78; 
            drawTemplatePreview(canvas, template, data);
            container.appendChild(canvas);
        });
    }

    function openPrintPreview(dataList) {
        templateSelectContainer.innerHTML = '';
        printTemplates.forEach((tpl, idx) => {
            const card = document.createElement('div');
            card.className = 'template-card' + (idx === selectedTemplateIndex ? ' selected' : '');
            card.dataset.index = idx;
            const canvas = document.createElement('canvas');
            canvas.width = 150;
            drawTemplatePreview(canvas, tpl, null);
            card.appendChild(canvas);
            const nameDiv = document.createElement('div');
            nameDiv.className = 'template-name';
            nameDiv.textContent = tpl.name;
            card.appendChild(nameDiv);
            card.addEventListener('click', () => {
                document.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedTemplateIndex = idx;
                renderInnerPreview(window.currentPrintDataList, printTemplates[idx]);
            });
            templateSelectContainer.appendChild(card);
        });

        if (dataList.length === 1) {
            const d = dataList[0];
            printInfoDiv.innerHTML = `<p><strong>编码：</strong>${d.code || ''}</p><p><strong>名称：</strong>${d.name || ''}</p>`;
        } else {
            printInfoDiv.innerHTML = `<p><strong>批量打印：</strong>已选 ${dataList.length} 个标签</p>`;
        }

        printPreviewOverlay.classList.add('active');

        const printers = getPrinterList();
        printerSelect.innerHTML = '';
        if (printers.length === 0) {
            const option = document.createElement('option');
            option.textContent = '未检测到打印机';
            option.disabled = true;
            printerSelect.appendChild(option);
        } else {
            let defaultIndex = 0;
            const virtualKeywords = ['pdf', 'wps', 'fax', 'virtual', 'one note', 'onenote', 'microsoft print to pdf', 'print to pdf'];
            for (let i = 0; i < printers.length; i++) {
                const name = printers[i].toLowerCase();
                if (!virtualKeywords.some(k => name.includes(k))) {
                    defaultIndex = i;
                    break;
                }
            }
            printers.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = name;
                printerSelect.appendChild(option);
            });
            printerSelect.value = defaultIndex;
        }

        printCopiesInput.value = 1;
        window.currentPrintDataList = dataList;
        
        renderInnerPreview(dataList, printTemplates[selectedTemplateIndex]);
    }

    // 所有文本统一使用 HTML 打印，确保完美的垂直居中和行距控制
    function buildLodopPrintData(LODOP, dataList, template, printerIndex) {
        LODOP.PRINT_INIT(template.name || '标签打印');
        LODOP.SET_PRINT_PAGESIZE(1, template.paperWidth * 10, template.paperHeight * 10, '');
        if (!isNaN(printerIndex) && printerIndex >= 0) {
            LODOP.SET_PRINTER_INDEX(printerIndex);
        }

        dataList.forEach((data, i) => {
            template.elements.forEach((el) => {
                let value = '';
                if (el.field === 'static') {
                    value = el.text || '';
                } else {
                    let rawData = data[el.field] !== undefined ? data[el.field] : '';
                    if (el.showLastLevelOnly && typeof rawData === 'string' && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    value = rawData;
                }
                if (el.prefix && value) {
                    value = el.prefix + value;
                }

                const x = el.x + 'mm';
                const y = el.y + 'mm';
                const width = el.width + 'mm';
                const height = el.height + 'mm';

                if (el.type === 'text') {
                    let finalFontSize = el.fontSize;
                    if (el.dynamicSize && value) {
                        const codeText = data[el.field] || '';
                        finalFontSize = calcDynamicFontSize(codeText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                    }
                    
                    const htmlContent = `
                        <div style="
                            width: ${el.width}mm; 
                            height: ${el.height}mm; 
                            display: table;
                            font-family: ${el.fontName || 'SimHei'}, sans-serif; 
                            font-size: ${finalFontSize}pt; 
                            font-weight: ${el.bold ? 'bold' : 'normal'}; 
                            text-align: ${el.align || 'center'};
                            line-height: 1.05; 
                            word-break: break-all; 
                            overflow: hidden;
                            margin: 0;
                            padding: 0;
                        ">
                            <div style="display: table-cell; vertical-align: middle;">
                                ${escapeHtml(value)}
                            </div>
                        </div>
                    `;
                    LODOP.ADD_PRINT_HTM(y, x, width, height, htmlContent);
                } else if (el.type === 'barcode') {
                    let barcodeValue = data[el.field] !== undefined ? data[el.field] : '';
                    LODOP.ADD_PRINT_BARCODE(y, x, width, height, el.barcodeType, barcodeValue);
                    LODOP.SET_PRINT_STYLEA(0, "Horient", 2);
                    LODOP.SET_PRINT_STYLEA(0, "Alignment", 2);
                }
            });
            if (i < dataList.length - 1) {
                LODOP.NEWPAGE();
            }
        });
    }

    function executePrint() {
        const LODOP = getLodopInstance();
        if (!LODOP) return;

        const dataList = window.currentPrintDataList;
        if (!dataList || dataList.length === 0) return;

        const template = printTemplates[selectedTemplateIndex];
        const printerIndex = parseInt(printerSelect.value);
        const copies = parseInt(printCopiesInput.value) || 1;

        if (isNaN(printerIndex)) {
            alert('请选择打印机');
            return;
        }

        LODOP.SET_PRINT_COPIES(copies);
        buildLodopPrintData(LODOP, dataList, template, printerIndex);
        LODOP.PRINT();

        printPreviewOverlay.classList.remove('active');
    }

    function showLodopPreview() {
        const LODOP = getLodopInstance();
        if (!LODOP) return;

        const dataList = window.currentPrintDataList;
        if (!dataList || dataList.length === 0) return;

        const template = printTemplates[selectedTemplateIndex];
        const printerIndex = parseInt(printerSelect.value);

        buildLodopPrintData(LODOP, dataList, template, printerIndex);
        LODOP.PREVIEW();
    }

        if (!node) { alert('节点不存在'); return; }
        const data = {
            code: code,
            name: node.name || '',
            cost: node.cost,
            orderNumber: node.orderNumber,
            trackingNumber: node.trackingNumber,
            qrLinks: node.qrLinks
        };
        openPrintPreview([data]);
    };

    window.printItemLabel = function(parentCode, itemCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) { alert('父节点不存在'); return; }
        const item = parent.items ? parent.items.find(it => it.code === itemCode) : null;
        if (!item) { alert('库存项不存在'); return; }
        const data = {
            code: itemCode,
            name: item.name || parent.name || '',
            cost: item.cost,
            orderNumber: item.orderNumber,
            trackingNumber: item.trackingNumber,
            qrLinks: item.qrLinks
        };
        openPrintPreview([data]);
    };

    printPreviewBtn.addEventListener('click', showLodopPreview);
