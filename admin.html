<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品管理后台（带标签打印）</title>
    <style>
        /* ===== 全局重置与变量 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #4f46e5;
            --color-primary-light: #818cf8;
            --color-primary-dark: #4338ca;
            --color-success: #10b981;
            --color-success-light: #34d399;
            --color-danger: #f43f5e;
            --color-danger-light: #fb7185;
            --color-warning: #f59e0b;
            --color-gray-50: #f8fafc;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-400: #94a3b8;
            --color-gray-500: #64748b;
            --color-gray-600: #475569;
            --color-gray-700: #334155;
            --color-gray-800: #1e293b;
            --color-gray-900: #0f172a;
            --radius: 16px;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f1f5f9 0%, #e9eef3 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--color-gray-800);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-gray-100);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-gray-300);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-gray-400);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .top-bar h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .top-bar .sub {
            font-size: 14px;
            color: var(--color-gray-500);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-bar .sub #lodop-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            transition: var(--transition);
        }
        .top-bar .sub #lodop-status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .top-bar .sub #lodop-status.error {
            background: #fce4ec;
            color: #b91c1c;
        }

        .top-bar .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 按钮系统 ===== */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
            background: var(--color-gray-100);
            color: var(--color-gray-700);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        .btn:active {
            transform: translateY(0px) scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
        }

        .btn-success {
            background: linear-gradient(135deg, var(--color-success), #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669, var(--color-success));
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--color-danger), #e11d48);
            color: #fff;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
            background: linear-gradient(135deg, #e11d48, var(--color-danger));
        }

        .btn-secondary {
            background: var(--color-gray-200);
            color: var(--color-gray-700);
        }
        .btn-secondary:hover {
            background: var(--color-gray-300);
        }

        .btn-sm {
            padding: 2px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
            transform: none;
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow-card);
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.5);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 8px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            transition: var(--transition);
            outline: none;
            color: var(--color-gray-800);
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* ===== 树形结构 ===== */
        .tree-container {
            padding: 4px 0;
        }
        .tree-node {
            margin-left: 0;
            padding-left: 0;
            border-left: none;
            position: relative;
        }
        .tree-node .node-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--color-gray-50);
            margin-bottom: 4px;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }
        .tree-node .node-content:hover {
            background: #fff;
            border-left-color: var(--color-primary-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .tree-node .node-content .name {
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .tree-node .node-content .code {
            color: var(--color-gray-500);
            font-size: 12px;
            background: var(--color-gray-200);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .tree-node .node-content .badge {
            font-size: 11px;
            background: #e0e7ff;
            color: var(--color-primary-dark);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .tree-node .node-content .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .tree-node .node-content .toggle {
            cursor: pointer;
            font-size: 12px;
            color: var(--color-gray-400);
            transition: var(--transition);
            display: inline-block;
            width: 20px;
            text-align: center;
        }
        .tree-node .node-content .toggle:hover {
            color: var(--color-primary);
        }
        .tree-node .children {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
            margin-left: 24px;
            padding-left: 16px;
            border-left: 2px dashed var(--color-gray-200);
        }
        .tree-node.expanded > .children {
            max-height: 5000px;
            opacity: 1;
            margin-top: 6px;
        }

        /* ===== 表格 ===== */
        .items-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            margin-top: 12px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .items-table th {
            background: var(--color-gray-50);
            color: var(--color-gray-600);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--color-gray-200);
            font-size: 12px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--color-gray-100);
            vertical-align: middle;
            background: #fff;
            transition: var(--transition);
        }
        .items-table tr:hover td {
            background: var(--color-gray-50);
        }
        .items-table .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .items-table .status-badge {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.待售 { background: #fef3c7; color: #92400e; }
        .status-badge.在售 { background: #d1fae5; color: #065f46; }
        .status-badge.售出 { background: #e2e8f0; color: #475569; }

        /* ===== 批量操作栏 ===== */
        .batch-actions {
            display: flex;
            gap: 8px;
            margin: 8px 0 12px 0;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes scaleIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal h3 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 20px;
        }
        .modal label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            margin-top: 4px;
            transition: var(--transition);
            background: #fff;
            color: var(--color-gray-800);
        }
        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .modal .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
            align-items: center;
        }
        .modal .save-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--color-success);
            flex: 1;
        }

        /* ===== 登录页 ===== */
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        #login-overlay.active {
            display: flex;
        }
        #login-overlay::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            pointer-events: none;
        }
        #login-overlay::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.10) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            pointer-events: none;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.1);
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .login-box h2 {
            margin-top: 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 6px;
        }
        .login-box .subtitle {
            color: var(--color-gray-500);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            margin-top: 4px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        .login-box input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .login-box .btn-group {
            margin-top: 24px;
            justify-content: flex-end;
        }
        #login-error {
            color: var(--color-danger);
            margin-top: 12px;
            font-size: 14px;
        }

        /* ===== 打印预览 ===== */
        #print-preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
        }
        #print-preview-overlay.active {
            display: flex;
        }
        .print-preview-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .print-preview-box h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .print-info {
            background: var(--color-gray-50);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .print-info p {
            margin: 4px 0;
        }
        .print-settings label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .print-settings select,
        .print-settings input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            margin-top: 4px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        .print-settings select:focus,
        .print-settings input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .template-select-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
        }
        .template-card {
            border: 2px solid var(--color-gray-200);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            background: #fff;
        }
        .template-card:hover {
            border-color: var(--color-primary-light);
            transform: translateY(-2px);
        }
        .template-card.selected {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .template-card canvas {
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }
        .template-card .template-name {
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray-700);
        }
        #inner-preview-container {
            width: 100%;
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--color-gray-200);
            border-radius: 12px;
            background: var(--color-gray-50);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }
        #inner-preview-container canvas {
            border: 1px solid var(--color-gray-300);
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* ===== 加载动画 & 刷新按钮 ===== */
        .refresh-btn .refresh-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
        .refresh-btn .refresh-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }
        .refresh-btn.loading .refresh-icon svg {
            animation: spin-arrow 0.9s linear infinite;
        }
        @keyframes spin-arrow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--color-gray-200);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 选中状态 ===== */
        .item-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--color-primary);
            cursor: pointer;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .top-bar .actions { justify-content: flex-start; }
            .modal { padding: 20px; }
            .print-preview-box { padding: 20px; }
            .tree-node .node-content { flex-wrap: wrap; }
            .tree-node .node-content .actions { margin-left: 0; width: 100%; }
            .items-table { font-size: 12px; }
            .items-table th, .items-table td { padding: 8px 10px; }
        }

        /* ===== 通用工具 ===== */
        .flex { display: flex; align-items: center; gap: 8px; }
        .gap-2 { gap: 8px; }
        .ml-auto { margin-left: auto; }
        .text-muted { color: var(--color-gray-500); }
    </style>
</head>
<body>

<!-- 登录遮罩 -->
<div id="login-overlay" class="active">
    <div class="login-box">
        <h2>商品管理</h2>
        <p class="subtitle">登录以同步 GitHub Gist 数据</p>
        <label>GitHub Token</label>
        <input type="password" id="login-token" placeholder="ghp_xxxx" />
        <label>Gist ID</label>
        <input type="text" id="login-gistid" value="f13d97c430522e4851afbf3cd2331e14" />
        <label>文件名</label>
        <input type="text" id="login-filename" value="data.json" />
        <div class="btn-group" style="display:flex; gap:12px; margin-top:24px; justify-content:flex-end;">
            <button class="btn btn-primary" id="login-btn">登录</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- 主界面 -->
<div id="app-container" style="display:none;">
    <div class="container">
        <div class="top-bar">
            <div>
                <h1>📦 商品管理</h1>
                <div class="sub">
                    <span id="user-status">已登录</span>
                    <span id="lodop-status">⏳ 检测打印服务…</span>
                </div>
            </div>

<script src="CLodopFuncs.js" onerror="console.warn('本地CLodopFuncs.js加载失败，尝试远程...')"></script>
<script>
    (function() {
        function checkLodop() {
            return (typeof getLodop === 'function') || window.LODOP || window.CLodop;
        }
        if (checkLodop()) {
            console.log('C-Lodop 已加载');
            updateLodopStatus(true);
            return;
        }
        const isHttps = window.location.protocol === 'https:';
        const remoteUrl = isHttps ? 'https://localhost.lodop.net:8443/CLodopFuncs.js' : 'http://localhost:8000/CLodopFuncs.js';
        const script = document.createElement('script');
        script.src = remoteUrl;
        script.onload = function() {
            if (checkLodop()) {
                console.log('C-Lodop 从远程加载成功');
                updateLodopStatus(true);
            } else {
                console.warn('远程加载成功但未找到 LODOP 对象');
                updateLodopStatus(false);
            }
        };
        script.onerror = function() {
            console.error('远程 C-Lodop 加载失败');
            updateLodopStatus(false);
            alert('无法加载 C-Lodop 打印服务。\n请确保已安装 C-Lodop 并运行。\n如果网站是 HTTPS，请先手动信任证书。');
        };
        document.head.appendChild(script);
        setTimeout(function() {
            if (checkLodop()) updateLodopStatus(true);
        }, 3000);
    })();

    function updateLodopStatus(ok) {
        const el = document.getElementById('lodop-status');
        if (el) {
            if (ok) {
                el.textContent = '✅ 打印服务已就绪';
                el.className = 'lodop-status success';
            } else {
                el.textContent = '❌ 打印服务未连接，请安装 C-Lodop 并手动信任证书';
                el.className = 'lodop-status error';
            }
        }
    }

    function waitForLodop(callback, retries) {
        retries = retries || 10;
        if ((typeof getLodop === 'function') || window.LODOP || window.CLodop) {
            callback(true);
            return;
        }
        if (retries <= 0) {
            callback(false);
            return;
        }
        setTimeout(function() {
            waitForLodop(callback, retries - 1);
        }, 500);
    }

    window.addEventListener('load', function() {
        waitForLodop(function(ok) {
            updateLodopStatus(ok);
        });
    });
</script>

    // ---------- GitHub API ----------
    async function getGistContent(token, gistId, filename) {
        const url = `https://api.github.com/gists/${gistId}`;
        const resp = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`GitHub API 错误: ${err.message || resp.statusText}`);
        }
        const data = await resp.json();
        const files = data.files;
        if (!files || !files[filename]) return {};
        try { return JSON.parse(files[filename].content); } catch { return {}; }
    }

    async function updateGistContent(token, gistId, filename, content) {
        const contentStr = JSON.stringify(content, null, 2);
        const url = `https://api.github.com/gists/${gistId}`;
        const payload = { files: { [filename]: { content: contentStr } } };
        const resp = await fetch(url, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(`更新失败: ${err.message || resp.statusText}`);
        }
        return await resp.json();
    }

    // ---------- 登录/登出 ----------

            localStorage.setItem(STORAGE_KEYS.GIST_ID, gistId);
            localStorage.setItem(STORAGE_KEYS.FILENAME, filename);
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            gistData = data;
            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            userStatus.textContent = `已连接 (${gistId})`;

            populateFilter();

        localStorage.removeItem(STORAGE_KEYS.GIST_ID);
        localStorage.removeItem(STORAGE_KEYS.FILENAME);

        currentGistId = '';
        currentFilename = 'data.json';

        appContainer.style.display = 'none';
        loginOverlay.classList.add('active');

        loginToken.value = '';
        loginGistId.value = 'f13d97c430522e4851afbf3cd2331e14';

    }

    loginBtn.addEventListener('click', performLogin);
    document.querySelectorAll('#login-token, #login-gistid, #login-filename').forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') performLogin(); });
    });
    logoutBtn.addEventListener('click', logout);

    // ---------- 数据加载与渲染 ----------
    async function loadData() {
        try {
            const data = await getGistContent(currentToken, currentGistId, currentFilename);
            if (!data.products) data.products = {};
            gistData = data;
            renderTree();
            populateFilter();
            userStatus.textContent = `已连接 (${currentGistId})`;
            return true;
        } catch (e) {
            alert(`加载数据失败: ${e.message}`);
            return false;
        }
    }

    // ---------- 【核心】带合并逻辑的保存函数 ----------
    async function saveData() {
        try {
            // 1. 先拉取最新的远程数据
            let remoteData;
            try {
                remoteData = await getGistContent(currentToken, currentGistId, currentFilename);
            } catch (e) {
                // 拉取失败则直接提交（风险较高，但可保底）
                console.warn('拉取远程数据失败，强制覆盖提交', e);
                await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
                return true;
            }

            // 2. 如果没有远程数据，直接提交本地
            if (!remoteData || !remoteData.products || Object.keys(remoteData.products).length === 0) {
                await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
                return true;
            }

            // 3. 执行深度合并与冲突检测
            const merged = deepMergeAndConflict(gistData.products, remoteData.products);

            // 4. 如果合并函数返回 null，表示有冲突且用户取消了（或选择了放弃），则保存取消
            if (merged === null) {
                console.log('用户取消了保存');
                return false;
            }

            // 5. 将合并结果赋给当前内存，并提交
            gistData.products = merged;
            await updateGistContent(currentToken, currentGistId, currentFilename, gistData);
            return true;
        } catch (e) {
            alert(`保存失败: ${e.message}`);
            return false;
        }
    }

    // ---------- 合并与冲突处理函数 ----------
    function deepMergeAndConflict(local, remote) {
        const result = {};
        const allKeys = new Set([...Object.keys(local), ...Object.keys(remote)]);

        for (const key of allKeys) {
            const localNode = local[key];
            const remoteNode = remote[key];

            if (localNode && !remoteNode) {
                result[key] = JSON.parse(JSON.stringify(localNode));
                continue;
            }
            if (!localNode && remoteNode) {
                result[key] = JSON.parse(JSON.stringify(remoteNode));
                continue;
            }
            if (localNode && remoteNode) {
                const mergedNode = mergeNode(localNode, remoteNode, key);
                if (mergedNode === null) return null;
                result[key] = mergedNode;
            }
        }
        return result;
    }

    function mergeNode(localNode, remoteNode, nodeKey) {
        const merged = {};

        // 字段列表
        const fields = ['name', 'unified', 'cost', 'trackingNumber', 'orderNumber', 'remark', 'qrLinks'];
        let hasConflict = false;
        let conflictFields = [];

        for (const field of fields) {
            const localVal = localNode[field];
            const remoteVal = remoteNode[field];
            if (JSON.stringify(localVal) !== JSON.stringify(remoteVal)) {
                if (localVal !== undefined && remoteVal !== undefined && localVal !== null && remoteVal !== null) {
                    hasConflict = true;
                    conflictFields.push(field);
                    merged[field] = localVal; // 默认本地，后面可改
                } else {
                    merged[field] = localVal !== undefined ? localVal : remoteVal;
                }
            } else {
                merged[field] = localVal;
            }
        }

        // children 递归
        const mergedChildren = deepMergeAndConflict(localNode.children || {}, remoteNode.children || {});
        if (mergedChildren === null) return null;
        merged.children = mergedChildren;

        // items 合并
        const localItems = localNode.items || [];
        const remoteItems = remoteNode.items || [];
        const itemMap = new Map();
        remoteItems.forEach(item => itemMap.set(item.code, { source: 'remote', data: JSON.parse(JSON.stringify(item)) }));
        localItems.forEach(item => {
            const existing = itemMap.get(item.code);
            if (!existing) {
                itemMap.set(item.code, { source: 'local', data: JSON.parse(JSON.stringify(item)) });
            } else {
                // 比较字段
                const localData = item;
                const remoteData = existing.data;
                const fieldsItem = ['name', 'cost', 'trackingNumber', 'orderNumber', 'status', 'qrLinks', 'remark'];
                let itemConflict = false;
                for (const f of fieldsItem) {
                    if (JSON.stringify(localData[f]) !== JSON.stringify(remoteData[f])) {
                        itemConflict = true;
                        break;
                    }
                }
                if (itemConflict) {
                    const choice = confirm(
                        `⚠️ 库存项 "${item.code}" 在本地和远程都被修改。\n` +
                        `点击“确定”使用本地版本，点击“取消”使用远程版本。`
                    );
                    if (choice) {
                        existing.data = JSON.parse(JSON.stringify(localData));
                    } // 否则保留远程
                }
            }
        });
        merged.items = Array.from(itemMap.values()).map(entry => entry.data);

        // 处理字段冲突（用户选择）
        if (hasConflict) {
            const fieldStr = conflictFields.join(', ');
            const choice = confirm(
                `⚠️ 节点 "${nodeKey}" 的以下字段在本地和远程不一致：\n${fieldStr}\n\n` +
                `点击“确定”使用本地版本，点击“取消”使用远程版本。`
            );
            if (!choice) {
                for (const field of conflictFields) {
                    merged[field] = remoteNode[field];
                }
            }
        }

        return merged;
    }

    // ---------- 其余辅助函数（findNodeByCode, renderNode 等）与原先完全相同 ----------
    function findNodeByCode(code, obj) {
        if (!obj) obj = gistData.products;
        if (obj[code]) return obj[code];
        for (let key in obj) {
            if (obj[key].children) {
                const found = findNodeByCode(code, obj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findParentNode(code, parentObj) {
        if (!parentObj) parentObj = gistData.products;
        for (let key in parentObj) {
            if (parentObj[key].children && parentObj[key].children[code]) {
                return parentObj[key];
            }
            if (parentObj[key].children) {
                const found = findParentNode(code, parentObj[key].children);
                if (found) return found;
            }
        }
        return null;
    }

    function findItemInNode(node, itemCode) {
        if (node.items) {
            const item = node.items.find(it => it.code === itemCode);
            if (item) return item;
        }
        if (node.children) {
            for (let childKey in node.children) {
                const found = findItemInNode(node.children[childKey], itemCode);
                if (found) return found;
            }
        }
        return null;
    }

    function generateRootCode() {
        const keys = Object.keys(gistData.products).filter(k => /^A\d{3}$/.test(k));
        let maxNum = 0;
        keys.forEach(k => { const num = parseInt(k.substring(1)); if (num > maxNum) maxNum = num; });
        const next = maxNum + 1;
        if (next > 999) { alert('达到上限'); return null; }
        return 'A' + String(next).padStart(3, '0');
    }

    function generateChildCode(parentCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) return null;
        if (!parent.children) parent.children = {};
        const children = parent.children;
        const keys = Object.keys(children).filter(k => k.startsWith(parentCode + '/B'));
        let maxNum = 0;
        keys.forEach(k => {
            const parts = k.split('/');
            const last = parts[parts.length - 1];
            if (last.startsWith('B')) {
                const num = parseInt(last.substring(1));
                if (num > maxNum) maxNum = num;
            }
        });
        const next = maxNum + 1;
        if (next > 999) { alert('子编码超过 B999'); return null; }
        return parentCode + '/B' + String(next).padStart(3, '0');
    }

    function generateItemCode(parentCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) return null;
        if (!parent.items) parent.items = [];
        const items = parent.items;
        let maxNum = 0;
        items.forEach(item => {
            const parts = item.code.split('/');
            const last = parts[parts.length - 1];
            const num = parseInt(last);
            if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        const next = maxNum + 1;
        if (next > 999) { alert('库存编码超过 999'); return null; }
        return parentCode + '/' + String(next).padStart(3, '0');
    }

        if (status === '售出') return '#94a3b8';
        return '#94a3b8';
    }

    function renderNode(code, node, depth) {
        const hasChildren = node.children && Object.keys(node.children).length > 0;
        const hasItems = node.items && node.items.length > 0;
        const unified = node.unified !== false;
        const badge = unified ? '统一' : '不统一';
        const badgeColor = unified ? '#dbeafe' : '#fef3c7';

        let childrenHtml = '';
        if (hasChildren) {
            const childKeys = Object.keys(node.children).sort();
            childrenHtml = childKeys.map(c => renderNode(c, node.children[c], depth + 1)).join('');
        }

        let itemsHtml = '';
        if (hasItems) {
            itemsHtml = `
                <div class="batch-actions">
                    <button class="btn btn-secondary btn-sm" onclick="batchPrintItems('${code}')">批量打印</button>

                <table class="items-table">

                        <th><input type="checkbox" class="select-all" data-parent="${code}" onchange="toggleSelectAll(this, '${code}')"></th>
                        <th>库存编码</th><th>名称</th><th>成本</th><th>快递单号</th><th>订单号</th><th>状态</th><th>操作</th>
                    </tr></thead>
                    <tbody>
                        ${node.items.map((item, idx) => `
                            <tr>
                                <td><input type="checkbox" class="item-checkbox" data-parent="${code}" data-item-code="${item.code}"></td>
                                <td>${item.code}</td>
                                <td>${item.name || ''}</td>
                                <td>${item.cost !== undefined ? item.cost : ''}</td>
                                <td>${item.trackingNumber || ''}</td>
                                <td>${item.orderNumber || ''}</td>
                                <td><span class="status-badge ${item.status || '在售'}">${item.status || '在售'}</span></td>
                                <td class="actions">
                                    <button class="btn btn-primary btn-sm" onclick="editItem('${code}','${item.code}')">编辑</button>
                                    <button class="btn btn-primary btn-sm" onclick="printItemLabel('${code}','${item.code}')">打印标签</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteItem('${code}','${item.code}')">删除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        const actions = `
            <button class="btn btn-secondary btn-sm" onclick="openNodeModal('edit','${code}')">编辑</button>
            ${unified ? `<button class="btn btn-secondary btn-sm" onclick="openNodeModal('add','','${code}')">添加子类</button>` :
                        `<button class="btn btn-success btn-sm" onclick="openItemModal('add','${code}')">添加库存</button>`}
            <button class="btn btn-primary btn-sm" onclick="printNodeLabel('${code}')">打印标签</button>
            <button class="btn btn-danger btn-sm" onclick="deleteNode('${code}')">删除</button>
        `;

        const toggleIcon = (hasChildren || hasItems) ? `<span class="toggle" onclick="toggleNode('${code}')">▼</span>` : '';

        return `
            <div class="tree-node" data-code="${code}" data-depth="${depth}">
                <div class="node-content">
                    ${toggleIcon}
                    <span class="name" onclick="toggleNode('${code}')">${node.name || code}</span>
                    <span class="code">${code}</span>
                    <span class="badge" style="background:${badgeColor};">${badge}</span>
                    ${node.orderNumber ? `<span class="badge" style="background:#e0e7ff;">📋${node.orderNumber}</span>` : ''}
                    <span class="actions">${actions}</span>
                </div>
                ${hasChildren ? `<div class="children">${childrenHtml}</div>` : ''}
                ${hasItems ? `<div class="children">${itemsHtml}</div>` : ''}
            </div>
        `;
    }

    function buildTreeHtml() {
        const products = gistData.products || {};
        const codes = Object.keys(products).sort();
        if (codes.length === 0) return '<p style="color:var(--color-gray-400);">暂无商品，请添加大类</p>';
        return codes.map(code => renderNode(code, products[code], 0)).join('');
    }

    function renderTree() {
        const filter = filterSelect.value;
        const searchTerm = searchInput.value.trim().toLowerCase();
        let fullHtml = buildTreeHtml();
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = fullHtml;
        if (filter !== 'all') {
            const rootNodes = tempDiv.querySelectorAll('.tree-node[data-depth="0"]');
            rootNodes.forEach(node => {
                const code = node.dataset.code;
                if (code !== filter) {
                    node.style.display = 'none';
                } else {
                    node.classList.add('expanded');
                    const allChildren = node.querySelectorAll('.tree-node');
                    allChildren.forEach(c => c.style.display = '');
                    allChildren.forEach(c => c.classList.add('expanded'));
                }
            });
        } else {
            tempDiv.querySelectorAll('.tree-node').forEach(n => n.classList.add('expanded'));
        }
        if (searchTerm) {
            const allNodes = tempDiv.querySelectorAll('.tree-node');
            allNodes.forEach(node => {
                const name = node.querySelector('.name')?.textContent?.toLowerCase() || '';
                const code = node.dataset.code?.toLowerCase() || '';
                if (name.includes(searchTerm) || code.includes(searchTerm)) {
                    node.style.display = '';
                    let parent = node.parentElement.closest('.tree-node');
                    while (parent) {
                        parent.classList.add('expanded');
                        parent.style.display = '';
                        parent = parent.parentElement.closest('.tree-node');
                    }
                } else {
                    const hasMatch = node.querySelector('.tree-node') &&
                        Array.from(node.querySelectorAll('.tree-node')).some(child => child.style.display !== 'none');
                    if (!hasMatch) {
                        node.style.display = 'none';
                    }
                }
            });
        }
        treeContainer.innerHTML = tempDiv.innerHTML;

    async function saveNode() {
        const mode = modalNodeMode.value;
        let code = modalNodeCode.value.trim();
        const name = modalNodeName.value.trim();
        if (!name) { alert('名称不能为空'); return; }
        const unified = modalNodeUnified.value === 'true';
        const cost = parseFloat(modalNodeCost.value);
        const tracking = modalNodeTracking.value.trim();
        const order = modalNodeOrder.value.trim();
        const qrLinks = modalNodeQrlinks.value.split(/[,，\n]+/).map(s => s.trim()).filter(s => s);
        const remark = modalNodeRemark.value.trim();

        if (!code) {
            if (mode === 'add') {
                const parentCode = modalNodeParent.value;
                code = parentCode ? generateChildCode(parentCode) : generateRootCode();
                if (!code) { alert('编码生成失败'); return; }
            } else {
                alert('编码不能为空');
                return;
            }
        }

        const originalCode = modalNodeOriginalCode.value;

        modalNodeSave.disabled = true;
        modalNodeSave.textContent = '保存中…';
        nodeSaveStatus.innerHTML = '<div class="spinner"></div>';

        try {
            if (mode === 'add') {
                if (findNodeByCode(code)) { alert('编码已存在'); resetSaveButton(modalNodeSave, nodeSaveStatus); return; }
                const newNode = {
                    name: name,
                    unified: unified,
                    children: {},
                    cost: isNaN(cost) ? undefined : cost,
                    trackingNumber: tracking || undefined,
                    orderNumber: order || undefined,
                    qrLinks: qrLinks.length ? qrLinks : undefined,
                    remark: remark || undefined
                };
                const parentCode = modalNodeParent.value;
                if (!parentCode) {
                    gistData.products[code] = newNode;
                } else {
                    const parent = findNodeByCode(parentCode);
                    if (parent) {
                        if (!parent.children) parent.children = {};
                        parent.children[code] = newNode;
                    } else {
                        alert('父节点不存在');
                        resetSaveButton(modalNodeSave, nodeSaveStatus);
                        return;
                    }
                }
            } else {
                const node = findNodeByCode(originalCode);
                if (!node) { alert('节点不存在'); resetSaveButton(modalNodeSave, nodeSaveStatus); return; }
                node.name = name;
                node.unified = unified;
                node.cost = isNaN(cost) ? undefined : cost;
                node.trackingNumber = tracking || undefined;
                node.orderNumber = order || undefined;
                node.qrLinks = qrLinks.length ? qrLinks : undefined;
                node.remark = remark || undefined;
                if (code !== originalCode) {
                    if (findNodeByCode(code)) { alert('新编码已被占用'); resetSaveButton(modalNodeSave, nodeSaveStatus); return; }
                    const parent = findParentNode(originalCode);
                    if (parent) {
                        delete parent.children[originalCode];
                        parent.children[code] = node;
                    } else if (gistData.products[originalCode]) {
                        delete gistData.products[originalCode];
                        gistData.products[code] = node;
                    } else {
                        alert('未找到父节点');
                        resetSaveButton(modalNodeSave, nodeSaveStatus);
                        return;
                    }
                    if (node.children && Object.keys(node.children).length > 0) {
                        alert('⚠️ 编码已更改，但子节点编码未自动更新，请手动调整子节点编码以避免数据混乱。');
                    }
                }
            }

            const success = await saveData(); // 使用合并后的保存
            if (success) {
                nodeSaveStatus.innerHTML = '✓ 已保存';
                modalNodeSave.textContent = '已保存';
                renderTree();
                populateFilter();
                setTimeout(() => {
                    modalNodeOverlay.classList.remove('active');
                    resetSaveButton(modalNodeSave, nodeSaveStatus);
                }, 3000);
            } else {
                resetSaveButton(modalNodeSave, nodeSaveStatus);
            }
        } catch (e) {
            alert('保存出错: ' + e.message);
            resetSaveButton(modalNodeSave, nodeSaveStatus);
        }
    }

                status: status,

    function escapeHtml(text) {
        if (typeof text !== 'string') return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getTextLines(text, fontSizePt, fontName, bold, maxWidthPx) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSizePx = fontSizePt * 1.3333;
        ctx.font = `${bold ? 'bold ' : ''}${fontSizePx}px ${fontName || 'SimHei'}`;
        
        const lines = [];
        let currentLine = '';
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const testLine = currentLine + char;
            const metrics = ctx.measureText(testLine);
            
            if (metrics.width > maxWidthPx && currentLine !== '') {
                lines.push(currentLine);
                currentLine = char;
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine) {
            lines.push(currentLine);
        }
        return lines;
    }

    function calcDynamicFontSize(text, maxWidthMm, maxHeightMm, baseSize, fontName, bold) {
        const displayText = '内部编码: ' + (text || '').toString();
        const maxWidthPx = maxWidthMm * 3.7795;
        const maxHeightPx = maxHeightMm * 3.7795;
        const lineHeightRatio = 1.05;
        
        let low = 2;
        let high = 40;
        let bestSize = low;
        
        while (high - low > 0.05) {
            const mid = (low + high) / 2;
            const lines = getTextLines(displayText, mid, fontName, bold, maxWidthPx);
            const fontSizePx = mid * 1.3333;
            const totalHeightPx = lines.length * fontSizePx * lineHeightRatio;
            
            if (totalHeightPx <= maxHeightPx) {
                bestSize = mid;
                low = mid;
            } else {
                high = mid;
            }
        }
        return bestSize;
    }

        if (!LODOP) return [];
        try {
            const count = LODOP.GET_PRINTER_COUNT();
            const printers = [];
            for (let i = 0; i < count; i++) {
                printers.push(LODOP.GET_PRINTER_NAME(i));
            }
            return printers;
        } catch (e) {
            console.error('获取打印机列表失败:', e);
            return [];
        }
    }

    function drawTemplatePreview(canvas, template, data) {
        const scale = canvas.width / template.paperWidth;
        canvas.height = template.paperHeight * scale;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#cccccc';
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        template.elements.forEach(el => {
            const x = el.x * scale;
            const y = el.y * scale;
            const width = el.width * scale;
            const height = el.height * scale;

            if (el.type === 'text') {
                ctx.fillStyle = '#000000';
                let text = '';
                if (el.field === 'static') {
                    text = el.text || '';
                } else if (data && data[el.field] !== undefined) {
                    let rawData = data[el.field].toString();
                    if (el.showLastLevelOnly && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    text = rawData;
                    if (el.prefix) text = el.prefix + text;
                } else {
                    text = (el.prefix || '') + 'C001'; 
                }
                
                let fontSize = el.fontSize;
                if (el.dynamicSize) {
                    const demoText = text.replace(el.prefix || '', '');
                    fontSize = calcDynamicFontSize(demoText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                }
                const fontSizePx = fontSize * 0.3528 * scale; 
                ctx.font = `${el.bold ? 'bold ' : ''}${fontSizePx}px ${el.fontName || 'SimHei'}, sans-serif`;
                
                const maxWidthPx = el.width * scale;
                const lineHeightPx = fontSizePx * 1.05;
                
                const lines = [];
                let currentLine = '';
                const chars = text.split('');
                for (let i = 0; i < chars.length; i++) {
                    const testLine = currentLine + chars[i];
                    if (ctx.measureText(testLine).width > maxWidthPx && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = chars[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const totalTextHeightPx = lines.length * lineHeightPx;
                const startY = y + (height - totalTextHeightPx) / 2;
                
                ctx.textAlign = el.align === 'center' ? 'center' : 'left';
                ctx.textBaseline = 'middle';
                
                lines.forEach((line, index) => {
                    const drawX = el.align === 'center' ? (x + width / 2) : x;
                    const drawY = startY + (index * lineHeightPx) + (lineHeightPx / 2);
                    ctx.fillText(line, drawX, drawY);
                });
            } else if (el.type === 'barcode') {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(x, y, width, height);
                ctx.fillStyle = '#333333';
                ctx.font = `${Math.max(scale * 2, 8)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const codeText = data && data[el.field] ? data[el.field] : '条码区域';
                let displayText = codeText;
                if (displayText.length > 15) {
                    displayText = displayText.substring(0, 12) + '...';
                }
                ctx.fillText(displayText, x + width / 2, y + height / 2);
            }
        });
    }

    function renderInnerPreview(dataList, template) {
        const container = document.getElementById('inner-preview-container');
        container.innerHTML = '';
        
        dataList.forEach(data => {
            const canvas = document.createElement('canvas');
            canvas.width = template.paperWidth * 3.78; 
            drawTemplatePreview(canvas, template, data);
            container.appendChild(canvas);
        });
    }

    function openPrintPreview(dataList) {
        templateSelectContainer.innerHTML = '';
        printTemplates.forEach((tpl, idx) => {
            const card = document.createElement('div');
            card.className = 'template-card' + (idx === selectedTemplateIndex ? ' selected' : '');
            card.dataset.index = idx;
            const canvas = document.createElement('canvas');
            canvas.width = 150;
            drawTemplatePreview(canvas, tpl, null);
            card.appendChild(canvas);
            const nameDiv = document.createElement('div');
            nameDiv.className = 'template-name';
            nameDiv.textContent = tpl.name;
            card.appendChild(nameDiv);
            card.addEventListener('click', () => {
                document.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedTemplateIndex = idx;
                renderInnerPreview(window.currentPrintDataList, printTemplates[idx]);
            });
            templateSelectContainer.appendChild(card);
        });

        if (dataList.length === 1) {
            const d = dataList[0];
            printInfoDiv.innerHTML = `<p><strong>编码：</strong>${d.code || ''}</p><p><strong>名称：</strong>${d.name || ''}</p>`;
        } else {
            printInfoDiv.innerHTML = `<p><strong>批量打印：</strong>已选 ${dataList.length} 个标签</p>`;
        }

        printPreviewOverlay.classList.add('active');

        const printers = getPrinterList();
        printerSelect.innerHTML = '';
        if (printers.length === 0) {
            const option = document.createElement('option');
            option.textContent = '未检测到打印机';
            option.disabled = true;
            printerSelect.appendChild(option);
        } else {
            let defaultIndex = 0;
            const virtualKeywords = ['pdf', 'wps', 'fax', 'virtual', 'one note', 'onenote', 'microsoft print to pdf', 'print to pdf'];
            for (let i = 0; i < printers.length; i++) {
                const name = printers[i].toLowerCase();
                if (!virtualKeywords.some(k => name.includes(k))) {
                    defaultIndex = i;
                    break;
                }
            }
            printers.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = name;
                printerSelect.appendChild(option);
            });
            printerSelect.value = defaultIndex;
        }

        printCopiesInput.value = 1;
        window.currentPrintDataList = dataList;
        
        renderInnerPreview(dataList, printTemplates[selectedTemplateIndex]);
    }

    function buildLodopPrintData(LODOP, dataList, template, printerIndex) {
        LODOP.PRINT_INIT(template.name || '标签打印');
        LODOP.SET_PRINT_PAGESIZE(1, template.paperWidth * 10, template.paperHeight * 10, '');
        if (!isNaN(printerIndex) && printerIndex >= 0) {
            LODOP.SET_PRINTER_INDEX(printerIndex);
        }

        dataList.forEach((data, i) => {
            template.elements.forEach((el) => {
                let value = '';
                if (el.field === 'static') {
                    value = el.text || '';
                } else {
                    let rawData = data[el.field] !== undefined ? data[el.field] : '';
                    if (el.showLastLevelOnly && typeof rawData === 'string' && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    value = rawData;
                }
                if (el.prefix && value) {
                    value = el.prefix + value;
                }

                const x = el.x + 'mm';
                const y = el.y + 'mm';
                const width = el.width + 'mm';
                const height = el.height + 'mm';

                if (el.type === 'text') {
                    let finalFontSize = el.fontSize;
                    if (el.dynamicSize && value) {
                        const codeText = data[el.field] || '';
                        finalFontSize = calcDynamicFontSize(codeText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                    }
                    
                    const htmlContent = `
                        <div style="
                            width: ${el.width}mm; 
                            height: ${el.height}mm; 
                            display: table;
                            font-family: ${el.fontName || 'SimHei'}, sans-serif; 
                            font-size: ${finalFontSize}pt; 
                            font-weight: ${el.bold ? 'bold' : 'normal'}; 
                            text-align: ${el.align || 'center'};
                            line-height: 1.05; 
                            word-break: break-all; 
                            overflow: hidden;
                            margin: 0;
                            padding: 0;
                        ">
                            <div style="display: table-cell; vertical-align: middle;">
                                ${escapeHtml(value)}
                            </div>
                        </div>
                    `;
                    LODOP.ADD_PRINT_HTM(y, x, width, height, htmlContent);
                } else if (el.type === 'barcode') {
                    let barcodeValue = data[el.field] !== undefined ? data[el.field] : '';
                    LODOP.ADD_PRINT_BARCODE(y, x, width, height, el.barcodeType, barcodeValue);
                    LODOP.SET_PRINT_STYLEA(0, "Horient", 2);
                    LODOP.SET_PRINT_STYLEA(0, "Alignment", 2);
                }
            });
            if (i < dataList.length - 1) {
                LODOP.NEWPAGE();
            }
        });
    }

    function executePrint() {
        const LODOP = getLodopInstance();
        if (!LODOP) return;

        const dataList = window.currentPrintDataList;
        if (!dataList || dataList.length === 0) return;

        const template = printTemplates[selectedTemplateIndex];
        const printerIndex = parseInt(printerSelect.value);
        const copies = parseInt(printCopiesInput.value) || 1;

        if (isNaN(printerIndex)) {
            alert('请选择打印机');
            return;
        }

        LODOP.SET_PRINT_COPIES(copies);
        buildLodopPrintData(LODOP, dataList, template, printerIndex);
        LODOP.PRINT();

        printPreviewOverlay.classList.remove('active');
    }

    function showLodopPreview() {
        const LODOP = getLodopInstance();
        if (!LODOP) return;

        const dataList = window.currentPrintDataList;
        if (!dataList || dataList.length === 0) return;

        const template = printTemplates[selectedTemplateIndex];
        const printerIndex = parseInt(printerSelect.value);

        buildLodopPrintData(LODOP, dataList, template, printerIndex);
        LODOP.PREVIEW();
    }

    window.printNodeLabel = function(code) {
        const node = findNodeByCode(code);
        if (!node) { alert('节点不存在'); return; }
        const data = {
            code: code,
            name: node.name || '',
            cost: node.cost,
            orderNumber: node.orderNumber,
            trackingNumber: node.trackingNumber,
            qrLinks: node.qrLinks
        };
        openPrintPreview([data]);
    };

    window.printItemLabel = function(parentCode, itemCode) {
        const parent = findNodeByCode(parentCode);
        if (!parent) { alert('父节点不存在'); return; }
        const item = parent.items ? parent.items.find(it => it.code === itemCode) : null;
        if (!item) { alert('库存项不存在'); return; }
        const data = {
            code: itemCode,
            name: item.name || parent.name || '',
            cost: item.cost,
            orderNumber: item.orderNumber,
            trackingNumber: item.trackingNumber,
            qrLinks: item.qrLinks
        };
        openPrintPreview([data]);
    };

    printPreviewCancel.addEventListener('click', () => printPreviewOverlay.classList.remove('active'));
    printPreviewBtn.addEventListener('click', showLodopPreview);
    printExecute.addEventListener('click', executePrint);

    // ---------- 自动登录 ----------
    (function autoLogin() {
        const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
        const gistId = localStorage.getItem(STORAGE_KEYS.GIST_ID);
        const filename = localStorage.getItem(STORAGE_KEYS.FILENAME) || 'data.json';
        if (token && gistId) {
            loginToken.value = token;
            loginGistId.value = gistId;
            loginFilename.value = filename;
            performLogin();
        } else {
            loginOverlay.classList.add('active');
            appContainer.style.display = 'none';
        }
    })();

    console.log('管理后台已加载（带合并冲突处理）');
</script>
