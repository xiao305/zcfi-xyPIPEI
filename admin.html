<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品管理后台（带标签打印）</title>
    <link rel="icon" href="data:," />
    <style>
        /* ===== 全局重置与变量 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #4f46e5;
            --color-primary-light: #818cf8;
            --color-primary-dark: #4338ca;
            --color-success: #10b981;
            --color-success-light: #34d399;
            --color-danger: #f43f5e;
            --color-danger-light: #fb7185;
            --color-warning: #f59e0b;
            --color-gray-50: #f8fafc;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-400: #94a3b8;
            --color-gray-500: #64748b;
            --color-gray-600: #475569;
            --color-gray-700: #334155;
            --color-gray-800: #1e293b;
            --color-gray-900: #0f172a;
            --radius: 16px;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f1f5f9 0%, #e9eef3 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--color-gray-800);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-gray-100);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-gray-300);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-gray-400);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .top-bar h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .top-bar .sub {
            font-size: 14px;
            color: var(--color-gray-500);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-bar .sub #lodop-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            transition: var(--transition);
        }
        .top-bar .sub #lodop-status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .top-bar .sub #lodop-status.error {
            background: #fce4ec;
            color: #b91c1c;
        }

        .top-bar .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 按钮系统 ===== */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
            background: var(--color-gray-100);
            color: var(--color-gray-700);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        .btn:active {
            transform: translateY(0px) scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
        }

        .btn-success {
            background: linear-gradient(135deg, var(--color-success), #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669, var(--color-success));
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--color-danger), #e11d48);
            color: #fff;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
            background: linear-gradient(135deg, #e11d48, var(--color-danger));
        }

        .btn-secondary {
            background: var(--color-gray-200);
            color: var(--color-gray-700);
        }
        .btn-secondary:hover {
            background: var(--color-gray-300);
        }

        .btn-sm {
            padding: 2px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
            transform: none;
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow-card);
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.5);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 8px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            transition: var(--transition);
            outline: none;
            color: var(--color-gray-800);
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* ===== 树形结构 ===== */
        .tree-container {
            padding: 4px 0;
        }
        .tree-node {
            margin-left: 0;
            padding-left: 0;
            border-left: none;
            position: relative;
        }
        .tree-node .node-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--color-gray-50);
            margin-bottom: 4px;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }
        .tree-node .node-content:hover {
            background: #fff;
            border-left-color: var(--color-primary-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .tree-node .node-content .name {
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .tree-node .node-content .code {
            color: var(--color-gray-500);
            font-size: 12px;
            background: var(--color-gray-200);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .tree-node .node-content .badge {
            font-size: 11px;
            background: #e0e7ff;
            color: var(--color-primary-dark);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .tree-node .node-content .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .tree-node .node-content .toggle {
            cursor: pointer;
            font-size: 12px;
            color: var(--color-gray-400);
            transition: var(--transition);
            display: inline-block;
            width: 20px;
            text-align: center;
        }
        .tree-node .node-content .toggle:hover {
            color: var(--color-primary);
        }
        .tree-node .children {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
            margin-left: 24px;
            padding-left: 16px;
            border-left: 2px dashed var(--color-gray-200);
        }
        .tree-node.expanded > .children {
            max-height: 5000px;
            opacity: 1;
            margin-top: 6px;
        }

        /* ===== 表格 ===== */
        .items-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            margin-top: 12px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .items-table th {
            background: var(--color-gray-50);
            color: var(--color-gray-600);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--color-gray-200);
            font-size: 12px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--color-gray-100);
            vertical-align: middle;
            background: #fff;
            transition: var(--transition);
        }
        .items-table tr:hover td {
            background: var(--color-gray-50);
        }
        .items-table .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .items-table .status-badge {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.待售 { background: #fef3c7; color: #92400e; }
        .status-badge.在售 { background: #d1fae5; color: #065f46; }
        .status-badge.售出 { background: #e2e8f0; color: #475569; }

        /* ===== 批量操作栏 ===== */
        .batch-actions {
            display: flex;
            gap: 8px;
            margin: 8px 0 12px 0;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes scaleIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal h3 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 20px;
        }
        .modal label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            margin-top: 4px;
            transition: var(--transition);
            background: #fff;
            color: var(--color-gray-800);
        }
        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .modal .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
            align-items: center;
        }
        .modal .save-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--color-success);
            flex: 1;
        }

        /* ===== 登录页 ===== */
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        #login-overlay.active {
            display: flex;
        }
        #login-overlay::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            pointer-events: none;
        }
        #login-overlay::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.10) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            pointer-events: none;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.1);
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .login-box h2 {
            margin-top: 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 6px;
        }
        .login-box .subtitle {
            color: var(--color-gray-500);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            margin-top: 4px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        .login-box input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .login-box .btn-group {
            margin-top: 24px;
            justify-content: flex-end;
        }
        #login-error {
            color: var(--color-danger);
            margin-top: 12px;
            font-size: 14px;
        }

        /* ===== 打印预览 ===== */
        #print-preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
        }
        #print-preview-overlay.active {
            display: flex;
        }
        .print-preview-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .print-preview-box h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .print-info {
            background: var(--color-gray-50);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .print-info p {
            margin: 4px 0;
        }
        .print-settings label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            font-size: 13px;
            color: var(--color-gray-700);
        }
        .print-settings select,
        .print-settings input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            margin-top: 4px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        .print-settings select:focus,
        .print-settings input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .template-select-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
        }
        .template-card {
            border: 2px solid var(--color-gray-200);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            background: #fff;
        }
        .template-card:hover {
            border-color: var(--color-primary-light);
            transform: translateY(-2px);
        }
        .template-card.selected {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .template-card canvas {
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }
        .template-card .template-name {
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray-700);
        }
        #inner-preview-container {
            width: 100%;
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--color-gray-200);
            border-radius: 12px;
            background: var(--color-gray-50);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }
        #inner-preview-container canvas {
            border: 1px solid var(--color-gray-300);
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* ===== 加载动画 & 刷新按钮 ===== */
        .refresh-btn .refresh-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
        .refresh-btn .refresh-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }
        .refresh-btn.loading .refresh-icon svg {
            animation: spin-arrow 0.9s linear infinite;
        }
        @keyframes spin-arrow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--color-gray-200);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 选中状态 ===== */
        .item-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--color-primary);
            cursor: pointer;
        }

        /* ===== 状态徽章（统一词表：待售/在售/售出） ===== */
        .status-badge.status-pending { background: #fef3c7; color: #92400e; }
        .status-badge.status-onsale { background: #d1fae5; color: #065f46; }
        .status-badge.status-sold { background: #e2e8f0; color: #475569; }
        .status-badge.status-unknown { background: #fee2e2; color: #991b1b; }

        /* ===== 顶栏同步信息 ===== */
        .sync-meta {
            font-size: 12px;
            color: var(--color-gray-500);
            white-space: nowrap;
        }

        /* ===== 严格加载错误遮罩 ===== */
        #load-error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        #load-error-overlay.active { display: flex; }
        .load-error-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .load-error-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 14px;
        }
        .load-error-code {
            display: inline-block;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            border-radius: 20px;
            padding: 2px 10px;
            margin-bottom: 12px;
        }
        #load-error-message {
            font-size: 14px;
            line-height: 1.7;
            color: var(--color-danger);
            word-break: break-word;
        }
        #load-error-hint {
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--color-gray-500);
        }

<script src="CLodopFuncs.js" onerror="console.warn('本地CLodopFuncs.js加载失败，尝试远程...')"></script>
<script>
    (function() {
        function checkLodop() {
            return (typeof getLodop === 'function') || window.LODOP || window.CLodop;
        }
        if (checkLodop()) {
            console.log('C-Lodop 已加载');
            updateLodopStatus(true);
            return;
        }
        const isHttps = window.location.protocol === 'https:';
        const remoteUrl = isHttps ? 'https://localhost.lodop.net:8443/CLodopFuncs.js' : 'http://localhost:8000/CLodopFuncs.js';
        const script = document.createElement('script');
        script.src = remoteUrl;
        script.onload = function() {
            if (checkLodop()) {
                console.log('C-Lodop 从远程加载成功');
                updateLodopStatus(true);
            } else {
                console.warn('远程加载成功但未找到 LODOP 对象');
                updateLodopStatus(false);
            }
        };
        script.onerror = function() {
            console.error('远程 C-Lodop 加载失败');
            updateLodopStatus(false);
            alert('无法加载 C-Lodop 打印服务。\n请确保已安装 C-Lodop 并运行。\n如果网站是 HTTPS，请先手动信任证书。');
        };
        document.head.appendChild(script);
        setTimeout(function() {
            if (checkLodop()) updateLodopStatus(true);
        }, 3000);
    })();

    function updateLodopStatus(ok) {
        const el = document.getElementById('lodop-status');
        if (el) {
            if (ok) {
                el.textContent = '✅ 打印服务已就绪';
                el.className = 'lodop-status success';
            } else {
                el.textContent = '❌ 打印服务未连接，请安装 C-Lodop 并手动信任证书';
                el.className = 'lodop-status error';
            }
        }
    }

    function waitForLodop(callback, retries) {
        retries = retries || 10;
        if ((typeof getLodop === 'function') || window.LODOP || window.CLodop) {
            callback(true);
            return;
        }
        if (retries <= 0) {
            callback(false);
            return;
        }
        setTimeout(function() {
            waitForLodop(callback, retries - 1);
        }, 500);
    }

    window.addEventListener('load', function() {
        waitForLodop(function(ok) {
            updateLodopStatus(ok);
        });
    });
</script>

var printerSelect = $('printer-select');

// ============================================================
// 状态词表与统一展示
// ============================================================
function fillStatusSelect(select, selected) {
    if (!select) return;
    while (select.firstChild) select.removeChild(select.firstChild);
    STATUS_LIST.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
    });
    var value = Z.normalizeStatus(selected === undefined || selected === null ? STATUS.ON_SALE : selected);
    if (STATUS_LIST.indexOf(value) === -1) {
        var legacy = document.createElement('option');
        legacy.value = value;
        legacy.textContent = value + '（历史值）';
        select.appendChild(legacy);
    }
    select.value = value;
}

/** 读取/保存后的文档在内存里统一状态词表（兼容历史“已售”） */
function normalizeDoc(doc) {
    if (!doc || !Z.isPlainObject(doc.products)) return;
    Z.walk(doc.products, function (node) {
        if (node.status !== undefined) node.status = Z.normalizeStatus(node.status);
        if (Array.isArray(node.items)) {
            node.items.forEach(function (item) {
                if (item && item.status !== undefined) item.status = Z.normalizeStatus(item.status);
            });
        }
    });
}

// ============================================================
// 登录 / 加载 / 同步元信息 / 错误态
// ============================================================
function updateSyncMeta() {
    var ts = syncMeta.updatedAt || syncMeta.lastSyncAt;
    setText(syncTimeEl, '最后同步：' + (ts ? Z.formatDateTime(ts) : '—'));
    var rev = syncMeta.revision ? String(syncMeta.revision) : '';
    setText(revisionEl, '版本：' + (rev ? rev.slice(0, 7) : '未知'));
    refreshBtn.title = ts ? '最后同步：' + Z.formatDateTime(ts) : '刷新数据';
}

function setRefreshing(on) {
    if (!refreshBtn) return;
    refreshBtn.classList.toggle('loading', !!on);
    refreshBtn.disabled = !!on;
    refreshBtn.setAttribute('aria-busy', on ? 'true' : 'false');
}

function applyLoaded(result) {
    // baseDoc 保留远端原始值（例如历史“已售”），用于字段级 diff / 冲突检测；
    // gistData 做展示态归一（“已售”显示为“售出”）。
    var rawDoc = Z.clone(result.data);
    normalizeDoc(result.data);
    gistData = result.data;
    baseDoc = rawDoc;
    syncMeta = {
        updatedAt: result.updatedAt || null,
        revision: result.revision || null,
        size: result.size || null,
        lastSyncAt: Date.now()
    };
    readOnly = false;
    hideLoadError();
    updateSyncMeta();
    populateFilter();
    renderTree();
    setText(userStatus, '已连接 (' + currentGistId + ')');
    setRefreshing(false);
}

function showLoadError(err, context) {
    readOnly = true;
    var code = err && err.code ? err.code : 'UNKNOWN';
    setText(loadErrorCode, '错误码：' + code);
    setText(loadErrorMessage, Z.friendlyError(err));
    loadErrorHint.textContent = (context === 'refresh' ? '刷新失败。' : '数据未能加载。') +
        '当前处于只读保护状态：在重新加载成功之前，页面不会写入任何数据，避免覆盖远端内容。';
    loginOverlay.classList.remove('active');
    loadErrorOverlay.classList.add('active');
    setText(userStatus, '未连接（只读保护）');
    setRefreshing(false);
}

function hideLoadError() {
    loadErrorOverlay.classList.remove('active');
}

function showLoginForm() {
    readOnly = true;
    hideLoadError();
    appContainer.style.display = 'none';
    loginOverlay.classList.add('active');
    setText(userStatus, '未连接');
}

function refreshFromRemote() {
    if (isLoading || isSaving) return Promise.resolve(false);
    if (!currentToken) { showLoginForm(); return Promise.resolve(false); }
    isLoading = true;
    setRefreshing(true);
    return Z.get(currentToken, currentGistId, currentFilename)
        .then(function (result) {
            applyLoaded(result);
            toast('已刷新到最新数据', 'success');
            return true;
        })
        .catch(function (err) {
            readOnly = true;
            showLoadError(err, 'refresh');
            toast('刷新失败：' + Z.friendlyError(err), { type: 'error', duration: 7000 });
            return false;
        })
        .finally(function () {
            isLoading = false;
            setRefreshing(false);
        });
}

function performLogin(options) {
    options = options || {};
    var token = loginToken.value.trim();
    var gistId = loginGistId.value.trim();
    var filename = loginFilename.value.trim() || 'data.json';
    loginError.textContent = '';
    if (!token || !gistId) {
        loginError.textContent = '请填写 Token 和 Gist ID';
        showLoginForm();
        return Promise.resolve(false);
    }
    loginBtn.disabled = true;
    loginBtn.textContent = '连接中…';
    return Z.get(token, gistId, filename)
        .then(function (result) {
            currentToken = token;
            currentGistId = gistId;
            currentFilename = filename;
            Z.storage.set(STORAGE_KEYS.TOKEN, token);
            Z.storage.set(STORAGE_KEYS.GIST_ID, gistId);
            Z.storage.set(STORAGE_KEYS.FILENAME, filename);
            loginOverlay.classList.remove('active');
            appContainer.style.display = 'block';
            applyLoaded(result);
            if (!options.silent) toast('已连接，数据加载成功', 'success');
            return true;
        })
        .catch(function (err) {
            loginError.textContent = '登录失败：' + Z.friendlyError(err);
            if (options.silent) showLoadError(err, 'login');
            else showLoginForm();
            return false;
        })
        .finally(function () {
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        });
}

function retryLoad() {
    hideLoadError();
    var token = currentToken || loginToken.value.trim();
    var gistId = currentGistId || loginGistId.value.trim();
    var filename = currentFilename || loginFilename.value.trim() || 'data.json';
    if (!token || !gistId) { showLoginForm(); return; }
    loginToken.value = token;
    loginGistId.value = gistId;
    loginFilename.value = filename;
    loadErrorRetry.disabled = true;
    loadErrorRetry.textContent = '重试中…';
    var task = currentToken ? refreshFromRemote() : performLogin({ silent: true });
    Promise.resolve(task).finally(function () {
        loadErrorRetry.disabled = false;
        loadErrorRetry.textContent = '重试';
    });
}

function logout() {
    Z.storage.remove(STORAGE_KEYS.TOKEN);
    Z.storage.remove(STORAGE_KEYS.GIST_ID);
    Z.storage.remove(STORAGE_KEYS.FILENAME);
    currentToken = '';
    currentGistId = DEFAULT_GIST_ID;
    currentFilename = 'data.json';
    gistData = { products: {} };
    baseDoc = Z.clone(gistData);
    syncMeta = { updatedAt: null, revision: null, size: null, lastSyncAt: null };
    readOnly = true;
    hideLoadError();
    updateSyncMeta();
    ['modal-node-overlay', 'modal-item-overlay', 'batch-status-overlay', 'delete-confirm-overlay',
        'conflict-overlay', 'print-preview-overlay'].forEach(function (id) {
        var el = $(id);
        if (el) el.classList.remove('active');
    });
    appContainer.style.display = 'none';
    loginOverlay.classList.add('active');
    loginError.textContent = '';
    loginToken.value = '';
    loginGistId.value = DEFAULT_GIST_ID;
    loginFilename.value = 'data.json';
    setText(userStatus, '未连接');
    setRefreshing(false);
}

// ============================================================
// 查询辅助（打印模块沿用 findNodeByCode 名称，故此处保留包装）
// ============================================================
function findNodeByCode(code) { return Z.findNodeByCode(gistData.products, code); }
function findNodeEntry(code) { return Z.findNodeEntry(gistData.products, code); }
function findParentNode(code) { return Z.findParentNode(gistData.products, code); }
function baseNodeOf(code) { return Z.findNodeByCode(baseDoc.products, code); }
function baseItemOf(parentCode, itemCode) {
    var parent = Z.findNodeByCode(baseDoc.products, parentCode);
    return parent ? Z.findItem(parent, itemCode) : null;
}

// ============================================================
// 编码生成
// ============================================================
function generateRootCode() {
    var products = gistData.products || {};
    var maxNum = 0;
    Object.keys(products).forEach(function (key) {
        var code = Z.normalizeCode(key);
        if (!/^A\d{3}$/.test(code)) return;
        var num = parseInt(code.slice(1), 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
    });
    var next = maxNum + 1;
    if (next > 999) { toast('大类编码已达 A999 上限', 'error'); return null; }
    return 'A' + String(next).padStart(3, '0');
}

function generateChildCode(parentCode) {
    var parent = findNodeByCode(parentCode);
    if (!parent) return null;
    var children = (parent.children && typeof parent.children === 'object') ? parent.children : {};
    var maxNum = 0;
    Object.keys(children).forEach(function (key) {
        var last = String(key).split('/').pop();
        if (!/^B\d+$/.test(last)) return;
        var num = parseInt(last.slice(1), 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
    });
    var next = maxNum + 1;
    if (next > 999) { toast('子类编码已达 B999 上限', 'error'); return null; }
    return parentCode + '/B' + String(next).padStart(3, '0');
}

function generateItemCode(parentCode) {
    var parent = findNodeByCode(parentCode);
    if (!parent) return null;
    var items = Array.isArray(parent.items) ? parent.items : [];
    var maxNum = 0;
    items.forEach(function (item) {
        if (!item || !item.code) return;
        var last = String(item.code).split('/').pop();
        if (!/^\d+$/.test(last)) return;
        var num = parseInt(last, 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
    });
    var next = maxNum + 1;
    if (next > 999) { toast('库存编码已达 999 上限', 'error'); return null; }
    return parentCode + '/' + String(next).padStart(3, '0');
}

// ============================================================
// 树渲染（数据层过滤 + 全量转义 + data-action）
// ============================================================
function includesTerm(value, term) {
    if (value === null || value === undefined) return false;
    return String(value).toLowerCase().indexOf(term) !== -1;
}

function nodeMatchesTerm(node, code, term) {
    if (includesTerm(code, term) || includesTerm(node.name, term)) return true;
    if (includesTerm(node.orderNumber, term) || includesTerm(node.trackingNumber, term) || includesTerm(node.remark, term)) return true;
    if (includesTerm(Z.normalizeStatus(node.status), term)) return true;
    if (Array.isArray(node.qrLinks) && node.qrLinks.some(function (link) { return includesTerm(link, term); })) return true;
    return false;
}

function itemMatchesTerm(item, term) {
    if (!item) return false;
    if (includesTerm(item.code, term) || includesTerm(item.name, term)) return true;
    if (includesTerm(item.orderNumber, term) || includesTerm(item.trackingNumber, term) || includesTerm(item.remark, term)) return true;
    if (includesTerm(Z.normalizeStatus(item.status), term)) return true;
    if (Array.isArray(item.qrLinks) && item.qrLinks.some(function (link) { return includesTerm(link, term); })) return true;
    return false;
}

function buildNodeHtml(code, node, depth, term, expandAll, forceShow) {
    var children = (node.children && typeof node.children === 'object' && !Array.isArray(node.children)) ? node.children : {};
    var items = Array.isArray(node.items) ? node.items : [];
    var selfMatch = term ? nodeMatchesTerm(node, code, term) : false;
    var showAll = !!forceShow || !term || selfMatch;

    var childParts = [];
    Object.keys(children).sort().forEach(function (childCode) {
        var child = children[childCode];
        if (!child || typeof child !== 'object') return;
        var result = buildNodeHtml(childCode, child, depth + 1, term, expandAll, showAll);
        if (result.visible) childParts.push(result.html);
    });

    var visibleItems = [];
    items.forEach(function (item) {
        if (!item) return;
        if (showAll || itemMatchesTerm(item, term)) visibleItems.push(item);
    });

    var visible = !term || selfMatch || childParts.length > 0 || visibleItems.length > 0;
    if (!visible) return { html: '', visible: false };

    var expanded = expandAll || (term && (selfMatch || childParts.length > 0 || visibleItems.length > 0));
    var unified = node.unified !== false;
    var nodeStatus = Z.normalizeStatus(node.status);
    var hasToggle = Object.keys(children).length > 0 || items.length > 0;

    var toggleIcon = hasToggle
        ? '<span class="toggle" data-action="toggle" data-code="' + esc(code) + '" title="展开/收起">▼</span>'
        : '';

    var actions = [
        '<button type="button" class="btn btn-secondary btn-sm" data-action="edit-node" data-code="' + esc(code) + '">编辑</button>',
        unified
            ? '<button type="button" class="btn btn-secondary btn-sm" data-action="add-node" data-parent="' + esc(code) + '">添加子类</button>'
            : '<button type="button" class="btn btn-success btn-sm" data-action="add-item" data-parent="' + esc(code) + '">添加库存</button>',
        '<button type="button" class="btn btn-primary btn-sm" data-action="print-node" data-code="' + esc(code) + '">打印标签</button>',
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete-node" data-code="' + esc(code) + '">删除</button>'
    ].join('');

    var itemsHtml = '';
    if (visibleItems.length) {
        var rows = visibleItems.map(function (item) {
            var itemCode = item.code === undefined || item.code === null ? '' : String(item.code);
            var itemStatus = Z.normalizeStatus(item.status);
            var costText = (item.cost === undefined || item.cost === null || item.cost === '') ? '' : esc(item.cost);
            var parentAttr = esc(code);
            var itemAttr = esc(itemCode);
            return '<tr>'
                + '<td><input type="checkbox" class="item-checkbox" data-parent="' + parentAttr + '" data-item-code="' + itemAttr + '"></td>'
                + '<td>' + esc(itemCode) + '</td>'
                + '<td>' + esc(item.name || '') + '</td>'
                + '<td>' + costText + '</td>'
                + '<td>' + esc(item.trackingNumber || '') + '</td>'
                + '<td>' + esc(item.orderNumber || '') + '</td>'
                + '<td><span class="status-badge ' + Z.statusClass(itemStatus) + '">' + esc(itemStatus) + '</span></td>'
                + '<td class="actions">'
                + '<button type="button" class="btn btn-primary btn-sm" data-action="edit-item" data-parent="' + parentAttr + '" data-item="' + itemAttr + '">编辑</button>'
                + '<button type="button" class="btn btn-primary btn-sm" data-action="print-item" data-parent="' + parentAttr + '" data-item="' + itemAttr + '">打印标签</button>'
                + '<button type="button" class="btn btn-danger btn-sm" data-action="delete-item" data-parent="' + parentAttr + '" data-item="' + itemAttr + '">删除</button>'
                + '</td></tr>';
        }).join('');
        itemsHtml = '<div class="batch-actions">'
            + '<button type="button" class="btn btn-secondary btn-sm" data-action="batch-print" data-parent="' + esc(code) + '">批量打印</button>'
            + '<button type="button" class="btn btn-secondary btn-sm" data-action="batch-status" data-parent="' + esc(code) + '">批量修改状态</button>'
            + '</div>'
            + '<table class="items-table"><thead><tr>'
            + '<th><input type="checkbox" class="select-all" data-parent="' + esc(code) + '"></th>'
            + '<th>库存编码</th><th>名称</th><th>成本</th><th>快递单号</th><th>订单号</th><th>状态</th><th>操作</th>'
            + '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    var html = '<div class="tree-node' + (expanded ? ' expanded' : '') + '" data-code="' + esc(code) + '" data-depth="' + depth + '">'
        + '<div class="node-content">'
        + toggleIcon
        + '<span class="name" data-action="toggle" data-code="' + esc(code) + '">' + esc(node.name || code) + '</span>'
        + '<span class="code">' + esc(code) + '</span>'
        + '<span class="badge" style="background:' + (unified ? '#dbeafe' : '#fef3c7') + ';">' + (unified ? '统一' : '不统一') + '</span>'
        + '<span class="status-badge ' + Z.statusClass(nodeStatus) + '">' + esc(nodeStatus) + '</span>'
        + (node.orderNumber ? '<span class="badge" style="background:#e0e7ff;">📋' + esc(node.orderNumber) + '</span>' : '')
        + '<span class="actions">' + actions + '</span>'
        + '</div>'
        + (childParts.length ? '<div class="children">' + childParts.join('') + '</div>' : '')
        + (itemsHtml ? '<div class="children">' + itemsHtml + '</div>' : '')
        + '</div>';

    return { html: html, visible: true };
}

function renderTree() {
    var products = gistData.products || {};
    var term = Z.normalizeQuery(searchInput.value);
    var filter = filterSelect.value || 'all';
    var codes = Object.keys(products).sort();
    if (filter !== 'all') codes = codes.filter(function (code) { return code === filter; });
    var parts = [];
    codes.forEach(function (code) {
        var node = products[code];
        if (!node || typeof node !== 'object') return;
        var result = buildNodeHtml(code, node, 0, term, !term, false);
        if (result.visible) parts.push(result.html);
    });
    if (!parts.length) {
        treeContainer.innerHTML = '<p style="color:var(--color-gray-400);">' +
            (term ? '没有匹配的商品或库存' : '暂无商品，请添加大类') + '</p>';
        return;
    }
    treeContainer.innerHTML = parts.join('');
}

function findTreeEl(code) {
    var nodes = treeContainer.querySelectorAll('.tree-node');
    for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].dataset.code === code) return nodes[i];
    }
    return null;
}

function toggleNode(code) {
    var el = findTreeEl(code);
    if (el) el.classList.toggle('expanded');
}

function populateFilter() {
    var products = gistData.products || {};
    var current = filterSelect.value || 'all';
    var codes = Object.keys(products).sort();
    filterSelect.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = '全部展开';
    filterSelect.appendChild(allOpt);
    codes.forEach(function (code) {
        var opt = document.createElement('option');
        opt.value = code;
        opt.textContent = (products[code] && products[code].name ? products[code].name : code) + ' (' + code + ')';
        filterSelect.appendChild(opt);
    });
    filterSelect.value = codes.indexOf(current) !== -1 ? current : 'all';
}

// 事件委托：树 / 表格 / 批量 / 打印按钮
function onTreeClick(event) {
    var target = event.target;
    if (!target || !target.closest) return;
    var el = target.closest('[data-action]');
    if (!el || !treeContainer.contains(el)) return;
    var action = el.getAttribute('data-action');
    var code = el.getAttribute('data-code');
    var parent = el.getAttribute('data-parent');
    var itemCode = el.getAttribute('data-item');
    if (isSaving && action !== 'toggle') { toast('正在保存，请稍候…', 'warn'); return; }
    switch (action) {
        case 'toggle': toggleNode(code); break;
        case 'edit-node': openNodeModal('edit', code); break;
        case 'add-node': openNodeModal('add', '', code); break;
        case 'add-item': openItemModal('add', code); break;
        case 'print-node': window.printNodeLabel(code); break;
        case 'delete-node': deleteNode(code); break;
        case 'edit-item': openItemModal('edit', parent, itemCode); break;
        case 'print-item': window.printItemLabel(parent, itemCode); break;
        case 'delete-item': deleteItem(parent, itemCode); break;
        case 'batch-print': window.batchPrintItems(parent); break;
        case 'batch-status': openBatchStatus(parent); break;
    }
}

function onTreeChange(event) {
    var target = event.target;
    if (target && target.classList && target.classList.contains('select-all')) {
        toggleSelectAll(target, target.getAttribute('data-parent') || '');
    }
}

// ============================================================
// 保存引擎封装（ops + 三方合并 + 串行锁 + 冲突 UI）
// ============================================================
function setGlobalBusy(busy) {
    [addRootBtn, refreshBtn, logoutBtn, modalNodeSave, modalItemSave, batchStatusSave, deleteConfirmOk].forEach(function (btn) {
        if (!btn) return;
        if (busy) btn.disabled = true;
        else btn.disabled = false;
    });
    if (!busy) updateDeleteConfirmState();
}

function fieldDiff(values, base) {
    var fields = {};
    ['name', 'unified', 'cost', 'trackingNumber', 'orderNumber', 'remark', 'qrLinks', 'status'].forEach(function (field) {
        if (!Z.valuesEqual(values[field], base ? base[field] : undefined)) fields[field] = values[field];
    });
    return fields;
}

function saveWithOps(ops, options) {
    options = options || {};
    if (readOnly) {
        toast('当前处于只读保护状态，无法写入数据。请先重试加载成功。', { type: 'error', duration: 7000 });
        return Promise.resolve(null);
    }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return Promise.resolve(null); }
    if (isLoading) { toast('正在加载最新数据，请稍候…', 'warn'); return Promise.resolve(null); }
    if (!ops || !ops.length) { toast('没有需要保存的修改', 'info'); return Promise.resolve(null); }
    isSaving = true;
    setGlobalBusy(true);
    return Z.save({
        token: currentToken,
        gistId: currentGistId,
        filename: currentFilename,
        baseDoc: baseDoc,
        ops: ops,
        onConflict: options.onConflict || showConflictDialog,
        onRetry: function (err, attempt) {
            if (options.onRetry) options.onRetry(err, attempt);
            else toast('网络异常，正在自动重试（第 ' + (attempt + 1) + ' 次）…', 'warn');
        }
    }).then(function (result) {
        // 与加载时一致：baseDoc 保留远端原始值（含历史别名），展示态数据做归一
        var rawDoc = Z.clone(result.data);
        normalizeDoc(result.data);
        gistData = result.data;
        baseDoc = rawDoc;
        syncMeta = {
            updatedAt: result.updatedAt || syncMeta.updatedAt,
            revision: result.revision || syncMeta.revision,
            size: result.size || syncMeta.size,
            lastSyncAt: Date.now()
        };
        updateSyncMeta();
        populateFilter();
        renderTree();
        if (result.unchanged) {
            if (result.conflicts && result.conflicts.length) toast('未写入改动：冲突已按你的选择保留远端版本', { type: 'warn', duration: 5000 });
            else toast('数据没有变化', 'info');
        } else {
            toast(options.successMessage || '保存成功', 'success');
        }
        if (result.conflicts && result.conflicts.length) {
            toast('已按你的选择解决 ' + result.conflicts.length + ' 处冲突', { type: 'warn', duration: 5000 });
        }
        return result;
    }).catch(function (err) {
        var tip = Z.friendlyError(err);
        toast('保存失败：' + tip, { type: 'error', duration: 7000 });
        if (options.onError) options.onError(err, tip);
        return null;
    }).finally(function () {
        isSaving = false;
        setGlobalBusy(false);
    });
}

// ---------- 冲突处理弹窗 ----------
function conflictFieldLabel(conflict) {
    if (conflict.kind === 'remote-deleted' || conflict.field === '__deleted__') return '已被其它设备删除';
    if (conflict.kind === 'remote-modified' || conflict.field === '__modified__') return '已被其它设备修改';
    return conflict.label || conflict.field || '字段';
}

function conflictValueText(conflict, side) {
    var isRemote = (side === 'remote' || side === 'theirs');
    if (conflict.kind === 'remote-deleted') return isRemote ? '接受远端删除' : '保留我的版本（重建）';
    if (conflict.kind === 'remote-modified') return isRemote ? '放弃删除，保留远端修改' : '仍然删除';
    var value = isRemote ? conflict.remote : conflict.mine;
    if (value === undefined || value === null) return '（空）';
    if (typeof value === 'boolean') return value ? '是' : '否';
    if (typeof value === 'object') {
        try { return JSON.stringify(value); } catch (e) { return String(value); }
    }
    return String(value);
}

function showConflictDialog(conflicts) {
    return new Promise(function (resolve) {
        conflictState = {
            conflicts: conflicts,
            choices: conflicts.map(function () { return 'mine'; }),
            resolve: resolve
        };
        conflictList.innerHTML = '';
        conflicts.forEach(function (conflict, index) {
            var item = document.createElement('div');
            item.className = 'conflict-item';
            var scopeName = conflict.scope === 'item' ? '库存' : '节点';
            var target = conflict.target === undefined || conflict.target === null ? '' : String(conflict.target);
            item.innerHTML = '<div class="conflict-head">'
                + '<span class="badge">' + esc(scopeName) + '</span>'
                + '<span class="conflict-target">' + esc(target) + '</span>'
                + '<span class="badge">' + esc(conflictFieldLabel(conflict)) + '</span>'
                + '</div>'
                + '<div class="conflict-values">'
                + '<label class="conflict-choice"><span><input type="radio" name="conflict-' + index + '" value="mine" checked> 用我的</span>'
                + '<span class="value">' + esc(conflictValueText(conflict, 'mine')) + '</span></label>'
                + '<label class="conflict-choice"><span><input type="radio" name="conflict-' + index + '" value="theirs"> 用远端</span>'
                + '<span class="value">' + esc(conflictValueText(conflict, 'theirs')) + '</span></label>'
                + '</div>';
            item.querySelectorAll('input[type="radio"]').forEach(function (radio) {
                radio.addEventListener('change', function () {
                    if (!conflictState) return;
                    conflictState.choices[index] = radio.value;
                });
            });
            conflictList.appendChild(item);
        });
        setText(conflictSummary, '检测到 ' + conflicts.length + ' 处与其它设备/扫码端的修改冲突，请逐项选择保留哪一边（默认“用我的”）。');
        conflictOverlay.classList.add('active');
        conflictConfirm.focus();
    });
}

function finishConflict(mode) {
    if (!conflictState) return;
    var state = conflictState;
    conflictState = null;
    conflictOverlay.classList.remove('active');
    if (mode === 'cancel') { state.resolve(null); return; }
    state.resolve(state.choices.slice());
}

function selectAllConflictChoices(side) {
    if (!conflictState) return;
    conflictState.choices = conflictState.conflicts.map(function () { return side; });
    conflictList.querySelectorAll('input[type="radio"]').forEach(function (radio) {
        radio.checked = radio.value === side;
    });
}

// ============================================================
// 节点弹窗
// ============================================================
function resetSaveButton(btn, statusDiv) {
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
    if (statusDiv) { statusDiv.textContent = ''; }
}

function collectNodeFormValues() {
    return {
        name: modalNodeName.value.trim(),
        unified: modalNodeUnified.value === 'true',
        cost: parseCost(modalNodeCost.value),
        trackingNumber: trimOrUndefined(modalNodeTracking.value),
        orderNumber: trimOrUndefined(modalNodeOrder.value),
        qrLinks: parseLinks(modalNodeQrlinks.value),
        remark: trimOrUndefined(modalNodeRemark.value),
        status: Z.normalizeStatus(modalNodeStatus.value)
    };
}

function openNodeModal(mode, code, parentCode) {
    if (readOnly) { toast('当前为只读保护状态，无法编辑。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    if (mode === 'add') {
        // 新增节点：只有新增时才创建空 children（编辑绝不携带 children/items）
        var defaultCode = parentCode ? generateChildCode(parentCode) : generateRootCode();
        if (!defaultCode) return;
        editContext = { nodeMode: 'add', originalCode: null, parentCode: parentCode || '', baseNode: null };
        modalNodeMode.value = 'add';
        modalNodeParent.value = parentCode || '';
        modalNodeTitle.textContent = parentCode ? '添加子类' : '添加大类';
        modalNodeCode.value = defaultCode;
        modalNodeName.value = '';
        modalNodeUnified.value = 'true';
        modalNodeCost.value = '';
        modalNodeTracking.value = '';
        modalNodeOrder.value = '';
        modalNodeQrlinks.value = '';
        modalNodeRemark.value = '';
        modalNodeOriginalCode.value = '';
        fillStatusSelect(modalNodeStatus, STATUS.ON_SALE);
    } else {
        var node = findNodeByCode(code);
        if (!node) { toast('节点不存在或已被删除', 'error'); return; }
        editContext = {
            nodeMode: 'edit',
            originalCode: code,
            parentCode: '',
            baseNode: Z.clone(baseNodeOf(code) || node)
        };
        modalNodeMode.value = 'edit';
        modalNodeOriginalCode.value = code;
        modalNodeParent.value = '';
        modalNodeTitle.textContent = '编辑节点';
        modalNodeCode.value = code;
        modalNodeName.value = node.name || '';
        modalNodeUnified.value = node.unified !== false ? 'true' : 'false';
        modalNodeCost.value = node.cost === undefined || node.cost === null ? '' : node.cost;
        modalNodeTracking.value = node.trackingNumber || '';
        modalNodeOrder.value = node.orderNumber || '';
        modalNodeQrlinks.value = (Array.isArray(node.qrLinks) && node.qrLinks.length) ? node.qrLinks.join(', ') : '';
        modalNodeRemark.value = node.remark || '';
        fillStatusSelect(modalNodeStatus, node.status);
    }
    modalNodeOverlay.classList.add('active');
    resetSaveButton(modalNodeSave, nodeSaveStatus);
    setTimeout(function () { modalNodeName.focus(); }, 30);
}

function closeNodeModal() {
    modalNodeOverlay.classList.remove('active');
    resetSaveButton(modalNodeSave, nodeSaveStatus);
    editContext = null;
}

function saveNode() {
    if (readOnly) { toast('当前为只读保护状态，无法保存。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    if (!editContext) return;
    var mode = editContext.nodeMode;
    var code = Z.normalizeCode(modalNodeCode.value);
    var values = collectNodeFormValues();
    if (!values.name) {
        toast('名称不能为空', 'error');
        modalNodeName.focus();
        return;
    }
    if (!code) {
        if (mode === 'add') {
            code = editContext.parentCode ? generateChildCode(editContext.parentCode) : generateRootCode();
            if (!code) return;
            modalNodeCode.value = code;
        } else {
            toast('编码不能为空', 'error');
            return;
        }
    }
    var originalCode = editContext.originalCode;
    var existing = findNodeEntry(code);
    if (existing && (!originalCode || !Z.sameCode(code, originalCode))) {
        toast('编码已存在：' + code, 'error');
        return;
    }
    var op;
    if (mode === 'add') {
        op = {
            type: 'node.upsert',
            code: code,
            originalCode: null,
            parentCode: editContext.parentCode || null,
            baseNode: null,
            fields: fieldDiff(values, null)
        };
    } else {
        var baseNode = editContext.baseNode;
        var fields = fieldDiff(values, baseNode);
        // 历史数据节点可能没有 status 字段：默认“在售”不主动写入，避免制造无意义改动
        if (fields.status !== undefined && baseNode.status === undefined && fields.status === STATUS.ON_SALE) {
            delete fields.status;
        }
        if (!Object.keys(fields).length && Z.sameCode(code, originalCode)) {
            toast('没有需要保存的修改', 'info');
            closeNodeModal();
            return;
        }
        op = {
            type: 'node.upsert',
            code: code,
            originalCode: originalCode,
            parentCode: null,
            baseNode: Z.clone(baseNode),
            fields: fields
        };
    }
    modalNodeSave.disabled = true;
    modalNodeSave.textContent = '保存中…';
    nodeSaveStatus.innerHTML = '<span class="spinner"></span> 保存中…';
    var successMessage = (mode === 'add' ? '已添加节点 ' : '已保存节点 ') + code;
    saveWithOps([op], {
        successMessage: successMessage,
        onError: function (err, tip) {
            nodeSaveStatus.textContent = '保存失败：' + tip;
        }
    }).then(function (result) {
        if (result) {
            closeNodeModal();
        } else {
            modalNodeSave.disabled = false;
            modalNodeSave.textContent = '重试保存';
            if (!nodeSaveStatus.textContent) nodeSaveStatus.textContent = '保存失败，请重试';
        }
    });
}

function closeItemModal() {

}

function saveItem() {
    if (readOnly) { toast('当前为只读保护状态，无法保存。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    if (!itemContext) return;
    var parentCode = itemContext.parentCode;
    var parent = findNodeByCode(parentCode);
    if (!parent) { toast('父节点不存在或已被删除', 'error'); return; }
    var items = Array.isArray(parent.items) ? parent.items : [];
    var code = Z.normalizeCode(modalItemCode.value);
    if (!code) {
        if (itemContext.itemMode === 'add') {
            code = generateItemCode(parentCode);
            if (!code) return;
            modalItemCode.value = code;
        } else {
            toast('编码不能为空', 'error');
            return;
        }
    }
    var originalCode = itemContext.originalCode;
    var duplicated = items.some(function (item) {
        return item && item.code === code && (!originalCode || item.code !== originalCode);
    });
    if (duplicated) { toast('编码已存在：' + code, 'error'); return; }
    var values = collectItemFormValues();
    var op;
    if (itemContext.itemMode === 'add') {
        op = {
            type: 'item.upsert',
            parentCode: parentCode,
            code: code,
            originalCode: null,
            baseItem: null,
            fields: fieldDiff(values, null)
        };
    } else {
        var baseItem = itemContext.baseItem;
        var fields = fieldDiff(values, baseItem);
        if (!Object.keys(fields).length && Z.sameCode(code, originalCode)) {
            toast('没有需要保存的修改', 'info');
            closeItemModal();
            return;
        }
        op = {
            type: 'item.upsert',
            parentCode: parentCode,
            code: code,
            originalCode: originalCode,
            baseItem: Z.clone(baseItem),
            fields: fields
        };
    }
    modalItemSave.disabled = true;
    modalItemSave.textContent = '保存中…';
    itemSaveStatus.innerHTML = '<span class="spinner"></span> 保存中…';
    var successMessage = (itemContext.itemMode === 'add' ? '已添加库存 ' : '已保存库存 ') + code;
    saveWithOps([op], {
        successMessage: successMessage,
        onError: function (err, tip) {
            itemSaveStatus.textContent = '保存失败：' + tip;
        }
    }).then(function (result) {
        if (result) {
            closeItemModal();
        } else {
            modalItemSave.disabled = false;
            modalItemSave.textContent = '重试保存';
            if (!itemSaveStatus.textContent) itemSaveStatus.textContent = '保存失败，请重试';
        }
    });
}

// ============================================================
// 删除（二次确认 + 输入编码 + 数量统计）
// ============================================================
function updateDeleteConfirmState() {
    if (!deleteState) return;
    var typed = deleteConfirmInput.value;
    var ok = Z.sameCode(typed, deleteState.code);
    deleteConfirmOk.disabled = !ok || isSaving;
}

function showDeleteConfirm(opts) {
    deleteState = { code: opts.code, onConfirm: opts.onConfirm };
    setText(deleteConfirmTitle, opts.title || '确认删除');
    deleteConfirmMessage.textContent = opts.message || '';
    setText(deleteConfirmCode, opts.code);
    deleteConfirmInput.value = '';
    setText(deleteConfirmStatus, '');
    deleteConfirmOk.disabled = true;
    deleteConfirmCancel.disabled = false;
    deleteConfirmOk.textContent = '确认删除';
    deleteConfirmOverlay.classList.add('active');
    setTimeout(function () { deleteConfirmInput.focus(); }, 40);
}

function cancelDelete() {
    deleteConfirmOverlay.classList.remove('active');
    deleteState = null;
}

function confirmDelete() {
    if (!deleteState || isSaving) return;
    if (!Z.sameCode(deleteConfirmInput.value, deleteState.code)) return;
    var state = deleteState;
    deleteConfirmOk.disabled = true;
    deleteConfirmCancel.disabled = true;
    deleteConfirmOk.textContent = '删除中…';
    Promise.resolve(state.onConfirm()).then(function (ok) {
        deleteConfirmOk.textContent = '确认删除';
        deleteConfirmCancel.disabled = false;
        if (ok) {
            deleteConfirmOverlay.classList.remove('active');
            deleteState = null;
        } else {
            updateDeleteConfirmState();
        }
    });
}

function deleteNode(code) {
    if (readOnly) { toast('当前为只读保护状态，无法删除。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var entry = findNodeEntry(code);
    if (!entry) { toast('节点不存在或已被删除', 'error'); return; }
    var counts = Z.countDescendants(entry.node);
    var baseNode = baseNodeOf(code);
    var parts = ['将删除节点「' + code + '」'];
    if (counts.children > 0) parts.push('其下 ' + counts.children + ' 个子类');
    if (counts.items > 0) parts.push('其下 ' + counts.items + ' 个库存');
    var message = parts.join('，') + '。此操作不可撤销。';
    showDeleteConfirm({
        title: '删除节点',
        code: code,
        message: message,
        onConfirm: function () {
            deleteConfirmStatus.textContent = '删除中…';
            return saveWithOps([{ type: 'node.delete', code: code, baseNode: baseNode ? Z.clone(baseNode) : null }], {
                successMessage: '已删除节点 ' + code,
                onError: function (err, tip) { deleteConfirmStatus.textContent = '删除失败：' + tip; }
            }).then(function (result) {
                if (result) {
                    if (result.unchanged && result.conflicts && result.conflicts.length) {
                        toast('检测到远端修改，已按你的选择取消删除节点 ' + code, { type: 'warn', duration: 5000 });
                    } else {
                        toast('已删除节点 ' + code + '（' + counts.children + ' 个子类 / ' + counts.items + ' 个库存）', 'success');
                    }
                }
                return !!result;
            });
        }
    });
}

function deleteItem(parentCode, itemCode) {
    if (readOnly) { toast('当前为只读保护状态，无法删除。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var parent = findNodeByCode(parentCode);
    if (!parent) { toast('父节点不存在或已被删除', 'error'); return; }
    var item = Z.findItem(parent, itemCode);
    if (!item) { toast('库存项不存在或已被删除', 'error'); return; }
    var baseItem = baseItemOf(parentCode, itemCode);
    showDeleteConfirm({
        title: '删除库存',
        code: itemCode,
        message: '将删除库存「' + itemCode + '」（影响库存：1 项）。此操作不可撤销。',
        onConfirm: function () {
            deleteConfirmStatus.textContent = '删除中…';
            return saveWithOps([{
                type: 'item.delete',
                parentCode: parentCode,
                code: itemCode,
                baseItem: baseItem ? Z.clone(baseItem) : null
            }], {
                successMessage: '已删除库存 ' + itemCode,
                onError: function (err, tip) { deleteConfirmStatus.textContent = '删除失败：' + tip; }
            }).then(function (result) {
                if (result) {
                    if (result.unchanged && result.conflicts && result.conflicts.length) {
                        toast('检测到远端修改，已按你的选择取消删除库存 ' + itemCode, { type: 'warn', duration: 5000 });
                    } else {
                        toast('已删除库存 ' + itemCode, 'success');
                    }
                }
                return !!result;
            });
        }
    });
}

// ============================================================
// 批量操作
// ============================================================
function getSelectedItems(parentCode) {
    var checkboxes = treeContainer.querySelectorAll('.item-checkbox');
    var result = [];
    Array.prototype.forEach.call(checkboxes, function (checkbox) {
        if (checkbox.checked && checkbox.dataset.parent === parentCode) result.push(checkbox.dataset.itemCode);
    });
    return result;
}

function toggleSelectAll(checkbox, parentCode) {
    var checkboxes = treeContainer.querySelectorAll('.item-checkbox');
    Array.prototype.forEach.call(checkboxes, function (item) {
        if (item.dataset.parent === parentCode) item.checked = checkbox.checked;
    });
}

function batchPrintItems(parentCode) {
    var selected = getSelectedItems(parentCode);
    if (!selected.length) { toast('请先选择要打印的库存项', 'warn'); return; }
    var parent = findNodeByCode(parentCode);
    if (!parent) return;
    var dataList = selected.map(function (itemCode) {
        var item = Z.findItem(parent, itemCode);
        return {
            code: itemCode,
            name: item ? (item.name || parent.name || '') : (parent.name || ''),
            cost: item ? item.cost : undefined,
            orderNumber: item ? item.orderNumber : undefined,
            trackingNumber: item ? item.trackingNumber : undefined,
            qrLinks: item ? item.qrLinks : undefined
        };
    });
    openPrintPreview(dataList);
}

function openBatchStatus(parentCode) {
    if (readOnly) { toast('当前为只读保护状态，无法修改。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var selected = getSelectedItems(parentCode);
    if (!selected.length) { toast('请先选择要修改的库存项', 'warn'); return; }
    batchContext = { parentCode: parentCode, itemCodes: selected };
    fillStatusSelect(batchStatusSelect, STATUS.ON_SALE);
    setText(batchStatusNote, '已选择 ' + selected.length + ' 项库存，将统一修改为下方状态。');
    batchStatusOverlay.classList.add('active');
}

function applyBatchStatus() {
    if (!batchContext) return;
    if (readOnly) { toast('当前为只读保护状态，无法保存。请先重试加载。', 'error'); return; }
    if (isSaving) { toast('正在保存，请稍候…', 'warn'); return; }
    var parent = findNodeByCode(batchContext.parentCode);
    if (!parent) { toast('父节点不存在或已被删除', 'error'); batchStatusOverlay.classList.remove('active'); return; }
    var target = Z.normalizeStatus(batchStatusSelect.value);
    var baseParent = Z.findNodeByCode(baseDoc.products, batchContext.parentCode);
    var ops = [];
    batchContext.itemCodes.forEach(function (itemCode) {
        var item = Z.findItem(parent, itemCode);
        if (!item) return;
        if (Z.normalizeStatus(item.status) === target) return;
        var baseItem = baseParent ? Z.findItem(baseParent, itemCode) : null;
        ops.push({
            type: 'item.upsert',
            parentCode: batchContext.parentCode,
            code: itemCode,
            originalCode: itemCode,
            baseItem: baseItem ? Z.clone(baseItem) : null,
            fields: { status: target }
        });
    });
    if (!ops.length) { toast('所选库存状态未变化', 'info'); batchStatusOverlay.classList.remove('active'); return; }
    batchStatusSave.disabled = true;
    batchStatusSave.textContent = '保存中…';
    saveWithOps(ops, { successMessage: '已修改 ' + ops.length + ' 项库存状态为「' + target + '」' }).then(function (result) {
        batchStatusSave.disabled = false;
        batchStatusSave.textContent = '确定修改';
        if (result) batchStatusOverlay.classList.remove('active');
    });
}

    var key = event.key;
    if (key === 'Escape') {
        if (conflictOverlay.classList.contains('active')) { finishConflict('cancel'); return; }
        if (deleteConfirmOverlay.classList.contains('active')) { cancelDelete(); return; }
        if (modalNodeOverlay.classList.contains('active')) { closeNodeModal(); return; }
        if (modalItemOverlay.classList.contains('active')) { closeItemModal(); return; }
        if (batchStatusOverlay.classList.contains('active')) { batchStatusOverlay.classList.remove('active'); return; }
        if (printPreviewOverlay.classList.contains('active')) { printPreviewOverlay.classList.remove('active'); return; }
        return;
    }
    if (key === 'Enter' && !event.isComposing) {
        var target = event.target;
        if (!target || !target.tagName) return;
        if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
        if (modalNodeOverlay.classList.contains('active') && modalNodeOverlay.contains(target)) {
            event.preventDefault();
            saveNode();
        } else if (modalItemOverlay.classList.contains('active') && modalItemOverlay.contains(target)) {
            event.preventDefault();
            saveItem();
        }
    }
});

    function escapeHtml(text) {
        if (typeof text !== 'string') return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getTextLines(text, fontSizePt, fontName, bold, maxWidthPx) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSizePx = fontSizePt * 1.3333;
        ctx.font = `${bold ? 'bold ' : ''}${fontSizePx}px ${fontName || 'SimHei'}`;
        
        const lines = [];
        let currentLine = '';
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const testLine = currentLine + char;
            const metrics = ctx.measureText(testLine);
            
            if (metrics.width > maxWidthPx && currentLine !== '') {
                lines.push(currentLine);
                currentLine = char;
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine) {
            lines.push(currentLine);
        }
        return lines;
    }

    function calcDynamicFontSize(text, maxWidthMm, maxHeightMm, baseSize, fontName, bold) {
        const displayText = '内部编码: ' + (text || '').toString();
        const maxWidthPx = maxWidthMm * 3.7795;
        const maxHeightPx = maxHeightMm * 3.7795;
        const lineHeightRatio = 1.05;
        
        let low = 2;
        let high = 40;
        let bestSize = low;
        
        while (high - low > 0.05) {
            const mid = (low + high) / 2;
            const lines = getTextLines(displayText, mid, fontName, bold, maxWidthPx);
            const fontSizePx = mid * 1.3333;
            const totalHeightPx = lines.length * fontSizePx * lineHeightRatio;
            
            if (totalHeightPx <= maxHeightPx) {
                bestSize = mid;
                low = mid;
            } else {
                high = mid;
            }
        }
        return bestSize;
    }

    function getLodopInstance() {
        if (typeof getLodop === 'function') {
            return getLodop();
        } else if (window.LODOP) {
            return window.LODOP;
        } else if (window.CLodop) {
            return window.CLodop;
        } else {
            alert('打印服务未加载，请确保已安装 C-Lodop 并刷新页面。');
            return null;
        }
    }

    function getPrinterList() {
        const LODOP = getLodopInstance();
        if (!LODOP) return [];
        try {
            const count = LODOP.GET_PRINTER_COUNT();
            const printers = [];
            for (let i = 0; i < count; i++) {
                printers.push(LODOP.GET_PRINTER_NAME(i));
            }
            return printers;
        } catch (e) {
            console.error('获取打印机列表失败:', e);
            return [];
        }
    }

    function drawTemplatePreview(canvas, template, data) {
        const scale = canvas.width / template.paperWidth;
        canvas.height = template.paperHeight * scale;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#cccccc';
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        template.elements.forEach(el => {
            const x = el.x * scale;
            const y = el.y * scale;
            const width = el.width * scale;
            const height = el.height * scale;

            if (el.type === 'text') {
                ctx.fillStyle = '#000000';
                let text = '';
                if (el.field === 'static') {
                    text = el.text || '';
                } else if (data && data[el.field] !== undefined) {
                    let rawData = data[el.field].toString();
                    if (el.showLastLevelOnly && rawData.includes('/')) {
                        const parts = rawData.split('/');
                        rawData = parts[parts.length - 1];
                    }
                    text = rawData;
                    if (el.prefix) text = el.prefix + text;
                } else {
                    text = (el.prefix || '') + 'C001'; 
                }
                
                let fontSize = el.fontSize;
                if (el.dynamicSize) {
                    const demoText = text.replace(el.prefix || '', '');
                    fontSize = calcDynamicFontSize(demoText, el.width, el.height, el.fontSize, el.fontName, el.bold);
                }
                const fontSizePx = fontSize * 0.3528 * scale; 
                ctx.font = `${el.bold ? 'bold ' : ''}${fontSizePx}px ${el.fontName || 'SimHei'}, sans-serif`;
                
                const maxWidthPx = el.width * scale;
                const lineHeightPx = fontSizePx * 1.05;
                
                const lines = [];
                let currentLine = '';
                const chars = text.split('');
                for (let i = 0; i < chars.length; i++) {
                    const testLine = currentLine + chars[i];
                    if (ctx.measureText(testLine).width > maxWidthPx && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = chars[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const totalTextHeightPx = lines.length * lineHeightPx;
                const startY = y + (height - totalTextHeightPx) / 2;
                
                ctx.textAlign = el.align === 'center' ? 'center' : 'left';
                ctx.textBaseline = 'middle';
                
                lines.forEach((line, index) => {
                    const drawX = el.align === 'center' ? (x + width / 2) : x;
                    const drawY = startY + (index * lineHeightPx) + (lineHeightPx / 2);
                    ctx.fillText(line, drawX, drawY);
                });
            } else if (el.type === 'barcode') {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(x, y, width, height);
                ctx.fillStyle = '#333333';
                ctx.font = `${Math.max(scale * 2, 8)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const codeText = data && data[el.field] ? data[el.field] : '条码区域';
                let displayText = codeText;
                if (displayText.length > 15) {
                    displayText = displayText.substring(0, 12) + '...';
                }
                ctx.fillText(displayText, x + width / 2, y + height / 2);
            }
        });
    }

    function renderInnerPreview(dataList, template) {
        const container = document.getElementById('inner-preview-container');
        container.innerHTML = '';
        
        dataList.forEach(data => {
            const canvas = document.createElement('canvas');
            canvas.width = template.paperWidth * 3.78; 
            drawTemplatePreview(canvas, template, data);
            container.appendChild(canvas);
        });
    }
